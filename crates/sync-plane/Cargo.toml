[package]
name = "sync-plane"
version = "0.1.0"
edition = "2021"

[lib]
doctest = false

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
opentelemetry = "0.31"
rdkafka = { version = "0.36", features = ["tokio", "cmake-build"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1.40", features = ["rt", "rt-multi-thread", "sync", "time"] }
tracing = "0.1.40"
tracing-opentelemetry = "0.32.1"
uuid = { version = "1.0", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
