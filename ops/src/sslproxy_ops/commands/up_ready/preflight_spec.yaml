# Cluster preflight requirements.
# These checks run before Wave 1 and fail fast when prerequisites are missing.

preflight:
  cluster:
    minimum_ready_nodes: 1

  storage_classes:
    - local-path

  secrets:
    - namespace: default
      name: tidb-client-ca
      key: ca.crt
    - namespace: default
      name: tidb-octopus
      key: password
    - namespace: default
      name: tidb-atheros-search
      key: password
    - namespace: default
      name: tidb-schema-migrator
      key: password
    - namespace: default
      name: tidb-keycloak
      key: password
    - namespace: default
      name: tidb-schema-owner
      key: dsn
    - namespace: default
      name: redis-runtime
      key: password
    - namespace: default
      name: minio-credentials
      key: access-key

  service_accounts:
    - default/ssl-proxy

  node_requirements:
    atheros-sensor:
      labels:
        wiretrap.io/sensor: "true"

  host_devices:
    - /dev/net/tun

  crds: []

  min_disk_space_gb: 20

  conflicting_releases: true
