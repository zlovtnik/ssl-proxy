version: 1

defaults:
  namespace: default
  timeout: 10m
  artifact_dir: stackctl-artifacts
  max_parallel: 4
  global_overrides:
    fullnameOverride: ssl-proxy
    instanceOverride: ssl-proxy
  values:
    - ./helm/ssl-proxy/values.yaml
    - ./helm/ssl-proxy/values-k8s.yaml

components:
  platform-config:
    type: helm
    stage: bootstrap
    release: ssl-proxy-platform-config
    chart: ./cyber-stack/base/platform-config
    values_key: platformConfig
    include_global: true
    gates:
      - resource: serviceaccount/ssl-proxy

  tidb:
    type: helm
    stage: infrastructure
    release: ssl-proxy-tidb
    chart: ./cyber-stack/base/tidb
    values_key: tidb
    include_global: true
    set:
      external: false
    depends_on: [platform-config]
    timeout: 15m
    gates:
      - resource: statefulset/ssl-proxy-tidb

  redpanda:
    type: helm
    stage: infrastructure
    release: ssl-proxy-redpanda
    chart: ./cyber-stack/base/redpanda
    values_key: redpanda
    include_global: true
    set:
      external: false
    depends_on: [platform-config]
    timeout: 15m
    gates:
      - resource: statefulset/ssl-proxy-redpanda

  minio:
    type: helm
    stage: infrastructure
    release: ssl-proxy-minio
    chart: ./cyber-stack/base/minio
    values_key: minio
    include_global: true
    set:
      external: false
    depends_on: [platform-config]
    timeout: 15m
    gates:
      - resource: statefulset/ssl-proxy-minio

  redis:
    type: helm
    stage: infrastructure
    release: ssl-proxy-redis-runtime
    chart: ./cyber-stack/base/redis-runtime
    values_key: redisRuntime
    include_global: true
    depends_on: [platform-config]
    gates:
      - resource: deployment/ssl-proxy-redis-runtime

  telemetry:
    type: helm
    stage: infrastructure
    release: ssl-proxy-telemetry
    chart: ./cyber-stack/base/telemetry
    values_key: telemetry
    include_global: true
    depends_on: [platform-config]
    timeout: 15m
    gates:
      - resource: statefulset/ssl-proxy-prometheus
      - resource: statefulset/ssl-proxy-loki
      - resource: statefulset/ssl-proxy-grafana
      - resource: deployment/ssl-proxy-otel-collector
    checks:
      - type: http
        target: service/ssl-proxy-prometheus
        port: 9090
        path: /-/ready
      - type: http
        target: service/ssl-proxy-grafana
        port: 3004
        path: /api/health

  tidb-schema-executor:
    type: helm-job
    stage: schema-executor
    release: ssl-proxy-tidb-schema-executor
    chart: ./cyber-stack/base/tidb-schema-executor
    values_key: tidbSchemaExecutor
    include_global: true
    depends_on:
      - tidb
    timeout: 10m
    job:
      rerun: replace
      name: ssl-proxy-tidb-schema-executor
    set:
      lifecycle:
        mode: managed
    gates:
      - resource: job/ssl-proxy-tidb-schema-executor
        condition: complete

  schema-migrator:
    type: helm
    stage: schema-migrator
    release: ssl-proxy-schema-migrator
    chart: ./cyber-stack/base/schema-migrator
    values_key: schemaMigrator
    include_global: true
    depends_on:
      - tidb
      - tidb-schema-executor
    timeout: 15m
    gates:
      - resource: deployment/ssl-proxy-schema-migrator-backend
      - resource: deployment/ssl-proxy-schema-migrator-ui
      - resource: deployment/ssl-proxy-schema-migrator-keycloak
      - resource: deployment/ssl-proxy-schema-migrator-edge

  java-coordinator:
    type: helm
    stage: applications
    release: ssl-proxy-coordinator
    chart: ./cyber-stack/base/java-coordinator
    values_key: javaCoordinator
    include_global: true
    depends_on:
      - tidb
      - redpanda
      - minio
      - schema-migrator
    gates:
      - resource: deployment/ssl-proxy-coordinator
    checks:
      - type: tcp
        target: service/ssl-proxy-coordinator
        port: 8080

  atheros-search:
    type: helm
    stage: applications
    release: ssl-proxy-atheros-search
    chart: ./cyber-stack/base/atheros-search
    values_key: atherosSearch
    include_global: true
    depends_on:
      - tidb
      - redpanda
      - schema-migrator
    gates:
      - resource: deployment/ssl-proxy-atheros-search
      - resource: deployment/ssl-proxy-atheros-search-ui
    checks:
      - type: http
        target: service/ssl-proxy-atheros-search
        port: 8080
        path: /readyz

  atheros-sensor:
    type: helm
    stage: applications
    release: ssl-proxy-atheros-sensor
    chart: ./cyber-stack/base/atheros-sensor
    values_key: atherosSensor
    include_global: true
    gates:
      - resource: daemonset/ssl-proxy-atheros-sensor

  proxy:
    type: helm
    stage: proxy
    release: ssl-proxy-proxy
    chart: ./cyber-stack/base/proxy
    values_key: proxy
    include_global: true
    depends_on:
      - redpanda
      - java-coordinator
      - atheros-search
    gates:
      - resource: deployment/ssl-proxy-proxy
    checks:
      - type: http
        target: service/ssl-proxy-proxy-admin
        port: 3002
        path: /ready
