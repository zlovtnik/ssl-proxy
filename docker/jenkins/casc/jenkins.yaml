jenkins:
  systemMessage: "ssl-proxy CI is managed by Configuration as Code."
  numExecutors: 1
  mode: NORMAL
  disableRememberMe: true
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_ID:-admin}"
          password: "${jenkins-admin-password}"
        - id: "prometheus"
          password: "${jenkins-prometheus-password}"
  authorizationStrategy:
    projectMatrix:
      entries:
        - user:
            name: "${JENKINS_ADMIN_ID:-admin}"
            permissions:
              - "Overall/Administer"
        - user:
            name: "prometheus"
            permissions:
              - "Overall/Read"
              - "Metrics/View"

credentials:
  system:
    domainCredentials:
      - credentials:
          - file:
              scope: GLOBAL
              id: "ssl-proxy-prod-readonly-kubeconfig"
              description: "Read-only kubeconfig for the production revision gate"
              fileName: "prod-readonly-kubeconfig"
              secretBytes: "${readFileBase64:/run/secrets/ssl-proxy-prod-readonly-kubeconfig}"
          - string:
              scope: GLOBAL
              id: "ssl-proxy-github-promotion-token"
              description: "GitHub token limited to digest branch pushes and pull requests"
              secret: "${readFile:/run/secrets/github-promotion-token}"

unclassified:
  location:
    url: "${JENKINS_URL}"

jobs:
  - script: |
      pipelineJob('ssl-proxy-images') {
        description('Builds and publishes every first-party image from the pinned superproject revision.')
        logRotator {
          numToKeep(20)
          artifactNumToKeep(5)
        }
        properties {
          authorizationMatrix {
            inheritanceStrategy {
              inheritingGlobal()
            }
            entries {
              user {
                name('prometheus')
                permissions(['Job/Read'])
              }
            }
          }
        }
        triggers {
          scm('H/5 * * * *')
        }
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  url('https://github.com/zlovtnik/ssl-proxy.git')
                }
                branch('*/main')
              }
            }
            scriptPath('Jenkinsfile')
            lightweight(false)
          }
        }
      }
