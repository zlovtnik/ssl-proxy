jenkins:
  systemMessage: "ssl-proxy CI is managed by Configuration as Code."
  numExecutors: 1
  mode: NORMAL
  disableRememberMe: true
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_ID:-admin}"
          password: "${jenkins-admin-password}"
        - id: "prometheus"
          password: "${jenkins-prometheus-password}"
  authorizationStrategy:
    projectMatrix:
      entries:
        - user:
            name: "${JENKINS_ADMIN_ID:-admin}"
            permissions:
              - "Overall/Administer"
        - user:
            name: "prometheus"
            permissions:
              - "Overall/Read"
              - "Metrics/View"

unclassified:
  location:
    url: "${JENKINS_URL}"

jobs:
  - script: |
      pipelineJob('ssl-proxy-images') {
        description('Validates the superproject and publishes changed first-party images.')
        logRotator {
          numToKeep(20)
          artifactNumToKeep(5)
        }
        properties {
          authorizationMatrix {
            inheritanceStrategy {
              inheritingGlobal()
            }
            entries {
              user {
                name('prometheus')
                permissions(['Job/Read'])
              }
            }
          }
        }
        triggers {
          scm('H/5 * * * *')
        }
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  url('https://github.com/zlovtnik/ssl-proxy.git')
                }
                branch('*/main')
              }
            }
            scriptPath('Jenkinsfile')
            lightweight(false)
          }
        }
      }
  - script: |
      multibranchPipelineJob('octopus-validation') {
        triggers {
          periodicFolderTrigger { interval('5m') }
        }
        branchSources {
          git {
            id('octopus-validation')
            remote('https://github.com/zlovtnik/octopus')
          }
        }
        factory {
          workflowBranchProjectFactory {
            scriptPath('Jenkinsfile')
          }
        }
      }
  - script: |
      multibranchPipelineJob('integration-console-images') {
        triggers {
          periodicFolderTrigger { interval('5m') }
        }
        branchSources {
          git {
            id('integration-console-images')
            remote('https://github.com/zlovtnik/integration-console.git')
          }
        }
        factory {
          workflowBranchProjectFactory {
            scriptPath('Jenkinsfile')
          }
        }
      }
  - script: |
      multibranchPipelineJob('schema-migrator-images') {
        triggers {
          periodicFolderTrigger { interval('5m') }
        }
        branchSources {
          git {
            id('schema-migrator-images')
            remote('https://github.com/zlovtnik/schema-migrator.git')
          }
        }
        factory {
          workflowBranchProjectFactory {
            scriptPath('Jenkinsfile')
          }
        }
      }
  - script: |
      multibranchPipelineJob('wg-key-rotator-images') {
        triggers {
          periodicFolderTrigger { interval('5m') }
        }
        branchSources {
          git {
            id('wg-key-rotator-images')
            remote('https://github.com/zlovtnik/wg-key-rotator.git')
          }
        }
        factory {
          workflowBranchProjectFactory {
            scriptPath('Jenkinsfile')
          }
        }
      }
