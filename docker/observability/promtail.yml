server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /promtail/positions.yml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels:
          - __meta_docker_container_label_com_docker_compose_project
        regex: .+
        action: keep
      - source_labels:
          - __meta_docker_container_label_com_docker_compose_service
        regex: vec-worker.*|ollama
        action: drop
      - source_labels:
          - __meta_docker_container_label_com_docker_compose_service
        target_label: service
      - source_labels:
          - __meta_docker_container_name
        regex: "/(.*)"
        target_label: container
      - source_labels:
          - __meta_docker_container_log_stream
        target_label: stream
      - source_labels:
          - __meta_docker_container_label_com_docker_compose_project
        target_label: compose_project
    pipeline_stages:
      - docker: {}
      - json:
          expressions:
            timestamp: timestamp
            level: level
            service: service
            trace_id: trace_id
            span_id: span_id
            event: event
            error: error
      - labels:
          level:
          service:
