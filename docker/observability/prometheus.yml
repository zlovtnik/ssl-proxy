global:
  scrape_interval: 20s
  evaluation_interval: 15s
  scrape_timeout: 10s

rule_files:
  - /etc/prometheus/alerts/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]

  - job_name: otel-spanmetrics
    static_configs:
      - targets: ["otel-collector:9464"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: promtail
    static_configs:
      - targets: ["promtail:9080"]

  - job_name: jaeger
    static_configs:
      - targets: ["jaeger:14269"]

  - job_name: pushgateway
    static_configs:
      - targets: ["pushgateway:9091"]

  # App services in scope for this non-vector rollout.
  - job_name: ssl-proxy
    metrics_path: /metrics
    static_configs:
      - targets: ["ssl-proxy:3002"]

  - job_name: java-coordinator
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["java-coordinator:8081"]
        labels:
          compose_service: java-coordinator
      - targets: ["java-coordinator-2:8081"]
        labels:
          compose_service: java-coordinator-2
      - targets: ["java-coordinator-3:8081"]
        labels:
          compose_service: java-coordinator-3

  - job_name: integration-console-web
    metrics_path: /metrics
    static_configs:
      - targets: ["integration-console-web:3000"]

  # integration-console-worker, integration-console-heatmap-refresh,
  # integration-console-heartbeat, integration-console-db-setup, minio-init,
  # and redpanda-init are tracked via Pushgateway job metrics.

  - job_name: atheros-sensor
    metrics_path: /metrics
    # network_mode: host means Prometheus reaches the sensor via host-gateway.
    static_configs:
      - targets: ["host.docker.internal:9097"]

  # Infra services in scope.
  - job_name: redpanda
    static_configs:
      - targets: ["redpanda:9644"]

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: minio
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: ["minio:9000"]
