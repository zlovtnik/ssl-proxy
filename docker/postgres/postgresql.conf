# Authoritative Wiretrap PostgreSQL 16 settings. Do not add application DDL here.
listen_addresses = '*'
port = 5432

ssl = on
ssl_ca_file = '/run/postgres-tls/ca.crt'
ssl_cert_file = '/run/postgres-tls/server.crt'
ssl_key_file = '/run/postgres-tls/server.key'
ssl_min_protocol_version = 'TLSv1.2'
password_encryption = 'scram-sha-256'

shared_preload_libraries = 'pg_stat_statements'
shared_buffers = '4GB'
effective_cache_size = '12GB'
work_mem = '16MB'
hash_mem_multiplier = 2
maintenance_work_mem = '512MB'
max_connections = 150
superuser_reserved_connections = 3
max_worker_processes = 12
max_parallel_workers = 6
max_parallel_workers_per_gather = 2
max_parallel_maintenance_workers = 2

checkpoint_timeout = '15min'
max_wal_size = '8GB'
min_wal_size = '2GB'
wal_compression = lz4

random_page_cost = 1.1
effective_io_concurrency = 200
maintenance_io_concurrency = 50

autovacuum_max_workers = 4
autovacuum_work_mem = '256MB'
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02
autovacuum_vacuum_cost_limit = 1000

track_io_timing = on
track_wal_io_timing = on
log_checkpoints = on
compute_query_id = on
pg_stat_statements.track = all
