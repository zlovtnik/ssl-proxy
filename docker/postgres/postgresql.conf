# -------------------------------------------------------------------
# Tuned postgresql.conf for ssl-proxy Postgres container
# Host assumptions: 32 GB RAM, 16 logical cores, SSD/NVMe storage, up to 128 client connections
# Goal: keep latency low while using the larger page cache effectively.
# -------------------------------------------------------------------

# -- Memory -----------------------------------------------------------
shared_buffers = 8GB                     # ~25% of 32GB host RAM
effective_cache_size = 24GB              # planner hint for OS + shared cache
work_mem = 16MB                          # safe with 128 connections and background jobs
maintenance_work_mem = 2GB               # VACUUM, CREATE INDEX, etc.
wal_buffers = 128MB                      # explicit WAL buffer sizing for 8GB shared_buffers
huge_pages = try                         # let the kernel use transparent huge pages

# -- Connections -------------------------------------------------------
max_connections = 128                    # leave room for workers, cron, dashboard, and admin sessions
superuser_reserved_connections = 3       # reserve for admin/maintenance

# -- Checkpoint / WAL --------------------------------------------------
checkpoint_completion_target = 0.9       # spread writes across checkpoint window
checkpoint_timeout = 15min               # default; fine for this workload
max_wal_size = 8GB
min_wal_size = 2GB
wal_level = replica                      # default; sufficient for pg_cron
synchronous_commit = on                  # safety for sync-plane data
wal_compression = on                     # reduce WAL volume for large upserts

# -- Planner / Cost ----------------------------------------------------
random_page_cost = 1.1                   # SSD / NVMe (default 4.0 is HDD)
effective_io_concurrency = 200           # SSD can handle high concurrency
default_statistics_target = 200          # better plans for larger tables
track_io_timing = on                     # expose read/write latency in stats

# -- Parallelism -------------------------------------------------------
max_worker_processes = 20                # leave headroom for pg_cron, autovacuum, and extension workers
max_parallel_workers_per_gather = 4      # accelerate heavy reads without exhausting OLTP capacity
max_parallel_workers = 12                # leave worker headroom for autovacuum and extensions
max_parallel_maintenance_workers = 4     # speed index/vector maintenance on NVMe
parallel_tuple_cost = 0.1                # encourage parallel plans on SSD
parallel_setup_cost = 100                # default

# -- Autovacuum --------------------------------------------------------
autovacuum = on
autovacuum_max_workers = 4              # keep up with vec_* and sync_events churn
autovacuum_naptime = 15s                # wake often enough to avoid dead tuple pileups
autovacuum_vacuum_scale_factor = 0.02   # vacuum at 2% table churn
autovacuum_vacuum_threshold = 50
autovacuum_analyze_scale_factor = 0.01  # analyze at 1% churn
autovacuum_vacuum_cost_limit = 1600     # enough budget to finish before churn outruns vacuum
autovacuum_vacuum_cost_delay = 2ms      # smaller pauses keep bloat from accumulating
# Monitor pg_stat_user_tables and pg_stat_activity for latency/bloat tradeoffs.

# -- Network / session stability --------------------------------------
tcp_keepalives_idle = 60
tcp_keepalives_interval = 10
tcp_keepalives_count = 6
deadlock_timeout = 500ms
idle_in_transaction_session_timeout = 60s

# -- Logging -----------------------------------------------------------
log_timezone = 'US/Eastern'
log_line_prefix = '%t [%p]: [%l-1] %u@%d '
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on
log_temp_files = 0                      # log temp file creation for tuning
log_min_duration_statement = 1000       # log queries >= 1s while tuning contention
log_statement = 'none'                  # don't log all queries in production

# -- Timezone ----------------------------------------------------------
timezone = 'US/Eastern'

# -- Defaults ----------------------------------------------------------
lc_messages = 'en_US.UTF-8'
lc_monetary = 'en_US.UTF-8'
lc_numeric = 'en_US.UTF-8'
lc_time = 'en_US.UTF-8'
