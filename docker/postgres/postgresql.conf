# ──────────────────────────────────────────────────────────────
# Tuned postgresql.conf for ssl-proxy Postgres container
# Host assumptions: 1 CPU core, 16 GB RAM, 32 max connections
# Storage: SSD/NVMe (random_page_cost=1.1)
# ──────────────────────────────────────────────────────────────

# ── Memory ────────────────────────────────────────────────────
shared_buffers = 4GB                     # 25% of 16GB container RAM
effective_cache_size = 12GB              # 75% of 16GB container RAM
work_mem = 64MB                          # 16GB / (32 conns × 8 sorts) ≈ 64MB
maintenance_work_mem = 1GB               # VACUUM, CREATE INDEX, etc.
wal_buffers = 32MB                       # ~1% of shared_buffers
huge_pages = try                         # let kernel use transparent huge pages

# ── Connections ───────────────────────────────────────────────
max_connections = 32                     # hard cap matching all service pools
superuser_reserved_connections = 3       # reserve for admin/maintenance

# ── Checkpoint / WAL ──────────────────────────────────────────
checkpoint_completion_target = 0.9       # spread writes across checkpoint window
checkpoint_timeout = 15min               # default; fine for this workload
max_wal_size = 4GB
min_wal_size = 1GB
wal_level = replica                      # default; sufficient for pg_cron
synchronous_commit = on                  # safety for sync-plane data

# ── Planner / Cost ────────────────────────────────────────────
random_page_cost = 1.1                   # SSD / NVMe (default 4.0 is HDD)
effective_io_concurrency = 200           # SSD can handle high concurrency
default_statistics_target = 100          # default; bump to 500 for large tables

# ── Parallelism ───────────────────────────────────────────────
max_worker_processes = 4                 # 1 CPU × 4
max_parallel_workers_per_gather = 2      # 1 CPU × 2
max_parallel_workers = 4                 # match max_worker_processes
parallel_tuple_cost = 0.1                # encourage parallel plans on SSD
parallel_setup_cost = 100                # default

# ── Autovacuum ────────────────────────────────────────────────
autovacuum = on
autovacuum_max_workers = 2              # conservative for 1 CPU
autovacuum_naptime = 1min               # responsive
autovacuum_vacuum_scale_factor = 0.01   # vacuum sooner (1% of table)
autovacuum_vacuum_threshold = 50
autovacuum_analyze_scale_factor = 0.005 # analyze sooner
autovacuum_vacuum_cost_limit = 1000     # allow faster vacuuming

# ── Logging ───────────────────────────────────────────────────
log_timezone = 'US/Eastern'
log_line_prefix = '%t [%p]: [%l-1] %u@%d '
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on
log_temp_files = 0                      # log temp file creation for tuning
log_min_duration_statement = 5000       # log queries >= 5s
log_statement = 'none'                  # don't log all queries in production

# ── Timezone ──────────────────────────────────────────────────
timezone = 'US/Eastern'

# ── Defaults ──────────────────────────────────────────────────
lc_messages = 'en_US.UTF-8'
lc_monetary = 'en_US.UTF-8'
lc_numeric = 'en_US.UTF-8'
lc_time = 'en_US.UTF-8'