apiVersion: batch/v1
kind: Job
metadata:
  name: ssl-proxy-tidb-init
  namespace: ssl-proxy
  labels:
    app: ssl-proxy-tidb
spec:
  template:
    metadata:
      labels:
        app: ssl-proxy-tidb-init
    spec:
      containers:
        - name: tidb-init
          image: pingcap/tidb:v8.5.0
          command:
            - /bin/sh
            - -c
            - |
              set -e
              
              echo "Waiting for TiDB to be ready..."
              until mysql -h ssl-proxy-tidb -P 4000 -u root -e "SELECT 1" 2>/dev/null; do
                sleep 2
              done
              echo "TiDB is ready."
              
              echo "Creating databases..."
              mysql -h ssl-proxy-tidb -P 4000 -u root -e "CREATE DATABASE IF NOT EXISTS octopus_core CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
              mysql -h ssl-proxy-tidb -P 4000 -u root -e "CREATE DATABASE IF NOT EXISTS atheros_search CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
              mysql -h ssl-proxy-tidb -P 4000 -u root -e "CREATE DATABASE IF NOT EXISTS schema_migrator CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
              
              echo "Creating accounts..."
              mysql -h ssl-proxy-tidb -P 4000 -u root -e "CREATE USER IF NOT EXISTS 'octopus_runtime' IDENTIFIED BY '${OCTOPUS_PASSWORD}';"
              mysql -h ssl-proxy-tidb -P 4000 -u root -e "CREATE USER IF NOT EXISTS 'atheros_search_runtime' IDENTIFIED BY '${ATHEROS_SEARCH_PASSWORD}';"
              mysql -h ssl-proxy-tidb -P 4000 -u root -e "CREATE USER IF NOT EXISTS 'schema_migrator_runtime' IDENTIFIED BY '${SCHEMA_MIGRATOR_PASSWORD}';"
              
              echo "Granting permissions..."
              mysql -h ssl-proxy-tidb -P 4000 -u root -e "GRANT SELECT, INSERT, UPDATE, DELETE ON octopus_core.* TO 'octopus_runtime';"
              mysql -h ssl-proxy-tidb -P 4000 -u root -e "GRANT SELECT, INSERT, UPDATE, DELETE ON atheros_search.* TO 'octopus_runtime';"
              mysql -h ssl-proxy-tidb -P 4000 -u root -e "GRANT SELECT ON atheros_search.* TO 'atheros_search_runtime';"
              mysql -h ssl-proxy-tidb -P 4000 -u root -e "GRANT SELECT ON octopus_core.* TO 'atheros_search_runtime';"
              mysql -h ssl-proxy-tidb -P 4000 -u root -e "GRANT SELECT, INSERT, UPDATE, DELETE ON schema_migrator.* TO 'schema_migrator_runtime';"
              
              echo "TiDB initialization complete."
          env:
            - name: OCTOPUS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tidb-octopus
                  key: password
            - name: ATHEROS_SEARCH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tidb-atheros-search
                  key: password
            - name: SCHEMA_MIGRATOR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tidb-schema-migrator
                  key: password
      restartPolicy: OnFailure
