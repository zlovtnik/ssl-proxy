{{- if .Values.observability.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ssl-proxy.fullname" . }}-prometheus-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ssl-proxy.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 20s
      evaluation_interval: 15s
      scrape_timeout: 10s
    rule_files:
      - /etc/prometheus/alerts/alerts.yml
    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["127.0.0.1:9090"]
      - job_name: otel-collector
        static_configs:
          - targets: ["{{ include "ssl-proxy.fullname" . }}-otel-collector:8888"]
      - job_name: otel-spanmetrics
        static_configs:
          - targets: ["{{ include "ssl-proxy.fullname" . }}-otel-collector:9464"]
      - job_name: loki
        static_configs:
          - targets: ["{{ include "ssl-proxy.fullname" . }}-loki:3100"]
      - job_name: promtail
        static_configs:
          - targets: ["{{ include "ssl-proxy.fullname" . }}-promtail:9080"]
      - job_name: jaeger
        static_configs:
          - targets: ["{{ include "ssl-proxy.fullname" . }}-jaeger:14269"]
      - job_name: pushgateway
        static_configs:
          - targets: ["{{ include "ssl-proxy.fullname" . }}-pushgateway:9091"]
      - job_name: ssl-proxy
        metrics_path: /metrics
        static_configs:
          - targets: ["{{ include "ssl-proxy.fullname" . }}-proxy-admin:{{ .Values.proxy.service.adminPort }}"]
      - job_name: java-coordinator
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ["{{ include "ssl-proxy.fullname" . }}-coordinator:{{ .Values.javaCoordinator.service.port }}"]
      {{- if .Values.integrationConsole.enabled }}
      - job_name: integration-console-web
        metrics_path: /metrics
        static_configs:
          - targets: ["{{ include "ssl-proxy.fullname" . }}-integration-console:{{ .Values.integrationConsole.web.service.port }}"]
      {{- end }}
      {{- if .Values.atherosSensor.enabled }}
      - job_name: atheros-sensor
        metrics_path: /metrics
        static_configs:
          - targets: ["{{ include "ssl-proxy.fullname" . }}-atheros-sensor:{{ .Values.atherosSensor.metricsPort }}"]
      {{- end }}
      - job_name: redpanda
        static_configs:
          - targets: ["{{ include "ssl-proxy.fullname" . }}-redpanda:{{ .Values.redpanda.adminPort }}"]
      - job_name: postgres-exporter
        static_configs:
          - targets: ["{{ include "ssl-proxy.fullname" . }}-postgres-exporter:9187"]
      - job_name: redis-exporter
        static_configs:
          - targets: ["{{ include "ssl-proxy.fullname" . }}-redis-exporter:9121"]
      - job_name: node-exporter
        static_configs:
          - targets: ["{{ include "ssl-proxy.fullname" . }}-node-exporter:9100"]
      - job_name: cadvisor
        static_configs:
          - targets: ["{{ include "ssl-proxy.fullname" . }}-cadvisor:8080"]
      - job_name: minio
        metrics_path: /minio/v2/metrics/cluster
        static_configs:
          - targets: ["{{ include "ssl-proxy.fullname" . }}-minio:9000"]
  alerts.yml: |
    {{- if .Values.observability.prometheus.alertRules }}
    {{- .Values.observability.prometheus.alertRules | nindent 4 }}
    {{- else }}
    groups: []
    {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ssl-proxy.fullname" . }}-loki-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ssl-proxy.labels" . | nindent 4 }}
    app.kubernetes.io/component: loki
data:
  config.yml: |
    auth_enabled: false
    server:
      http_listen_port: 3100
      grpc_listen_port: 9096
    common:
      path_prefix: /loki
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
    schema_config:
      configs:
        - from: "2024-01-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: loki_index_
            period: 24h
    analytics:
      reporting_enabled: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ssl-proxy.fullname" . }}-promtail-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ssl-proxy.labels" . | nindent 4 }}
    app.kubernetes.io/component: promtail
data:
  config.yml: |
    server:
      http_listen_port: 9080
      grpc_listen_port: 0
    positions:
      filename: /promtail/positions.yml
    clients:
      - url: http://{{ include "ssl-proxy.fullname" . }}-loki:3100/loki/api/v1/push
    scrape_configs:
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_container_name]
            target_label: container
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
            target_label: service
          - source_labels: [__meta_kubernetes_pod_uid, __meta_kubernetes_pod_container_name]
            separator: /
            target_label: __path__
            replacement: /var/log/pods/*$1/*.log
        pipeline_stages:
          - cri: {}
          - json:
              expressions:
                timestamp: timestamp
                level: level
                service: service
                trace_id: trace_id
                span_id: span_id
                event: event
                error: error
          - labels:
              level:
              service:
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ssl-proxy.fullname" . }}-otel-collector-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ssl-proxy.labels" . | nindent 4 }}
    app.kubernetes.io/component: otel-collector
data:
  config.yml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 256
        spike_limit_mib: 64
      batch:
        timeout: 1s
        send_batch_size: 1024
    connectors:
      spanmetrics:
        namespace: traces.spanmetrics
        dimensions:
          - name: db.system
          - name: db.operation
          - name: db.name
          - name: messaging.system
          - name: messaging.destination.name
          - name: messaging.operation
          - name: status
        histogram:
          explicit:
            buckets: [5ms, 10ms, 25ms, 50ms, 100ms, 250ms, 500ms, 1s, 2.5s, 5s, 10s, 30s]
    exporters:
      otlp/jaeger:
        endpoint: {{ include "ssl-proxy.fullname" . }}-jaeger:4317
        tls:
          insecure: true
      prometheus/spanmetrics:
        endpoint: 0.0.0.0:9464
      logging:
        verbosity: normal
    service:
      telemetry:
        metrics:
          address: 0.0.0.0:8888
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlp/jaeger, spanmetrics, logging]
        metrics/spanmetrics:
          receivers: [spanmetrics]
          processors: [memory_limiter, batch]
          exporters: [prometheus/spanmetrics]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ssl-proxy.fullname" . }}-grafana-provisioning
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ssl-proxy.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
data:
  datasources.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://{{ include "ssl-proxy.fullname" . }}-prometheus:9090
        isDefault: true
        jsonData:
          httpMethod: POST
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://{{ include "ssl-proxy.fullname" . }}-loki:3100
        jsonData:
          maxLines: 1000
          derivedFields:
            - name: trace_id
              matcherRegex: '"trace_id":"([^\"]+)"'
              url: http://{{ include "ssl-proxy.fullname" . }}-jaeger:16686/trace/$${__value.raw}
      - name: Jaeger
        uid: jaeger
        type: jaeger
        access: proxy
        url: http://{{ include "ssl-proxy.fullname" . }}-jaeger:16686
  dashboards.yml: |
    apiVersion: 1
    providers:
      - name: Observability
        orgId: 1
        folder: Observability
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ssl-proxy.fullname" . }}-grafana-dashboards
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ssl-proxy.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
data:
  {{- with .Values.observability.grafana.dashboards.dbCalls }}
  db-calls.json: |
    {{- . | nindent 4 }}
  {{- end }}
  {{- with .Values.observability.grafana.dashboards.infraSaturation }}
  infra-saturation.json: |
    {{- . | nindent 4 }}
  {{- end }}
  {{- with .Values.observability.grafana.dashboards.integrationConsoleHealth }}
  integration-console-health.json: |
    {{- . | nindent 4 }}
  {{- end }}
  {{- with .Values.observability.grafana.dashboards.serviceRedMetrics }}
  service-red-metrics.json: |
    {{- . | nindent 4 }}
  {{- end }}
  {{- with .Values.observability.grafana.dashboards.stackHealthOverview }}
  stack-health-overview.json: |
    {{- . | nindent 4 }}
  {{- end }}
  {{- with .Values.observability.grafana.dashboards.syncPipelineLatency }}
  sync-pipeline-latency.json: |
    {{- . | nindent 4 }}
  {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ssl-proxy.fullname" . }}-postgres-exporter-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ssl-proxy.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres-exporter
data:
  queries.yml: |
    {{- if .Values.observability.postgresExporter.queries }}
    {{- .Values.observability.postgresExporter.queries | nindent 4 }}
    {{- else }}
    {}
    {{- end }}
{{- end }}
