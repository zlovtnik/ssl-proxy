---
# Common configuration shared across services
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ssl-proxy.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ssl-proxy.labels" . | nindent 4 }}
data:
  # Redpanda
  SYNC_REDPANDA_BOOTSTRAP_SERVERS: {{ include "ssl-proxy.redpandaBootstrapServers" . | quote }}
  # Sync topics
  SYNC_SCAN_TOPIC: {{ .Values.global.shared.javaCoordinator.topics.scanTopic | quote }}
  SYNC_LOAD_TOPIC: {{ .Values.global.shared.javaCoordinator.topics.loadTopic | quote }}
  SYNC_RESULT_TOPIC: {{ .Values.global.shared.javaCoordinator.topics.resultTopic | quote }}
  SYNC_PAYLOAD_AUDIT_TOPIC: {{ .Values.global.shared.javaCoordinator.topics.payloadAuditTopic | quote }}
  # Consumer groups
  SYNC_SCAN_CONSUMER: {{ .Values.global.shared.javaCoordinator.consumers.scanConsumer | quote }}
  SYNC_LOAD_CONSUMER: {{ .Values.global.shared.javaCoordinator.consumers.loadConsumer | quote }}
  SYNC_RESULT_CONSUMER: {{ .Values.global.shared.javaCoordinator.consumers.resultConsumer | quote }}
  SYNC_PAYLOAD_AUDIT_CONSUMER: {{ .Values.global.shared.javaCoordinator.consumers.payloadAuditConsumer | quote }}
  # Stream names
  SYNC_STREAM_NAMES: {{ .Values.global.shared.javaCoordinator.streams.commonStreamNames | quote }}
  COORDINATOR_LOAD_STREAM_NAMES: {{ .Values.global.shared.javaCoordinator.streams.commonStreamNames | quote }}
  AUDIT_STREAM_NAME: {{ .Values.global.shared.javaCoordinator.streams.auditStreamName | quote }}
  SYNC_RESULT_STREAM_NAME: {{ .Values.global.shared.javaCoordinator.streams.resultStreamName | quote }}
  # Wireless stream names (Java coordinator)
  WIRELESS_BACKLOG_STREAM_NAME: {{ .Values.global.shared.javaCoordinator.streams.wirelessBacklogStreamName | quote }}
  WIRELESS_MAC_STREAM_NAME: {{ .Values.global.shared.javaCoordinator.streams.wirelessMacStreamName | quote }}
  WIRELESS_NETWORKS_STREAM_NAME: {{ .Values.global.shared.javaCoordinator.streams.wirelessNetworksStreamName | quote }}
  WIRELESS_PROBE_STREAM_NAME: {{ .Values.global.shared.javaCoordinator.streams.wirelessProbeStreamName | quote }}
  # Wireless operation topics (Java coordinator)
  WIRELESS_BACKLOG_SAVE_TOPIC: {{ .Values.global.shared.javaCoordinator.wirelessTopics.backlogSaveTopic | quote }}
  WIRELESS_BACKLOG_LIST_TOPIC: {{ .Values.global.shared.javaCoordinator.wirelessTopics.backlogListTopic | quote }}
  WIRELESS_BACKLOG_SYNCED_TOPIC: {{ .Values.global.shared.javaCoordinator.wirelessTopics.backlogSyncedTopic | quote }}
  WIRELESS_BACKLOG_PRUNE_TOPIC: {{ .Values.global.shared.javaCoordinator.wirelessTopics.backlogPruneTopic | quote }}
  WIRELESS_MAC_LOOKUP_TOPIC: {{ .Values.global.shared.javaCoordinator.wirelessTopics.macLookupTopic | quote }}
  WIRELESS_NETWORKS_AUTHORIZED_TOPIC: {{ .Values.global.shared.javaCoordinator.wirelessTopics.networksAuthorizedTopic | quote }}
  WIRELESS_PROBE_FLUSH_TOPIC: {{ .Values.global.shared.javaCoordinator.wirelessTopics.probeFlushTopic | quote }}
  # Wireless consumer groups (Java coordinator)
  WIRELESS_BACKLOG_SAVE_CONSUMER: {{ .Values.global.shared.javaCoordinator.wirelessConsumers.backlogSaveConsumer | quote }}
  WIRELESS_BACKLOG_LIST_CONSUMER: {{ .Values.global.shared.javaCoordinator.wirelessConsumers.backlogListConsumer | quote }}
  WIRELESS_BACKLOG_SYNCED_CONSUMER: {{ .Values.global.shared.javaCoordinator.wirelessConsumers.backlogSyncedConsumer | quote }}
  WIRELESS_BACKLOG_PRUNE_CONSUMER: {{ .Values.global.shared.javaCoordinator.wirelessConsumers.backlogPruneConsumer | quote }}
  WIRELESS_MAC_LOOKUP_CONSUMER: {{ .Values.global.shared.javaCoordinator.wirelessConsumers.macLookupConsumer | quote }}
  WIRELESS_NETWORKS_AUTHORIZED_CONSUMER: {{ .Values.global.shared.javaCoordinator.wirelessConsumers.networksAuthorizedConsumer | quote }}
  WIRELESS_PROBE_FLUSH_CONSUMER: {{ .Values.global.shared.javaCoordinator.wirelessConsumers.probeFlushConsumer | quote }}
  # Wireless reply topics (Java coordinator)
  WIRELESS_BACKLOG_LIST_REPLY_TOPIC: {{ .Values.global.shared.javaCoordinator.wirelessReplyTopics.backlogListReplyTopic | quote }}
  WIRELESS_BACKLOG_PRUNE_REPLY_TOPIC: {{ .Values.global.shared.javaCoordinator.wirelessReplyTopics.backlogPruneReplyTopic | quote }}
  WIRELESS_MAC_LOOKUP_REPLY_TOPIC: {{ .Values.global.shared.javaCoordinator.wirelessReplyTopics.macLookupReplyTopic | quote }}
  WIRELESS_NETWORKS_AUTHORIZED_REPLY_TOPIC: {{ .Values.global.shared.javaCoordinator.wirelessReplyTopics.networksAuthorizedReplyTopic | quote }}

---
# Redpanda topic manifest ConfigMap (mounted by octopus for topic validation)
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ssl-proxy.fullname" . }}-topics-manifest
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ssl-proxy.labels" . | nindent 4 }}
{{ $replicas := .Values.global.shared.redpanda.topicReplicationFactor }}
data:
  topics.manifest: |
    # topic|partitions|replicas|retention.ms|retention.bytes
    # NOTE: Partition count set to {{ .Values.global.shared.javaCoordinator.topicPartitions }} to support up to 5 replicas
    sync.scan.request|{{ .Values.global.shared.javaCoordinator.topicPartitions }}|{{ $replicas }}|2592000000|-1
    sync.scan.request.dlq|{{ .Values.global.shared.javaCoordinator.topicPartitions }}|{{ $replicas }}|2592000000|-1
    sync.oracle.load|{{ .Values.global.shared.javaCoordinator.topicPartitions }}|{{ $replicas }}|2592000000|-1
    sync.oracle.load.dlq|{{ .Values.global.shared.javaCoordinator.topicPartitions }}|{{ $replicas }}|2592000000|-1
    sync.oracle.result|{{ .Values.global.shared.javaCoordinator.topicPartitions }}|{{ $replicas }}|2592000000|-1
    sync.oracle.result.dlq|{{ .Values.global.shared.javaCoordinator.topicPartitions }}|{{ $replicas }}|2592000000|-1
    proxy.payload_audit|3|{{ $replicas }}|2592000000|-1
    proxy.payload_audit.dlq|3|{{ $replicas }}|2592000000|-1
    wireless.audit|3|{{ $replicas }}|2592000000|-1
    wireless.mac.seen|3|{{ $replicas }}|2592000000|-1
    wireless.audit.enriched|3|{{ $replicas }}|2592000000|-1
    wireless.audit.config|1|{{ $replicas }}|2592000000|-1
    wireless.config.authorized_networks|1|{{ $replicas }}|2592000000|-1
    wireless.config.sensor|1|{{ $replicas }}|2592000000|-1
    wireless.client.inventory|3|{{ $replicas }}|2592000000|-1
    audit.threat.shadow_device|3|{{ $replicas }}|2592000000|-1
    wireless.mac.registry|1|{{ $replicas }}|2592000000|-1
    wireless.backlog.save|3|{{ $replicas }}|2592000000|-1
    wireless.backlog.save.dlq|3|{{ $replicas }}|2592000000|-1
    wireless.backlog.list|3|{{ $replicas }}|2592000000|-1
    wireless.backlog.list.dlq|3|{{ $replicas }}|2592000000|-1
    wireless.backlog.synced|3|{{ $replicas }}|2592000000|-1
    wireless.backlog.synced.dlq|3|{{ $replicas }}|2592000000|-1
    wireless.backlog.prune|3|{{ $replicas }}|2592000000|-1
    wireless.backlog.prune.dlq|3|{{ $replicas }}|2592000000|-1
    wireless.backlog.list.reply|3|{{ $replicas }}|300000|-1
    wireless.backlog.prune.reply|3|{{ $replicas }}|300000|-1
    wireless.mac.lookup|3|{{ $replicas }}|2592000000|-1
    wireless.mac.lookup.dlq|3|{{ $replicas }}|2592000000|-1
    wireless.mac.lookup.reply|3|{{ $replicas }}|300000|-1
    wireless.networks.authorized|3|{{ $replicas }}|2592000000|-1
    wireless.networks.authorized.dlq|3|{{ $replicas }}|2592000000|-1
    wireless.networks.authorized.reply|3|{{ $replicas }}|300000|-1
    wireless.probe.flush|3|{{ $replicas }}|3600000|-1
    wireless.probe.flush.dlq|3|{{ $replicas }}|2592000000|-1
    audit.wireless.bandwidth|3|{{ $replicas }}|604800000|-1
    wireless.alert.rogue_ap|3|{{ $replicas }}|2592000000|-1
    wireless.alert.deauth_flood|3|{{ $replicas }}|2592000000|-1
    wireless.alert.signal_anomaly|3|{{ $replicas }}|2592000000|-1
    wireless.alert.pmf_attack|3|{{ $replicas }}|2592000000|-1
    wireless.alert.attack_sequence|3|{{ $replicas }}|2592000000|-1
    wifi.alert.handshake|3|{{ $replicas }}|2592000000|-1
