---
# Common configuration shared across services
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ssl-proxy.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ssl-proxy.labels" . | nindent 4 }}
data:
  # Redpanda
  SYNC_REDPANDA_BOOTSTRAP_SERVERS: {{ include "ssl-proxy.redpandaBootstrapServers" . | quote }}
  # Sync topics
  SYNC_SCAN_TOPIC: {{ .Values.javaCoordinator.topics.scanTopic | quote }}
  SYNC_LOAD_TOPIC: {{ .Values.javaCoordinator.topics.loadTopic | quote }}
  SYNC_RESULT_TOPIC: {{ .Values.javaCoordinator.topics.resultTopic | quote }}
  PAYLOAD_AUDIT_REDPANDA_TOPIC: {{ .Values.javaCoordinator.topics.payloadAuditTopic | quote }}
  # Consumer groups
  SYNC_SCAN_CONSUMER: {{ .Values.javaCoordinator.consumers.scanConsumer | quote }}
  SYNC_LOAD_CONSUMER: {{ .Values.javaCoordinator.consumers.loadConsumer | quote }}
  SYNC_RESULT_CONSUMER: {{ .Values.javaCoordinator.consumers.resultConsumer | quote }}
  PAYLOAD_AUDIT_CONSUMER: {{ .Values.javaCoordinator.consumers.payloadAuditConsumer | quote }}
  # Stream names
  SYNC_STREAM_NAMES: {{ .Values.javaCoordinator.streams.syncStreamNames | quote }}
  SYNC_ORACLE_STREAM_NAMES: {{ .Values.javaCoordinator.streams.oracleStreamNames | quote }}
  AUDIT_STREAM_NAME: {{ .Values.javaCoordinator.streams.auditStreamName | quote }}
  SYNC_RESULT_STREAM_NAME: {{ .Values.javaCoordinator.streams.resultStreamName | quote }}
  # Wireless stream names (Java coordinator)
  WIRELESS_BACKLOG_STREAM_NAME: {{ .Values.javaCoordinator.streams.wirelessBacklogStreamName | quote }}
  WIRELESS_MAC_STREAM_NAME: {{ .Values.javaCoordinator.streams.wirelessMacStreamName | quote }}
  WIRELESS_NETWORKS_STREAM_NAME: {{ .Values.javaCoordinator.streams.wirelessNetworksStreamName | quote }}
  WIRELESS_PROBE_STREAM_NAME: {{ .Values.javaCoordinator.streams.wirelessProbeStreamName | quote }}
  # Wireless operation topics (Java coordinator)
  WIRELESS_BACKLOG_SAVE_TOPIC: {{ .Values.javaCoordinator.wirelessTopics.backlogSaveTopic | quote }}
  WIRELESS_BACKLOG_LIST_TOPIC: {{ .Values.javaCoordinator.wirelessTopics.backlogListTopic | quote }}
  WIRELESS_BACKLOG_SYNCED_TOPIC: {{ .Values.javaCoordinator.wirelessTopics.backlogSyncedTopic | quote }}
  WIRELESS_BACKLOG_PRUNE_TOPIC: {{ .Values.javaCoordinator.wirelessTopics.backlogPruneTopic | quote }}
  WIRELESS_MAC_LOOKUP_TOPIC: {{ .Values.javaCoordinator.wirelessTopics.macLookupTopic | quote }}
  WIRELESS_NETWORKS_AUTHORIZED_TOPIC: {{ .Values.javaCoordinator.wirelessTopics.networksAuthorizedTopic | quote }}
  WIRELESS_PROBE_FLUSH_TOPIC: {{ .Values.javaCoordinator.wirelessTopics.probeFlushTopic | quote }}
  # Wireless consumer groups (Java coordinator)
  WIRELESS_BACKLOG_SAVE_CONSUMER: {{ .Values.javaCoordinator.wirelessConsumers.backlogSaveConsumer | quote }}
  WIRELESS_BACKLOG_LIST_CONSUMER: {{ .Values.javaCoordinator.wirelessConsumers.backlogListConsumer | quote }}
  WIRELESS_BACKLOG_SYNCED_CONSUMER: {{ .Values.javaCoordinator.wirelessConsumers.backlogSyncedConsumer | quote }}
  WIRELESS_BACKLOG_PRUNE_CONSUMER: {{ .Values.javaCoordinator.wirelessConsumers.backlogPruneConsumer | quote }}
  WIRELESS_MAC_LOOKUP_CONSUMER: {{ .Values.javaCoordinator.wirelessConsumers.macLookupConsumer | quote }}
  WIRELESS_NETWORKS_AUTHORIZED_CONSUMER: {{ .Values.javaCoordinator.wirelessConsumers.networksAuthorizedConsumer | quote }}
  WIRELESS_PROBE_FLUSH_CONSUMER: {{ .Values.javaCoordinator.wirelessConsumers.probeFlushConsumer | quote }}
  # Wireless reply topics (Java coordinator)
  WIRELESS_BACKLOG_LIST_REPLY_TOPIC: {{ .Values.javaCoordinator.wirelessReplyTopics.backlogListReplyTopic | quote }}
  WIRELESS_BACKLOG_PRUNE_REPLY_TOPIC: {{ .Values.javaCoordinator.wirelessReplyTopics.backlogPruneReplyTopic | quote }}
  WIRELESS_MAC_LOOKUP_REPLY_TOPIC: {{ .Values.javaCoordinator.wirelessReplyTopics.macLookupReplyTopic | quote }}
  WIRELESS_NETWORKS_AUTHORIZED_REPLY_TOPIC: {{ .Values.javaCoordinator.wirelessReplyTopics.networksAuthorizedReplyTopic | quote }}

---
# Redpanda topic manifest ConfigMap (mounted by zig-coordinator for topic validation)
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ssl-proxy.fullname" . }}-topics-manifest
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ssl-proxy.labels" . | nindent 4 }}
data:
  topics.manifest: |
    # topic|partitions|replicas|retention.ms|retention.bytes
    # NOTE: Partition count set to {{ .Values.javaCoordinator.topicPartitions }} to support up to 5 replicas
    sync.scan.request|{{ .Values.javaCoordinator.topicPartitions }}|3|2592000000|-1
    sync.scan.request.dlq|{{ .Values.javaCoordinator.topicPartitions }}|3|2592000000|-1
    sync.oracle.load|{{ .Values.javaCoordinator.topicPartitions }}|3|2592000000|-1
    sync.oracle.load.dlq|{{ .Values.javaCoordinator.topicPartitions }}|3|2592000000|-1
    sync.oracle.result|{{ .Values.javaCoordinator.topicPartitions }}|3|2592000000|-1
    sync.oracle.result.dlq|{{ .Values.javaCoordinator.topicPartitions }}|3|2592000000|-1
    proxy.payload_audit|3|3|2592000000|-1
    proxy.payload_audit.dlq|3|3|2592000000|-1
    wireless.audit|3|3|2592000000|-1
    wireless.mac.seen|3|3|2592000000|-1
    wireless.audit.enriched|3|3|2592000000|-1
    wireless.audit.config|1|3|2592000000|-1
    wireless.config.authorized_networks|1|3|2592000000|-1
    wireless.config.sensor|1|3|2592000000|-1
    wireless.client.inventory|3|3|2592000000|-1
    audit.threat.shadow_device|3|3|2592000000|-1
    wireless.mac.registry|1|3|2592000000|-1
    wireless.backlog.save|3|3|2592000000|-1
    wireless.backlog.save.dlq|3|3|2592000000|-1
    wireless.backlog.list|3|3|2592000000|-1
    wireless.backlog.list.dlq|3|3|2592000000|-1
    wireless.backlog.synced|3|3|2592000000|-1
    wireless.backlog.synced.dlq|3|3|2592000000|-1
    wireless.backlog.prune|3|3|2592000000|-1
    wireless.backlog.prune.dlq|3|3|2592000000|-1
    wireless.backlog.list.reply|3|3|300000|-1
    wireless.backlog.prune.reply|3|3|300000|-1
    wireless.mac.lookup|3|3|2592000000|-1
    wireless.mac.lookup.dlq|3|3|2592000000|-1
    wireless.mac.lookup.reply|3|3|300000|-1
    wireless.networks.authorized|3|3|2592000000|-1
    wireless.networks.authorized.dlq|3|3|2592000000|-1
    wireless.networks.authorized.reply|3|3|300000|-1
    wireless.probe.flush|3|3|3600000|-1
    wireless.probe.flush.dlq|3|3|2592000000|-1
    audit.wireless.bandwidth|3|3|604800000|-1
    wireless.alert.rogue_ap|3|3|2592000000|-1
    wireless.alert.deauth_flood|3|3|2592000000|-1
    wireless.alert.signal_anomaly|3|3|2592000000|-1
    wireless.alert.pmf_attack|3|3|2592000000|-1
    wireless.alert.attack_sequence|3|3|2592000000|-1
    wifi.alert.handshake|3|3|2592000000|-1
