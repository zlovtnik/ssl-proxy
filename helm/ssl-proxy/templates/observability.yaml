      hostPID: true
      containers:
        - name: node-exporter
          image: {{ include "ssl-proxy.image" (dict "root" . "image" .Values.observability.nodeExporter.image) }}
          imagePullPolicy: {{ .Values.observability.nodeExporter.image.pullPolicy }}
          args:
            - --path.procfs=/host/proc
            - --path.sysfs=/host/sys
            - --path.rootfs=/host/root
            - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
          ports:
            - name: metrics
              containerPort: 9100
          volumeMounts:
            - {name: proc, mountPath: /host/proc, readOnly: true}
            - {name: sys, mountPath: /host/sys, readOnly: true}
            - {name: root, mountPath: /host/root, readOnly: true}
      volumes:
        - name: proc
          hostPath: {path: /proc, type: Directory}
        - name: sys
          hostPath: {path: /sys, type: Directory}
        - name: root
          hostPath: {path: /, type: Directory}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ssl-proxy.fullname" . }}-cadvisor
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ssl-proxy.labels" . | nindent 4 }}
    app.kubernetes.io/component: cadvisor
spec:
  clusterIP: None
  selector:
    {{- include "ssl-proxy.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: cadvisor
  ports:
    - {name: metrics, port: 8080, targetPort: metrics}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "ssl-proxy.fullname" . }}-cadvisor
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ssl-proxy.labels" . | nindent 4 }}
    app.kubernetes.io/component: cadvisor
spec:
  selector:
    matchLabels:
      {{- include "ssl-proxy.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: cadvisor
  template:
    metadata:
      labels:
        {{- include "ssl-proxy.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: cadvisor
    spec:
      hostNetwork: true
      containers:
        - name: cadvisor
          image: {{ include "ssl-proxy.image" (dict "root" . "image" .Values.observability.cadvisor.image) }}
          imagePullPolicy: {{ .Values.observability.cadvisor.image.pullPolicy }}
          securityContext:
            privileged: true
          args: ["--docker_only=false", "--housekeeping_interval=10s"]
          ports:
            - name: metrics
              containerPort: 8080
          volumeMounts:
            - {name: root, mountPath: /rootfs, readOnly: true}
            - {name: run, mountPath: /var/run, readOnly: true}
            - {name: sys, mountPath: /sys, readOnly: true}
            - {name: containerd, mountPath: /var/lib/containerd, readOnly: true}
            - {name: disk, mountPath: /dev/disk, readOnly: true}
      volumes:
        - name: root
          hostPath: {path: /, type: Directory}
        - name: run
          hostPath: {path: /var/run, type: Directory}
        - name: sys
          hostPath: {path: /sys, type: Directory}
        - name: containerd
          hostPath:
            path: {{ .Values.observability.cadvisor.containerdHostPath | quote }}
            type: Directory
        - name: disk
          hostPath: {path: /dev/disk, type: DirectoryOrCreate}
{{- end }}
