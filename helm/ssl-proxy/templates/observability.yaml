    {{- include "ssl-proxy.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres-exporter
spec:
  selector:
    {{- include "ssl-proxy.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgres-exporter
  ports:
    - {name: metrics, port: 9187, targetPort: metrics}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ssl-proxy.fullname" . }}-postgres-exporter
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ssl-proxy.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "ssl-proxy.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: postgres-exporter
  template:
    metadata:
      labels:
        {{- include "ssl-proxy.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: postgres-exporter
    spec:
      containers:
        - name: postgres-exporter
          image: {{ include "ssl-proxy.image" (dict "root" . "image" .Values.observability.postgresExporter.image) }}
          imagePullPolicy: {{ .Values.observability.postgresExporter.image.pullPolicy }}
          args: ["--extend.query-path=/etc/postgres-exporter/queries.yml"]
          env:
            - name: DATA_SOURCE_URI
              value: {{ printf "%s:%v/%s?sslmode=disable" .Values.postgres.host .Values.postgres.port .Values.postgres.database | quote }}
            - name: DATA_SOURCE_USER
              value: {{ .Values.postgres.user | quote }}
            - name: DATA_SOURCE_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.passwordSecret.name }}
                  key: {{ .Values.postgres.passwordSecret.key }}
          ports:
            - name: metrics
              containerPort: 9187
          readinessProbe:
            httpGet:
              path: /
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: queries
              mountPath: /etc/postgres-exporter
              readOnly: true
      volumes:
        - name: queries
          configMap:
            name: {{ include "ssl-proxy.fullname" . }}-postgres-exporter-config
---
