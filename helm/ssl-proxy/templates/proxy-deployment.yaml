{{- if .Values.proxy.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ssl-proxy.fullname" . }}-proxy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ssl-proxy.labels" . | nindent 4 }}
    app.kubernetes.io/component: proxy
  {{- with .Values.proxy.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.proxy.service.type }}
  {{- with .Values.proxy.service.externalIPs }}
  externalIPs:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    {{- include "ssl-proxy.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: proxy
  ports:
    - name: wireguard
      port: {{ .Values.proxy.service.wgPort }}
      targetPort: {{ .Values.proxy.wireguard.port }}
      protocol: UDP
    - name: wireguard-internal
      port: {{ .Values.proxy.service.wgInternalPort }}
      targetPort: {{ .Values.proxy.wireguard.internalPort }}
      protocol: UDP
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ssl-proxy.fullname" . }}-proxy-admin
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ssl-proxy.labels" . | nindent 4 }}
    app.kubernetes.io/component: proxy
spec:
  type: ClusterIP
  {{- with .Values.proxy.adminService.externalIPs }}
  externalIPs:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    {{- include "ssl-proxy.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: proxy
  ports:
    - name: admin
      port: {{ .Values.proxy.service.adminPort }}
      targetPort: {{ .Values.proxy.service.adminPort }}
      protocol: TCP
    - name: policy
      port: {{ .Values.proxy.service.policyPort }}
      targetPort: {{ .Values.proxy.service.policyPort }}
      protocol: TCP
{{- if and .Values.monitoring.enabled .Values.proxy.service.metricsPort }}
    - name: metrics
      port: {{ .Values.proxy.service.metricsPort }}
      targetPort: {{ .Values.proxy.service.metricsPort }}
      protocol: TCP
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ssl-proxy.fullname" . }}-proxy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ssl-proxy.labels" . | nindent 4 }}
    app.kubernetes.io/component: proxy
spec:
  replicas: {{ .Values.proxy.replicas }}
  selector:
    matchLabels:
      {{- include "ssl-proxy.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: proxy
  template:
    metadata:
      labels:
        {{- include "ssl-proxy.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: proxy
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "ssl-proxy.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: copy-wireguard-config
          image: {{ include "ssl-proxy.image" (dict "root" . "image" .Values.proxy.image) }}
          imagePullPolicy: {{ .Values.proxy.image.pullPolicy }}
          command: ["/bin/sh", "-ec", "cp -a /config-source/. /config/"]
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          volumeMounts:
            - name: config-source
              mountPath: /config-source
              readOnly: true
            - name: config
              mountPath: /config
      containers:
        - name: ssl-proxy
          image: {{ include "ssl-proxy.image" (dict "root" . "image" .Values.proxy.image) }}
          imagePullPolicy: {{ .Values.proxy.image.pullPolicy }}
          command: ["/usr/local/bin/start-proxy-wg"]
          env:
            # WireGuard
            - name: WG_INTERFACE_NAME
              value: {{ .Values.proxy.wireguard.interfaceName | quote }}
            - name: WG_TEMPLATE_PATH
              value: "/config/templates/server.conf"
            - name: WG_CONFIG_PATH
              value: "/run/wireguard/wg0.conf"
            - name: WG_UAPI_SOCKET_DIR
              value: "/var/run/wireguard"
            - name: WG_SERVER_ADDRESS
              value: {{ .Values.proxy.wireguard.serverAddress | quote }}
            - name: WG_PORT
              value: {{ .Values.proxy.wireguard.port | quote }}
            - name: WG_INTERNAL_PORT
              value: {{ .Values.proxy.wireguard.internalPort | quote }}
            - name: WG_MTU
              value: {{ .Values.proxy.wireguard.mtu | quote }}
            {{- if .Values.proxy.wireguard.obfuscationMaxDatagramBytes }}
            - name: WG_OBFUSCATION_MAX_DATAGRAM_BYTES
              value: {{ .Values.proxy.wireguard.obfuscationMaxDatagramBytes | quote }}
            {{- end }}
            - name: WG_UDP_SOCKET_BUFFER_BYTES
              value: {{ .Values.proxy.wireguard.udpSocketBufferBytes | quote }}
            - name: WG_OBFUSCATION_ENABLED
              value: {{ .Values.proxy.wireguard.obfuscation.enabled | quote }}
            - name: WG_OBFUSCATION_KEY
              value: ""
            - name: WG_OBFUSCATION_KEY_FILE
              value: "/run/local-secrets/wg_obfuscation_key"
            - name: WG_OBFUSCATION_MAGIC_BYTE
              value: {{ .Values.proxy.wireguard.obfuscation.magicByte | quote }}
            - name: WG_OBFUSCATION_SESSION_IDLE_SECS
              value: {{ .Values.proxy.wireguard.obfuscation.sessionIdleSecs | quote }}
            - name: WG_SUDO
              value: "1"
            - name: WG_RUNTIME_SYSCTLS
              value: "0"
            - name: WG_WAN_INTERFACE
              value: "auto"
            - name: WG_PEERS
              value: {{ .Values.proxy.wireguard.peerNames | quote }}
            # Redpanda
            - name: SYNC_REDPANDA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "ssl-proxy.fullname" . }}-config
                  key: SYNC_REDPANDA_BOOTSTRAP_SERVERS
            - name: SYNC_CONTENT_TOPICS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "ssl-proxy.fullname" . }}-config
                  key: SYNC_STREAM_NAMES
            - name: ADMIN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.proxy.adminApiKeySecret.name }}
                  key: {{ .Values.proxy.adminApiKeySecret.key }}
            - name: ADMIN_BIND_ADDR
              value: {{ .Values.proxy.wireguard.adminBindAddress | quote }}
            - name: RUST_LOG
              value: "ssl_proxy=info"
            - name: EXPLICIT_PROXY_ENABLED
              value: "false"
            - name: SYNC_OUTBOX_DIR
              value: "/sync-outbox"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.javaCoordinator.tracing.otlpEndpoint | quote }}
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "grpc"
            - name: OTEL_SERVICE_NAME
              value: "ssl-proxy"
          ports:
            - containerPort: {{ .Values.proxy.wireguard.port }}
              protocol: UDP
              name: wireguard
            - containerPort: {{ .Values.proxy.wireguard.internalPort }}
              protocol: UDP
              name: wg-internal
            - containerPort: {{ .Values.proxy.service.adminPort }}
              protocol: TCP
              name: admin
            - containerPort: {{ .Values.proxy.service.policyPort }}
              protocol: TCP
              name: policy
          {{- with .Values.proxy.healthcheck.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.proxy.healthcheck.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.proxy.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /config
            - name: sync-outbox
              mountPath: /sync-outbox
            - name: runtime-secrets
              mountPath: /run/local-secrets
              readOnly: true
            - name: tun-device
              mountPath: /dev/net/tun
          securityContext:
            {{- toYaml .Values.proxy.securityContext | nindent 12 }}
      volumes:
        - name: config-source
          projected:
            defaultMode: 0400
            sources:
              - secret:
                  name: {{ .Values.proxy.wireguard.configSecret.name }}
                  items:
                    - {key: server.conf, path: templates/server.conf}
                    - {key: Corefile, path: coredns/Corefile}
                    - {key: privatekey-server, path: server/privatekey-server}
                    - {key: publickey-server, path: server/publickey-server}
                    - {key: peer1.conf, path: peer1/peer1.conf}
                    - {key: peer1-obfuscated.conf, path: peer1/peer1-obfuscated.conf}
                    - {key: presharedkey-peer1, path: peer1/presharedkey-peer1}
                    - {key: privatekey-peer1, path: peer1/privatekey-peer1}
                    - {key: publickey-peer1, path: peer1/publickey-peer1}
                    - {key: peer2.conf, path: peer2/peer2.conf}
                    - {key: peer2-obfuscated.conf, path: peer2/peer2-obfuscated.conf}
                    - {key: presharedkey-peer2, path: peer2/presharedkey-peer2}
                    - {key: privatekey-peer2, path: peer2/privatekey-peer2}
                    - {key: publickey-peer2, path: peer2/publickey-peer2}
              - configMap:
                  name: {{ include "ssl-proxy.fullname" . }}-topics-manifest
                  items:
                    - key: topics.manifest
                      path: topics/topics.manifest
        - name: config
          emptyDir: {}
        - name: sync-outbox
          emptyDir: {}
        - name: runtime-secrets
          secret:
            secretName: {{ .Values.proxy.runtimeSecret.name }}
            defaultMode: 0400
            items:
              - key: {{ .Values.proxy.runtimeSecret.obfuscationKey }}
                path: wg_obfuscation_key
        - name: tun-device
          hostPath:
            path: /dev/net/tun
            type: CharDevice
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
