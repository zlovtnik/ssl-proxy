{{- if .Values.proxy.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ssl-proxy.fullname" . }}-proxy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ssl-proxy.labels" . | nindent 4 }}
    app.kubernetes.io/component: proxy
  {{- with .Values.proxy.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.proxy.service.type }}
  selector:
    {{- include "ssl-proxy.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: proxy
  ports:
    - name: wireguard
      port: {{ .Values.proxy.service.wgPort }}
      targetPort: {{ .Values.proxy.wireguard.port }}
      protocol: UDP
    - name: wireguard-internal
      port: {{ .Values.proxy.service.wgInternalPort }}
      targetPort: {{ .Values.proxy.wireguard.internalPort }}
      protocol: UDP
    - name: admin
      port: {{ .Values.proxy.service.adminPort }}
      targetPort: {{ .Values.proxy.service.adminPort }}
      protocol: TCP
    - name: policy
      port: {{ .Values.proxy.service.policyPort }}
      targetPort: {{ .Values.proxy.service.policyPort }}
      protocol: TCP
{{- if and .Values.monitoring.enabled .Values.proxy.service.adminPort }}
    - name: metrics
      port: {{ .Values.proxy.service.adminPort }}
      targetPort: {{ .Values.proxy.service.adminPort }}
      protocol: TCP
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ssl-proxy.fullname" . }}-proxy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ssl-proxy.labels" . | nindent 4 }}
    app.kubernetes.io/component: proxy
spec:
  replicas: {{ .Values.proxy.replicas }}
  selector:
    matchLabels:
      {{- include "ssl-proxy.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: proxy
  template:
    metadata:
      labels:
        {{- include "ssl-proxy.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: proxy
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "ssl-proxy.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.proxy.securityContext | nindent 8 }}
      containers:
        - name: ssl-proxy
          image: {{ .Values.proxy.image.repository }}:{{ .Values.proxy.image.tag }}
          imagePullPolicy: {{ .Values.proxy.image.pullPolicy }}
          command: ["/usr/local/bin/start-proxy-wg"]
          env:
            # WireGuard
            - name: WG_INTERFACE_NAME
              value: {{ .Values.proxy.wireguard.interfaceName | quote }}
            - name: WG_TEMPLATE_PATH
              value: "/config/templates/server.conf"
            - name: WG_CONFIG_PATH
              value: "/run/wireguard/wg0.conf"
            - name: WG_UAPI_SOCKET_DIR
              value: "/var/run/wireguard"
            - name: WG_SERVER_ADDRESS
              value: {{ .Values.proxy.wireguard.serverAddress | quote }}
            - name: WG_PORT
              value: {{ .Values.proxy.wireguard.port | quote }}
            - name: WG_INTERNAL_PORT
              value: {{ .Values.proxy.wireguard.internalPort | quote }}
            - name: WG_MTU
              value: {{ .Values.proxy.wireguard.mtu | quote }}
            - name: WG_OBFUSCATION_ENABLED
              value: {{ .Values.proxy.wireguard.obfuscation.enabled | quote }}
            - name: WG_OBFUSCATION_KEY
              value: {{ .Values.proxy.wireguard.obfuscation.key | quote }}
            - name: WG_OBFUSCATION_MAGIC_BYTE
              value: {{ .Values.proxy.wireguard.obfuscation.magicByte | quote }}
            - name: WG_OBFUSCATION_SESSION_IDLE_SECS
              value: {{ .Values.proxy.wireguard.obfuscation.sessionIdleSecs | quote }}
            - name: WG_SUDO
              value: "1"
            # Redpanda
            - name: SYNC_REDPANDA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "ssl-proxy.fullname" . }}-config
                  key: SYNC_REDPANDA_BOOTSTRAP_SERVERS
            - name: SYNC_CONTENT_TOPICS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "ssl-proxy.fullname" . }}-config
                  key: SYNC_STREAM_NAMES
            - name: ADMIN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.proxy.adminApiKeySecret.name }}
                  key: {{ .Values.proxy.adminApiKeySecret.key }}
            - name: RUST_LOG
              value: "ssl_proxy=info"
            - name: EXPLICIT_PROXY_ENABLED
              value: "false"
            - name: SYNC_OUTBOX_DIR
              value: "/sync-outbox"
          ports:
            - containerPort: {{ .Values.proxy.wireguard.port }}
              protocol: UDP
              name: wireguard
            - containerPort: {{ .Values.proxy.wireguard.internalPort }}
              protocol: UDP
              name: wireguard-internal
            - containerPort: {{ .Values.proxy.service.adminPort }}
              protocol: TCP
              name: admin
            - containerPort: {{ .Values.proxy.service.policyPort }}
              protocol: TCP
              name: policy
          {{- with .Values.proxy.healthcheck.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.proxy.healthcheck.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.proxy.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /config
            - name: sync-outbox
              mountPath: /sync-outbox
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
      volumes:
        - name: config
          configMap:
            name: {{ include "ssl-proxy.fullname" . }}-topics-manifest
        - name: sync-outbox
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}