{{- if .Values.javaCoordinator.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ssl-proxy.fullname" . }}-coordinator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ssl-proxy.labels" . | nindent 4 }}
    app.kubernetes.io/component: zig-coordinator
spec:
  type: {{ .Values.javaCoordinator.service.type }}
  selector:
    {{- include "ssl-proxy.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: zig-coordinator
  ports:
    - name: http
      port: {{ .Values.javaCoordinator.service.port }}
      targetPort: 8081
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ssl-proxy.fullname" . }}-coordinator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ssl-proxy.labels" . | nindent 4 }}
    app.kubernetes.io/component: zig-coordinator
spec:
  replicas: {{ .Values.javaCoordinator.replicas }}
  selector:
    matchLabels:
      {{- include "ssl-proxy.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: zig-coordinator
  template:
    metadata:
      labels:
        {{- include "ssl-proxy.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: zig-coordinator
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "ssl-proxy.serviceAccountName" . }}
      containers:
        - name: java-coordinator
          image: {{ .Values.javaCoordinator.image.repository }}:{{ .Values.javaCoordinator.image.tag }}
          imagePullPolicy: {{ .Values.javaCoordinator.image.pullPolicy }}
          env:
            # Postgres
            - name: DATABASE_URL
              value: {{ include "ssl-proxy.postgresUrl" . }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.passwordSecret.name }}
                  key: {{ .Values.postgres.passwordSecret.key }}
            - name: JAVA_TOOL_OPTIONS
              value: {{ .Values.javaCoordinator.jvmOptions | quote }}
            - name: COORDINATOR_DB_POOL
              value: {{ .Values.javaCoordinator.datasource.maximumPoolSize | quote }}
            - name: COORDINATOR_DB_POOL_MIN_IDLE
              value: {{ .Values.javaCoordinator.datasource.minimumIdle | quote }}
            # Redpanda
            - name: SYNC_REDPANDA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "ssl-proxy.fullname" . }}-config
                  key: SYNC_REDPANDA_BOOTSTRAP_SERVERS
            - name: SYNC_REDPANDA_TOPIC_MANIFEST
              value: "/app/docker/redpanda/topics.manifest"
            # Topics
            - name: SYNC_SCAN_TOPIC
              valueFrom:
                configMapKeyRef:
                  name: {{ include "ssl-proxy.fullname" . }}-config
                  key: SYNC_SCAN_TOPIC
            - name: SYNC_LOAD_TOPIC
              valueFrom:
                configMapKeyRef:
                  name: {{ include "ssl-proxy.fullname" . }}-config
                  key: SYNC_LOAD_TOPIC
            - name: SYNC_RESULT_TOPIC
              valueFrom:
                configMapKeyRef:
                  name: {{ include "ssl-proxy.fullname" . }}-config
                  key: SYNC_RESULT_TOPIC
            - name: PAYLOAD_AUDIT_REDPANDA_TOPIC
              valueFrom:
                configMapKeyRef:
                  name: {{ include "ssl-proxy.fullname" . }}-config
                  key: PAYLOAD_AUDIT_REDPANDA_TOPIC
            # Consumer groups
            - name: SYNC_SCAN_CONSUMER
              valueFrom:
                configMapKeyRef:
                  name: {{ include "ssl-proxy.fullname" . }}-config
                  key: SYNC_SCAN_CONSUMER
            - name: SYNC_LOAD_CONSUMER
              valueFrom:
                configMapKeyRef:
                  name: {{ include "ssl-proxy.fullname" . }}-config
                  key: SYNC_LOAD_CONSUMER
            - name: SYNC_RESULT_CONSUMER
              valueFrom:
                configMapKeyRef:
                  name: {{ include "ssl-proxy.fullname" . }}-config
                  key: SYNC_RESULT_CONSUMER
            - name: PAYLOAD_AUDIT_CONSUMER
              valueFrom:
                configMapKeyRef:
                  name: {{ include "ssl-proxy.fullname" . }}-config
                  key: PAYLOAD_AUDIT_CONSUMER
            - name: SYNC_SCAN_CONSUMERS_COUNT
              value: {{ .Values.javaCoordinator.consumerConcurrency.scan | quote }}
            - name: SYNC_RESULT_CONSUMERS_COUNT
              value: {{ .Values.javaCoordinator.consumerConcurrency.result | quote }}
            - name: WIRELESS_CONSUMERS_COUNT
              value: {{ .Values.javaCoordinator.consumerConcurrency.wireless | quote }}
            - name: WIRELESS_MAX_POLL_RECORDS
              value: {{ .Values.javaCoordinator.consumerConcurrency.wirelessMaxPollRecords | quote }}
            - name: WIRELESS_RAW_PAYLOAD_HOT_DAYS
              value: {{ .Values.javaCoordinator.retention.wirelessRawPayloadHotDays | quote }}
            - name: SYNC_EVENT_ROW_RETENTION_DAYS
              value: {{ .Values.javaCoordinator.retention.syncEventRowRetentionDays | quote }}
            - name: SYNC_EVENT_TOMBSTONE_RETENTION_DAYS
              value: {{ .Values.javaCoordinator.retention.syncEventTombstoneRetentionDays | quote }}
            - name: WIRELESS_RAW_ARCHIVE_BUCKET
              value: {{ .Values.javaCoordinator.retention.wirelessRawArchiveBucket | quote }}
            - name: WIRELESS_RAW_ARCHIVE_BATCH_SIZE
              value: {{ .Values.javaCoordinator.retention.wirelessRawArchiveBatchSize | quote }}
            - name: WIRELESS_RAW_ARCHIVE_INTERVAL_MS
              value: {{ .Values.javaCoordinator.retention.wirelessRawArchiveIntervalMs | quote }}
            - name: RETENTION_MAINTENANCE_INTERVAL_MS
              value: {{ .Values.javaCoordinator.retention.maintenanceIntervalMs | quote }}
            - name: MINIO_ENDPOINT
              value: {{ .Values.minio.endpoint | quote }}
            - name: MINIO_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.minio.accessKeySecret.name }}
                  key: {{ .Values.minio.accessKeySecret.key }}
            - name: MINIO_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.minio.secretKeySecret.name }}
                  key: {{ .Values.minio.secretKeySecret.key }}
            # Stream names
            - name: SYNC_STREAM_NAME
              value: "proxy.events"
            - name: SYNC_STREAM_NAMES
              valueFrom:
                configMapKeyRef:
                  name: {{ include "ssl-proxy.fullname" . }}-config
                  key: SYNC_STREAM_NAMES
            - name: SYNC_ORACLE_STREAM_NAMES
              valueFrom:
                configMapKeyRef:
                  name: {{ include "ssl-proxy.fullname" . }}-config
                  key: SYNC_ORACLE_STREAM_NAMES
            - name: AUDIT_STREAM_NAME
              valueFrom:
                configMapKeyRef:
                  name: {{ include "ssl-proxy.fullname" . }}-config
                  key: AUDIT_STREAM_NAME
            - name: SYNC_RESULT_STREAM_NAME
              valueFrom:
                configMapKeyRef:
                  name: {{ include "ssl-proxy.fullname" . }}-config
                  key: SYNC_RESULT_STREAM_NAME
            # Wireless stream names
            - name: WIRELESS_BACKLOG_STREAM_NAME
              valueFrom:
                configMapKeyRef:
                  name: {{ include "ssl-proxy.fullname" . }}-config
                  key: WIRELESS_BACKLOG_STREAM_NAME
            - name: WIRELESS_MAC_STREAM_NAME
              valueFrom:
                configMapKeyRef:
                  name: {{ include "ssl-proxy.fullname" . }}-config
                  key: WIRELESS_MAC_STREAM_NAME
            - name: WIRELESS_NETWORKS_STREAM_NAME
              valueFrom:
                configMapKeyRef:
                  name: {{ include "ssl-proxy.fullname" . }}-config
                  key: WIRELESS_NETWORKS_STREAM_NAME
            - name: WIRELESS_PROBE_STREAM_NAME
              valueFrom:
                configMapKeyRef:
                  name: {{ include "ssl-proxy.fullname" . }}-config
                  key: WIRELESS_PROBE_STREAM_NAME
            # Wireless operation topics
            - name: WIRELESS_BACKLOG_SAVE_TOPIC
              valueFrom:
                configMapKeyRef:
                  name: {{ include "ssl-proxy.fullname" . }}-config
                  key: WIRELESS_BACKLOG_SAVE_TOPIC
            - name: WIRELESS_BACKLOG_LIST_TOPIC
              valueFrom:
                configMapKeyRef:
                  name: {{ include "ssl-proxy.fullname" . }}-config
                  key: WIRELESS_BACKLOG_LIST_TOPIC
            - name: WIRELESS_BACKLOG_SYNCED_TOPIC
              valueFrom:
                configMapKeyRef:
                  name: {{ include "ssl-proxy.fullname" . }}-config
                  key: WIRELESS_BACKLOG_SYNCED_TOPIC
            - name: WIRELESS_BACKLOG_PRUNE_TOPIC
              valueFrom:
                configMapKeyRef:
                  name: {{ include "ssl-proxy.fullname" . }}-config
                  key: WIRELESS_BACKLOG_PRUNE_TOPIC
            - name: WIRELESS_MAC_LOOKUP_TOPIC
              valueFrom:
                configMapKeyRef:
                  name: {{ include "ssl-proxy.fullname" . }}-config
                  key: WIRELESS_MAC_LOOKUP_TOPIC
            - name: WIRELESS_NETWORKS_AUTHORIZED_TOPIC
              valueFrom:
                configMapKeyRef:
                  name: {{ include "ssl-proxy.fullname" . }}-config
                  key: WIRELESS_NETWORKS_AUTHORIZED_TOPIC
            - name: WIRELESS_PROBE_FLUSH_TOPIC
              valueFrom:
                configMapKeyRef:
                  name: {{ include "ssl-proxy.fullname" . }}-config
                  key: WIRELESS_PROBE_FLUSH_TOPIC
            # Wireless consumer groups
            - name: WIRELESS_BACKLOG_SAVE_CONSUMER
              valueFrom:
                configMapKeyRef:
                  name: {{ include "ssl-proxy.fullname" . }}-config
                  key: WIRELESS_BACKLOG_SAVE_CONSUMER
            - name: WIRELESS_BACKLOG_LIST_CONSUMER
              valueFrom:
                configMapKeyRef:
                  name: {{ include "ssl-proxy.fullname" . }}-config
                  key: WIRELESS_BACKLOG_LIST_CONSUMER
            - name: WIRELESS_BACKLOG_SYNCED_CONSUMER
              valueFrom:
                configMapKeyRef:
                  name: {{ include "ssl-proxy.fullname" . }}-config
                  key: WIRELESS_BACKLOG_SYNCED_CONSUMER
            - name: WIRELESS_BACKLOG_PRUNE_CONSUMER
              valueFrom:
                configMapKeyRef:
                  name: {{ include "ssl-proxy.fullname" . }}-config
                  key: WIRELESS_BACKLOG_PRUNE_CONSUMER
            - name: WIRELESS_MAC_LOOKUP_CONSUMER
              valueFrom:
                configMapKeyRef:
                  name: {{ include "ssl-proxy.fullname" . }}-config
                  key: WIRELESS_MAC_LOOKUP_CONSUMER
            - name: WIRELESS_NETWORKS_AUTHORIZED_CONSUMER
              valueFrom:
                configMapKeyRef:
                  name: {{ include "ssl-proxy.fullname" . }}-config
                  key: WIRELESS_NETWORKS_AUTHORIZED_CONSUMER
            - name: WIRELESS_PROBE_FLUSH_CONSUMER
              valueFrom:
                configMapKeyRef:
                  name: {{ include "ssl-proxy.fullname" . }}-config
                  key: WIRELESS_PROBE_FLUSH_CONSUMER
            # Wireless reply topics
            - name: WIRELESS_BACKLOG_LIST_REPLY_TOPIC
              valueFrom:
                configMapKeyRef:
                  name: {{ include "ssl-proxy.fullname" . }}-config
                  key: WIRELESS_BACKLOG_LIST_REPLY_TOPIC
            - name: WIRELESS_BACKLOG_PRUNE_REPLY_TOPIC
              valueFrom:
                configMapKeyRef:
                  name: {{ include "ssl-proxy.fullname" . }}-config
                  key: WIRELESS_BACKLOG_PRUNE_REPLY_TOPIC
            - name: WIRELESS_MAC_LOOKUP_REPLY_TOPIC
              valueFrom:
                configMapKeyRef:
                  name: {{ include "ssl-proxy.fullname" . }}-config
                  key: WIRELESS_MAC_LOOKUP_REPLY_TOPIC
            - name: WIRELESS_NETWORKS_AUTHORIZED_REPLY_TOPIC
              valueFrom:
                configMapKeyRef:
                  name: {{ include "ssl-proxy.fullname" . }}-config
                  key: WIRELESS_NETWORKS_AUTHORIZED_REPLY_TOPIC
            - name: SYNC_OUTBOX_DIR
              value: "/sync-outbox"
            - name: SYNC_REDPANDA_LAG_METRICS_ENABLED
              value: {{ .Values.javaCoordinator.metrics.redpandaLagMetricsEnabled | quote }}
            - name: SYNC_REDPANDA_LAG_METRICS_POLL_INTERVAL_MS
              value: {{ .Values.javaCoordinator.metrics.redpandaLagMetricsPollIntervalMs | quote }}
            - name: SYNC_REDPANDA_LAG_METRICS_TIMEOUT_MS
              value: {{ .Values.javaCoordinator.metrics.redpandaLagMetricsTimeoutMs | quote }}
            - name: SYNC_HEARTBEAT_LOG_INTERVAL_MS
              value: {{ .Values.javaCoordinator.metrics.heartbeatLogIntervalMs | quote }}
            - name: ORACLE_SINK_ENABLED
              value: {{ .Values.javaCoordinator.oracle.enabled | quote }}
            - name: ORACLE_SINK_WIRELESS_ENABLED
              value: {{ .Values.javaCoordinator.oracle.wirelessEnabled | quote }}
            - name: ORACLE_SINK_SCHEMA_VALIDATION_WARN_ONLY
              value: {{ .Values.javaCoordinator.oracle.schemaValidationWarnOnly | quote }}
            - name: ORACLE_LOAD_MAX_RETRIES
              value: {{ .Values.javaCoordinator.oracle.loadMaxRetries | quote }}
            - name: ORACLE_CONN
              value: {{ .Values.javaCoordinator.oracle.conn | quote }}
            - name: ORACLE_USER
              value: {{ .Values.javaCoordinator.oracle.user | quote }}
            - name: ORACLE_PASS_FILE
              value: "/run/secrets/oracle/{{ .Values.javaCoordinator.oracle.passwordSecret.key }}"
            - name: TNS_ADMIN
              value: "/app/wallet"
            - name: MANAGEMENT_TRACING_SAMPLING_PROBABILITY
              value: {{ .Values.javaCoordinator.tracing.samplingProbability | quote }}
          ports:
            - containerPort: 8081
              protocol: TCP
              name: http
          {{- with .Values.javaCoordinator.healthcheck.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.javaCoordinator.resources | nindent 12 }}
          volumeMounts:
            - name: topics-manifest
              mountPath: /app/docker/redpanda
              readOnly: true
            - name: sync-outbox
              mountPath: /sync-outbox
            - name: oracle-wallet
              mountPath: /app/wallet
              readOnly: true
            - name: oracle-password
              mountPath: /run/secrets/oracle
              readOnly: true
      volumes:
        - name: topics-manifest
          configMap:
            name: {{ include "ssl-proxy.fullname" . }}-topics-manifest
        - name: sync-outbox
          emptyDir: {}
        - name: oracle-wallet
          secret:
            secretName: {{ .Values.javaCoordinator.oracle.walletSecret.name }}
        - name: oracle-password
          secret:
            secretName: {{ .Values.javaCoordinator.oracle.passwordSecret.name }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
