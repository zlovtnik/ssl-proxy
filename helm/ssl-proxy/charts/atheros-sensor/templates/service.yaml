{{- if .Values.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ssl-proxy.atherosSensor.fullname" . }}-atheros-sensor
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ssl-proxy.atherosSensor.labels" . | nindent 4 }}
    app.kubernetes.io/component: atheros-sensor
spec:
  clusterIP: None
  selector:
    {{- include "ssl-proxy.atherosSensor.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: atheros-sensor
  ports:
    - name: metrics
      port: {{ .Values.metricsPort }}
      targetPort: metrics
{{- end }}

