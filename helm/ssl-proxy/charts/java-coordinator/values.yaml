# Values local to the java-coordinator subchart.
global:
  nameOverride: ""
  fullnameOverride: ""
  image:
    registry: ""
    pullPolicy: Always
  rolloutRevision: ""
  labels: {}
  annotations: {}
  serviceAccount:
    create: true
    name: "ssl-proxy"
    annotations: {}
  podSecurityContext: {}
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  shared:
    minio:
      endpoint: "http://minio.minio.svc.cluster.local:9000"
      accessKeySecret:
        name: "minio-credentials"
        key: "access-key"
      secretKeySecret:
        name: "minio-credentials"
        key: "secret-key"

enabled: true
replicas: 2
image:
  repository: java-coordinator
  tag: latest
  pullPolicy: Always
service:
  port: 8080
  type: ClusterIP
jvmOptions: "-XX:+UseZGC -XX:+ZGenerational -XX:InitialRAMPercentage=50 -XX:MaxRAMPercentage=75"
datasource:
  maximumPoolSize: 35
  minimumIdle: 10
consumerConcurrency:
  scan: 1
  result: 1
  wireless: 1
  wirelessMaxPollRecords: 1
runtime:
  environment: "production"
processors:
  # Empty preserves the legacy processor lane. New catalog workloads are
  # selected explicitly and remain disabled by default.
  enabled: []
  batchSize: 250
  intervalSeconds: 10
  embeddingModel: "sentence-transformers/all-MiniLM-L6-v2"
  eventDuplicateDistance: 0.05
  behaviorSimilarityThreshold: 0.88
  sequenceDistanceThreshold: 0.10
cutover:
  devBypass: false
consumerBatch:
  maxPollRecords: 500
  pollTimeoutMs: 3000
  size: 500
  windowMs: 250
retention:
  archiveEnabled: false
  wirelessRawPayloadHotDays: 7
  syncEventRowRetentionDays: 30
  searchRetentionDays: 30
  syncEventTombstoneRetentionDays: 45
  wirelessRawArchiveBucket: "ssl-proxy-wireless-raw-archive"
  wirelessRawArchiveBatchSize: 100
  wirelessRawArchiveIntervalMs: 300000
  maintenanceIntervalMs: "3600000"
tracing:
  samplingProbability: 0.05
  otlpEndpoint: "http://ssl-proxy-otel-collector:4317"
# Resource limits
resources:
  limits:
    cpu: "1"
    memory: 1Gi
  requests:
    cpu: 250m
    memory: 256Mi
# Health check - Spring Boot Actuator
healthcheck:
  startupProbe:
    httpGet:
      path: /live
      port: 8081
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 30
  livenessProbe:
    httpGet:
      path: /live
      port: 8081
    initialDelaySeconds: 30
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 5
  readinessProbe:
    httpGet:
      path: /ready
      port: 8081
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
# Metrics endpoint (embedded in Actuator)
metrics:
  enabled: true
  port: 8081
  redpandaLagMetricsEnabled: true
  redpandaLagMetricsPollIntervalMs: 10000
  redpandaLagMetricsTimeoutMs: 5000
  heartbeatLogIntervalMs: 15000
tidb:
  enabled: true
  schemaManifestSHA256: "2d956c8cd7dd4d10526a18b75490622f591f65a5db1dc4ba43480367e96f6ffd"
  poolSize: 20
  healthcheckReserve: 2
  connectionTimeoutMs: 5000
  statementTimeoutSecs: 30
  warnOnly: false
  sslMode: "VERIFY_IDENTITY"


# Vec Worker
