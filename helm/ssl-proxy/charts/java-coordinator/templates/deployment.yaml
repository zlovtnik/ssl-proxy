{{- if .Values.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ssl-proxy.javaCoordinator.fullname" . }}-coordinator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ssl-proxy.javaCoordinator.labels" . | nindent 4 }}
    app.kubernetes.io/component: java-coordinator
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "ssl-proxy.javaCoordinator.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: java-coordinator
  template:
    metadata:
      labels:
        {{- include "ssl-proxy.javaCoordinator.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: java-coordinator
      {{- if or .Values.global.rolloutRevision .Values.global.podAnnotations }}
      annotations:
        {{- with .Values.global.rolloutRevision }}
        ssl-proxy.io/rollout-revision: {{ . | quote }}
        {{- end }}
        {{- with .Values.global.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "ssl-proxy.javaCoordinator.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.global.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: java-coordinator
          image: {{ include "ssl-proxy.javaCoordinator.image" (dict "root" . "image" .Values.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            # Postgres
            - name: DATABASE_URL
              value: {{ include "ssl-proxy.javaCoordinator.postgresUrl" . }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.shared.postgres.passwordSecret.name }}
                  key: {{ .Values.global.shared.postgres.passwordSecret.key }}
            - name: POSTGRES_USER
              value: {{ .Values.global.shared.postgres.user | quote }}
            - name: JAVA_TOOL_OPTIONS
              value: {{ .Values.jvmOptions | quote }}
            - name: COORDINATOR_DB_POOL
              value: {{ .Values.datasource.maximumPoolSize | quote }}
            - name: COORDINATOR_DB_POOL_MIN_IDLE
              value: {{ .Values.datasource.minimumIdle | quote }}
            # Redpanda
            - name: SYNC_REDPANDA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "ssl-proxy.javaCoordinator.fullname" . }}-config
                  key: SYNC_REDPANDA_BOOTSTRAP_SERVERS
            - name: SYNC_REDPANDA_TOPIC_MANIFEST
              value: "/app/docker/redpanda/topics.manifest"
            # Topics
            - name: SYNC_SCAN_TOPIC
              valueFrom:
                configMapKeyRef:
                  name: {{ include "ssl-proxy.javaCoordinator.fullname" . }}-config
                  key: SYNC_SCAN_TOPIC
            - name: SYNC_LOAD_TOPIC
              valueFrom:
                configMapKeyRef:
                  name: {{ include "ssl-proxy.javaCoordinator.fullname" . }}-config
                  key: SYNC_LOAD_TOPIC
            - name: SYNC_RESULT_TOPIC
              valueFrom:
                configMapKeyRef:
                  name: {{ include "ssl-proxy.javaCoordinator.fullname" . }}-config
                  key: SYNC_RESULT_TOPIC
            - name: SYNC_PAYLOAD_AUDIT_TOPIC
              valueFrom:
                configMapKeyRef:
                  name: {{ include "ssl-proxy.javaCoordinator.fullname" . }}-config
                  key: SYNC_PAYLOAD_AUDIT_TOPIC
            # Consumer groups
            - name: SYNC_SCAN_CONSUMER
              valueFrom:
                configMapKeyRef:
                  name: {{ include "ssl-proxy.javaCoordinator.fullname" . }}-config
                  key: SYNC_SCAN_CONSUMER
            - name: SYNC_LOAD_CONSUMER
              valueFrom:
                configMapKeyRef:
                  name: {{ include "ssl-proxy.javaCoordinator.fullname" . }}-config
                  key: SYNC_LOAD_CONSUMER
            - name: SYNC_RESULT_CONSUMER
              valueFrom:
                configMapKeyRef:
                  name: {{ include "ssl-proxy.javaCoordinator.fullname" . }}-config
                  key: SYNC_RESULT_CONSUMER
            - name: SYNC_PAYLOAD_AUDIT_CONSUMER
              valueFrom:
                configMapKeyRef:
                  name: {{ include "ssl-proxy.javaCoordinator.fullname" . }}-config
                  key: SYNC_PAYLOAD_AUDIT_CONSUMER
            - name: SYNC_SCAN_CONSUMERS_COUNT
              value: {{ .Values.consumerConcurrency.scan | quote }}
            - name: SYNC_RESULT_CONSUMERS_COUNT
              value: {{ .Values.consumerConcurrency.result | quote }}
            - name: WIRELESS_CONSUMERS_COUNT
              value: {{ .Values.consumerConcurrency.wireless | quote }}
            - name: WIRELESS_MAX_POLL_RECORDS
              value: {{ .Values.consumerConcurrency.wirelessMaxPollRecords | quote }}
            - name: WIRELESS_RAW_PAYLOAD_HOT_DAYS
              value: {{ .Values.retention.wirelessRawPayloadHotDays | quote }}
            - name: SYNC_EVENT_ROW_RETENTION_DAYS
              value: {{ .Values.retention.syncEventRowRetentionDays | quote }}
            - name: SYNC_EVENT_TOMBSTONE_RETENTION_DAYS
              value: {{ .Values.retention.syncEventTombstoneRetentionDays | quote }}
            - name: WIRELESS_RAW_ARCHIVE_BUCKET
              value: {{ .Values.retention.wirelessRawArchiveBucket | quote }}
            - name: WIRELESS_RAW_ARCHIVE_BATCH_SIZE
              value: {{ .Values.retention.wirelessRawArchiveBatchSize | quote }}
            - name: WIRELESS_RAW_ARCHIVE_INTERVAL_MS
              value: {{ .Values.retention.wirelessRawArchiveIntervalMs | quote }}
            - name: RETENTION_MAINTENANCE_INTERVAL_MS
              value: {{ .Values.retention.maintenanceIntervalMs | quote }}
            - name: MINIO_ENDPOINT
              value: {{ .Values.global.shared.minio.endpoint | quote }}
            - name: MINIO_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.shared.minio.accessKeySecret.name }}
                  key: {{ .Values.global.shared.minio.accessKeySecret.key }}
            - name: MINIO_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.shared.minio.secretKeySecret.name }}
                  key: {{ .Values.global.shared.minio.secretKeySecret.key }}
            # Stream names
            - name: SYNC_STREAM_NAME
              value: "proxy.events"
            - name: SYNC_STREAM_NAMES
              valueFrom:
                configMapKeyRef:
                  name: {{ include "ssl-proxy.javaCoordinator.fullname" . }}-config
                  key: SYNC_STREAM_NAMES
            - name: SYNC_ORACLE_STREAM_NAMES
              valueFrom:
                configMapKeyRef:
                  name: {{ include "ssl-proxy.javaCoordinator.fullname" . }}-config
                  key: SYNC_ORACLE_STREAM_NAMES
            - name: AUDIT_STREAM_NAME
              valueFrom:
                configMapKeyRef:
                  name: {{ include "ssl-proxy.javaCoordinator.fullname" . }}-config
                  key: AUDIT_STREAM_NAME
            - name: SYNC_RESULT_STREAM_NAME
              valueFrom:
                configMapKeyRef:
                  name: {{ include "ssl-proxy.javaCoordinator.fullname" . }}-config
                  key: SYNC_RESULT_STREAM_NAME
            # Wireless stream names
            - name: WIRELESS_BACKLOG_STREAM_NAME
              valueFrom:
                configMapKeyRef:
                  name: {{ include "ssl-proxy.javaCoordinator.fullname" . }}-config
                  key: WIRELESS_BACKLOG_STREAM_NAME
            - name: WIRELESS_MAC_STREAM_NAME
              valueFrom:
                configMapKeyRef:
                  name: {{ include "ssl-proxy.javaCoordinator.fullname" . }}-config
                  key: WIRELESS_MAC_STREAM_NAME
            - name: WIRELESS_NETWORKS_STREAM_NAME
              valueFrom:
                configMapKeyRef:
                  name: {{ include "ssl-proxy.javaCoordinator.fullname" . }}-config
                  key: WIRELESS_NETWORKS_STREAM_NAME
            - name: WIRELESS_PROBE_STREAM_NAME
              valueFrom:
                configMapKeyRef:
                  name: {{ include "ssl-proxy.javaCoordinator.fullname" . }}-config
                  key: WIRELESS_PROBE_STREAM_NAME
            # Wireless operation topics
            - name: WIRELESS_BACKLOG_SAVE_TOPIC
              valueFrom:
                configMapKeyRef:
                  name: {{ include "ssl-proxy.javaCoordinator.fullname" . }}-config
                  key: WIRELESS_BACKLOG_SAVE_TOPIC
            - name: WIRELESS_BACKLOG_LIST_TOPIC
              valueFrom:
                configMapKeyRef:
                  name: {{ include "ssl-proxy.javaCoordinator.fullname" . }}-config
                  key: WIRELESS_BACKLOG_LIST_TOPIC
            - name: WIRELESS_BACKLOG_SYNCED_TOPIC
              valueFrom:
                configMapKeyRef:
                  name: {{ include "ssl-proxy.javaCoordinator.fullname" . }}-config
                  key: WIRELESS_BACKLOG_SYNCED_TOPIC
            - name: WIRELESS_BACKLOG_PRUNE_TOPIC
              valueFrom:
                configMapKeyRef:
                  name: {{ include "ssl-proxy.javaCoordinator.fullname" . }}-config
                  key: WIRELESS_BACKLOG_PRUNE_TOPIC
            - name: WIRELESS_MAC_LOOKUP_TOPIC
              valueFrom:
                configMapKeyRef:
                  name: {{ include "ssl-proxy.javaCoordinator.fullname" . }}-config
                  key: WIRELESS_MAC_LOOKUP_TOPIC
            - name: WIRELESS_NETWORKS_AUTHORIZED_TOPIC
              valueFrom:
                configMapKeyRef:
                  name: {{ include "ssl-proxy.javaCoordinator.fullname" . }}-config
                  key: WIRELESS_NETWORKS_AUTHORIZED_TOPIC
            - name: WIRELESS_PROBE_FLUSH_TOPIC
              valueFrom:
                configMapKeyRef:
                  name: {{ include "ssl-proxy.javaCoordinator.fullname" . }}-config
                  key: WIRELESS_PROBE_FLUSH_TOPIC
            # Wireless consumer groups
            - name: WIRELESS_BACKLOG_SAVE_CONSUMER
              valueFrom:
                configMapKeyRef:
                  name: {{ include "ssl-proxy.javaCoordinator.fullname" . }}-config
                  key: WIRELESS_BACKLOG_SAVE_CONSUMER
            - name: WIRELESS_BACKLOG_LIST_CONSUMER
              valueFrom:
                configMapKeyRef:
                  name: {{ include "ssl-proxy.javaCoordinator.fullname" . }}-config
                  key: WIRELESS_BACKLOG_LIST_CONSUMER
            - name: WIRELESS_BACKLOG_SYNCED_CONSUMER
              valueFrom:
                configMapKeyRef:
                  name: {{ include "ssl-proxy.javaCoordinator.fullname" . }}-config
                  key: WIRELESS_BACKLOG_SYNCED_CONSUMER
            - name: WIRELESS_BACKLOG_PRUNE_CONSUMER
              valueFrom:
                configMapKeyRef:
                  name: {{ include "ssl-proxy.javaCoordinator.fullname" . }}-config
                  key: WIRELESS_BACKLOG_PRUNE_CONSUMER
            - name: WIRELESS_MAC_LOOKUP_CONSUMER
              valueFrom:
                configMapKeyRef:
                  name: {{ include "ssl-proxy.javaCoordinator.fullname" . }}-config
                  key: WIRELESS_MAC_LOOKUP_CONSUMER
            - name: WIRELESS_NETWORKS_AUTHORIZED_CONSUMER
              valueFrom:
                configMapKeyRef:
                  name: {{ include "ssl-proxy.javaCoordinator.fullname" . }}-config
                  key: WIRELESS_NETWORKS_AUTHORIZED_CONSUMER
            - name: WIRELESS_PROBE_FLUSH_CONSUMER
              valueFrom:
                configMapKeyRef:
                  name: {{ include "ssl-proxy.javaCoordinator.fullname" . }}-config
                  key: WIRELESS_PROBE_FLUSH_CONSUMER
            # Wireless reply topics
            - name: WIRELESS_BACKLOG_LIST_REPLY_TOPIC
              valueFrom:
                configMapKeyRef:
                  name: {{ include "ssl-proxy.javaCoordinator.fullname" . }}-config
                  key: WIRELESS_BACKLOG_LIST_REPLY_TOPIC
            - name: WIRELESS_BACKLOG_PRUNE_REPLY_TOPIC
              valueFrom:
                configMapKeyRef:
                  name: {{ include "ssl-proxy.javaCoordinator.fullname" . }}-config
                  key: WIRELESS_BACKLOG_PRUNE_REPLY_TOPIC
            - name: WIRELESS_MAC_LOOKUP_REPLY_TOPIC
              valueFrom:
                configMapKeyRef:
                  name: {{ include "ssl-proxy.javaCoordinator.fullname" . }}-config
                  key: WIRELESS_MAC_LOOKUP_REPLY_TOPIC
            - name: WIRELESS_NETWORKS_AUTHORIZED_REPLY_TOPIC
              valueFrom:
                configMapKeyRef:
                  name: {{ include "ssl-proxy.javaCoordinator.fullname" . }}-config
                  key: WIRELESS_NETWORKS_AUTHORIZED_REPLY_TOPIC
            - name: SYNC_OUTBOX_DIR
              value: "/sync-outbox"
            - name: SYNC_REDPANDA_LAG_METRICS_ENABLED
              value: {{ .Values.metrics.redpandaLagMetricsEnabled | quote }}
            - name: SYNC_REDPANDA_LAG_METRICS_POLL_INTERVAL_MS
              value: {{ .Values.metrics.redpandaLagMetricsPollIntervalMs | quote }}
            - name: SYNC_REDPANDA_LAG_METRICS_TIMEOUT_MS
              value: {{ .Values.metrics.redpandaLagMetricsTimeoutMs | quote }}
            - name: SYNC_HEARTBEAT_LOG_INTERVAL_MS
              value: {{ .Values.metrics.heartbeatLogIntervalMs | quote }}
            - name: ORACLE_SINK_ENABLED
              value: {{ .Values.oracle.enabled | quote }}
            - name: ORACLE_SINK_WIRELESS_ENABLED
              value: {{ .Values.oracle.wirelessEnabled | quote }}
            - name: ORACLE_SINK_SCHEMA_VALIDATION_WARN_ONLY
              value: {{ .Values.oracle.schemaValidationWarnOnly | quote }}
            - name: ORACLE_LOAD_MAX_RETRIES
              value: {{ .Values.oracle.loadMaxRetries | quote }}
            - name: ORACLE_CONN
              value: {{ .Values.oracle.conn | quote }}
            - name: ORACLE_USER
              value: {{ .Values.oracle.user | quote }}
            - name: ORACLE_PASS_FILE
              value: "/run/secrets/oracle/{{ .Values.oracle.passwordSecret.key }}"
            - name: TNS_ADMIN
              value: "/app/wallet"
            - name: MANAGEMENT_TRACING_SAMPLING_PROBABILITY
              value: {{ .Values.tracing.samplingProbability | quote }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.tracing.otlpEndpoint | quote }}
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "grpc"
            - name: OTEL_SERVICE_NAME
              value: "java-coordinator"
          ports:
            - containerPort: 8081
              protocol: TCP
              name: http
          {{- with .Values.healthcheck.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.healthcheck.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.healthcheck.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: topics-manifest
              mountPath: /app/docker/redpanda
              readOnly: true
            - name: sync-outbox
              mountPath: /sync-outbox
            {{- if .Values.oracle.enabled }}
            - name: oracle-wallet
              mountPath: /app/wallet
              readOnly: true
            - name: oracle-password
              mountPath: /run/secrets/oracle
              readOnly: true
            {{- end }}
      volumes:
        - name: topics-manifest
          configMap:
            name: {{ include "ssl-proxy.javaCoordinator.fullname" . }}-topics-manifest
        - name: sync-outbox
          emptyDir: {}
        {{- if .Values.oracle.enabled }}
        - name: oracle-wallet
          secret:
            secretName: {{ .Values.oracle.walletSecret.name }}
        - name: oracle-password
          secret:
            secretName: {{ .Values.oracle.passwordSecret.name }}
        {{- end }}
      {{- with .Values.global.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.global.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.global.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
