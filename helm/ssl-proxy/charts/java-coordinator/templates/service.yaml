{{- if .Values.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ssl-proxy-common.fullname" (dict "root" . "component" "javaCoordinator") }}-coordinator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ssl-proxy-common.labels" (dict "root" . "component" "javaCoordinator") | nindent 4 }}
    app.kubernetes.io/component: java-coordinator
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "ssl-proxy-common.selectorLabels" (dict "root" . "component" "javaCoordinator") | nindent 4 }}
    app.kubernetes.io/component: java-coordinator
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: 8081
      protocol: TCP
{{- end }}
