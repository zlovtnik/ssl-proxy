{{- if .Values.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-vec-worker
  labels:
    app.kubernetes.io/name: vec-worker
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicas | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: vec-worker
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vec-worker
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: vec-worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - server
          env:
            - name: ATHSEARCH_TIDB_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-tidb-credentials
                  key: dsn
            - name: ATHSEARCH_TIDB_TLS_CA_FILE
              value: /etc/tidb/ca.crt
            - name: ATHSEARCH_TIDB_TLS_CERT_FILE
              value: /etc/tidb/client.crt
            - name: ATHSEARCH_TIDB_TLS_KEY_FILE
              value: /etc/tidb/client.key
            - name: ATHSEARCH_TIDB_TLS_SERVER_NAME
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-tidb-config
                  key: tls-server-name
            - name: ATHSEARCH_SCHEMA_MANIFEST_SHA256
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-tidb-config
                  key: manifest-sha256
            - name: ATHSEARCH_EMBEDDING_BACKEND
              value: {{ .Values.embedding.url | quote }}
            - name: ATHSEARCH_EMBEDDING_MODEL
              value: {{ .Values.embedding.model | quote }}
            - name: ATHSEARCH_EMBEDDING_DIMENSIONS
              value: {{ .Values.embedding.dimensions | quote }}
            - name: ATHSEARCH_WORKER_ENABLED
              value: "true"
            - name: ATHSEARCH_WORKER_COUNT
              value: {{ .Values.worker.count | default 4 | quote }}
            - name: ATHSEARCH_WORKER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: ATHSEARCH_EMBEDDING_BATCH_SIZE
              value: {{ .Values.embedding.batchSize | default 64 | quote }}
            - name: ATHSEARCH_LEASE_SECONDS
              value: {{ .Values.embedding.leaseSeconds | default 1800 | quote }}
            - name: ATHSEARCH_POLL_INTERVAL_MS
              value: {{ (mul (.Values.pollIntervalSeconds | default 1) 1000) | quote }}
            - name: ATHSEARCH_DLQ_ENABLED
              value: "true"
            - name: ATHSEARCH_HTTP_PORT
              value: {{ .Values.service.port | default 9092 | quote }}
            - name: ATHSEARCH_METRICS_PORT
              value: {{ .Values.metrics.port | default 9091 | quote }}
            - name: ATHSEARCH_LOG_LEVEL
              value: "info"
          ports:
            - name: http
              containerPort: {{ .Values.service.port | default 9092 }}
            - name: metrics
              containerPort: {{ .Values.metrics.port | default 9091 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: {{ .Values.healthcheck.livenessProbe.initialDelaySeconds | default 20 }}
            periodSeconds: {{ .Values.healthcheck.livenessProbe.periodSeconds | default 30 }}
            timeoutSeconds: {{ .Values.healthcheck.livenessProbe.timeoutSeconds | default 10 }}
            failureThreshold: {{ .Values.healthcheck.livenessProbe.failureThreshold | default 5 }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            limits:
              cpu: {{ .Values.resources.limits.cpu | default "2" }}
              memory: {{ .Values.resources.limits.memory | default "4Gi" }}
            requests:
              cpu: {{ .Values.resources.requests.cpu | default "500m" }}
              memory: {{ .Values.resources.requests.memory | default "1Gi" }}
          volumeMounts:
            - name: tidb-tls
              mountPath: /etc/tidb
              readOnly: true
      volumes:
        - name: tidb-tls
          secret:
            secretName: {{ .Release.Name }}-tidb-tls
{{- end }}
