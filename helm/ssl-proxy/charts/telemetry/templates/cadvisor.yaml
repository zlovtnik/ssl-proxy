{{- if .Values.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ssl-proxy.telemetry.fullname" . }}-cadvisor
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ssl-proxy.telemetry.labels" . | nindent 4 }}
    app.kubernetes.io/component: cadvisor
spec:
  clusterIP: None
  selector:
    {{- include "ssl-proxy.telemetry.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: cadvisor
  ports:
    - {name: metrics, port: 8080, targetPort: metrics}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "ssl-proxy.telemetry.fullname" . }}-cadvisor
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ssl-proxy.telemetry.labels" . | nindent 4 }}
    app.kubernetes.io/component: cadvisor
spec:
  selector:
    matchLabels:
      {{- include "ssl-proxy.telemetry.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: cadvisor
  template:
    metadata:
      labels:
        {{- include "ssl-proxy.telemetry.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: cadvisor
    spec:
      hostNetwork: true
      containers:
        - name: cadvisor
          image: {{ include "ssl-proxy.telemetry.image" (dict "root" . "image" .Values.cadvisor.image) }}
          imagePullPolicy: {{ .Values.cadvisor.image.pullPolicy }}
          securityContext:
            privileged: true
          args: ["--docker_only=false", "--housekeeping_interval=10s"]
          ports:
            - name: metrics
              containerPort: 8080
          resources:
            {{- toYaml .Values.cadvisor.resources | nindent 12 }}
          volumeMounts:
            - {name: root, mountPath: /rootfs, readOnly: true}
            - {name: run, mountPath: /var/run, readOnly: true}
            - {name: sys, mountPath: /sys, readOnly: true}
            - {name: containerd, mountPath: /var/lib/containerd, readOnly: true}
            - {name: disk, mountPath: /dev/disk, readOnly: true}
      volumes:
        - name: root
          hostPath: {path: /, type: Directory}
        - name: run
          hostPath: {path: /var/run, type: Directory}
        - name: sys
          hostPath: {path: /sys, type: Directory}
        - name: containerd
          hostPath:
            path: {{ .Values.cadvisor.containerdHostPath | quote }}
            type: Directory
        - name: disk
          hostPath: {path: /dev/disk, type: DirectoryOrCreate}
{{- end }}
