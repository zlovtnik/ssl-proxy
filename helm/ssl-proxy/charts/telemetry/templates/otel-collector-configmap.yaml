{{- if .Values.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ssl-proxy.telemetry.fullname" . }}-otel-collector-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ssl-proxy.telemetry.labels" . | nindent 4 }}
    app.kubernetes.io/component: otel-collector
data:
  config.yml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 256
        spike_limit_mib: 64
      batch:
        timeout: 1s
        send_batch_size: 1024
    connectors:
      spanmetrics:
        namespace: traces.spanmetrics
        dimensions:
          - name: db.system
          - name: db.operation
          - name: db.name
          - name: messaging.system
          - name: messaging.destination.name
          - name: messaging.operation
          - name: status
        histogram:
          explicit:
            buckets: [5ms, 10ms, 25ms, 50ms, 100ms, 250ms, 500ms, 1s, 2.5s, 5s, 10s, 30s]
    exporters:
      otlp/jaeger:
        endpoint: {{ include "ssl-proxy.telemetry.fullname" . }}-jaeger:4317
        tls:
          insecure: true
      prometheus/spanmetrics:
        endpoint: 0.0.0.0:9464
      logging:
        verbosity: normal
    service:
      telemetry:
        metrics:
          address: 0.0.0.0:8888
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlp/jaeger, spanmetrics, logging]
        metrics/spanmetrics:
          receivers: [spanmetrics]
          processors: [memory_limiter, batch]
          exporters: [prometheus/spanmetrics]
{{- end }}

