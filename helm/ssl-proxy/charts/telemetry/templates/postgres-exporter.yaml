{{- if .Values.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ssl-proxy.telemetry.fullname" . }}-postgres-exporter
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ssl-proxy.telemetry.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres-exporter
spec:
  selector:
    {{- include "ssl-proxy.telemetry.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgres-exporter
  ports:
    - {name: metrics, port: 9187, targetPort: metrics}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ssl-proxy.telemetry.fullname" . }}-postgres-exporter
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ssl-proxy.telemetry.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "ssl-proxy.telemetry.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: postgres-exporter
  template:
    metadata:
      labels:
        {{- include "ssl-proxy.telemetry.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: postgres-exporter
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres-exporter
          image: {{ include "ssl-proxy.telemetry.image" (dict "root" . "image" .Values.postgresExporter.image) }}
          imagePullPolicy: {{ .Values.postgresExporter.image.pullPolicy }}
          args: ["--extend.query-path=/etc/postgres-exporter/queries.yml"]
          env:
            - name: DATA_SOURCE_URI
              value: {{ printf "%s:%v/%s?sslmode=disable" .Values.global.shared.postgres.host .Values.global.shared.postgres.port .Values.global.shared.postgres.database | quote }}
            - name: DATA_SOURCE_USER
              value: {{ .Values.global.shared.postgres.user | quote }}
            - name: DATA_SOURCE_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.shared.postgres.passwordSecret.name }}
                  key: {{ .Values.global.shared.postgres.passwordSecret.key }}
          ports:
            - name: metrics
              containerPort: 9187
          readinessProbe:
            httpGet:
              path: /
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.postgresExporter.resources | nindent 12 }}
          volumeMounts:
            - name: queries
              mountPath: /etc/postgres-exporter
              readOnly: true
      volumes:
        - name: queries
          configMap:
            name: {{ include "ssl-proxy.telemetry.fullname" . }}-postgres-exporter-config
---
{{- end }}
