{{- if .Values.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ssl-proxy.telemetry.fullname" . }}-jaeger
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ssl-proxy.telemetry.labels" . | nindent 4 }}
    app.kubernetes.io/component: jaeger
spec:
  selector:
    {{- include "ssl-proxy.telemetry.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: jaeger
  ports:
    - name: query
      port: {{ .Values.jaeger.service.port }}
      targetPort: query
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: metrics
      port: 14269
      targetPort: metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ssl-proxy.telemetry.fullname" . }}-jaeger
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ssl-proxy.telemetry.labels" . | nindent 4 }}
    app.kubernetes.io/component: jaeger
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "ssl-proxy.telemetry.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: jaeger
  template:
    metadata:
      labels:
        {{- include "ssl-proxy.telemetry.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: jaeger
    spec:
      automountServiceAccountToken: false
      containers:
        - name: jaeger
          image: {{ include "ssl-proxy.telemetry.image" (dict "root" . "image" .Values.jaeger.image) }}
          imagePullPolicy: {{ .Values.jaeger.image.pullPolicy }}
          env:
            - name: COLLECTOR_OTLP_ENABLED
              value: "true"
          ports:
            - name: query
              containerPort: 16686
              {{- with .Values.jaeger.service.hostPort }}
              hostPort: {{ . }}
              {{- end }}
            - name: otlp-grpc
              containerPort: 4317
              {{- with .Values.jaeger.service.otlpGrpcHostPort }}
              hostPort: {{ . }}
              {{- end }}
            - name: metrics
              containerPort: 14269
              {{- with .Values.jaeger.service.metricsHostPort }}
              hostPort: {{ . }}
              {{- end }}
          readinessProbe:
            httpGet:
              path: /
              port: query
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.jaeger.resources | nindent 12 }}
---
{{- end }}
