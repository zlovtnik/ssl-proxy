{{- if .Values.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ssl-proxy.telemetry.fullname" . }}-redis-exporter
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ssl-proxy.telemetry.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis-exporter
spec:
  selector:
    {{- include "ssl-proxy.telemetry.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: redis-exporter
  ports:
    - {name: metrics, port: 9121, targetPort: metrics}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ssl-proxy.telemetry.fullname" . }}-redis-exporter
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ssl-proxy.telemetry.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "ssl-proxy.telemetry.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: redis-exporter
  template:
    metadata:
      labels:
        {{- include "ssl-proxy.telemetry.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: redis-exporter
    spec:
      containers:
        - name: redis-exporter
          image: {{ include "ssl-proxy.telemetry.image" (dict "root" . "image" .Values.redisExporter.image) }}
          imagePullPolicy: {{ .Values.redisExporter.image.pullPolicy }}
          env:
            - name: REDIS_ADDR
              value: {{ .Values.global.shared.redis.url | quote }}
          ports:
            - name: metrics
              containerPort: 9121
          readinessProbe:
            httpGet:
              path: /
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.redisExporter.resources | nindent 12 }}
---
{{- end }}
