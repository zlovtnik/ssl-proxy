{{- if .Values.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ssl-proxy.telemetry.fullname" . }}-pushgateway
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ssl-proxy.telemetry.labels" . | nindent 4 }}
    app.kubernetes.io/component: pushgateway
spec:
  selector:
    {{- include "ssl-proxy.telemetry.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: pushgateway
  ports:
    - name: http
      port: 9091
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ssl-proxy.telemetry.fullname" . }}-pushgateway
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ssl-proxy.telemetry.labels" . | nindent 4 }}
    app.kubernetes.io/component: pushgateway
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "ssl-proxy.telemetry.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: pushgateway
  template:
    metadata:
      labels:
        {{- include "ssl-proxy.telemetry.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: pushgateway
    spec:
      automountServiceAccountToken: false
      containers:
        - name: pushgateway
          image: {{ include "ssl-proxy.telemetry.image" (dict "root" . "image" .Values.pushgateway.image) }}
          imagePullPolicy: {{ .Values.pushgateway.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 9091
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.pushgateway.resources | nindent 12 }}
---
{{- end }}
