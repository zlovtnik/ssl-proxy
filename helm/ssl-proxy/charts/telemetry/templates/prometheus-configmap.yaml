{{- if .Values.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ssl-proxy.telemetry.fullname" . }}-prometheus-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ssl-proxy.telemetry.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 20s
      evaluation_interval: 15s
      scrape_timeout: 10s
    rule_files:
      - /etc/prometheus/alerts/alerts.yml
    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["127.0.0.1:9090"]
      - job_name: otel-collector
        static_configs:
          - targets: ["{{ include "ssl-proxy.telemetry.fullname" . }}-otel-collector:8888"]
      - job_name: otel-spanmetrics
        static_configs:
          - targets: ["{{ include "ssl-proxy.telemetry.fullname" . }}-otel-collector:9464"]
      - job_name: loki
        static_configs:
          - targets: ["{{ include "ssl-proxy.telemetry.fullname" . }}-loki:3100"]
      - job_name: promtail
        static_configs:
          - targets: ["{{ include "ssl-proxy.telemetry.fullname" . }}-promtail:9080"]
      - job_name: jaeger
        static_configs:
          - targets: ["{{ include "ssl-proxy.telemetry.fullname" . }}-jaeger:14269"]
      - job_name: pushgateway
        static_configs:
          - targets: ["{{ include "ssl-proxy.telemetry.fullname" . }}-pushgateway:9091"]
      - job_name: ssl-proxy
        metrics_path: /metrics
        static_configs:
          - targets: ["{{ include "ssl-proxy.telemetry.fullname" . }}-proxy-admin:{{ .Values.global.shared.proxy.service.adminPort }}"]
      - job_name: java-coordinator
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ["{{ include "ssl-proxy.telemetry.fullname" . }}-coordinator:{{ .Values.global.shared.javaCoordinator.service.port }}"]
      - job_name: integration-console-web
        metrics_path: /metrics
        static_configs:
          - targets: ["{{ include "ssl-proxy.telemetry.fullname" . }}-integration-console:{{ .Values.global.shared.integrationConsole.web.service.port }}"]
      - job_name: atheros-sensor
        metrics_path: /metrics
        static_configs:
          - targets: ["{{ include "ssl-proxy.telemetry.fullname" . }}-atheros-sensor:{{ .Values.global.shared.atherosSensor.metricsPort }}"]
      - job_name: atheros-search
        metrics_path: /metrics
        static_configs:
          - targets: ["{{ include "ssl-proxy.telemetry.fullname" . }}-atheros-search:{{ .Values.global.shared.atherosSearch.metricsPort }}"]
      - job_name: vec-worker
        metrics_path: /metrics
        static_configs:
          - targets: ["{{ include "ssl-proxy.telemetry.fullname" . }}-vec-worker:{{ .Values.global.shared.atherosSearch.workerMetricsPort }}"]
      - job_name: redpanda
        static_configs:
          - targets: ["{{ include "ssl-proxy.telemetry.fullname" . }}-redpanda:{{ .Values.global.shared.redpanda.adminPort }}"]
      - job_name: postgres-exporter
        static_configs:
          - targets: ["{{ include "ssl-proxy.telemetry.fullname" . }}-postgres-exporter:9187"]
      - job_name: redis-exporter
        static_configs:
          - targets: ["{{ include "ssl-proxy.telemetry.fullname" . }}-redis-exporter:9121"]
      - job_name: node-exporter
        static_configs:
          - targets: ["{{ include "ssl-proxy.telemetry.fullname" . }}-node-exporter:9100"]
      - job_name: cadvisor
        static_configs:
          - targets: ["{{ include "ssl-proxy.telemetry.fullname" . }}-cadvisor:8080"]
      - job_name: minio
        metrics_path: /minio/v2/metrics/cluster
        static_configs:
          - targets: ["{{ include "ssl-proxy.telemetry.fullname" . }}-minio:9000"]
  alerts.yml: |
    {{- if .Values.prometheus.alertRules }}
    {{- .Values.prometheus.alertRules | nindent 4 }}
    {{- else }}
    groups: []
    {{- end }}
{{- end }}
