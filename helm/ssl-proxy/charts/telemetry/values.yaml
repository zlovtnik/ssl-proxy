# Values local to the telemetry subchart.
global:
  nameOverride: ""
  fullnameOverride: ""
  image:
    registry: ""
    pullPolicy: IfNotPresent
  rolloutRevision: ""
  labels: {}
  annotations: {}
  serviceAccount:
    create: true
    name: "ssl-proxy"
    annotations: {}
  podSecurityContext: {}
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: []
  shared:
    redpanda:
      adminPort: 9644
    postgres:
      host: "postgres-primary.postgres.svc.cluster.local"
      port: 5432
      database: "sync"
      user: "sync"
      passwordSecret:
        name: "postgres-credentials"
        key: "password"
    redis:
      url: "redis://redis.redis.svc.cluster.local:6379/1"
    proxy:
      service:
        adminPort: 3002
    javaCoordinator:
      service:
        port: 8080
    integrationConsole:
      enabled: true
      web:
        service:
          port: 3005
    atherosSensor:
      enabled: true
      metricsPort: 9097

# KEDA, ServiceMonitor, and dashboard-discovery values remain explicitly tracked as gaps in the umbrella chart.
enabled: false
prometheus:
  image:
    repository: prom/prometheus
    tag: v2.54.1
    pullPolicy: IfNotPresent
  service:
    port: 9090
    hostPort: null
  persistence:
    enabled: true
    hostPath: ""
    size: 20Gi
    storageClassName: ""
  alertRules: ""
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {cpu: "1", memory: 2Gi}
loki:
  image:
    repository: grafana/loki
    tag: 3.1.1
    pullPolicy: IfNotPresent
  service:
    port: 3100
  persistence:
    enabled: true
    hostPath: ""
    size: 20Gi
    storageClassName: ""
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: 500m, memory: 1Gi}
promtail:
  image:
    repository: grafana/promtail
    tag: 3.1.1
    pullPolicy: IfNotPresent
  positionsHostPath: "/var/lib/ssl-proxy/promtail"
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 250m, memory: 256Mi}
jaeger:
  image:
    repository: jaegertracing/all-in-one
    tag: 1.62.0
    pullPolicy: IfNotPresent
  service:
    port: 16686
    hostPort: null
    otlpGrpcHostPort: null
    metricsHostPort: null
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: 500m, memory: 1Gi}
otelCollector:
  image:
    repository: otel/opentelemetry-collector-contrib
    tag: 0.107.0
    pullPolicy: IfNotPresent
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}
grafana:
  image:
    repository: grafana/grafana
    tag: 11.1.4
    pullPolicy: IfNotPresent
  service:
    port: 3004
    targetPort: 3000
    hostPort: null
  adminUser: admin
  adminPasswordSecret:
    name: observability-credentials
    key: grafana-admin-password
  persistence:
    enabled: true
    hostPath: ""
    size: 10Gi
    storageClassName: ""
  dashboards:
    dbCalls: ""
    infraSaturation: ""
    integrationConsoleHealth: ""
    serviceRedMetrics: ""
    stackHealthOverview: ""
    syncPipelineLatency: ""
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: 500m, memory: 1Gi}
postgresExporter:
  image:
    repository: quay.io/prometheuscommunity/postgres-exporter
    tag: v0.19.1
    pullPolicy: IfNotPresent
  queries: ""
  resources:
    requests: {cpu: 25m, memory: 64Mi}
    limits: {cpu: 250m, memory: 256Mi}
redisExporter:
  image:
    repository: oliver006/redis_exporter
    tag: v1.61.0
    pullPolicy: IfNotPresent
  resources:
    requests: {cpu: 25m, memory: 64Mi}
    limits: {cpu: 250m, memory: 256Mi}
nodeExporter:
  image:
    repository: prom/node-exporter
    tag: v1.8.2
    pullPolicy: IfNotPresent
  resources:
    requests: {cpu: 25m, memory: 32Mi}
    limits: {cpu: 200m, memory: 128Mi}
cadvisor:
  image:
    repository: gcr.io/cadvisor/cadvisor
    tag: v0.49.1
    pullPolicy: IfNotPresent
  containerdHostPath: "/var/lib/containerd"
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}
pushgateway:
  image:
    repository: prom/pushgateway
    tag: v1.8.0
    pullPolicy: IfNotPresent
  resources:
    requests: {cpu: 25m, memory: 64Mi}
    limits: {cpu: 250m, memory: 256Mi}


# TODO: no ScaledObject templates exist yet. Keep disabled until the vec-worker workload exists.
keda:
  # -- Set to true to deploy KEDA ScaledObjects (requires KEDA operator in cluster)
  enabled: true

  # Java Coordinator auto-scaling (based on Redpanda consumer lag)
  javaCoordinator:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    # Scan topic scaling
    scanLagThreshold: 5000
    scanActivationLagThreshold: 500
    # Result topic scaling
    resultLagThreshold: 5000
    resultActivationLagThreshold: 500
    # Scale behavior
    scaleUp:
      stabilizationWindowSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300

  # Vec Worker auto-scaling (based on Postgres pending job count)
  vecWorker:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    # Each vec-worker handles ~100 jobs concurrently
    # Scale when pending > baseCount * targetQueryValue
    jobsPerReplica: 100
    targetQueryValue: 3  # scale when pending > 3 * 100 = 300
    scaleUp:
      stabilizationWindowSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300

# TODO: ServiceMonitor templates do not exist yet; monitoring.enabled currently only controls proxy metrics exposure.
monitoring:
  # -- Set to true to create ServiceMonitors for Prometheus scraping
  enabled: true
  # ServiceMonitors will be created in this namespace
  serviceMonitorNamespace: "monitoring"
  # Scrape interval
  interval: 30s
  # Labels for ServiceMonitor selection
  labels:
    release: kube-prometheus-stack

  # Redpanda metrics (external, scraped from Redpanda's :9644 endpoint)
  redpanda:
    enabled: true
    # Endpoint for Redpanda metrics
    endpoint: "redpanda-0.redpanda.redpanda.svc.cluster.local:9644"

  # Postgres metrics (via postgres_exporter sidecar)
  postgres:
    enabled: true
    # postgres_exporter queries
    queries:
      vecPendingJobs: |
        SELECT status, count(*) as count
        FROM vec_embedding_jobs
        WHERE status = 'pending'
          AND (leased_until IS NULL OR leased_until < NOW())
        GROUP BY status

# TODO: dashboard discovery is not templated; Grafana's built-in dashboard ConfigMaps are managed above.
dashboardDiscovery:
    # -- Set to true to create a ConfigMap with Grafana dashboard JSON
    enabled: true
    # Dashboard label for auto-discovery
    dashboardLabel: "grafana_dashboard"
    dashboardLabelValue: "1"
    # Dashboard namespace
    namespace: "monitoring"
