{{- if .Values.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ssl-proxy.proxy.fullname" . }}-proxy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ssl-proxy.proxy.labels" . | nindent 4 }}
    app.kubernetes.io/component: proxy
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "ssl-proxy.proxy.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: proxy
  ports:
    - name: wireguard
      port: {{ .Values.service.wgPort }}
      targetPort: {{ .Values.wireguard.port }}
      protocol: UDP
    - name: wireguard-internal
      port: {{ .Values.service.wgInternalPort }}
      targetPort: {{ .Values.wireguard.internalPort }}
      protocol: UDP
{{- end }}
