# Values local to the postgres subchart.
global:
  nameOverride: ""
  fullnameOverride: ""
  image:
    registry: ""
    pullPolicy: IfNotPresent
  rolloutRevision: ""
  labels: {}
  annotations: {}
  serviceAccount:
    create: true
    name: "ssl-proxy"
    annotations: {}
  podSecurityContext: {}
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# -- Set to true if Postgres is managed externally (not deployed by this chart)
external: true
# -- Postgres connection URL (without password, password goes in secret)
host: "postgres-primary.postgres.svc.cluster.local"
port: 5432
# -- Optional node port bound directly by the Postgres pod (single-node deployments only)
hostPort: null
database: "sync"
user: "sync"
# -- Secret reference for Postgres password
passwordSecret:
  name: "postgres-credentials"
  key: "password"
image:
  repository: ssl-proxy-postgres
  tag: 16-bookworm
  pullPolicy: Always
persistence:
  enabled: true
  hostPath: ""
  # postgres:16 uses the pre-18 data-directory layout.
  mountPath: "/var/lib/postgresql/data"
  pgData: "/var/lib/postgresql/data/pgdata"
  size: 100Gi
  storageClassName: ""
resources:
  limits:
    cpu: "4"
    memory: 8Gi
  requests:
    cpu: "1"
    memory: 4Gi
# PostgreSQL parallel query workers allocate POSIX dynamic shared memory here.
# Mount a dedicated tmpfs instead of relying on the container runtime's 64 MiB
# default. Memory consumed by this volume counts against the container limit.
sharedMemory:
  sizeLimit: 512Mi
tuning:
  # Kubernetes profile for the 8 GiB container limit. The image's
  # /etc/postgresql/postgresql.conf remains tuned for the 32 GiB Compose host.
  max_connections: 128
  shared_buffers: 2GB
  effective_cache_size: 6GB
  work_mem: 8MB
  maintenance_work_mem: 512MB
  autovacuum_work_mem: 256MB
  wal_buffers: 32MB
  max_parallel_workers_per_gather: 2
  max_parallel_maintenance_workers: 2
