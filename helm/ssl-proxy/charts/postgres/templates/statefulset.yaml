{{- if not .Values.external }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "ssl-proxy.postgres.fullname" . }}-postgres
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ssl-proxy.postgres.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  serviceName: {{ include "ssl-proxy.postgres.fullname" . }}-postgres
  replicas: 1
  selector:
    matchLabels:
      {{- include "ssl-proxy.postgres.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        {{- include "ssl-proxy.postgres.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: postgres
      {{- with .Values.global.rolloutRevision }}
      annotations:
        ssl-proxy.io/rollout-revision: {{ . | quote }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "ssl-proxy.postgres.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.global.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: 60
      containers:
        - name: postgres
          image: {{ include "ssl-proxy.postgres.image" (dict "root" . "image" .Values.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - postgres
            - -c
            - config_file=/etc/postgresql/postgresql.conf
            - -c
            - shared_preload_libraries=pg_cron,pg_stat_statements
            - -c
            - cron.database_name={{ .Values.database }}
            - -c
            - listen_addresses=*
            - -c
            - track_io_timing=on
            - -c
            - max_connections={{ .Values.tuning.max_connections }}
            - -c
            - shared_buffers={{ .Values.tuning.shared_buffers }}
            - -c
            - effective_cache_size={{ .Values.tuning.effective_cache_size }}
            - -c
            - work_mem={{ .Values.tuning.work_mem }}
            - -c
            - maintenance_work_mem={{ .Values.tuning.maintenance_work_mem }}
            - -c
            - autovacuum_work_mem={{ .Values.tuning.autovacuum_work_mem }}
            - -c
            - wal_buffers={{ .Values.tuning.wal_buffers }}
            - -c
            - max_parallel_workers_per_gather={{ .Values.tuning.max_parallel_workers_per_gather }}
            - -c
            - max_parallel_maintenance_workers={{ .Values.tuning.max_parallel_maintenance_workers }}
          env:
            - name: POSTGRES_DB
              value: {{ .Values.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.user | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.passwordSecret.name }}
                  key: {{ .Values.passwordSecret.key }}
            - name: PGDATA
              value: {{ .Values.persistence.pgData | quote }}
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -ec
                  - |
                    attempts=0
                    until
                      printf '%s\n' \
                        '\getenv desired_password POSTGRES_PASSWORD' \
                        "SELECT format('ALTER ROLE %I PASSWORD %L', current_user, :'desired_password') \gexec" |
                        psql \
                          --host=/var/run/postgresql \
                          --username="$POSTGRES_USER" \
                          --dbname="$POSTGRES_DB" \
                          --no-password \
                          --set=ON_ERROR_STOP=1
                    do
                      attempts=$((attempts + 1))
                      if [ "$attempts" -ge 60 ]; then
                        echo "failed to reconcile the Postgres role password" >&2
                        exit 1
                      fi
                      sleep 1
                    done
          ports:
            - name: postgres
              containerPort: {{ .Values.port }}
              {{- with .Values.hostPort }}
              hostPort: {{ . }}
              {{- end }}
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - >-
                  PGPASSWORD="$POSTGRES_PASSWORD" exec psql
                  --host=127.0.0.1
                  --username="$POSTGRES_USER"
                  --dbname="$POSTGRES_DB"
                  --no-password
                  --tuples-only
                  --no-align
                  --command='SELECT 1'
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.user | quote }}, "-d", {{ .Values.database | quote }}]
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: postgres-data
              mountPath: {{ .Values.persistence.mountPath | quote }}
      volumes:
        - name: postgres-data
          {{- if .Values.persistence.hostPath }}
          hostPath:
            path: {{ .Values.persistence.hostPath | quote }}
            type: Directory
          {{- else if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "ssl-proxy.postgres.fullname" . }}-postgres-data
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.global.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.global.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.global.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
