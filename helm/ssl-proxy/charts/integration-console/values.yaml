# Values local to the integration-console subchart.
global:
  nameOverride: ""
  fullnameOverride: ""
  image:
    registry: ""
    pullPolicy: IfNotPresent
  rolloutRevision: ""
  labels: {}
  annotations: {}
  serviceAccount:
    create: true
    name: "ssl-proxy"
    annotations: {}
  podSecurityContext: {}
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: []
  shared:
    redpanda:
      bootstrapServers: "redpanda-0.redpanda.redpanda.svc.cluster.local:9092"
    postgres:
      host: "postgres-primary.postgres.svc.cluster.local"
      port: 5432
      database: "sync"
      user: "sync"
      passwordSecret:
        name: "postgres-credentials"
        key: "password"
    redis:
      url: "redis://redis.redis.svc.cluster.local:6379/1"
    minio:
      endpoint: "http://minio.minio.svc.cluster.local:9000"
      bucket: "integration-console-exports"
      accessKeySecret:
        name: "minio-credentials"
        key: "access-key"
      secretKeySecret:
        name: "minio-credentials"
        key: "secret-key"

enabled: true
web:
  replicas: 1
  image:
    repository: integration-console
    tag: latest
    pullPolicy: IfNotPresent
  service:
    port: 3000
    targetPort: 3000
    type: ClusterIP
    hostPort: null
  resources:
    limits:
      cpu: "1"
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 512Mi
  # Ingress for web access
  ingress:
    enabled: false
    className: "nginx"
    hosts:
      - console.ssl-proxy.local
    tls: []
  syncDbPool: 5
  cache:
    ttlInventory: 60
    ttlAuditRecent: 10
    ttlDashboard: 15
worker:
  enabled: true
  replicas: 1
  resources:
    limits:
      cpu: "1"
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 512Mi
  syncDbPool: 5
heatmapRefresh:
  enabled: true
  replicas: 1
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi
  intervalSeconds: 300
heartbeat:
  enabled: true
  replicas: 1
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi
  intervalSeconds: 60
dbSetup:
  enabled: true
  image:
    repository: integration-console
    tag: latest
# Rails environment
railsEnv: "development"
logFormat: "json"
otlpEndpoint: "http://ssl-proxy-otel-collector:4317"

# Atheros wireless sensor (host-networked producer; no direct Postgres ownership)
