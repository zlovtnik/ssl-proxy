{{- if .Values.enabled }}
{{- if .Values.worker.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ssl-proxy.integrationConsole.fullname" . }}-integration-console-worker
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ssl-proxy.integrationConsole.labels" . | nindent 4 }}
    app.kubernetes.io/component: integration-console-worker
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      {{- include "ssl-proxy.integrationConsole.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: integration-console-worker
  template:
    metadata:
      labels:
        {{- include "ssl-proxy.integrationConsole.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: integration-console-worker
      {{- with .Values.global.rolloutRevision }}
      annotations:
        ssl-proxy.io/rollout-revision: {{ . | quote }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "ssl-proxy.integrationConsole.serviceAccountName" . }}
      automountServiceAccountToken: false
      containers:
        - name: worker
          image: {{ include "ssl-proxy.integrationConsole.image" (dict "root" . "image" .Values.web.image) }}
          imagePullPolicy: {{ .Values.web.image.pullPolicy }}
          command: ["bin/rails", "runner", "Observability::WorkerRunner.run_forever"]
          env:
            {{- include "ssl-proxy.integrationConsole.integrationConsoleEnv" . | nindent 12 }}
            - name: SYNC_DB_POOL
              value: {{ .Values.worker.syncDbPool | quote }}
            - name: PUSHGATEWAY_URL
              value: "http://{{ include "ssl-proxy.integrationConsole.fullname" . }}-pushgateway:9091"
            - name: OTEL_SERVICE_NAME
              value: "integration-console-worker"
          livenessProbe:
            exec:
              command: ["sh", "-ec", "test -f /tmp/wireless-worker-health && find /tmp/wireless-worker-health -mmin -2 | grep -q ."]
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
{{- end }}
{{- end }}
