{{- if .Values.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ssl-proxy.integrationConsole.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels: &labels
    app.kubernetes.io/name: integration-console
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.replicas }}
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels: *labels
  template:
    metadata:
      labels:
        <<: *labels
        ssl-proxy.io/tidb-client: "true"
      annotations:
        ssl-proxy.io/rollout-revision: {{ .Values.global.rolloutRevision | quote }}
        {{- with .Values.global.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ .Values.global.serviceAccount.name }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.global.podSecurityContext | nindent 8 }}
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: web
          image: {{ include "ssl-proxy.integrationConsole.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["bin/rails", "server", "-b", "0.0.0.0", "-p", "3000"]
          env:
            - {name: RAILS_ENV, value: production}
            - {name: RAILS_LOG_TO_STDOUT, value: "true"}
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: {{ .Values.databaseSecret.name }}, key: {{ .Values.databaseSecret.primaryUrlKey }}}}
            - name: SYNC_DATABASE_URL
              valueFrom: {secretKeyRef: {name: {{ .Values.databaseSecret.name }}, key: {{ .Values.databaseSecret.syncUrlKey }}}}
            - name: REDIS_URL
              valueFrom: {secretKeyRef: {name: {{ .Values.global.shared.redis.urlSecret.name }}, key: {{ .Values.global.shared.redis.urlSecret.key }}}}
            - {name: KEYCLOAK_ISSUER, value: {{ .Values.global.shared.keycloak.issuer | quote }}}
            - {name: KEYCLOAK_JWKS_URI, value: {{ .Values.global.shared.keycloak.jwksUri | quote }}}
            - {name: KEYCLOAK_CLIENT_ID, value: {{ .Values.global.shared.keycloak.consoleClientId | quote }}}
            - {name: INTEGRATION_CONSOLE_SCHEMA_VERSION, value: {{ .Values.schema.integrationConsoleVersion | quote }}}
            - {name: INTEGRATION_CONSOLE_SCHEMA_CHECKSUM, value: {{ .Values.schema.integrationConsoleChecksum | quote }}}
            - {name: OCTOPUS_CORE_SCHEMA_VERSION, value: {{ .Values.schema.octopusCoreVersion | quote }}}
            - {name: OCTOPUS_CORE_SCHEMA_CHECKSUM, value: {{ .Values.schema.octopusCoreChecksum | quote }}}
            - {name: ATHEROS_SEARCH_SCHEMA_VERSION, value: {{ .Values.schema.atherosSearchVersion | quote }}}
            - {name: ATHEROS_SEARCH_SCHEMA_CHECKSUM, value: {{ .Values.schema.atherosSearchChecksum | quote }}}
            - {name: SYNC_SCAN_CONSUMER, value: octopus-scan-v1}
            - {name: SYNC_LOAD_CONSUMER, value: octopus-load-v1}
            - {name: SYNC_RESULT_CONSUMER, value: octopus-result-v1}
          ports:
            - {name: http, containerPort: 3000}
          startupProbe: {httpGet: {path: /up, port: http}, periodSeconds: 3, failureThreshold: 40}
          readinessProbe: {httpGet: {path: /health/ready, port: http}, periodSeconds: 10, failureThreshold: 6}
          livenessProbe: {httpGet: {path: /up, port: http}, periodSeconds: 20, failureThreshold: 6}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
      {{- with .Values.global.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.global.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.global.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ssl-proxy.integrationConsole.fullname" . }}
  namespace: {{ .Release.Namespace }}
spec:
  type: {{ .Values.service.type }}
  selector: *labels
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      {{- with .Values.service.hostPort }}
      nodePort: {{ . }}
      {{- end }}
{{- end }}
