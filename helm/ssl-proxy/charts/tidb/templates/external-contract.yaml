{{- if .Values.external }}
{{- $tidb := required "global.shared.tidb is required" .Values.global.shared.tidb -}}
{{- $_ := required "global.shared.tidb.host must name the external TiDB endpoint" $tidb.host -}}
{{- if or (eq $tidb.host "tidb") (eq $tidb.host "127.0.0.1") (eq $tidb.host "localhost") -}}
{{- fail "global.shared.tidb.host must be external, not a bundled or loopback endpoint" -}}
{{- end -}}
{{- $_ = required "global.shared.tidb.tls.caSecret.name is required" $tidb.tls.caSecret.name -}}
{{- $_ = required "global.shared.tidb.tls.caSecret.key is required" $tidb.tls.caSecret.key -}}
{{- if ne $tidb.tls.serverName $tidb.host -}}
{{- fail "global.shared.tidb.tls.serverName must equal global.shared.tidb.host (Connector/J verifies the JDBC host identity)" -}}
{{- end -}}
{{- range $name := list "octopus" "atherosSearch" "schemaMigrator" "keycloak" -}}
{{- $account := index $tidb.accounts $name -}}
{{- $_ = required (printf "global.shared.tidb.accounts.%s.database is required" $name) $account.database -}}
{{- $_ = required (printf "global.shared.tidb.accounts.%s.user is required" $name) $account.user -}}
{{- $_ = required (printf "global.shared.tidb.accounts.%s.passwordSecret.name is required" $name) $account.passwordSecret.name -}}
{{- $_ = required (printf "global.shared.tidb.accounts.%s.passwordSecret.key is required" $name) $account.passwordSecret.key -}}
{{- end -}}
{{- if and .Values.egress.enabled (empty .Values.egress.cidrs) -}}
{{- fail "tidb.egress.cidrs must contain the external TiDB routes when egress policy is enabled" -}}
{{- end -}}
{{- if .Values.egress.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ssl-proxy-common.fullname" (dict "root" . "component" "tidb") }}-external-tidb-egress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ssl-proxy-common.labels" (dict "root" . "component" "tidb") | nindent 4 }}
    app.kubernetes.io/component: external-tidb-egress
spec:
  podSelector:
    matchExpressions:
      - key: ssl-proxy.io/tidb-client
        operator: In
        values: ["true"]
  policyTypes: ["Egress"]
  egress:
    - to:
        {{- range .Values.egress.cidrs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ $tidb.port }}
{{- end }}
{{- end }}
