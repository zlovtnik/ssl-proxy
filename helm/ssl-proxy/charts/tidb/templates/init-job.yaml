{{- if not .Values.external }}
{{- $tidbSvc := include "ssl-proxy-common.fullname" (dict "root" . "component" "tidb") -}}
{{- $tidbHost := printf "%s-tidb.%s.svc.cluster.local" $tidbSvc .Release.Namespace }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $tidbSvc }}-tidb-init-{{ .Release.Revision }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ssl-proxy-common.labels" (dict "root" . "component" "tidb") | nindent 4 }}
    app.kubernetes.io/component: tidb-init
spec:
  backoffLimit: {{ .Values.initJob.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.initJob.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        {{- include "ssl-proxy-common.selectorLabels" (dict "root" . "component" "tidb") | nindent 8 }}
        app.kubernetes.io/component: tidb-init
    spec:
      serviceAccountName: {{ include "ssl-proxy-common.serviceAccountName" (dict "root" . "component" "tidb") }}
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: tidb-init
          image: {{ include "ssl-proxy-common.image" (dict "root" . "image" .Values.initJob.image) }}
          imagePullPolicy: {{ .Values.initJob.image.pullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -euo pipefail
              MYSQL_OPTS="--ssl-mode=VERIFY_IDENTITY --ssl-ca=/etc/tidb-tls/ca.crt"
              echo "Waiting for TiDB to be ready..."
              until mysql -h {{ $tidbHost }} -P 4000 -u root ${MYSQL_OPTS} -e "SELECT 1" 2>/dev/null; do
                sleep 3
              done
              echo "TiDB is ready."
              STATS_CACHE_QUOTA_BYTES={{ .Values.memoryTuning.statsCacheQuotaBytes | int64 }}
              SCHEMA_CACHE_SIZE_BYTES={{ .Values.memoryTuning.schemaCacheSizeBytes | int64 }}
              echo "Applying TiDB cache quotas..."
              mysql -h {{ $tidbHost }} -P 4000 -u root ${MYSQL_OPTS} -e \
                "SET GLOBAL tidb_stats_cache_mem_quota = ${STATS_CACHE_QUOTA_BYTES}; SET GLOBAL tidb_schema_cache_size = ${SCHEMA_CACHE_SIZE_BYTES};"
              ACTUAL_CACHE_QUOTAS="$(mysql -h {{ $tidbHost }} -P 4000 -u root ${MYSQL_OPTS} --batch --skip-column-names -e \
                "SELECT CONCAT(@@GLOBAL.tidb_stats_cache_mem_quota, ':', @@GLOBAL.tidb_schema_cache_size);")"
              EXPECTED_CACHE_QUOTAS="${STATS_CACHE_QUOTA_BYTES}:${SCHEMA_CACHE_SIZE_BYTES}"
              if [ "${ACTUAL_CACHE_QUOTAS}" != "${EXPECTED_CACHE_QUOTAS}" ]; then
                echo "TiDB cache quota verification failed: expected ${EXPECTED_CACHE_QUOTAS}, got ${ACTUAL_CACHE_QUOTAS}" >&2
                exit 1
              fi
              echo "TiDB cache quotas verified: ${ACTUAL_CACHE_QUOTAS}"
              echo "Creating databases..."
              mysql -h {{ $tidbHost }} -P 4000 -u root ${MYSQL_OPTS} -e \
                "CREATE DATABASE IF NOT EXISTS octopus_core CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
              mysql -h {{ $tidbHost }} -P 4000 -u root ${MYSQL_OPTS} -e \
                "CREATE DATABASE IF NOT EXISTS atheros_search CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
              mysql -h {{ $tidbHost }} -P 4000 -u root ${MYSQL_OPTS} -e \
                "CREATE DATABASE IF NOT EXISTS schema_migrator CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
              mysql -h {{ $tidbHost }} -P 4000 -u root ${MYSQL_OPTS} -e \
                "CREATE DATABASE IF NOT EXISTS keycloak CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
              mysql -h {{ $tidbHost }} -P 4000 -u root ${MYSQL_OPTS} -e \
                "CREATE DATABASE IF NOT EXISTS integration_console CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
              echo "Creating accounts..."
              mysql -h {{ $tidbHost }} -P 4000 -u root ${MYSQL_OPTS} -e \
                "CREATE USER IF NOT EXISTS 'octopus_runtime' IDENTIFIED BY '${OCTOPUS_PASSWORD}';"
              mysql -h {{ $tidbHost }} -P 4000 -u root ${MYSQL_OPTS} -e \
                "ALTER USER 'octopus_runtime' IDENTIFIED BY '${OCTOPUS_PASSWORD}';"
              mysql -h {{ $tidbHost }} -P 4000 -u root ${MYSQL_OPTS} -e \
                "CREATE USER IF NOT EXISTS 'atheros_search_runtime' IDENTIFIED BY '${ATHEROS_SEARCH_PASSWORD}';"
              mysql -h {{ $tidbHost }} -P 4000 -u root ${MYSQL_OPTS} -e \
                "ALTER USER 'atheros_search_runtime' IDENTIFIED BY '${ATHEROS_SEARCH_PASSWORD}';"
              mysql -h {{ $tidbHost }} -P 4000 -u root ${MYSQL_OPTS} -e \
                "CREATE USER IF NOT EXISTS 'schema_migrator_runtime' IDENTIFIED BY '${SCHEMA_MIGRATOR_PASSWORD}';"
              mysql -h {{ $tidbHost }} -P 4000 -u root ${MYSQL_OPTS} -e \
                "ALTER USER 'schema_migrator_runtime' IDENTIFIED BY '${SCHEMA_MIGRATOR_PASSWORD}';"
              mysql -h {{ $tidbHost }} -P 4000 -u root ${MYSQL_OPTS} -e \
                "CREATE USER IF NOT EXISTS 'keycloak' IDENTIFIED BY '${KEYCLOAK_PASSWORD}';"
              mysql -h {{ $tidbHost }} -P 4000 -u root ${MYSQL_OPTS} -e \
                "ALTER USER 'keycloak' IDENTIFIED BY '${KEYCLOAK_PASSWORD}';"
              echo "Granting permissions..."
              mysql -h {{ $tidbHost }} -P 4000 -u root ${MYSQL_OPTS} -e \
                "GRANT SELECT, INSERT, UPDATE, DELETE ON octopus_core.* TO 'octopus_runtime';"
              mysql -h {{ $tidbHost }} -P 4000 -u root ${MYSQL_OPTS} -e \
                "GRANT SELECT ON atheros_search.* TO 'octopus_runtime';
                 GRANT INSERT, UPDATE, DELETE ON atheros_search.search_documents TO 'octopus_runtime';
                 GRANT INSERT, UPDATE, DELETE ON atheros_search.search_document_tokens TO 'octopus_runtime';
                 GRANT INSERT, UPDATE, DELETE ON atheros_search.search_document_tags TO 'octopus_runtime';
                 GRANT INSERT, UPDATE, DELETE ON atheros_search.search_filter_values TO 'octopus_runtime';
                 GRANT INSERT, UPDATE, DELETE ON atheros_search.embedding_jobs TO 'octopus_runtime';
                 GRANT DELETE ON atheros_search.search_vectors_event TO 'octopus_runtime';
                 GRANT DELETE ON atheros_search.search_vectors_device TO 'octopus_runtime';
                 GRANT DELETE ON atheros_search.search_vectors_behaviour TO 'octopus_runtime';
                 GRANT DELETE ON atheros_search.search_vectors_sequence TO 'octopus_runtime';
                 GRANT INSERT, UPDATE, DELETE ON atheros_search.behaviour_snapshots TO 'octopus_runtime';
                 GRANT INSERT, UPDATE, DELETE ON atheros_search.baseline_profiles TO 'octopus_runtime';
                 GRANT INSERT, UPDATE, DELETE ON atheros_search.frame_sequences TO 'octopus_runtime';
                 GRANT INSERT, UPDATE, DELETE ON atheros_search.sequence_transitions TO 'octopus_runtime';
                 GRANT INSERT, UPDATE, DELETE ON atheros_search.sequence_transition_contributions TO 'octopus_runtime';
                 GRANT INSERT, UPDATE, DELETE ON atheros_search.sequence_previous_totals TO 'octopus_runtime';
                 GRANT INSERT, UPDATE, DELETE ON atheros_search.timing_profiles TO 'octopus_runtime';
                 GRANT INSERT, UPDATE, DELETE ON atheros_search.similarity_pairs TO 'octopus_runtime';
                 GRANT INSERT, UPDATE, DELETE ON atheros_search.threat_signals TO 'octopus_runtime';
                 GRANT INSERT, UPDATE, DELETE ON atheros_search.ap_risk_scores TO 'octopus_runtime';
                 GRANT INSERT, UPDATE, DELETE ON atheros_search.graph_nodes TO 'octopus_runtime';
                 GRANT INSERT, UPDATE, DELETE ON atheros_search.graph_edges TO 'octopus_runtime';
                 GRANT INSERT, UPDATE, DELETE ON atheros_search.inventory_devices TO 'octopus_runtime';
                 GRANT INSERT, UPDATE, DELETE ON atheros_search.identity_clusters TO 'octopus_runtime';
                 GRANT INSERT, UPDATE, DELETE ON atheros_search.identity_cluster_members TO 'octopus_runtime';
                 GRANT INSERT, UPDATE, DELETE ON atheros_search.merge_candidates TO 'octopus_runtime';"
              mysql -h {{ $tidbHost }} -P 4000 -u root ${MYSQL_OPTS} -e \
                "GRANT SELECT ON atheros_search.* TO 'atheros_search_runtime';
                 GRANT UPDATE ON atheros_search.embedding_jobs TO 'atheros_search_runtime';
                 GRANT INSERT, UPDATE ON atheros_search.search_vectors_event TO 'atheros_search_runtime';
                 GRANT INSERT, UPDATE ON atheros_search.search_vectors_device TO 'atheros_search_runtime';
                 GRANT INSERT, UPDATE ON atheros_search.search_vectors_behaviour TO 'atheros_search_runtime';
                 GRANT INSERT, UPDATE ON atheros_search.search_vectors_sequence TO 'atheros_search_runtime';
                 GRANT INSERT, UPDATE ON atheros_search.worker_heartbeat TO 'atheros_search_runtime';
                 GRANT INSERT, UPDATE ON atheros_search.search_queries TO 'atheros_search_runtime';
                 GRANT INSERT, UPDATE ON atheros_search.search_query_results TO 'atheros_search_runtime';
                 GRANT INSERT, UPDATE ON atheros_search.search_feedback TO 'atheros_search_runtime';
                 GRANT INSERT ON atheros_search.merge_decisions TO 'atheros_search_runtime';"
              mysql -h {{ $tidbHost }} -P 4000 -u root ${MYSQL_OPTS} -e \
                "GRANT SELECT ON octopus_core.schema_readiness TO 'atheros_search_runtime';
                 GRANT SELECT ON octopus_core.sync_events TO 'atheros_search_runtime';
                 GRANT SELECT ON octopus_core.devices TO 'atheros_search_runtime';
                 GRANT SELECT ON octopus_core.wireless_authorized_networks TO 'atheros_search_runtime';
                 GRANT SELECT ON octopus_core.wireless_clients TO 'atheros_search_runtime';
                 GRANT SELECT ON octopus_core.wireless_frames TO 'atheros_search_runtime';
                 GRANT SELECT ON octopus_core.wireless_frame_radio TO 'atheros_search_runtime';
                 GRANT SELECT ON octopus_core.wireless_frame_qos TO 'atheros_search_runtime';
                 GRANT SELECT ON octopus_core.wireless_frame_network TO 'atheros_search_runtime';
                 GRANT SELECT ON octopus_core.wireless_frame_app_signals TO 'atheros_search_runtime';
                 GRANT SELECT ON octopus_core.wireless_frame_identity TO 'atheros_search_runtime';
                 GRANT SELECT ON octopus_core.wireless_frame_security TO 'atheros_search_runtime';
                 GRANT SELECT ON octopus_core.wireless_shadow_alerts TO 'atheros_search_runtime';
                 GRANT SELECT ON octopus_core.v_wireless_device_inventory TO 'atheros_search_runtime';"
              mysql -h {{ $tidbHost }} -P 4000 -u root ${MYSQL_OPTS} -e \
                "GRANT SELECT, INSERT, UPDATE, DELETE ON schema_migrator.* TO 'schema_migrator_runtime';"
              mysql -h {{ $tidbHost }} -P 4000 -u root ${MYSQL_OPTS} -e \
                "GRANT ALL PRIVILEGES ON keycloak.* TO 'keycloak';"
              echo "Flushing privileges..."
              mysql -h {{ $tidbHost }} -P 4000 -u root ${MYSQL_OPTS} -e "FLUSH PRIVILEGES;"
              echo "Verifying accounts..."
              mysql -h {{ $tidbHost }} -P 4000 -u root ${MYSQL_OPTS} -e \
                "SELECT User, Host FROM mysql.user WHERE User IN ('octopus_runtime','atheros_search_runtime','schema_migrator_runtime','keycloak');"
              echo "TiDB initialization complete."
          env:
            - name: OCTOPUS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.shared.tidb.accounts.octopus.passwordSecret.name }}
                  key: {{ .Values.global.shared.tidb.accounts.octopus.passwordSecret.key }}
            - name: ATHEROS_SEARCH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.shared.tidb.accounts.atherosSearch.passwordSecret.name }}
                  # Atheros Search consumes a full DSN at runtime, while
                  # account provisioning needs the raw password stored beside it.
                  key: password
            - name: SCHEMA_MIGRATOR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.shared.tidb.accounts.schemaMigrator.passwordSecret.name }}
                  key: {{ .Values.global.shared.tidb.accounts.schemaMigrator.passwordSecret.key }}
            - name: KEYCLOAK_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.shared.tidb.accounts.keycloak.passwordSecret.name }}
                  key: {{ .Values.global.shared.tidb.accounts.keycloak.passwordSecret.key }}
          volumeMounts:
            - name: tidb-tls
              mountPath: /etc/tidb-tls
              readOnly: true
      volumes:
        - name: tidb-tls
          secret:
            secretName: {{ .Values.global.shared.tidb.tls.caSecret.name }}
            items:
              - key: {{ .Values.global.shared.tidb.tls.caSecret.key }}
                path: ca.crt
{{- end }}
