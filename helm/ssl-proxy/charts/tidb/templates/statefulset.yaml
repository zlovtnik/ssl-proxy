{{- if not .Values.external }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "ssl-proxy-common.fullname" (dict "root" . "component" "tidb") }}-tidb
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ssl-proxy-common.labels" (dict "root" . "component" "tidb") | nindent 4 }}
    app.kubernetes.io/component: tidb
spec:
  serviceName: {{ include "ssl-proxy-common.fullname" (dict "root" . "component" "tidb") }}-tidb-headless
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "ssl-proxy-common.selectorLabels" (dict "root" . "component" "tidb") | nindent 6 }}
      app.kubernetes.io/component: tidb
  template:
    metadata:
      labels:
        {{- include "ssl-proxy-common.selectorLabels" (dict "root" . "component" "tidb") | nindent 8 }}
        app.kubernetes.io/component: tidb
      annotations:
        checksum/tidb-config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      {{- if .Values.tlsCertChecksum }}
        ssl-proxy.io/tidb-tls-checksum: {{ .Values.tlsCertChecksum | quote }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "ssl-proxy-common.serviceAccountName" (dict "root" . "component" "tidb") }}
      automountServiceAccountToken: false
      containers:
        - name: tidb
          image: {{ include "ssl-proxy-common.image" (dict "root" . "image" .Values.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --store=unistore
            - --path=/tidb-data
            - --log-file=
            - --advertise-address={{ include "ssl-proxy-common.fullname" (dict "root" . "component" "tidb") }}-tidb.{{ .Release.Namespace }}.svc.cluster.local
            - --status={{ .Values.metricsPort }}
            - --config=/etc/tidb/config/tidb.toml
          ports:
            - containerPort: 4000
              {{- with .Values.service.hostPort }}
              hostPort: {{ . }}
              {{- end }}
              name: mysql
            - containerPort: {{ .Values.metricsPort }}
              name: metrics
          livenessProbe:
            httpGet:
              path: /status
              port: metrics
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /status
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tidb-data
              mountPath: /tidb-data
            - name: tidb-server-tls
              mountPath: /etc/tidb-tls-server
              readOnly: true
            - name: tidb-config
              mountPath: /etc/tidb/config
      volumes:
        - name: tidb-data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "ssl-proxy-common.fullname" (dict "root" . "component" "tidb") }}-tidb-data
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tidb-server-tls
          secret:
            secretName: tidb-server-tls
        - name: tidb-config
          configMap:
            name: {{ include "ssl-proxy-common.fullname" (dict "root" . "component" "tidb") }}-tidb-config
{{- end }}
