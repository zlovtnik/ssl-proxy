{{- if not .Values.external }}
{{- if ne (int .Values.replicas) 1 }}
{{- fail "tidb.replicas must be 1; this chart's storage layout is single-node only" }}
{{- end }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "ssl-proxy.tidb.fullname" . }}-tidb
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ssl-proxy.tidb.labels" . | nindent 4 }}
    app.kubernetes.io/component: tidb
spec:
  serviceName: {{ include "ssl-proxy.tidb.fullname" . }}-tidb
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "ssl-proxy.tidb.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: tidb
  template:
    metadata:
      labels:
        {{- include "ssl-proxy.tidb.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: tidb
      {{- if or .Values.global.rolloutRevision .Values.global.podAnnotations }}
      annotations:
        {{- with .Values.global.rolloutRevision }}
        ssl-proxy.io/rollout-revision: {{ . | quote }}
        {{- end }}
        {{- with .Values.global.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "ssl-proxy.tidb.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.global.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: 60
      containers:
        - name: tidb
          image: {{ include "ssl-proxy.tidb.image" (dict "root" . "image" .Values.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --store=mocktikv
            - --path=/data
            - --host=0.0.0.0
            - --port={{ .Values.service.port }}
            - --status={{ .Values.service.statusPort }}
          ports:
            - name: mysql
              containerPort: {{ .Values.service.port }}
            - name: status
              containerPort: {{ .Values.service.statusPort }}
          readinessProbe:
            tcpSocket:
              port: mysql
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: mysql
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tidb-data
              mountPath: /data
      volumes:
        - name: tidb-data
          {{- if .Values.persistence.hostPath }}
          hostPath:
            path: {{ .Values.persistence.hostPath | quote }}
            type: DirectoryOrCreate
          {{- else if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "ssl-proxy.tidb.fullname" . }}-tidb-data
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.global.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.global.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.global.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
