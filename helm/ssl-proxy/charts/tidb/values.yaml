global:
  nameOverride: ""
  fullnameOverride: ""
  image:
    registry: ""
    pullPolicy: IfNotPresent
  rolloutRevision: ""
  labels: {}
  annotations: {}
  serviceAccount:
    create: true
    name: "ssl-proxy"
    annotations: {}
  podSecurityContext: {}
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

external: true
minimumVersion: "8.5.0"
egress:
  enabled: true
  # NetworkPolicy cannot select a DNS name. Supply the routed external TiDB
  # CIDRs for production; empty is rejected when the policy is enabled.
  cidrs: []
