{{- if .Values.enabled }}
{{- $tidbAccount := required "global.shared.tidb.accounts.keycloak is required when schemaMigrator.enabled=true" (dig "shared" "tidb" "accounts" "keycloak" nil .Values.global) -}}
{{- if .Values.keycloak.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "ssl-proxy.schemaMigrator.componentName" (dict "root" . "component" "keycloak-data") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ssl-proxy.schemaMigrator.labels" . | nindent 4 }}
    app.kubernetes.io/component: schema-migrator-keycloak
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.keycloak.persistence.size }}
  {{- with .Values.keycloak.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ssl-proxy.schemaMigrator.componentName" (dict "root" . "component" "keycloak") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ssl-proxy.schemaMigrator.labels" . | nindent 4 }}
    app.kubernetes.io/component: schema-migrator-keycloak
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "ssl-proxy.schemaMigrator.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: schema-migrator-keycloak
  template:
    metadata:
      labels:
        {{- include "ssl-proxy.schemaMigrator.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: schema-migrator-keycloak
        ssl-proxy.io/tidb-client: "true"
      annotations:
        ssl-proxy.io/rollout-revision: {{ .Values.global.rolloutRevision | quote }}
        checksum/realm: {{ include (print $.Template.BasePath "/configmaps.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "ssl-proxy.schemaMigrator.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: pem-to-pkcs12
          image: alpine/openssl:3
          command: ["/bin/sh", "-ec"]
          args:
            - |
              openssl pkcs12 -export \
                -in /etc/tidb-tls/ca.crt \
                -out /run/tidb-tls/truststore.p12 \
                -name tidb-ca \
                -nokeys \
                -passout pass:changeit
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          volumeMounts:
            - name: tidb-tls
              mountPath: /etc/tidb-tls
              readOnly: true
            - name: tidb-truststore
              mountPath: /run/tidb-tls
        - name: prepare-keycloak-home
          image: {{ include "ssl-proxy.schemaMigrator.image" (dict "root" . "image" .Values.keycloak.image) }}
          imagePullPolicy: {{ .Values.keycloak.image.pullPolicy }}
          command: ["/bin/sh", "-ec"]
          args:
            - cp -R /opt/keycloak/. /keycloak-home/
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          volumeMounts:
            - name: keycloak-home
              mountPath: /keycloak-home
      containers:
        - name: keycloak
          image: {{ include "ssl-proxy.schemaMigrator.image" (dict "root" . "image" .Values.keycloak.image) }}
          imagePullPolicy: {{ .Values.keycloak.image.pullPolicy }}
          args:
            - start
            - --import-realm
            - --hostname={{ include "ssl-proxy.schemaMigrator.keycloakOrigin" . }}
            - --hostname-strict=true
            {{- with .Values.keycloak.adminHostname }}
            - --hostname-admin={{ . }}
            {{- end }}
            - --http-enabled=true
          env:
            - name: KC_DB
              value: mysql
            - name: KC_DB_URL_HOST
              value: {{ .Values.global.shared.tidb.host | quote }}
            - name: KC_DB_URL_PORT
              value: {{ .Values.global.shared.tidb.port | quote }}
            - name: KC_DB_URL_DATABASE
              value: {{ .Values.keycloak.database | quote }}
            - name: KC_DB_URL_PROPERTIES
              value: "?sslMode=VERIFY_IDENTITY&trustCertificateKeyStoreUrl=file:///run/tidb-tls/truststore.p12&trustCertificateKeyStoreType=PKCS12&trustCertificateKeyStorePassword=changeit&fallbackToSystemTrustStore=false"
            - name: KC_DB_USERNAME
              value: {{ $tidbAccount.user | quote }}
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $tidbAccount.passwordSecret.name }}
                  key: {{ $tidbAccount.passwordSecret.key }}
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: {{ .Values.keycloak.bootstrapAdminUsername | quote }}
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.keycloak.credentialsSecret.name }}
                  key: {{ .Values.keycloak.credentialsSecret.bootstrapAdminPasswordKey }}
            - name: KC_PROXY_HEADERS
              value: xforwarded
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_HEALTH_ENABLED
              value: "true"
          ports:
            - name: http
              containerPort: 8080
              {{- with .Values.keycloak.service.hostPort }}
              hostPort: {{ . }}
              {{- end }}
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: {{ printf "/realms/%s/.well-known/openid-configuration" .Values.keycloak.realm }}
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            {{- toYaml .Values.keycloak.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          volumeMounts:
            - name: keycloak-home
              mountPath: /opt/keycloak
            - name: keycloak-data
              mountPath: /opt/keycloak/data
            - name: realm
              mountPath: /opt/keycloak/data/import/realm.json
              subPath: realm.json
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: tidb-tls
              mountPath: /etc/tidb-tls
              readOnly: true
            - name: tidb-truststore
              mountPath: /run/tidb-tls
              readOnly: true
      volumes:
        - name: keycloak-home
          emptyDir: {}
        - name: keycloak-data
          {{- if .Values.keycloak.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "ssl-proxy.schemaMigrator.componentName" (dict "root" . "component" "keycloak-data") }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: realm
          configMap:
            name: {{ include "ssl-proxy.schemaMigrator.componentName" (dict "root" . "component" "keycloak-realm") }}
        - name: tmp
          emptyDir: {}
        - name: tidb-tls
          secret:
            secretName: {{ .Values.global.shared.tidb.tls.caSecret.name }}
            items:
              - key: {{ .Values.global.shared.tidb.tls.caSecret.key }}
                path: ca.crt
        - name: tidb-truststore
          emptyDir:
            sizeLimit: 1Mi
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ssl-proxy.schemaMigrator.componentName" (dict "root" . "component" "keycloak") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ssl-proxy.schemaMigrator.labels" . | nindent 4 }}
    app.kubernetes.io/component: schema-migrator-keycloak
spec:
  type: ClusterIP
  selector:
    {{- include "ssl-proxy.schemaMigrator.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: schema-migrator-keycloak
  ports:
    - name: http
      port: {{ .Values.keycloak.service.port }}
      targetPort: http
{{- end }}
