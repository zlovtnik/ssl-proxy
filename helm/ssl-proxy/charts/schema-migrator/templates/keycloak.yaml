{{- if .Values.enabled }}
{{- if .Values.keycloak.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "ssl-proxy.schemaMigrator.componentName" (dict "root" . "component" "keycloak-data") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ssl-proxy.schemaMigrator.labels" . | nindent 4 }}
    app.kubernetes.io/component: schema-migrator-keycloak
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.keycloak.persistence.size }}
  {{- with .Values.keycloak.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ssl-proxy.schemaMigrator.componentName" (dict "root" . "component" "keycloak") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ssl-proxy.schemaMigrator.labels" . | nindent 4 }}
    app.kubernetes.io/component: schema-migrator-keycloak
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "ssl-proxy.schemaMigrator.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: schema-migrator-keycloak
  template:
    metadata:
      labels:
        {{- include "ssl-proxy.schemaMigrator.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: schema-migrator-keycloak
      annotations:
        ssl-proxy.io/rollout-revision: {{ .Values.global.rolloutRevision | quote }}
        checksum/realm: {{ include (print $.Template.BasePath "/configmaps.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "ssl-proxy.schemaMigrator.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: prepare-keycloak-home
          image: {{ include "ssl-proxy.schemaMigrator.image" (dict "root" . "image" .Values.keycloak.image) }}
          imagePullPolicy: {{ .Values.keycloak.image.pullPolicy }}
          command: ["/bin/sh", "-ec"]
          args:
            - cp -R /opt/keycloak/. /keycloak-home/
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          volumeMounts:
            - name: keycloak-home
              mountPath: /keycloak-home
        - name: reconcile-database
          image: {{ include "ssl-proxy.schemaMigrator.image" (dict "root" . "image" .Values.bootstrapImages.mysql) }}
          imagePullPolicy: {{ .Values.bootstrapImages.mysql.pullPolicy }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              until mysqladmin ping --host="$DB_HOST" --port="$DB_PORT" --user="$DB_USER" --password="$DB_PASSWORD" --silent; do
                sleep 2
              done
              mysql --host="$DB_HOST" --port="$DB_PORT" --user="$DB_USER" --password="$DB_PASSWORD" \
                --execute="CREATE DATABASE IF NOT EXISTS \`$KEYCLOAK_DB_NAME\` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci"
          env:
            - name: DB_HOST
              value: {{ .Values.global.shared.tidb.host | quote }}
            - name: DB_PORT
              value: {{ .Values.global.shared.tidb.port | quote }}
            - name: DB_USER
              value: {{ .Values.global.shared.tidb.user | quote }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.shared.tidb.passwordSecret.name }}
                  key: {{ .Values.global.shared.tidb.passwordSecret.key }}
            - name: KEYCLOAK_DB_NAME
              value: {{ .Values.keycloak.database | quote }}
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
      containers:
        - name: keycloak
          image: {{ include "ssl-proxy.schemaMigrator.image" (dict "root" . "image" .Values.keycloak.image) }}
          imagePullPolicy: {{ .Values.keycloak.image.pullPolicy }}
          args:
            - start
            - --import-realm
            - --hostname={{ include "ssl-proxy.schemaMigrator.keycloakOrigin" . }}
            - --hostname-strict=true
            {{- with .Values.keycloak.adminHostname }}
            - --hostname-admin={{ . }}
            {{- end }}
            - --http-enabled=true
          env:
            - name: KC_DB
              value: mysql
            - name: KC_DB_URL_HOST
              value: {{ .Values.global.shared.tidb.host | quote }}
            - name: KC_DB_URL_PORT
              value: {{ .Values.global.shared.tidb.port | quote }}
            - name: KC_DB_URL_DATABASE
              value: {{ .Values.keycloak.database | quote }}
            - name: KC_DB_USERNAME
              value: {{ .Values.global.shared.tidb.user | quote }}
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.shared.tidb.passwordSecret.name }}
                  key: {{ .Values.global.shared.tidb.passwordSecret.key }}
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: {{ .Values.keycloak.bootstrapAdminUsername | quote }}
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.keycloak.credentialsSecret.name }}
                  key: {{ .Values.keycloak.credentialsSecret.bootstrapAdminPasswordKey }}
            - name: KC_PROXY_HEADERS
              value: xforwarded
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_HEALTH_ENABLED
              value: "true"
          ports:
            - name: http
              containerPort: 8080
              {{- with .Values.keycloak.service.hostPort }}
              hostPort: {{ . }}
              {{- end }}
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: {{ printf "/realms/%s/.well-known/openid-configuration" .Values.keycloak.realm }}
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            {{- toYaml .Values.keycloak.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          volumeMounts:
            - name: keycloak-home
              mountPath: /opt/keycloak
            - name: keycloak-data
              mountPath: /opt/keycloak/data
            - name: realm
              mountPath: /opt/keycloak/data/import/realm.json
              subPath: realm.json
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: keycloak-home
          emptyDir: {}
        - name: keycloak-data
          {{- if .Values.keycloak.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "ssl-proxy.schemaMigrator.componentName" (dict "root" . "component" "keycloak-data") }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: realm
          configMap:
            name: {{ include "ssl-proxy.schemaMigrator.componentName" (dict "root" . "component" "keycloak-realm") }}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ssl-proxy.schemaMigrator.componentName" (dict "root" . "component" "keycloak") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ssl-proxy.schemaMigrator.labels" . | nindent 4 }}
    app.kubernetes.io/component: schema-migrator-keycloak
spec:
  type: ClusterIP
  selector:
    {{- include "ssl-proxy.schemaMigrator.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: schema-migrator-keycloak
  ports:
    - name: http
      port: {{ .Values.keycloak.service.port }}
      targetPort: http
{{- end }}
