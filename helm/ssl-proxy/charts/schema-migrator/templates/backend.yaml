{{- if .Values.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ssl-proxy.schemaMigrator.componentName" (dict "root" . "component" "backend") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ssl-proxy.schemaMigrator.labels" . | nindent 4 }}
    app.kubernetes.io/component: schema-migrator-backend
spec:
  replicas: {{ .Values.backend.replicas }}
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "ssl-proxy.schemaMigrator.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: schema-migrator-backend
  template:
    metadata:
      labels:
        {{- include "ssl-proxy.schemaMigrator.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: schema-migrator-backend
      annotations:
        ssl-proxy.io/rollout-revision: {{ .Values.global.rolloutRevision | quote }}
    spec:
      serviceAccountName: {{ include "ssl-proxy.schemaMigrator.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: state-store-bootstrap
          image: {{ include "ssl-proxy.schemaMigrator.image" (dict "root" . "image" .Values.stateStore.bootstrapImage) }}
          imagePullPolicy: {{ .Values.stateStore.bootstrapImage.pullPolicy }}
          env:
            - name: PGHOST
              value: {{ .Values.global.shared.postgres.host | quote }}
            - name: PGPORT
              value: {{ .Values.global.shared.postgres.port | quote }}
            - name: PGDATABASE
              value: {{ .Values.global.shared.postgres.database | quote }}
            - name: PGUSER
              value: {{ .Values.global.shared.postgres.user | quote }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.shared.postgres.passwordSecret.name }}
                  key: {{ .Values.global.shared.postgres.passwordSecret.key }}
            - name: STATE_USER
              value: {{ .Values.stateStore.user | quote }}
            - name: STATE_SCHEMA
              value: {{ .Values.stateStore.schema | quote }}
            - name: STATE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.stateStore.credentialsSecret.name }}
                  key: {{ .Values.stateStore.credentialsSecret.passwordKey }}
          command: ["sh", "-ec"]
          args:
            - |
              until pg_isready; do sleep 2; done
              psql -v ON_ERROR_STOP=1 -v state_user="$STATE_USER" -v state_schema="$STATE_SCHEMA" -v state_password="$STATE_PASSWORD" <<'SQL'
              SELECT format('CREATE ROLE %I LOGIN PASSWORD %L', :'state_user', :'state_password')
              WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = :'state_user') \gexec
              ALTER ROLE :"state_user" PASSWORD :'state_password';
              CREATE SCHEMA IF NOT EXISTS :"state_schema" AUTHORIZATION :"state_user";
              ALTER SCHEMA :"state_schema" OWNER TO :"state_user";
              GRANT CONNECT ON DATABASE :"DBNAME" TO :"state_user";
              SQL
      containers:
        - name: backend
          image: {{ include "ssl-proxy.schemaMigrator.image" (dict "root" . "image" .Values.backend.image) }}
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          env:
            - name: JAVA_TOOL_OPTIONS
              value: -Djava.io.tmpdir=/tmp
            - name: BEDROCK_HTTP_HOST
              value: 0.0.0.0
            - name: BEDROCK_HTTP_PORT
              value: {{ .Values.backend.service.port | quote }}
            - name: BEDROCK_CORS_ORIGINS
              value: {{ include "ssl-proxy.schemaMigrator.publicOrigin" . | quote }}
            - name: BEDROCK_ENCRYPT_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.credentialsSecret.name }}
                  key: {{ .Values.backend.credentialsSecret.encryptKey }}
            - name: BEDROCK_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.credentialsSecret.name }}
                  key: {{ .Values.backend.credentialsSecret.jwtSecret }}
            - name: BEDROCK_API_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.credentialsSecret.name }}
                  key: {{ .Values.backend.credentialsSecret.apiBearerToken }}
            - name: BEDROCK_DEV_AUTH_ENABLED
              value: "false"
            - name: BEDROCK_KEYCLOAK_ENABLED
              value: "true"
            - name: BEDROCK_KEYCLOAK_ISSUER
              value: {{ printf "%s/realms/%s" (include "ssl-proxy.schemaMigrator.keycloakOrigin" .) .Values.keycloak.realm | quote }}
            - name: BEDROCK_KEYCLOAK_JWKS_URI
              value: {{ printf "http://%s:8080/realms/%s/protocol/openid-connect/certs" (include "ssl-proxy.schemaMigrator.componentName" (dict "root" . "component" "keycloak")) .Values.keycloak.realm | quote }}
            - name: BEDROCK_KEYCLOAK_CLIENT_ID
              value: {{ .Values.keycloak.clientId | quote }}
            - name: BEDROCK_KEYCLOAK_AUDIENCE
              value: {{ .Values.keycloak.clientId | quote }}
            - name: BEDROCK_STATE_DB_USER
              value: {{ .Values.stateStore.user | quote }}
            - name: BEDROCK_STATE_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.stateStore.credentialsSecret.name }}
                  key: {{ .Values.stateStore.credentialsSecret.passwordKey }}
            - name: BEDROCK_STATE_DB_URL
              value: {{ printf "jdbc:postgresql://%s:%v/%s" .Values.global.shared.postgres.host .Values.global.shared.postgres.port .Values.global.shared.postgres.database | quote }}
            - name: BEDROCK_STATE_DB_SCHEMA
              value: {{ .Values.stateStore.schema | quote }}
            - name: BEDROCK_STATE_DB_POOL_SIZE
              value: {{ .Values.stateStore.poolSize | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.shared.postgres.passwordSecret.name }}
                  key: {{ .Values.global.shared.postgres.passwordSecret.key }}
            - name: BEDROCK_DB_USER
              value: {{ .Values.global.shared.postgres.user | quote }}
            - name: BEDROCK_DB_PASSWORD
              value: $(POSTGRES_PASSWORD)
            - name: BEDROCK_DB_URL
              value: {{ printf "postgres://%s:$(POSTGRES_PASSWORD)@%s:%v/%s" .Values.global.shared.postgres.user .Values.global.shared.postgres.host .Values.global.shared.postgres.port .Values.global.shared.postgres.database | quote }}
            - name: DATABASE_URL
              value: {{ printf "postgres://%s:$(POSTGRES_PASSWORD)@%s:%v/%s" .Values.global.shared.postgres.user .Values.global.shared.postgres.host .Values.global.shared.postgres.port .Values.global.shared.postgres.database | quote }}
            - name: BEDROCK_DB_TEST_ALLOWED_HOSTS
              value: {{ concat (list .Values.global.shared.postgres.host) .Values.backend.dbTestAllowedHosts | uniq | join "," | quote }}
            - name: BEDROCK_PATCH_STAGE_DIR
              value: /tmp/schema-migrator-patches
            - name: BEDROCK_REPO_CACHE_DIR
              value: /tmp/schema-migrator-repos
          ports:
            - name: http
              containerPort: {{ .Values.backend.service.port }}
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ssl-proxy.schemaMigrator.componentName" (dict "root" . "component" "backend") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ssl-proxy.schemaMigrator.labels" . | nindent 4 }}
    app.kubernetes.io/component: schema-migrator-backend
spec:
  type: ClusterIP
  selector:
    {{- include "ssl-proxy.schemaMigrator.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: schema-migrator-backend
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: http
{{- end }}
