{{- if .Values.enabled -}}
{{- $hostname := required "schemaMigrator.publicHostname is required when schemaMigrator.enabled=true" .Values.publicHostname -}}
{{- $email := required "schemaMigrator.traefik.acme.email is required when schemaMigrator.enabled=true" .Values.traefik.acme.email -}}
{{- if contains "://" $hostname -}}
{{- fail "schemaMigrator.publicHostname must be a hostname without a URL scheme" -}}
{{- end -}}
{{- if not (contains "@" $email) -}}
{{- fail "schemaMigrator.traefik.acme.email must be a valid email address" -}}
{{- end -}}
{{- end -}}
