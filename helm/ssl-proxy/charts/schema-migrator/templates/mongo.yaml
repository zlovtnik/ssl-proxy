{{- if .Values.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "ssl-proxy.schemaMigrator.componentName" (dict "root" . "component" "mongo") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ssl-proxy.schemaMigrator.labels" . | nindent 4 }}
    app.kubernetes.io/component: schema-migrator-mongo
spec:
  serviceName: {{ include "ssl-proxy.schemaMigrator.componentName" (dict "root" . "component" "mongo") }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "ssl-proxy.schemaMigrator.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: schema-migrator-mongo
  template:
    metadata:
      labels:
        {{- include "ssl-proxy.schemaMigrator.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: schema-migrator-mongo
      annotations:
        ssl-proxy.io/rollout-revision: {{ .Values.global.rolloutRevision | quote }}
    spec:
      serviceAccountName: {{ include "ssl-proxy.schemaMigrator.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: prepare-data
          image: {{ include "ssl-proxy.schemaMigrator.image" (dict "root" . "image" .Values.bootstrapImages.busybox) }}
          imagePullPolicy: {{ .Values.bootstrapImages.busybox.pullPolicy }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              mkdir -p {{ .Values.mongo.persistence.mountPath | quote }}
              chown 999:999 {{ .Values.mongo.persistence.mountPath | quote }}
              if ! chmod 0700 {{ .Values.mongo.persistence.mountPath | quote }}; then
                echo "warning: filesystem does not support chmod; continuing with uid 999 ownership" >&2
              fi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "DAC_OVERRIDE"]
            readOnlyRootFilesystem: true
            runAsUser: 0
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: mongo-data
              mountPath: {{ .Values.mongo.persistence.mountPath | quote }}
      containers:
        - name: mongo
          image: {{ include "ssl-proxy.schemaMigrator.image" (dict "root" . "image" .Values.mongo.image) }}
          imagePullPolicy: {{ .Values.mongo.image.pullPolicy }}
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              value: {{ .Values.mongo.username | quote }}
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mongo.credentialsSecret.name }}
                  key: {{ .Values.mongo.credentialsSecret.passwordKey }}
            - name: MONGO_INITDB_DATABASE
              value: {{ .Values.mongo.database | quote }}
          ports:
            - name: mongo
              containerPort: 27017
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - >-
                  exec mongosh --quiet
                  --username "$MONGO_INITDB_ROOT_USERNAME"
                  --password "$MONGO_INITDB_ROOT_PASSWORD"
                  --authenticationDatabase admin
                  --eval "quit(db.adminCommand('ping').ok ? 0 : 1)"
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - >-
                  exec mongosh --quiet
                  --username "$MONGO_INITDB_ROOT_USERNAME"
                  --password "$MONGO_INITDB_ROOT_PASSWORD"
                  --authenticationDatabase admin
                  --eval "quit(db.adminCommand('ping').ok ? 0 : 1)"
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - >-
                  exec mongosh --quiet
                  --username "$MONGO_INITDB_ROOT_USERNAME"
                  --password "$MONGO_INITDB_ROOT_PASSWORD"
                  --authenticationDatabase admin
                  --eval "quit(db.adminCommand('ping').ok ? 0 : 1)"
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            {{- toYaml .Values.mongo.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
          volumeMounts:
            - name: mongo-data
              mountPath: {{ .Values.mongo.persistence.mountPath | quote }}
            - name: mongo-config
              mountPath: /data/configdb
            - name: mongo-tmp
              mountPath: /tmp
      volumes:
        - name: mongo-data
          {{- if .Values.mongo.persistence.enabled }}
          hostPath:
            path: {{ .Values.mongo.persistence.hostPath | quote }}
            type: DirectoryOrCreate
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: mongo-config
          emptyDir: {}
        - name: mongo-tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ssl-proxy.schemaMigrator.componentName" (dict "root" . "component" "mongo") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ssl-proxy.schemaMigrator.labels" . | nindent 4 }}
    app.kubernetes.io/component: schema-migrator-mongo
spec:
  type: ClusterIP
  selector:
    {{- include "ssl-proxy.schemaMigrator.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: schema-migrator-mongo
  ports:
    - name: mongo
      port: 27017
      targetPort: mongo
{{- end }}
