{{- if and .Values.enabled .Values.ui.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ssl-proxy-common.fullname" (dict "root" . "component" "atherosSearch") }}-atheros-search-ui-nginx
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ssl-proxy-common.labels" (dict "root" . "component" "atherosSearch") | nindent 4 }}
    app.kubernetes.io/component: atheros-search-ui
data:
  default.conf: |
    server {
      listen 8080;
      root /usr/share/nginx/html;
      index index.html;

      location /v1/ {
        proxy_pass http://{{ include "ssl-proxy-common.fullname" (dict "root" . "component" "atherosSearch") }}-atheros-search:{{ .Values.service.httpPort }};
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
      }

      location = /healthz {
        proxy_pass http://{{ include "ssl-proxy-common.fullname" (dict "root" . "component" "atherosSearch") }}-atheros-search:{{ .Values.service.httpPort }}/healthz;
      }

      location = /readyz {
        proxy_pass http://{{ include "ssl-proxy-common.fullname" (dict "root" . "component" "atherosSearch") }}-atheros-search:{{ .Values.service.httpPort }}/readyz;
      }

      location / {
        try_files $uri $uri/ /index.html;
      }

      add_header X-Frame-Options DENY always;
      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy strict-origin-when-cross-origin always;
      add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }
{{- end }}
