# Values local to the atheros-search subchart. The Go service owns both search
# APIs and the embedding worker that replaced the retired standalone vec-worker.
global:
  nameOverride: ""
  fullnameOverride: ""
  image:
    registry: ""
    pullPolicy: IfNotPresent
  rolloutRevision: ""
  labels: {}
  serviceAccount:
    create: true
    name: "ssl-proxy"
  podSecurityContext:
    fsGroup: 65532
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  shared:
    redpanda:
      bootstrapServers: "redpanda-0.redpanda.redpanda.svc.cluster.local:9092"
    postgres:
      host: "postgres-primary.postgres.svc.cluster.local"
      port: 5432
      database: "sync"
      user: "sync"
      passwordSecret:
        name: "postgres-credentials"
        key: "password"

enabled: false
replicas: 1
image:
  repository: atheros-search
  tag: latest
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  httpPort: 8080
  grpcPort: 50051
  metricsPort: 9090
embeddingBackend: ""
# Leave the API backend empty to permit sparse/inventory operation when the
# external embedding server is temporarily unavailable.
apiEmbeddingBackend: ""
embeddingModel: "nomic-embed-text-v2-moe"
embeddingDimensions: 768
eventEmbeddingScope: "high_signal"
logLevel: "info"
corsAllowedOrigins: ""
schemaReadyRequired: true
apiTokenSecret:
  name: atheros-credentials
  key: api-token-sha256
apiTokenEnabled: true
otlpEndpoint: "http://ssl-proxy-otel-collector:4317"
worker:
  # Enable only with a real embeddingBackend; the single-node profile does so.
  enabled: false
  name: "atheros-search-worker"
  batchSize: 256
  requestBatchSize: 256
  requestBatchMax: 512
  leaseSeconds: 600
  pollIntervalMs: 500
  maxDrainBatches: 0
  maxInputTokens: 512
  maxConcurrentEmbed: 4
  maxConcurrentComplete: 8
  alertsEnabled: true
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi
ingestEnabled: false
resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

ui:
  enabled: true
  replicas: 1
  image:
    repository: atheros-search-ui
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
    targetPort: 8080
    hostPort: null
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
