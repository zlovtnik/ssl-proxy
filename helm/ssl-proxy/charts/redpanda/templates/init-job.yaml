{{- if not .Values.external }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "ssl-proxy-common.fullname" (dict "root" . "component" "redpanda") }}-redpanda-init
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ssl-proxy-common.labels" (dict "root" . "component" "redpanda") | nindent 4 }}
    app.kubernetes.io/component: redpanda-init
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  activeDeadlineSeconds: {{ .Values.initJob.activeDeadlineSeconds }}
  backoffLimit: {{ .Values.initJob.backoffLimit }}
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        {{- include "ssl-proxy-common.selectorLabels" (dict "root" . "component" "redpanda") | nindent 8 }}
        app.kubernetes.io/component: redpanda-init
    spec:
      serviceAccountName: {{ include "ssl-proxy-common.serviceAccountName" (dict "root" . "component" "redpanda") }}
      automountServiceAccountToken: false
      restartPolicy: Never
      containers:
        - name: redpanda-init
          image: {{ include "ssl-proxy-common.image" (dict "root" . "image" .Values.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              brokers={{ include "ssl-proxy-common.fullname" (dict "root" . "component" "redpanda") }}-redpanda:9092
              until rpk cluster info --brokers "$brokers" >/dev/null 2>&1; do sleep 2; done
              while IFS='|' read -r topic partitions replicas retention_ms retention_bytes || [ -n "$topic$partitions$replicas$retention_ms$retention_bytes" ]; do
                case "$topic" in ''|'#'*) continue ;; esac
                attempts=0
                while :; do
                  description="$(rpk topic describe "$topic" --brokers "$brokers" --print-summary 2>/dev/null || true)"
                  current="$(printf '%s\n' "$description" | awk '
                    $1 == "PARTITIONS" { print $2; exit }
                    $1 == "NAME" && $2 == "PARTITIONS" { getline; print $2; exit }
                  ')"
                  case "$current" in
                    ''|*[!0-9]*|0)
                      rpk topic create "$topic" --brokers "$brokers" --partitions "$partitions" --replicas "$replicas" || true
                      attempts="$((attempts + 1))"
                      if [ "$attempts" -ge 30 ]; then
                        echo "timed out creating topic $topic" >&2
                        exit 1
                      fi
                      sleep 2
                      ;;
                    *) break ;;
                  esac
                done
                case "$current" in ''|*[!0-9]*) echo "unable to read partition count for $topic" >&2; exit 1 ;; esac
                if [ "$current" -lt "$partitions" ]; then
                  rpk topic add-partitions "$topic" --brokers "$brokers" --num "$((partitions - current))"
                elif [ "$current" -gt "$partitions" ]; then
                  echo "topic $topic has $current partitions, above desired $partitions" >&2
                  exit 1
                fi
                rpk topic alter-config "$topic" --brokers "$brokers" --set "retention.ms=$retention_ms" --set "retention.bytes=$retention_bytes" >/dev/null
              done < /config/topics.manifest
          volumeMounts:
            - name: topics-manifest
              mountPath: /config
              readOnly: true
          resources:
            {{- toYaml .Values.initJob.resources | nindent 12 }}
      volumes:
        - name: topics-manifest
          configMap:
            name: {{ include "ssl-proxy-common.fullname" (dict "root" . "component" "redpanda") }}-topics-manifest
{{- end }}
