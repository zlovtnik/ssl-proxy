{{- if not .Values.external }}
{{- if ne (int .Values.replicas) 1 }}
{{- fail "redpanda.replicas must be 1; this chart's service and storage layout is single-node only" }}
{{- end }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "ssl-proxy-common.fullname" (dict "root" . "component" "redpanda") }}-redpanda
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ssl-proxy-common.labels" (dict "root" . "component" "redpanda") | nindent 4 }}
    app.kubernetes.io/component: redpanda
spec:
  serviceName: {{ include "ssl-proxy-common.fullname" (dict "root" . "component" "redpanda") }}-redpanda
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "ssl-proxy-common.selectorLabels" (dict "root" . "component" "redpanda") | nindent 6 }}
      app.kubernetes.io/component: redpanda
  template:
    metadata:
      labels:
        {{- include "ssl-proxy-common.selectorLabels" (dict "root" . "component" "redpanda") | nindent 8 }}
        app.kubernetes.io/component: redpanda
    spec:
      serviceAccountName: {{ include "ssl-proxy-common.serviceAccountName" (dict "root" . "component" "redpanda") }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      containers:
        - name: redpanda
          image: {{ include "ssl-proxy-common.image" (dict "root" . "image" .Values.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - redpanda
            - start
            - --overprovisioned
            - --smp
            - "1"
            - --memory
            - 1G
            - --reserve-memory
            - 0M
            - --node-id
            - "0"
            - --kafka-addr
            - INTERNAL://0.0.0.0:9092
            - --advertise-kafka-addr
            - INTERNAL://{{ include "ssl-proxy-common.fullname" (dict "root" . "component" "redpanda") }}-redpanda:9092
          ports:
            - name: kafka
              containerPort: 9092
            - name: admin
              containerPort: {{ .Values.adminPort }}
          readinessProbe:
            exec:
              command: ["rpk", "cluster", "info", "--brokers", "127.0.0.1:9092"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /v1/status/ready
              port: admin
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: redpanda-data
              mountPath: /var/lib/redpanda/data
      volumes:
        - name: redpanda-data
          {{- if .Values.persistence.hostPath }}
          hostPath:
            path: {{ .Values.persistence.hostPath | quote }}
            type: Directory
          {{- else if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "ssl-proxy-common.fullname" (dict "root" . "component" "redpanda") }}-redpanda-data
          {{- else }}
          emptyDir: {}
          {{- end }}
{{- end }}
