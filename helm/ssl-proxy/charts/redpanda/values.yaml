# Values local to the redpanda subchart.
global:
  nameOverride: ""
  fullnameOverride: ""
  image:
    registry: ""
    pullPolicy: IfNotPresent
  rolloutRevision: ""
  labels: {}
  annotations: {}
  serviceAccount:
    create: true
    name: "ssl-proxy"
    annotations: {}
  podSecurityContext: {}
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: []

# -- Set to true if Redpanda is managed externally (not deployed by this chart)
external: true
# -- Bootstrap servers (if external, provide comma-separated list)
bootstrapServers: "redpanda-0.redpanda.redpanda.svc.cluster.local:9092"
# -- Admin API port for metrics and rpk operations
adminPort: 9644
image:
  repository: redpandadata/redpanda
  tag: latest
  pullPolicy: IfNotPresent
replicas: 1
topicReplicationFactor: 3
persistence:
  enabled: true
  hostPath: ""
  size: 20Gi
  storageClassName: ""
resources:
  limits:
    cpu: "2"
    memory: 2Gi
  requests:
    cpu: 500m
    memory: 1Gi

# Postgres connection settings
