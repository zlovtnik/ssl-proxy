global:
  rolloutRevision: ""
  serviceAccount: {name: ssl-proxy}
enabled: false
image: {repository: tidb-runtime-schema, tag: "1.0.0", pullPolicy: IfNotPresent}
ownerSecret: {name: tidb-schema-owner, dsnKey: dsn}
applyPostTiFlash: false
backoffLimit: 1
activeDeadlineSeconds: 1800
resources:
  requests: {cpu: 100m, memory: 128Mi}
  limits: {cpu: "1", memory: 512Mi}
