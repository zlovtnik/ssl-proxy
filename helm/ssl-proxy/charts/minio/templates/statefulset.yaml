{{- if not .Values.external }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "ssl-proxy.minio.fullname" . }}-minio
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ssl-proxy.minio.labels" . | nindent 4 }}
    app.kubernetes.io/component: minio
spec:
  serviceName: {{ include "ssl-proxy.minio.fullname" . }}-minio
  replicas: 1
  selector:
    matchLabels:
      {{- include "ssl-proxy.minio.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: minio
  template:
    metadata:
      labels:
        {{- include "ssl-proxy.minio.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: minio
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      containers:
        - name: minio
          image: {{ include "ssl-proxy.minio.image" (dict "root" . "image" .Values.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["server", "/data", "--console-address", ":9001"]
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.accessKeySecret.name }}
                  key: {{ .Values.accessKeySecret.key }}
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretKeySecret.name }}
                  key: {{ .Values.secretKeySecret.key }}
            - name: MINIO_PROMETHEUS_AUTH_TYPE
              value: public
          ports:
            - name: api
              containerPort: 9000
            - name: console
              containerPort: 9001
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: api
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: api
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: minio-data
              mountPath: /data
      volumes:
        - name: minio-data
          {{- if .Values.persistence.hostPath }}
          hostPath:
            path: {{ .Values.persistence.hostPath | quote }}
            type: Directory
          {{- else if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "ssl-proxy.minio.fullname" . }}-minio-data
          {{- else }}
          emptyDir: {}
          {{- end }}
{{- end }}
