# Single-node Kubernetes deployment for the ssl-proxy server.
# Secrets are created out-of-band from the existing protected server files.

global:
  image:
    # Set dynamically by `ops up-ready`.
    registry: ""
  shared:
    keycloak:
      # In-cluster Keycloak deployed by the schema-migrator subchart. The
      # issuer is set dynamically by `ops up-ready` from SERVER_IP because the
      # backend validates `iss` against Keycloak's browser-facing origin. JWKS
      # is fetched through the in-cluster Service. The client id matches the
      # realm's UI client (schemaMigrator.keycloak.clientId=bedrock-ui); the
      # backend accepts an `azp` match.
      jwksUri: "http://ssl-proxy-schema-migrator-keycloak:8080/realms/middleware/protocol/openid-connect/certs"
      schemaMigratorClientId: "bedrock-ui"
    redpanda:
      bootstrapServers: "ssl-proxy-redpanda:9092"
      topicReplicationFactor: 1
    tidb:
      host: "ssl-proxy-tidb.default.svc.cluster.local"
      port: 4000
      minimumVersion: "8.5.0"
      tls:
        serverName: "ssl-proxy-tidb.default.svc.cluster.local"
        caSecret:
          name: "tidb-client-ca"
          key: "ca.crt"
      accounts:
        octopus:
          database: "octopus_core"
          user: "octopus_runtime"
          passwordSecret:
            name: "tidb-octopus"
            key: "password"
        atherosSearch:
          database: "atheros_search"
          user: "atheros_search_runtime"
          passwordSecret:
            name: "tidb-atheros-search"
            key: "dsn"
        schemaMigrator:
          database: "schema_migrator"
          user: "schema_migrator_runtime"
          passwordSecret:
            name: "tidb-schema-migrator"
            key: "password"
        # Chart-local account for the in-cluster Keycloak (schema-migrator
        # subchart). Provisioned by the tidb init job hook.
        keycloak:
          database: "keycloak"
          user: "keycloak"
          passwordSecret:
            name: "tidb-keycloak"
            key: "password"
    minio:
      endpoint: "http://ssl-proxy-minio:9000"
    atherosSensor:

redpanda:
  external: false
  bootstrapServers: "ssl-proxy-redpanda:9092"
  topicReplicationFactor: 1
  persistence:
    hostPath: "/var/lib/docker/volumes/ssl-proxy_redpanda-data/_data"

minio:
  external: false
  endpoint: "http://ssl-proxy-minio:9000"
  persistence:
    hostPath: "/var/lib/docker/volumes/ssl-proxy_minio-data/_data"

proxy:
  image:
    repository: "ssl-proxy"
    tag: latest
    pullPolicy: Always
  service:
    type: ClusterIP
  hostPorts:
    enabled: true
  wireguard:
    obfuscationMaxDatagramBytes: 1500
  healthcheck:
    livenessProbe:
      httpGet: null
      exec:
        command: ["curl", "-fsS", "http://127.0.0.1:3002/health"]
      initialDelaySeconds: 40
      periodSeconds: 30
      timeoutSeconds: 10
      failureThreshold: 3
    readinessProbe:
      httpGet: null
      exec:
        command: ["curl", "-fsS", "http://127.0.0.1:3002/ready"]
      initialDelaySeconds: 20
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3

javaCoordinator:
  image:
    repository: "java-coordinator"
    tag: latest
    pullPolicy: Always
  runtime:
    environment: "development"
  cutover:
    devBypass: true
  resources:
    limits:
      cpu: "2"
      memory: 3Gi
    requests:
      cpu: 500m
      memory: 1Gi
  tidb:
    host: "ssl-proxy-tidb.default.svc.cluster.local"
    poolSize: 20

tidb:
  external: false
  image:
    tag: v8.5.7
    pullPolicy: Always
  resources:
    requests:
      cpu: 500m
      memory: 8Gi
    limits:
      cpu: "2"
      memory: 8Gi
  memoryTuning:
    statsCacheQuotaBytes: 536870912
    schemaCacheSizeBytes: 268435456
    coprocessorCacheCapacityMB: 128
  persistence:
    enabled: true
    size: 10Gi
  service:
    hostPort: 4000
  initJob:
    image:
      tag: latest
      pullPolicy: Always
  egress:
    enabled: false
    cidrs: []
vecWorker:
  enabled: false
tidbSchemaExecutor:
  enabled: true
  image:
    repository: tidb-runtime-schema
    tag: latest
    pullPolicy: Always
schemaMigrator:
  enabled: true
  # Set dynamically by `ops up-ready` from SCHEMA_MIGRATOR_PUBLIC_HOSTNAME.
  publicHostname: ""
  stateStore:
    host: "192.168.1.221"
  backend:
    image:
      repository: schema-migrator-backend
      tag: latest
      pullPolicy: Always
    dbTestAllowedHosts:
      - 192.168.1.221
  ui:
    # Set dynamically by `ops up-ready` to the HTTP LAN edge origin.
    browserOrigin: ""
    image:
      repository: schema-migrator-ui
      tag: latest
      pullPolicy: Always
    service:
      hostPort: 3008
  keycloak:
    # Set dynamically by `ops up-ready` so Keycloak's browser-facing issuer
    # and admin console use the reachable LAN origin.
    browserOrigin: ""
    adminHostname: ""
    persistence:
      enabled: true
    service:
      hostPort: 8180
      port: 8080
  traefik:
    hostPorts:
      # Avoid k3s svclb-traefik which already binds 80/443 on the node.
      http: 8082
      https: 8444
      # Unified LAN edge for the UI and backend API.
      lan: 8081
    acme:
      # Set dynamically by `ops up-ready` from ACME_EMAIL.
      email: ""
      persistence:
        hostPath: /var/lib/ssl-proxy/schema-migrator/traefik-acme
atherosSensor:
  enabled: true
  image:
    repository: atheros-sensor
    tag: latest
    pullPolicy: Always
atherosSearch:
  enabled: true
  schemaManifestSHA256: "94a4cbc7acee1226a6db1d54bd9acd0522b221d82466c28ede1a97d73df2e071"
  image:
    repository: atheros-search
    tag: latest
    pullPolicy: Always
  # Set dynamically by `ops up-ready` from SERVER_IP.
  embeddingBackend: ""
  # The browser UI is same-origin through its in-cluster nginx proxy. Do not
  # expose the digest-protected API directly to the browser.
  apiTokenEnabled: false
  worker:
    enabled: true
    batchSize: 256
    requestBatchSize: 64
    requestBatchMax: 128
  ui:
    enabled: true
    image:
      repository: atheros-search-ui
      tag: latest
      pullPolicy: Always
    service:
      hostPort: 3007
telemetry:
  enabled: true
  keda:
    enabled: false
  monitoring:
    enabled: true
  dashboardDiscovery:
    enabled: true
  prometheus:
    service:
      hostPort: 9090
    persistence:
      hostPath: "/var/lib/docker/volumes/ssl-proxy_prometheus-data/_data"
  loki:
    persistence:
      hostPath: "/var/lib/docker/volumes/ssl-proxy_loki-data/_data"
  jaeger:
    service:
      hostPort: 16686
      otlpGrpcHostPort: 4317
      metricsHostPort: 14269
  grafana:
    service:
      hostPort: 3004
    persistence:
      hostPath: "/var/lib/docker/volumes/ssl-proxy_grafana-data/_data"
