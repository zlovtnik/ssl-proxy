apiVersion: v2
name: ssl-proxy
description: Umbrella chart for the SSL Proxy platform
type: application
version: 0.3.0
appVersion: "1.0.0"
kubeVersion: ">=1.28.0-0"
keywords:
  - wireguard
  - proxy
  - redpanda
  - oracle
  - vector-embeddings
  - auto-scaling
maintainers:
  - name: ssl-proxy-team
dependencies:
  - name: proxy
    version: 0.1.3
    repository: "file://charts/proxy"
    condition: proxy.enabled
  - name: java-coordinator
    version: 0.1.1
    repository: "file://charts/java-coordinator"
    alias: javaCoordinator
    condition: javaCoordinator.enabled
  - name: schema-migrator
    version: 0.1.2
    repository: "file://charts/schema-migrator"
    alias: schemaMigrator
    condition: schemaMigrator.enabled
  - name: atheros-sensor
    version: 0.1.1
    repository: "file://charts/atheros-sensor"
    alias: atherosSensor
    condition: atherosSensor.enabled
  - name: redpanda
    version: 0.1.1
    repository: "file://charts/redpanda"
  - name: minio
    version: 0.1.1
    repository: "file://charts/minio"
  - name: tidb
    version: 0.2.0
    repository: "file://charts/tidb"
  - name: telemetry
    version: 0.1.2
    repository: "file://charts/telemetry"
    alias: observability
    condition: observability.enabled
  - name: vec-worker
    version: 0.1.0
    repository: "file://charts/vec-worker"
    alias: vecWorker
    condition: vecWorker.enabled
  - name: atheros-search
    version: 0.1.1
    repository: "file://charts/atheros-search"
    alias: atherosSearch
    condition: atherosSearch.enabled
  - name: redis-runtime
    version: 0.1.0
    repository: "file://charts/redis-runtime"
    alias: redisRuntime
    condition: redisRuntime.enabled
  - name: tidb-schema-executor
    version: 0.1.0
    repository: "file://charts/tidb-schema-executor"
    alias: tidbSchemaExecutor
    condition: tidbSchemaExecutor.enabled
