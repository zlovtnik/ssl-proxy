# SSL-Proxy umbrella values. Workload defaults live with their subcharts.
global:
  migration:
    # stage: new clients deployed with consumers disabled; legacy stays active.
    # activate: legacy is quiesced and ready new clients receive traffic.
    # prune: PostgreSQL/MongoDB compatibility objects are absent.
    mode: activate
  nameOverride: ""
  fullnameOverride: ""
  image:
    registry: ""
    pullPolicy: IfNotPresent
  # Changed by `ops up-ready` so mutable local-registry tags are actually pulled.
  rolloutRevision: ""
  labels: {}
  annotations: {}
  serviceAccount:
    create: true
    name: "ssl-proxy"
    annotations: {}
    automountServiceAccountToken: false
  podSecurityContext:
    fsGroup: 1000
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # Values consumed by more than one subchart belong in this explicit contract.
  shared:
    keycloak:
      issuer: "https://identity.example.internal/realms/ssl-proxy-fresh"
      jwksUri: "https://identity.example.internal/realms/ssl-proxy-fresh/protocol/openid-connect/certs"
      schemaMigratorClientId: "schema-migrator"
    redis:
      urlSecret:
        name: "redis-runtime"
        key: "url"
    redpanda:
      bootstrapServers: "redpanda-0.redpanda.redpanda.svc.cluster.local:9092"
      adminPort: 9644
      topicReplicationFactor: 3
    tidb:
      host: "tidb.example.internal"
      port: 4000
      minimumVersion: "8.5.0"
      tls:
        serverName: "tidb.example.internal"
        caSecret:
          name: "tidb-client-ca"
          key: "ca.crt"
      # Each account is a {database, user, passwordSecret: {name, key}} block.
      # Adding a 5th account means one entry here + one entry in the
      # values-k8s.yaml overlay. No templates need changing.
      accounts:
        octopus:
          database: "octopus_core"
          user: "octopus_runtime"
          passwordSecret: {name: "tidb-octopus", key: "password"}
        atherosSearch:
          database: "atheros_search"
          user: "atheros_search_runtime"
          passwordSecret: {name: "tidb-atheros-search", key: "password"}
        schemaMigrator:
          database: "schema_migrator"
          user: "schema_migrator_runtime"
          passwordSecret: {name: "tidb-schema-migrator", key: "password"}
        keycloak:
          database: "keycloak"
          user: "keycloak"
          passwordSecret: {name: "tidb-keycloak", key: "password"}
      metricsPort: 10080
    minio:
      endpoint: "http://minio.minio.svc.cluster.local:9000"
      bucket: "integration-console-exports"
      accessKeySecret:
        name: "minio-credentials"
        key: "access-key"
      secretKeySecret:
        name: "minio-credentials"
        key: "secret-key"
    proxy:
      service:
        adminPort: 3002
    javaCoordinator:
      service:
        port: 8080
      tracing:
        otlpEndpoint: "http://ssl-proxy-otel-collector:4317"
      topics:
        scanTopic: "sync.scan.request"
        loadTopic: "sync.oracle.load"
        resultTopic: "sync.oracle.result"
        payloadAuditTopic: "proxy.payload_audit"
      consumers:
        scanConsumer: "octopus-scan-v1"
        loadConsumer: "octopus-load-v1"
        resultConsumer: "octopus-result-v1"
        payloadAuditConsumer: "octopus-payload-audit-v1"
      streams:
        commonStreamNames: "proxy.events,wireless.audit,audit.wireless.bandwidth,wireless.alert.rogue_ap,wireless.alert.deauth_flood,wireless.alert.signal_anomaly,wireless.alert.pmf_attack,wireless.client.inventory,wireless.probe.flush,proxy.payload_audit"
        auditStreamName: "AUDIT_STREAM"
        resultStreamName: "ORACLE_RESULT_STREAM"
        wirelessBacklogStreamName: "WIRELESS_BACKLOG_STREAM"
        wirelessMacStreamName: "WIRELESS_MAC_STREAM"
        wirelessNetworksStreamName: "WIRELESS_NETWORKS_STREAM"
        wirelessProbeStreamName: "WIRELESS_PROBE_STREAM"
      wirelessTopics:
        backlogSaveTopic: "wireless.backlog.save"
        backlogListTopic: "wireless.backlog.list"
        backlogSyncedTopic: "wireless.backlog.synced"
        backlogPruneTopic: "wireless.backlog.prune"
        macLookupTopic: "wireless.mac.lookup"
        networksAuthorizedTopic: "wireless.networks.authorized"
        probeFlushTopic: "wireless.probe.flush"
      wirelessConsumers:
        backlogSaveConsumer: "wireless-backlog-save-v1"
        backlogListConsumer: "wireless-backlog-list-v1"
        backlogSyncedConsumer: "wireless-backlog-synced-v1"
        backlogPruneConsumer: "wireless-backlog-prune-v1"
        macLookupConsumer: "wireless-mac-lookup-v1"
        networksAuthorizedConsumer: "wireless-networks-authorized-v1"
        probeFlushConsumer: "wireless-probe-flush-v1"
      wirelessReplyTopics:
        backlogListReplyTopic: "wireless.backlog.list.reply"
        backlogPruneReplyTopic: "wireless.backlog.prune.reply"
        macLookupReplyTopic: "wireless.mac.lookup.reply"
        networksAuthorizedReplyTopic: "wireless.networks.authorized.reply"
      topicPartitions: 5
    atherosSensor:
      metricsPort: 9097
    atherosSearch:
      metricsPort: 9090
      workerMetricsPort: 9090

# Dependency aliases are the authoritative enablement paths and preserve the
# historical Helm --set names.
proxy:
  enabled: true
javaCoordinator:
  enabled: true
schemaMigrator:
  enabled: false
  publicHostname: ""
  traefik:
    acme:
      email: ""
atherosSensor:
  enabled: true
tidb:
  external: false
  minimumVersion: "8.5.0"
  egress:
    enabled: false
    cidrs: []
observability:
  enabled: true

# The standalone vec-worker was retired; Atheros Search owns its embedding worker.
vecWorker:
  enabled: false
atherosSearch:
  enabled: false
redisRuntime:
  enabled: true
tidbSchemaExecutor:
  enabled: false
