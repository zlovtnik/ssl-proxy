# SSL-Proxy umbrella values. Workload defaults live with their subcharts.
global:
  nameOverride: ""
  fullnameOverride: ""
  image:
    registry: ""
    pullPolicy: IfNotPresent
  # Changed by `ops up-ready` so mutable local-registry tags are actually pulled.
  rolloutRevision: ""
  labels: {}
  annotations: {}
  serviceAccount:
    create: true
    name: "ssl-proxy"
    annotations: {}
    automountServiceAccountToken: false
  podSecurityContext:
    fsGroup: 1000
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # Values consumed by more than one subchart belong in this explicit contract.
  shared:
    redpanda:
      bootstrapServers: "redpanda-0.redpanda.redpanda.svc.cluster.local:9092"
      adminPort: 9644
      topicReplicationFactor: 3
    postgres:
      host: "postgres-primary.postgres.svc.cluster.local"
      port: 5432
      database: "sync"
      user: "sync"
      passwordSecret:
        name: "postgres-credentials"
        key: "password"
    redis:
      url: "redis://redis.redis.svc.cluster.local:6379/1"
      passwordSecret:
        name: "redis-credentials"
        key: "password"
    minio:
      endpoint: "http://minio.minio.svc.cluster.local:9000"
      bucket: "integration-console-exports"
      accessKeySecret:
        name: "minio-credentials"
        key: "access-key"
      secretKeySecret:
        name: "minio-credentials"
        key: "secret-key"
    proxy:
      service:
        adminPort: 3002
    javaCoordinator:
      service:
        port: 8080
      tracing:
        otlpEndpoint: "http://ssl-proxy-otel-collector:4317"
      topics:
        scanTopic: "sync.scan.request"
        loadTopic: "sync.oracle.load"
        resultTopic: "sync.oracle.result"
        payloadAuditTopic: "proxy.payload_audit"
      consumers:
        scanConsumer: "zig-coordinator-scan"
        loadConsumer: "oracle-worker-load"
        resultConsumer: "zig-coordinator-result"
        payloadAuditConsumer: "zig-coordinator-payload-audit"
      streams:
        syncStreamNames: "proxy.events,wireless.audit,audit.wireless.bandwidth,wireless.alert.rogue_ap,wireless.alert.deauth_flood,wireless.alert.signal_anomaly,wireless.alert.pmf_attack,wireless.client.inventory,wireless.probe.flush,proxy.payload_audit"
        oracleStreamNames: "proxy.events,wireless.audit,audit.wireless.bandwidth,wireless.alert.rogue_ap,wireless.alert.deauth_flood,wireless.alert.signal_anomaly,wireless.alert.pmf_attack,wireless.client.inventory,wireless.probe.flush,proxy.payload_audit"
        auditStreamName: "AUDIT_STREAM"
        resultStreamName: "ORACLE_RESULT_STREAM"
        wirelessBacklogStreamName: "WIRELESS_BACKLOG_STREAM"
        wirelessMacStreamName: "WIRELESS_MAC_STREAM"
        wirelessNetworksStreamName: "WIRELESS_NETWORKS_STREAM"
        wirelessProbeStreamName: "WIRELESS_PROBE_STREAM"
      wirelessTopics:
        backlogSaveTopic: "wireless.backlog.save"
        backlogListTopic: "wireless.backlog.list"
        backlogSyncedTopic: "wireless.backlog.synced"
        backlogPruneTopic: "wireless.backlog.prune"
        macLookupTopic: "wireless.mac.lookup"
        networksAuthorizedTopic: "wireless.networks.authorized"
        probeFlushTopic: "wireless.probe.flush"
      wirelessConsumers:
        backlogSaveConsumer: "wireless-backlog-save"
        backlogListConsumer: "wireless-backlog-list"
        backlogSyncedConsumer: "wireless-backlog-synced"
        backlogPruneConsumer: "wireless-backlog-prune"
        macLookupConsumer: "wireless-mac-lookup"
        networksAuthorizedConsumer: "wireless-networks-authorized"
        probeFlushConsumer: "wireless-probe-flush"
      wirelessReplyTopics:
        backlogListReplyTopic: "wireless.backlog.list.reply"
        backlogPruneReplyTopic: "wireless.backlog.prune.reply"
        macLookupReplyTopic: "wireless.mac.lookup.reply"
        networksAuthorizedReplyTopic: "wireless.networks.authorized.reply"
      topicPartitions: 5
    integrationConsole:
      web:
        service:
          port: 3005
    atherosSensor:
      metricsPort: 9097
    atherosSearch:
      metricsPort: 9090
      workerMetricsPort: 9090

# Dependency aliases are the authoritative enablement paths and preserve the
# historical Helm --set names.
proxy:
  enabled: true
javaCoordinator:
  enabled: true
integrationConsole:
  enabled: true
schemaMigrator:
  enabled: false
  publicHostname: ""
  traefik:
    acme:
      email: ""
atherosSensor:
  enabled: true
observability:
  enabled: true

# The standalone vec-worker was retired; Atheros Search owns its embedding worker.
vecWorker:
  enabled: false
atherosSearch:
  enabled: false
