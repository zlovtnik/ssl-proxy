# =============================================================================
# SSL-Proxy Kubernetes Deployment Values
# =============================================================================

# -- Global settings applied to all resources
global:
  image:
    registry: ""
    pullPolicy: IfNotPresent
  # Changed by `ops up-ready` so mutable local-registry tags are actually pulled.
  rolloutRevision: ""
  # Common labels added to all resources
  labels: {}
  # Common annotations added to all resources
  annotations: {}

# =============================================================================
# Infrastructure Dependencies (external or managed separately)
# =============================================================================

# Redpanda connection settings
redpanda:
  # -- Set to true if Redpanda is managed externally (not deployed by this chart)
  external: true
  # -- Bootstrap servers (if external, provide comma-separated list)
  bootstrapServers: "redpanda-0.redpanda.redpanda.svc.cluster.local:9092"
  # -- Admin API port for metrics and rpk operations
  adminPort: 9644
  image:
    repository: redpandadata/redpanda
    tag: latest
    pullPolicy: IfNotPresent
  replicas: 1
  topicReplicationFactor: 3
  persistence:
    enabled: true
    hostPath: ""
    size: 20Gi
    storageClassName: ""
  resources:
    limits:
      cpu: "2"
      memory: 2Gi
    requests:
      cpu: 500m
      memory: 1Gi

# Postgres connection settings
postgres:
  # -- Set to true if Postgres is managed externally (not deployed by this chart)
  external: true
  # -- Postgres connection URL (without password, password goes in secret)
  host: "postgres-primary.postgres.svc.cluster.local"
  port: 5432
  database: "sync"
  user: "sync"
  # -- Secret reference for Postgres password
  passwordSecret:
    name: "postgres-credentials"
    key: "password"
  image:
    repository: ssl-proxy-postgres
    tag: latest
    pullPolicy: IfNotPresent
  persistence:
    enabled: true
    hostPath: ""
    size: 100Gi
    storageClassName: ""
  resources:
    limits:
      cpu: "4"
      memory: 8Gi
    requests:
      cpu: "1"
      memory: 2Gi

# Redis connection settings (used by integration-console)
redis:
  external: true
  url: "redis://redis.redis.svc.cluster.local:6379/1"
  # -- Secret reference for Redis password
  passwordSecret:
    name: "redis-credentials"
    key: "password"
  image:
    repository: redis
    tag: 7-alpine
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

# MinIO connection settings (used by integration-console)
minio:
  external: true
  endpoint: "http://minio.minio.svc.cluster.local:9000"
  bucket: "integration-console-exports"
  accessKeySecret:
    name: "minio-credentials"
    key: "access-key"
  secretKeySecret:
    name: "minio-credentials"
    key: "secret-key"
  image:
    repository: minio/minio
    tag: latest
    pullPolicy: IfNotPresent
  clientImage:
    repository: minio/mc
    tag: latest
    pullPolicy: IfNotPresent
  extraBuckets:
    - ssl-proxy-wireless-raw-archive
  persistence:
    enabled: true
    hostPath: ""
    size: 50Gi
    storageClassName: ""
  resources:
    limits:
      cpu: "1"
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 512Mi

# Ollama connection settings (for vec-worker embedding provider)
ollama:
  external: true
  url: "http://ollama.ollama.svc.cluster.local:11434"

# =============================================================================
# Service Configurations
# =============================================================================

# SSL-Proxy (WireGuard proxy + sync producer)
proxy:
  enabled: true
  replicas: 1
  image:
    repository: ssl-proxy
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: LoadBalancer
    # -- WireGuard UDP port
    wgPort: 443
    # -- Plain WireGuard UDP port
    wgInternalPort: 51820
    # -- Admin API HTTP port
    adminPort: 3002
    # -- Metrics HTTP port (separate from adminPort to avoid duplicate port numbers)
    metricsPort: 3003
    # -- Policy enforcement port
    policyPort: 3001
    externalIPs: []
    annotations: {}
  adminService:
    externalIPs: []
  # Resource limits (matches docker-compose)
  resources:
    limits:
      cpu: "2"
      memory: 2Gi
    requests:
      cpu: 500m
      memory: 512Mi
  # WireGuard configuration
  wireguard:
    interfaceName: "wg0"
    serverAddress: "10.13.13.1/24"
    port: 443
    internalPort: 51820
    mtu: 1420
    obfuscationMaxDatagramBytes: null
    udpSocketBufferBytes: "16777216"
    obfuscation:
      enabled: false
      key: ""
      magicByte: "0xAA"
      sessionIdleSecs: 300
    peerNames: "peer1,peer2"
    # Peer configuration is mounted from Secrets
    peers: []
    # - name: peer1
    #   privateKeySecret: {name: "wg-peer1-key", key: "private-key"}
    #   publicKeySecret: {name: "wg-peer1-key", key: "public-key"}
    #   allowedIPs: "10.13.13.2/32"
    configSecret:
      name: "wireguard-config"
    adminBindAddress: "0.0.0.0"
  # Admin API key for dashboard access
  adminApiKeySecret:
    name: "proxy-admin-key"
    key: "api-key"
  runtimeSecret:
    name: "proxy-runtime-secrets"
    obfuscationKey: "wg-obfuscation-key"
  # Security context (needs NET_ADMIN capability for BoringTun)
  securityContext:
    runAsUser: 0
    runAsGroup: 0
    capabilities:
      add:
        - NET_ADMIN
  # Health check
  healthcheck:
    livenessProbe:
      httpGet:
        path: /health
        port: 3002
      initialDelaySeconds: 40
      periodSeconds: 30
      timeoutSeconds: 10
      failureThreshold: 3
    readinessProbe:
      httpGet:
        path: /ready
        port: 3002
      initialDelaySeconds: 20
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3

# Java Coordinator (scan/load/result pipeline)
javaCoordinator:
  enabled: true
  replicas: 1
  image:
    repository: java-coordinator
    tag: latest
    pullPolicy: IfNotPresent
  service:
    port: 8080
    type: ClusterIP
  jvmOptions: "-XX:+UseZGC -XX:+ZGenerational -XX:InitialRAMPercentage=50 -XX:MaxRAMPercentage=75"
  datasource:
    maximumPoolSize: 35
    minimumIdle: 10
  consumerConcurrency:
    scan: 1
    result: 1
    wireless: 1
    wirelessMaxPollRecords: 1
  retention:
    wirelessRawPayloadHotDays: 7
    syncEventRowRetentionDays: 30
    syncEventTombstoneRetentionDays: 45
    wirelessRawArchiveBucket: "ssl-proxy-wireless-raw-archive"
    wirelessRawArchiveBatchSize: 100
    wirelessRawArchiveIntervalMs: 300000
    maintenanceIntervalMs: "3600000"
  tracing:
    samplingProbability: 0.05
    otlpEndpoint: "http://ssl-proxy-otel-collector:4317"
  # Resource limits
  resources:
    limits:
      cpu: "1"
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 256Mi
  # Topic configuration
  topics:
    scanTopic: "sync.scan.request"
    loadTopic: "sync.oracle.load"
    resultTopic: "sync.oracle.result"
    payloadAuditTopic: "proxy.payload_audit"
  # Consumer group names
  consumers:
    scanConsumer: "zig-coordinator-scan"
    loadConsumer: "oracle-worker-load"
    resultConsumer: "zig-coordinator-result"
    payloadAuditConsumer: "zig-coordinator-payload-audit"
  # Stream names configuration
  streams:
    syncStreamNames: "proxy.events,wireless.audit,audit.wireless.bandwidth,wireless.alert.rogue_ap,wireless.alert.deauth_flood,wireless.alert.signal_anomaly,wireless.alert.pmf_attack,wireless.client.inventory,wireless.probe.flush,proxy.payload_audit"
    oracleStreamNames: "proxy.events,wireless.audit,audit.wireless.bandwidth,wireless.alert.rogue_ap,wireless.alert.deauth_flood,wireless.alert.signal_anomaly,wireless.alert.pmf_attack,wireless.client.inventory,wireless.probe.flush,proxy.payload_audit"
    auditStreamName: "AUDIT_STREAM"
    resultStreamName: "ORACLE_RESULT_STREAM"
    wirelessBacklogStreamName: "WIRELESS_BACKLOG_STREAM"
    wirelessMacStreamName: "WIRELESS_MAC_STREAM"
    wirelessNetworksStreamName: "WIRELESS_NETWORKS_STREAM"
    wirelessProbeStreamName: "WIRELESS_PROBE_STREAM"
  # Wireless operation topics
  wirelessTopics:
    backlogSaveTopic: "wireless.backlog.save"
    backlogListTopic: "wireless.backlog.list"
    backlogSyncedTopic: "wireless.backlog.synced"
    backlogPruneTopic: "wireless.backlog.prune"
    macLookupTopic: "wireless.mac.lookup"
    networksAuthorizedTopic: "wireless.networks.authorized"
    probeFlushTopic: "wireless.probe.flush"
  # Wireless consumer groups
  wirelessConsumers:
    backlogSaveConsumer: "wireless-backlog-save"
    backlogListConsumer: "wireless-backlog-list"
    backlogSyncedConsumer: "wireless-backlog-synced"
    backlogPruneConsumer: "wireless-backlog-prune"
    macLookupConsumer: "wireless-mac-lookup"
    networksAuthorizedConsumer: "wireless-networks-authorized"
    probeFlushConsumer: "wireless-probe-flush"
  # Wireless reply topics
  wirelessReplyTopics:
    backlogListReplyTopic: "wireless.backlog.list.reply"
    backlogPruneReplyTopic: "wireless.backlog.prune.reply"
    macLookupReplyTopic: "wireless.mac.lookup.reply"
    networksAuthorizedReplyTopic: "wireless.networks.authorized.reply"
  # Topic partition count (must be >= max replicas)
  topicPartitions: 5
  # Health check - Spring Boot Actuator
  healthcheck:
    startupProbe:
      tcpSocket:
        port: 8081
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 30
    livenessProbe:
      tcpSocket:
        port: 8081
      initialDelaySeconds: 30
      periodSeconds: 30
      timeoutSeconds: 10
      failureThreshold: 5
  # Metrics endpoint (embedded in Actuator)
  metrics:
    enabled: true
    port: 8081
    redpandaLagMetricsEnabled: true
    redpandaLagMetricsPollIntervalMs: 10000
    redpandaLagMetricsTimeoutMs: 5000
    heartbeatLogIntervalMs: 15000
  oracle:
    enabled: true
    wirelessEnabled: true
    schemaValidationWarnOnly: false
    loadMaxRetries: 3
    conn: "mainerc_high"
    user: "USCIS_APP"
    passwordSecret:
      name: "oracle-credentials"
      key: "password"
    # TNS_ADMIN for Oracle wallet
    walletSecret:
      name: "oracle-wallet"

# Vec Worker
vecWorker:
  enabled: true
  replicas: 1
  image:
    repository: vec-worker
    tag: latest
    pullPolicy: IfNotPresent
  service:
    port: 9092
    type: ClusterIP
  # Resource limits
  resources:
    limits:
      cpu: "2"
      memory: 4Gi
    requests:
      cpu: 500m
      memory: 1Gi
  # Embedding configuration
  embedding:
    enabled: true
    provider: "llamacpp"  # ollama or llamacpp
    url: "http://host.docker.internal:8080"
    model: "nomic-embed-text-v2-moe"
    dimensions: 768
    maxInputTokens: 512
    maxConcurrentEmbedRequests: 4
    batchSize: 256
    requestBatchSize: 64
    requestBatchMax: 128
    leaseSeconds: 1800
    maxConcurrentCompletes: 16
  # Worker pool configuration
  workerName: "worker-1"
  pollIntervalSeconds: 1
  # Database pool
  databasePoolMaxConnections: 6
  # Health check
  healthcheck:
    livenessProbe:
      exec:
        command:
          - /usr/local/bin/vec-worker
          - healthcheck
      initialDelaySeconds: 20
      periodSeconds: 30
      timeoutSeconds: 10
      failureThreshold: 5
  # Metrics endpoint
  metrics:
    enabled: true
    port: 9092

# Integration Console (Rails + Svelte dashboard)
integrationConsole:
  enabled: true
  web:
    replicas: 1
    image:
      repository: integration-console
      tag: latest
      pullPolicy: IfNotPresent
    service:
      port: 3000
      targetPort: 3000
      type: ClusterIP
      externalIPs: []
    resources:
      limits:
        cpu: "1"
        memory: 1Gi
      requests:
        cpu: 250m
        memory: 512Mi
    # Ingress for web access
    ingress:
      enabled: false
      className: "nginx"
      hosts:
        - console.ssl-proxy.local
      tls: []
    syncDbPool: 5
    cache:
      ttlInventory: 60
      ttlAuditRecent: 10
      ttlDashboard: 15
  worker:
    enabled: true
    replicas: 1
    resources:
      limits:
        cpu: "1"
        memory: 1Gi
      requests:
        cpu: 250m
        memory: 512Mi
    syncDbPool: 5
  heatmapRefresh:
    enabled: true
    replicas: 1
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 256Mi
    intervalSeconds: 300
  heartbeat:
    enabled: true
    replicas: 1
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 256Mi
    intervalSeconds: 60
  dbSetup:
    enabled: true
    image:
      repository: integration-console
      tag: latest
  # Rails environment
  railsEnv: "development"
  logFormat: "json"
  otlpEndpoint: "http://ssl-proxy-otel-collector:4317"

# Atheros wireless sensor (host-networked producer; no direct Postgres ownership)
atherosSensor:
  enabled: false
  image:
    repository: atheros-sensor
    tag: latest
    pullPolicy: IfNotPresent
  device: ""
  locationId: "default"
  channel: 11
  channelHopEnabled: true
  channelHopIntervalMs: 1000
  regDomain: "US"
  auditLayerStream: "off"
  metricsPort: 9097
  otlpEndpoint: "http://ssl-proxy-otel-collector:4317"
  resources:
    limits:
      cpu: "1"
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 256Mi

# Optional search/vector service; disabled like the Compose vector profile.
atherosSearch:
  enabled: false
  image:
    repository: atheros-search
    tag: latest
    pullPolicy: IfNotPresent
  httpPort: 8080
  grpcPort: 50051
  metricsPort: 9090
  embeddingBackend: "http://host.docker.internal:8083"
  embeddingModel: "nomic-embed-text-v2-moe"
  embeddingDimensions: 768
  apiTokenSecret:
    name: atheros-credentials
    key: api-token-sha256
  otlpEndpoint: "http://ssl-proxy-otel-collector:4317"

# Compose-equivalent in-cluster observability stack.
observability:
  enabled: false
  prometheus:
    image:
      repository: prom/prometheus
      tag: v2.54.1
      pullPolicy: IfNotPresent
    service:
      port: 9090
      externalIPs: []
    persistence:
      enabled: true
      hostPath: ""
      size: 20Gi
      storageClassName: ""
    alertRules: ""
  loki:
    image:
      repository: grafana/loki
      tag: 3.1.1
      pullPolicy: IfNotPresent
    service:
      port: 3100
    persistence:
      enabled: true
      hostPath: ""
      size: 20Gi
      storageClassName: ""
  promtail:
    image:
      repository: grafana/promtail
      tag: 3.1.1
      pullPolicy: IfNotPresent
    positionsHostPath: "/var/lib/ssl-proxy/promtail"
  jaeger:
    image:
      repository: jaegertracing/all-in-one
      tag: 1.62.0
      pullPolicy: IfNotPresent
    service:
      port: 16686
      externalIPs: []
  otelCollector:
    image:
      repository: otel/opentelemetry-collector-contrib
      tag: 0.107.0
      pullPolicy: IfNotPresent
  grafana:
    image:
      repository: grafana/grafana
      tag: 11.1.4
      pullPolicy: IfNotPresent
    service:
      port: 3004
      targetPort: 3000
      externalIPs: []
    adminUser: admin
    adminPasswordSecret:
      name: observability-credentials
      key: grafana-admin-password
    persistence:
      enabled: true
      hostPath: ""
      size: 10Gi
      storageClassName: ""
    dashboards:
      dbCalls: ""
      infraSaturation: ""
      integrationConsoleHealth: ""
      serviceRedMetrics: ""
      stackHealthOverview: ""
      syncPipelineLatency: ""
  postgresExporter:
    image:
      repository: quay.io/prometheuscommunity/postgres-exporter
      tag: v0.19.1
      pullPolicy: IfNotPresent
    queries: ""
  redisExporter:
    image:
      repository: oliver006/redis_exporter
      tag: v1.61.0
      pullPolicy: IfNotPresent
  nodeExporter:
    image:
      repository: prom/node-exporter
      tag: v1.8.2
      pullPolicy: IfNotPresent
  cadvisor:
    image:
      repository: gcr.io/cadvisor/cadvisor
      tag: v0.49.1
      pullPolicy: IfNotPresent
    containerdHostPath: "/var/lib/containerd"
  pushgateway:
    image:
      repository: prom/pushgateway
      tag: v1.8.0
      pullPolicy: IfNotPresent

# =============================================================================
# KEDA Auto-Scaling Configuration
# =============================================================================

keda:
  # -- Set to true to deploy KEDA ScaledObjects (requires KEDA operator in cluster)
  enabled: true

  # Java Coordinator auto-scaling (based on Redpanda consumer lag)
  javaCoordinator:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    # Scan topic scaling
    scanLagThreshold: 5000
    scanActivationLagThreshold: 500
    # Result topic scaling
    resultLagThreshold: 5000
    resultActivationLagThreshold: 500
    # Scale behavior
    scaleUp:
      stabilizationWindowSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300

  # Vec Worker auto-scaling (based on Postgres pending job count)
  vecWorker:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    # Each vec-worker handles ~100 jobs concurrently
    # Scale when pending > baseCount * targetQueryValue
    jobsPerReplica: 100
    targetQueryValue: 3  # scale when pending > 3 * 100 = 300
    scaleUp:
      stabilizationWindowSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300

# =============================================================================
# Prometheus Monitoring
# =============================================================================

monitoring:
  # -- Set to true to create ServiceMonitors for Prometheus scraping
  enabled: true
  # ServiceMonitors will be created in this namespace
  serviceMonitorNamespace: "monitoring"
  # Scrape interval
  interval: 30s
  # Labels for ServiceMonitor selection
  labels:
    release: kube-prometheus-stack

  # Redpanda metrics (external, scraped from Redpanda's :9644 endpoint)
  redpanda:
    enabled: true
    # Endpoint for Redpanda metrics
    endpoint: "redpanda-0.redpanda.redpanda.svc.cluster.local:9644"

  # Postgres metrics (via postgres_exporter sidecar)
  postgres:
    enabled: true
    # postgres_exporter queries
    queries:
      vecPendingJobs: |
        SELECT status, count(*) as count
        FROM vec_embedding_jobs
        WHERE status = 'pending'
          AND (leased_until IS NULL OR leased_until < NOW())
        GROUP BY status

# =============================================================================
# Grafana Dashboards
# =============================================================================

grafana:
  # -- Set to true to create a ConfigMap with Grafana dashboard JSON
  enabled: true
  # Dashboard label for auto-discovery
  dashboardLabel: "grafana_dashboard"
  dashboardLabelValue: "1"
  # Dashboard namespace
  namespace: "monitoring"

# =============================================================================
# Service Accounts and RBAC
# =============================================================================

serviceAccount:
  # -- Create service accounts for the deployments
  create: true
  name: "ssl-proxy"

# =============================================================================
# Common Pod Settings
# =============================================================================

podSecurityContext: {}
podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
