      - VECTOR_EMBEDDING_DIMENSIONS=${VECTOR_EMBEDDING_DIMENSIONS:-768}
      - VECTOR_EMBEDDING_BATCH_SIZE=${VECTOR_EMBEDDING_BATCH_SIZE:-64}
      - VECTOR_EMBEDDING_REQUEST_BATCH_SIZE=${VECTOR_EMBEDDING_REQUEST_BATCH_SIZE:-32}
      - VECTOR_EMBEDDING_REQUEST_BATCH_MAX=${VECTOR_EMBEDDING_REQUEST_BATCH_MAX:-128}
      - VECTOR_EMBEDDING_LEASE_SECONDS=${VECTOR_EMBEDDING_LEASE_SECONDS:-1800}
      - POLL_INTERVAL_SECONDS=${POLL_INTERVAL_SECONDS:-1}
      - VECTOR_EMBEDDING_MAX_CONCURRENT_COMPLETES=${VECTOR_EMBEDDING_MAX_CONCURRENT_COMPLETES:-8}

  vec-worker-4:
    profiles:
      - vector
    build:
      context: .
      dockerfile: services/vec-worker/Dockerfile
    restart: unless-stopped
    environment:
      - VECTOR_EMBEDDING_WORKER_NAME=worker-4
      - VECTOR_EMBEDDING_MAX_CONCURRENT_EMBED_REQUESTS=2
      - DATABASE_POOL_MAX_CONNECTIONS=8
      - RUST_LOG=${VEC_WORKER_RUST_LOG:-vec_worker=warn,sqlx=warn}
      - DATABASE_URL=postgres://sync:sync@192.168.1.221:5432/sync
      - VECTOR_EMBEDDINGS_ENABLED=${VECTOR_EMBEDDINGS_ENABLED:-true}
      - VECTOR_EMBEDDING_PROVIDER=${VECTOR_EMBEDDING_PROVIDER:-llamacpp}
      - VECTOR_EMBEDDING_URL=${VECTOR_EMBEDDING_URL:-http://host.docker.internal:8080}
      - VECTOR_EMBEDDING_MODEL=${VECTOR_EMBEDDING_MODEL:-nomic-embed-text-v2-moe}
      - VECTOR_EMBEDDING_DIMENSIONS=${VECTOR_EMBEDDING_DIMENSIONS:-768}
      - VECTOR_EMBEDDING_BATCH_SIZE=${VECTOR_EMBEDDING_BATCH_SIZE:-64}
      - VECTOR_EMBEDDING_REQUEST_BATCH_SIZE=${VECTOR_EMBEDDING_REQUEST_BATCH_SIZE:-32}
      - VECTOR_EMBEDDING_REQUEST_BATCH_MAX=${VECTOR_EMBEDDING_REQUEST_BATCH_MAX:-128}
      - VECTOR_EMBEDDING_LEASE_SECONDS=${VECTOR_EMBEDDING_LEASE_SECONDS:-1800}
      - POLL_INTERVAL_SECONDS=${POLL_INTERVAL_SECONDS:-1}
      - VECTOR_EMBEDDING_MAX_CONCURRENT_COMPLETES=${VECTOR_EMBEDDING_MAX_CONCURRENT_COMPLETES:-8}

  atheros-sensor:
    depends_on:
      redpanda:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      java-coordinator:
        condition: service_healthy
    build:
      context: .
      dockerfile: Dockerfile
      target: atheros-sensor
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - /sys/class/net:/sys/class/net:ro
      - sync-outbox:/sync-outbox
    environment:
      <<: *ath_sensor_env
      # The sensor runs in host networking for capture, so Docker service DNS
      # names such as redpanda are not reachable from this container.
      SYNC_REDPANDA_BOOTSTRAP_SERVERS: ${ATH_SENSOR_REDPANDA_BOOTSTRAP_SERVERS:-redpanda://127.0.0.1:19092}
      DATABASE_URL: ${DATABASE_URL:-postgres://sync:sync@127.0.0.1:5432/sync}
      ATH_SENSOR_REQUIRE_HOST_ENDPOINTS: ${ATH_SENSOR_REQUIRE_HOST_ENDPOINTS:-true}
      ATH_SENSOR_DEVICE: ${ATH_SENSOR_DEVICE:-}
      ATH_SENSOR_LOCATION_ID: ${ATH_SENSOR_LOCATION_ID:-default}
      ATH_SENSOR_CHANNEL: ${ATH_SENSOR_CHANNEL:-11}
      ATH_SENSOR_CHANNEL_HOP_ENABLED: ${ATH_SENSOR_CHANNEL_HOP_ENABLED:-false}
      ATH_SENSOR_CHANNEL_HOP_INTERVAL_MS: ${ATH_SENSOR_CHANNEL_HOP_INTERVAL_MS:-1000}
      ATH_SENSOR_REG_DOMAIN: ${ATH_SENSOR_REG_DOMAIN:-US}
      ATH_SENSOR_MAC_DEVICE_LOOKUP_ENABLED: ${ATH_SENSOR_MAC_DEVICE_LOOKUP_ENABLED:-true}
      ATH_SENSOR_CLIENT_INVENTORY_FLUSH_SECS: ${ATH_SENSOR_CLIENT_INVENTORY_FLUSH_SECS:-60}
      ATH_SENSOR_SIGNAL_ANOMALY_DBM_DELTA: ${ATH_SENSOR_SIGNAL_ANOMALY_DBM_DELTA:-15}
      ATH_SENSOR_DEAUTH_FLOOD_THRESHOLD: ${ATH_SENSOR_DEAUTH_FLOOD_THRESHOLD:-20}
      ATH_SENSOR_DEAUTH_FLOOD_WINDOW_SECS: ${ATH_SENSOR_DEAUTH_FLOOD_WINDOW_SECS:-30}
      ATH_SENSOR_DEAUTH_FLOOD_COOLDOWN_SECS: ${ATH_SENSOR_DEAUTH_FLOOD_COOLDOWN_SECS:-60}
      ATH_SENSOR_EXPORT_HANDSHAKES: ${ATH_SENSOR_EXPORT_HANDSHAKES:-false}
      ATH_SENSOR_AUTHORIZED_NETWORK_CACHE_TTL_SECS: ${ATH_SENSOR_AUTHORIZED_NETWORK_CACHE_TTL_SECS:-60}
      ATH_SENSOR_METRICS_PORT: ${ATH_SENSOR_METRICS_PORT:-}
      ATH_SENSOR_SHUTDOWN_GRACE_SECS: ${ATH_SENSOR_SHUTDOWN_GRACE_SECS:-5}
      ATH_SENSOR_BACKLOG_MAX_ATTEMPTS: ${ATH_SENSOR_BACKLOG_MAX_ATTEMPTS:-10}
      ATH_SENSOR_BACKLOG_MAX_AGE_HOURS: ${ATH_SENSOR_BACKLOG_MAX_AGE_HOURS:-72}
      ATH_SENSOR_REDPANDA_REQUEST_TIMEOUT_MS: ${ATH_SENSOR_REDPANDA_REQUEST_TIMEOUT_MS:-10000}
      ATH_SENSOR_MAC_LOOKUP_ERROR_TTL_SECS: ${ATH_SENSOR_MAC_LOOKUP_ERROR_TTL_SECS:-30}
      ATH_SENSOR_AUDIT_LAYER_STREAM: ${ATH_SENSOR_AUDIT_LAYER_STREAM:-off}
      SYNC_OUTBOX_DIR: /sync-outbox
      RUST_LOG: ${ATH_SENSOR_RUST_LOG:-warn,atheros_sensor=info,ssl_proxy=info}
    healthcheck:
      test: ["CMD-SHELL", "/usr/local/bin/atheros-sensor healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

  redpanda:
    image: redpandadata/redpanda:latest
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 1G
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - INTERNAL://0.0.0.0:9092,HOST://0.0.0.0:19092
      - --advertise-kafka-addr
      - INTERNAL://redpanda:9092,HOST://127.0.0.1:19092
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster info --brokers 127.0.0.1:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "9092:9092"
      - "127.0.0.1:19092:19092"
      - "9644:9644"
    volumes:
      - redpanda-data:/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    sysctls:
      - net.core.somaxconn=1024
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    sysctls:
      - net.core.somaxconn=1024
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY_ID:-administrador}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_ACCESS_KEY:-senhamaster123}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  ollama:
    profiles:
      - vector
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    entrypoint: ["sh", "-lc"]
    command:
      - |
        until mc alias set local http://minio:9000 "$$MINIO_ACCESS_KEY_ID" "$$MINIO_SECRET_ACCESS_KEY"; do
          sleep 1
        done
        mc mb --ignore-existing "local/$$MINIO_BUCKET"
    environment:
      - MINIO_ACCESS_KEY_ID=${MINIO_ACCESS_KEY_ID:-administrador}
      - MINIO_SECRET_ACCESS_KEY=${MINIO_SECRET_ACCESS_KEY:-senhamaster123}
      - MINIO_BUCKET=${MINIO_BUCKET:-integration-console-exports}

  redpanda-init:
    image: redpandadata/redpanda:latest
    depends_on:
      redpanda:
        condition: service_healthy
    restart: "no"
    environment:
      <<: *ath_sensor_env
      SYNC_REDPANDA_BOOTSTRAP_SERVERS: ${SYNC_REDPANDA_BOOTSTRAP_SERVERS:-redpanda:9092}
      SYNC_REDPANDA_TOPIC_MANIFEST: /config/topics.manifest
    volumes:
      - ./docker/redpanda:/config:ro
    entrypoint: ["sh"]
    command: ["/config/bootstrap.sh"]

  postgres:
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - shared_preload_libraries=pg_cron
      - -c
      - cron.database_name=sync
      - -c
      - max_connections=64
      - -c
      - listen_addresses=*
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 24G
        reservations:
          cpus: '1.0'
          memory: 12G
    environment:
      POSTGRES_DB: sync
      POSTGRES_USER: sync
      POSTGRES_PASSWORD: sync
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sync -d sync"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      # /docker-entrypoint-initdb.d is intentionally unused; zig-coordinator
      # applies sql/postgres.sql with psql.
      - postgres-data:/var/lib/postgresql/data

volumes:
  redpanda-data:
  postgres-data:
  sync-outbox:
  minio-data:
  ollama-data:
