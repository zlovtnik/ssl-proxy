        condition: service_completed_successfully
    build:
      context: .
      dockerfile: services/oracle-worker/Dockerfile
    restart: unless-stopped
    volumes:
      - ./lib:/app/lib:ro
      - ./wallet:/app/wallet:ro
      - ./secrets:/run/secrets:ro
      - sync-outbox:/sync-outbox
    environment:
      - SYNC_REDPANDA_BOOTSTRAP_SERVERS=${SYNC_REDPANDA_BOOTSTRAP_SERVERS:-redpanda:9092}
