x-ath-sensor-env: &ath_sensor_env
  SYNC_REDPANDA_BOOTSTRAP_SERVERS: redpanda://127.0.0.1:19092
  DATABASE_URL: postgres://sync:sync@127.0.0.1:5432/sync

services:
  ssl-proxy:
    depends_on:
      redpanda:
        condition: service_healthy
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VCS_REF: ${VCS_REF:-unknown}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    # Compatibility mode: host-mounted peer config files are often 0600 on the host.
    # Run as root so startup key sync/read logic can access /config/peer1/*.conf.
    user: "0:0"
    command: ["/usr/local/bin/start-proxy-wg"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3002/health && /app/ssl-proxy boringtun show wg0 >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    # NET_ADMIN and /dev/net/tun are required for BoringTun to create tun interfaces
    # and manage routes. Risk: container compromise grants network admin + root-in-container.
    # Mitigations: capabilities limited to NET_ADMIN only, no --privileged.
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./config:/config
      - sync-outbox:/sync-outbox
    environment:
      - WG_INTERFACE_NAME=wg0
      - WG_TEMPLATE_PATH=/config/templates/server.conf
      - WG_CONFIG_PATH=/run/wireguard/wg0.conf
      - WG_UAPI_SOCKET_DIR=/var/run/wireguard
      - WG_SERVER_ADDRESS=${WG_SERVER_ADDRESS:-10.13.13.1/24}
      - WG_PORT=${WG_PORT:-443}
      - WG_INTERNAL_PORT=${WG_INTERNAL_PORT:-51820}
      - WG_OBFUSCATION_ENABLED=${WG_OBFUSCATION_ENABLED:-false}
      - WG_OBFUSCATION_KEY=${WG_OBFUSCATION_KEY:-}
      - WG_OBFUSCATION_MAGIC_BYTE=${WG_OBFUSCATION_MAGIC_BYTE:-0xAA}
      - WG_OBFUSCATION_SESSION_IDLE_SECS=${WG_OBFUSCATION_SESSION_IDLE_SECS:-300}
      - WG_MTU=1280
      - WG_WAN_INTERFACE=auto
      - WG_SYSCTL_RETRIES=3
      - WG_SYSCTL_RETRY_DELAY_MS=200
      - WG_RUNTIME_SYSCTLS=0
      - WG_SERVER_PRIVATE_KEY_FILE=/config/server/privatekey-server
      - WG_PEER1_CONFIG_PATH=/config/peer1/peer1.conf
      - WG_OBFUSCATED_PEER1_CONFIG_PATH=/config/peer1/peer1-obfuscated.conf.example
      - WG_PEER1_PUBLIC_KEY_FILE=/config/peer1/publickey-peer1
      - WG_PEER1_PRESHARED_KEY_FILE=/config/peer1/presharedkey-peer1
      - WG_PEER1_ALLOWED_IPS=10.13.13.2/32
      - WG_PEER2_CONFIG_PATH=/config/peer2/peer2.conf
      - WG_OBFUSCATED_PEER2_CONFIG_PATH=/config/peer2/peer2-obfuscated.conf.example
      - WG_PEER2_PUBLIC_KEY_FILE=/config/peer2/publickey-peer2
      - WG_PEER2_PRESHARED_KEY_FILE=/config/peer2/presharedkey-peer2
      - WG_PEER2_ALLOWED_IPS=10.13.13.3/32
      - WG_SUDO=1
      - RUST_LOG=ssl_proxy=info
      - EXPLICIT_PROXY_ENABLED=false
      # Development stacks must set ADMIN_API_KEY; the service rejects empty admin auth.
      - ADMIN_API_KEY=mAcacoAmareloTemGostoDeBananaVerde
      - SYNC_REDPANDA_BOOTSTRAP_SERVERS=${SYNC_REDPANDA_BOOTSTRAP_SERVERS:-redpanda:9092}
      - SYNC_OUTBOX_DIR=/sync-outbox
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      - OTEL_EXPORTER_OTLP_PROTOCOL=${OTEL_EXPORTER_OTLP_PROTOCOL:-grpc}
      - OTEL_SERVICE_NAME=ssl-proxy
      - OTEL_RESOURCE_ATTRIBUTES=service.version=${VCS_REF:-unknown},deployment.environment=${DEPLOYMENT_ENVIRONMENT:-dev},compose.service=ssl-proxy

    ports:
      # Publish the plain and obfuscated WireGuard UDP entrypoints on the Docker host.
      - "443:443/udp"
      - "51820:51820/udp"
      # Keep policy-enforcement and admin surfaces local to the host.
      - "127.0.0.1:3001:3001"
      - "127.0.0.1:3002:3002"
    # The image also contains /usr/local/bin/wg-obfs-shim plus sample client
    # assets under /app/client-config/ for operators who need to hand out a
    # matching shim setup from the deployed server environment.
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv4.conf.all.rp_filter=0
      - net.ipv4.conf.default.rp_filter=0

  java-coordinator:
    depends_on:
      redpanda:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started
    build:
      context: .
      dockerfile: services/zig-coordinator/Dockerfile
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgres://sync:sync@postgres:5432/sync}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-sync}
      - JAVA_TOOL_OPTIONS=${JAVA_TOOL_OPTIONS:--XX:+UseZGC -XX:+ZGenerational -XX:InitialRAMPercentage=50 -XX:MaxRAMPercentage=75}
      - COORDINATOR_DB_POOL=${COORDINATOR_DB_POOL:-35}
      - COORDINATOR_DB_POOL_MIN_IDLE=${COORDINATOR_DB_POOL_MIN_IDLE:-10}
      - SYNC_REDPANDA_BOOTSTRAP_SERVERS=${SYNC_REDPANDA_BOOTSTRAP_SERVERS:-redpanda:9092}
      - SYNC_REDPANDA_TOPIC_MANIFEST=/app/docker/redpanda/topics.manifest
      - SYNC_SCHEMA_FILE=/app/sql/postgres.coordinator.sql
      - SYNC_STREAM_NAME=proxy.events
      - SYNC_STREAM_NAMES=${SYNC_STREAM_NAMES:-proxy.events,wireless.audit,audit.wireless.bandwidth,wireless.alert.rogue_ap,wireless.alert.deauth_flood,wireless.alert.signal_anomaly,wireless.alert.pmf_attack,wireless.client.inventory,wireless.probe.flush,proxy.payload_audit}
      - SYNC_ORACLE_STREAM_NAMES=${SYNC_ORACLE_STREAM_NAMES:-proxy.events,wireless.audit,audit.wireless.bandwidth,wireless.alert.rogue_ap,wireless.alert.deauth_flood,wireless.alert.signal_anomaly,wireless.alert.pmf_attack,wireless.client.inventory,wireless.probe.flush,proxy.payload_audit}
      - AUDIT_STREAM_NAME=${AUDIT_STREAM_NAME:-AUDIT_STREAM}
      - SYNC_RESULT_STREAM_NAME=${SYNC_RESULT_STREAM_NAME:-ORACLE_RESULT_STREAM}
      - SYNC_SCAN_TOPIC=${SYNC_SCAN_TOPIC:-sync.scan.request}
      - SYNC_LOAD_TOPIC=${SYNC_LOAD_TOPIC:-sync.oracle.load}
      - SYNC_RESULT_TOPIC=${SYNC_RESULT_TOPIC:-sync.oracle.result}
      - SYNC_SCAN_CONSUMER=${SYNC_SCAN_CONSUMER:-zig-coordinator-scan}
      - SYNC_LOAD_CONSUMER=${SYNC_LOAD_CONSUMER:-oracle-worker-load}
      - SYNC_RESULT_CONSUMER=${SYNC_RESULT_CONSUMER:-zig-coordinator-result}
      - SYNC_SCAN_CONSUMERS_COUNT=${SYNC_SCAN_CONSUMERS_COUNT:-1}
      - SYNC_RESULT_CONSUMERS_COUNT=${SYNC_RESULT_CONSUMERS_COUNT:-1}
      - WIRELESS_CONSUMERS_COUNT=${WIRELESS_CONSUMERS_COUNT:-1}
      - WIRELESS_MAX_POLL_RECORDS=${WIRELESS_MAX_POLL_RECORDS:-1}
      - WIRELESS_RAW_PAYLOAD_HOT_DAYS=${WIRELESS_RAW_PAYLOAD_HOT_DAYS:-7}
      - SYNC_EVENT_ROW_RETENTION_DAYS=${SYNC_EVENT_ROW_RETENTION_DAYS:-30}
      - SYNC_EVENT_TOMBSTONE_RETENTION_DAYS=${SYNC_EVENT_TOMBSTONE_RETENTION_DAYS:-45}
      - WIRELESS_RAW_ARCHIVE_BUCKET=${WIRELESS_RAW_ARCHIVE_BUCKET:-ssl-proxy-wireless-raw-archive}
      - WIRELESS_RAW_ARCHIVE_BATCH_SIZE=${WIRELESS_RAW_ARCHIVE_BATCH_SIZE:-100}
      - WIRELESS_RAW_ARCHIVE_INTERVAL_MS=${WIRELESS_RAW_ARCHIVE_INTERVAL_MS:-300000}
      - RETENTION_MAINTENANCE_INTERVAL_MS=${RETENTION_MAINTENANCE_INTERVAL_MS:-3600000}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-http://minio:9000}
      - MINIO_ACCESS_KEY_ID=${MINIO_ACCESS_KEY_ID:-administrador}
      - MINIO_SECRET_ACCESS_KEY=${MINIO_SECRET_ACCESS_KEY:-senhamaster123}
      - SYNC_OUTBOX_DIR=/sync-outbox
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      - OTEL_EXPORTER_OTLP_PROTOCOL=${OTEL_EXPORTER_OTLP_PROTOCOL:-grpc}
      - OTEL_SERVICE_NAME=java-coordinator
      - OTEL_RESOURCE_ATTRIBUTES=service.version=${VCS_REF:-unknown},deployment.environment=${DEPLOYMENT_ENVIRONMENT:-dev},compose.service=java-coordinator
      - MANAGEMENT_TRACING_SAMPLING_PROBABILITY=${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:-0.05}
      - SYNC_REDPANDA_LAG_METRICS_ENABLED=${SYNC_REDPANDA_LAG_METRICS_ENABLED:-true}
      - SYNC_REDPANDA_LAG_METRICS_POLL_INTERVAL_MS=${SYNC_REDPANDA_LAG_METRICS_POLL_INTERVAL_MS:-10000}
      - SYNC_REDPANDA_LAG_METRICS_TIMEOUT_MS=${SYNC_REDPANDA_LAG_METRICS_TIMEOUT_MS:-5000}
      - SYNC_HEARTBEAT_LOG_INTERVAL_MS=${SYNC_HEARTBEAT_LOG_INTERVAL_MS:-15000}
      - ORACLE_SINK_ENABLED=${ORACLE_SINK_ENABLED:-true}
      - ORACLE_SINK_WIRELESS_ENABLED=${ORACLE_SINK_WIRELESS_ENABLED:-true}
      - ORACLE_SINK_SCHEMA_VALIDATION_WARN_ONLY=${ORACLE_SINK_SCHEMA_VALIDATION_WARN_ONLY:-false}
      - ORACLE_LOAD_MAX_RETRIES=${ORACLE_LOAD_MAX_RETRIES:-3}
      - TNS_ADMIN=/app/wallet
      - ORACLE_CONN=${ORACLE_CONN:-mainerc_high}
      - ORACLE_USER=${ORACLE_USER:-USCIS_APP}
      - ORACLE_PASS_FILE=${ORACLE_PASS_FILE:-/run/secrets/oracle_password.txt}
    volumes:
      - sync-outbox:/sync-outbox
      - type: bind
        source: ./docker/redpanda
        target: /app/docker/redpanda
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./wallet
        target: /app/wallet
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./secrets
        target: /run/secrets
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "127.0.0.1:8081:8081"
    # ORACLE_SINK_ENABLED is intentionally fail-fast by default here: unless it
    # is explicitly "false", the healthcheck verifies tnsnames.ora, sqlnet.ora,
    # cwallet.sso, and ORACLE_PASS_FILE before probing Actuator.
    healthcheck:
      test: ["CMD-SHELL", "if [ \"${ORACLE_SINK_ENABLED:-true}\" != \"false\" ]; then test -r /app/wallet/tnsnames.ora && test -r /app/wallet/sqlnet.ora && test -r /app/wallet/cwallet.sso && test -s \"${ORACLE_PASS_FILE:-/run/secrets/oracle_password.txt}\"; fi && wget -qO- http://localhost:8081/actuator/health >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  integration-console-web:
    depends_on:
      redpanda:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      integration-console-db-setup:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
    build:
      context: .
      dockerfile: apps/integration-console/Dockerfile
    restart: unless-stopped
    command: ["bin/rails", "server", "-b", "0.0.0.0"]
    environment:
      - RAILS_ENV=development
      - DATABASE_URL=${INTEGRATION_CONSOLE_DATABASE_URL:-postgres://sync:sync@postgres:5432/sync}
      - SYNC_DATABASE_URL=${SYNC_DATABASE_URL:-postgres://sync:sync@postgres:5432/sync}
      - SYNC_DB_POOL=${SYNC_DB_POOL:-3}
      - SYNC_REDPANDA_BOOTSTRAP_SERVERS=${SYNC_REDPANDA_BOOTSTRAP_SERVERS:-redpanda:9092}
      - INTEGRATION_CONSOLE_REDIS_URL=${INTEGRATION_CONSOLE_REDIS_URL:-redis://redis:6379/1}
      - INTEGRATION_CONSOLE_CACHE_TTL_INVENTORY=${INTEGRATION_CONSOLE_CACHE_TTL_INVENTORY:-60}
      - INTEGRATION_CONSOLE_CACHE_TTL_AUDIT_RECENT=${INTEGRATION_CONSOLE_CACHE_TTL_AUDIT_RECENT:-10}
      - INTEGRATION_CONSOLE_CACHE_TTL_DASHBOARD=${INTEGRATION_CONSOLE_CACHE_TTL_DASHBOARD:-15}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-http://minio:9000}
      - MINIO_ACCESS_KEY_ID=${MINIO_ACCESS_KEY_ID:-administrador}
      - MINIO_SECRET_ACCESS_KEY=${MINIO_SECRET_ACCESS_KEY:-senhamaster123}
      - MINIO_BUCKET=${MINIO_BUCKET:-integration-console-exports}
      - LOG_FORMAT=${INTEGRATION_CONSOLE_LOG_FORMAT:-json}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      - OTEL_EXPORTER_OTLP_PROTOCOL=${OTEL_EXPORTER_OTLP_PROTOCOL:-grpc}
      - OTEL_SERVICE_NAME=integration-console-web
      - OTEL_RESOURCE_ATTRIBUTES=service.version=${VCS_REF:-unknown},deployment.environment=${DEPLOYMENT_ENVIRONMENT:-dev},compose.service=integration-console-web
    ports:
      - "3003:3000"

  integration-console-worker:
    depends_on:
      redpanda:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      integration-console-db-setup:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
    build:
      context: .
      dockerfile: apps/integration-console/Dockerfile
    restart: unless-stopped
    command: ["bin/rails", "runner", "Observability::WorkerRunner.run_forever"]
    environment:
      - RAILS_ENV=development
      - DATABASE_URL=${INTEGRATION_CONSOLE_DATABASE_URL:-postgres://sync:sync@postgres:5432/sync}
      - SYNC_DATABASE_URL=${SYNC_DATABASE_URL:-postgres://sync:sync@postgres:5432/sync}
      - SYNC_DB_POOL=${SYNC_DB_POOL:-3}
      - SYNC_REDPANDA_BOOTSTRAP_SERVERS=${SYNC_REDPANDA_BOOTSTRAP_SERVERS:-redpanda:9092}
      - INTEGRATION_CONSOLE_REDIS_URL=${INTEGRATION_CONSOLE_REDIS_URL:-redis://redis:6379/1}
      - PUSHGATEWAY_URL=${PUSHGATEWAY_URL:-http://pushgateway:9091}
      - LOG_FORMAT=${INTEGRATION_CONSOLE_LOG_FORMAT:-json}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      - OTEL_EXPORTER_OTLP_PROTOCOL=${OTEL_EXPORTER_OTLP_PROTOCOL:-grpc}
      - OTEL_SERVICE_NAME=integration-console-worker
      - OTEL_RESOURCE_ATTRIBUTES=service.version=${VCS_REF:-unknown},deployment.environment=${DEPLOYMENT_ENVIRONMENT:-dev},compose.service=integration-console-worker
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/wireless-worker-health && find /tmp/wireless-worker-health -mmin -2 | grep -q ."]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  integration-console-db-setup:
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started
    build:
      context: .
      dockerfile: apps/integration-console/Dockerfile
    restart: "no"
    command: ["sh", "bin/observability-db-setup.sh"]
    environment:
      - RAILS_ENV=development
      - DATABASE_URL=postgres://sync:sync@192.168.1.221:5432/sync
      - SYNC_DATABASE_URL=postgres://sync:sync@192.168.1.221:5432/sync
      - SYNC_DB_POOL=${SYNC_DB_POOL:-3}
      - PUSHGATEWAY_URL=${PUSHGATEWAY_URL:-http://pushgateway:9091}
      - LOG_FORMAT=${INTEGRATION_CONSOLE_LOG_FORMAT:-json}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      - OTEL_EXPORTER_OTLP_PROTOCOL=${OTEL_EXPORTER_OTLP_PROTOCOL:-grpc}
      - OTEL_SERVICE_NAME=integration-console-db-setup
      - OTEL_RESOURCE_ATTRIBUTES=service.version=${VCS_REF:-unknown},deployment.environment=${DEPLOYMENT_ENVIRONMENT:-dev},compose.service=integration-console-db-setup

  integration-console-heatmap-refresh:
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      integration-console-db-setup:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
    build:
      context: .
      dockerfile: apps/integration-console/Dockerfile
    restart: unless-stopped
    command: ["bin/rails", "runner", "Observability::HeatmapRefreshLoop.run_forever"]
    environment:
      - RAILS_ENV=development
      - DATABASE_URL=${INTEGRATION_CONSOLE_DATABASE_URL:-postgres://sync:sync@postgres:5432/sync}
      - SYNC_DATABASE_URL=${SYNC_DATABASE_URL:-postgres://sync:sync@postgres:5432/sync}
      - SYNC_DB_POOL=${SYNC_DB_POOL:-3}
      - INTEGRATION_CONSOLE_REDIS_URL=${INTEGRATION_CONSOLE_REDIS_URL:-redis://redis:6379/1}
      - HEATMAP_REFRESH_INTERVAL_SECONDS=${HEATMAP_REFRESH_INTERVAL_SECONDS:-300}
      - PUSHGATEWAY_URL=${PUSHGATEWAY_URL:-http://pushgateway:9091}
      - LOG_FORMAT=${INTEGRATION_CONSOLE_LOG_FORMAT:-json}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      - OTEL_EXPORTER_OTLP_PROTOCOL=${OTEL_EXPORTER_OTLP_PROTOCOL:-grpc}
      - OTEL_SERVICE_NAME=integration-console-heatmap-refresh
      - OTEL_RESOURCE_ATTRIBUTES=service.version=${VCS_REF:-unknown},deployment.environment=${DEPLOYMENT_ENVIRONMENT:-dev},compose.service=integration-console-heatmap-refresh

  integration-console-heartbeat:
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      integration-console-db-setup:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
    build:
      context: .
      dockerfile: apps/integration-console/Dockerfile
    restart: unless-stopped
    command: ["bin/rails", "runner", "Observability::SensorHeartbeatLoop.run_forever"]
    environment:
      - RAILS_ENV=development
      - DATABASE_URL=${INTEGRATION_CONSOLE_DATABASE_URL:-postgres://sync:sync@postgres:5432/sync}
      - SYNC_DATABASE_URL=${SYNC_DATABASE_URL:-postgres://sync:sync@postgres:5432/sync}
      - SYNC_DB_POOL=${SYNC_DB_POOL:-3}
      - INTEGRATION_CONSOLE_REDIS_URL=${INTEGRATION_CONSOLE_REDIS_URL:-redis://redis:6379/1}
      - SENSOR_HEARTBEAT_MONITOR_INTERVAL_SECONDS=${SENSOR_HEARTBEAT_MONITOR_INTERVAL_SECONDS:-60}
      - PUSHGATEWAY_URL=${PUSHGATEWAY_URL:-http://pushgateway:9091}
      - LOG_FORMAT=${INTEGRATION_CONSOLE_LOG_FORMAT:-json}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      - OTEL_EXPORTER_OTLP_PROTOCOL=${OTEL_EXPORTER_OTLP_PROTOCOL:-grpc}
      - OTEL_SERVICE_NAME=integration-console-heartbeat
      - OTEL_RESOURCE_ATTRIBUTES=service.version=${VCS_REF:-unknown},deployment.environment=${DEPLOYMENT_ENVIRONMENT:-dev},compose.service=integration-console-heartbeat
  atheros-sensor:
    depends_on:
      redpanda:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      java-coordinator:
        condition: service_healthy
    build:
      context: .
      dockerfile: Dockerfile
      target: atheros-sensor
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - /sys/class/net:/sys/class/net:ro
      - sync-outbox:/sync-outbox
    environment:
      <<: *ath_sensor_env
      # The sensor runs in host networking for capture, so Docker service DNS
      # names such as redpanda are not reachable from this container.
      SYNC_REDPANDA_BOOTSTRAP_SERVERS: ${ATH_SENSOR_REDPANDA_BOOTSTRAP_SERVERS:-redpanda://127.0.0.1:19092}
      DATABASE_URL: ${DATABASE_URL:-postgres://sync:sync@127.0.0.1:5432/sync}
      ATH_SENSOR_REQUIRE_HOST_ENDPOINTS: ${ATH_SENSOR_REQUIRE_HOST_ENDPOINTS:-true}
      ATH_SENSOR_DEVICE: ${ATH_SENSOR_DEVICE:-}
      ATH_SENSOR_LOCATION_ID: ${ATH_SENSOR_LOCATION_ID:-default}
      ATH_SENSOR_CHANNEL: ${ATH_SENSOR_CHANNEL:-11}
      ATH_SENSOR_CHANNEL_HOP_ENABLED: ${ATH_SENSOR_CHANNEL_HOP_ENABLED:-false}
      ATH_SENSOR_CHANNEL_HOP_INTERVAL_MS: ${ATH_SENSOR_CHANNEL_HOP_INTERVAL_MS:-1000}
      ATH_SENSOR_REG_DOMAIN: ${ATH_SENSOR_REG_DOMAIN:-US}
      ATH_SENSOR_MAC_DEVICE_LOOKUP_ENABLED: ${ATH_SENSOR_MAC_DEVICE_LOOKUP_ENABLED:-true}
      ATH_SENSOR_CLIENT_INVENTORY_FLUSH_SECS: ${ATH_SENSOR_CLIENT_INVENTORY_FLUSH_SECS:-60}
      ATH_SENSOR_SIGNAL_ANOMALY_DBM_DELTA: ${ATH_SENSOR_SIGNAL_ANOMALY_DBM_DELTA:-15}
      ATH_SENSOR_DEAUTH_FLOOD_THRESHOLD: ${ATH_SENSOR_DEAUTH_FLOOD_THRESHOLD:-20}
      ATH_SENSOR_DEAUTH_FLOOD_WINDOW_SECS: ${ATH_SENSOR_DEAUTH_FLOOD_WINDOW_SECS:-30}
      ATH_SENSOR_DEAUTH_FLOOD_COOLDOWN_SECS: ${ATH_SENSOR_DEAUTH_FLOOD_COOLDOWN_SECS:-60}
      ATH_SENSOR_EXPORT_HANDSHAKES: ${ATH_SENSOR_EXPORT_HANDSHAKES:-false}
      ATH_SENSOR_AUTHORIZED_NETWORK_CACHE_TTL_SECS: ${ATH_SENSOR_AUTHORIZED_NETWORK_CACHE_TTL_SECS:-60}
      ATH_SENSOR_SHUTDOWN_GRACE_SECS: ${ATH_SENSOR_SHUTDOWN_GRACE_SECS:-5}
      ATH_SENSOR_BACKLOG_MAX_ATTEMPTS: ${ATH_SENSOR_BACKLOG_MAX_ATTEMPTS:-10}
      ATH_SENSOR_BACKLOG_MAX_AGE_HOURS: ${ATH_SENSOR_BACKLOG_MAX_AGE_HOURS:-72}
      ATH_SENSOR_REDPANDA_REQUEST_TIMEOUT_MS: ${ATH_SENSOR_REDPANDA_REQUEST_TIMEOUT_MS:-10000}
      ATH_SENSOR_MAC_LOOKUP_ERROR_TTL_SECS: ${ATH_SENSOR_MAC_LOOKUP_ERROR_TTL_SECS:-30}
      ATH_SENSOR_AUDIT_LAYER_STREAM: ${ATH_SENSOR_AUDIT_LAYER_STREAM:-off}
      SYNC_OUTBOX_DIR: /sync-outbox
      RUST_LOG: ${ATH_SENSOR_RUST_LOG:-warn,atheros_sensor=info}
      ATH_SENSOR_METRICS_PORT: ${ATH_SENSOR_METRICS_PORT:-9097}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://localhost:4317}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-grpc}
      OTEL_SERVICE_NAME: atheros-sensor
      OTEL_RESOURCE_ATTRIBUTES: service.version=${VCS_REF:-unknown},deployment.environment=${DEPLOYMENT_ENVIRONMENT:-dev},compose.service=atheros-sensor
    healthcheck:
      test: ["CMD-SHELL", "/usr/local/bin/atheros-sensor healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

  atheros-search:
    profiles:
      - vector
    build:
      context: .
      dockerfile: services/atheros-search/Dockerfile
    restart: unless-stopped
    environment:
      - ATHSEARCH_POSTGRES_DSN=${ATHSEARCH_POSTGRES_DSN:-postgres://sync:sync@192.168.1.221:5432/sync}
      - ATHSEARCH_REDPANDA_BOOTSTRAP=${ATHSEARCH_REDPANDA_BOOTSTRAP:-redpanda:9092}
      - ATHSEARCH_EMBEDDING_BACKEND=${ATHSEARCH_EMBEDDING_BACKEND:-http://host.docker.internal:8083}
      - ATHSEARCH_EMBEDDING_MODEL=${ATHSEARCH_EMBEDDING_MODEL:-nomic-embed-text-v2-moe}
      - ATHSEARCH_EMBEDDING_DIMENSIONS=${ATHSEARCH_EMBEDDING_DIMENSIONS:-768}
      - ATHSEARCH_EVENT_EMBEDDING_SCOPE=${ATHSEARCH_EVENT_EMBEDDING_SCOPE:-high_signal}
      - ATHSEARCH_GRPC_PORT=${ATHSEARCH_GRPC_PORT:-50051}
      - ATHSEARCH_HTTP_PORT=${ATHSEARCH_HTTP_PORT:-8080}
      - ATHSEARCH_METRICS_PORT=${ATHSEARCH_METRICS_PORT:-9090}
      - ATHSEARCH_LOG_LEVEL=${ATHSEARCH_LOG_LEVEL:-debug}
      - ATHSEARCH_AUDIT_TOPIC=${ATHSEARCH_AUDIT_TOPIC:-wireless.audit}
      - ATHSEARCH_BANDWIDTH_TOPIC=${ATHSEARCH_BANDWIDTH_TOPIC:-audit.wireless.bandwidth}
      - ATHSEARCH_CONSUMER_GROUP=${ATHSEARCH_CONSUMER_GROUP:-atheros-search-ingest}
      - ATHSEARCH_WORKER_ENABLED=${ATHSEARCH_WORKER_ENABLED:-true}
      - ATHSEARCH_WORKER_BATCH_SIZE=${ATHSEARCH_WORKER_BATCH_SIZE:-256}
      - ATHSEARCH_WORKER_REQUEST_BATCH_SIZE=${ATHSEARCH_WORKER_REQUEST_BATCH_SIZE:-256}
      - ATHSEARCH_WORKER_REQUEST_BATCH_MAX=${ATHSEARCH_WORKER_REQUEST_BATCH_MAX:-512}
      - ATHSEARCH_WORKER_LEASE_SECONDS=${ATHSEARCH_WORKER_LEASE_SECONDS:-600}
      - ATHSEARCH_WORKER_POLL_INTERVAL_MS=${ATHSEARCH_WORKER_POLL_INTERVAL_MS:-500}
      - ATHSEARCH_WORKER_MAX_DRAIN_BATCHES=${ATHSEARCH_WORKER_MAX_DRAIN_BATCHES:-0}
      - ATHSEARCH_WORKER_MAX_INPUT_TOKENS=${ATHSEARCH_WORKER_MAX_INPUT_TOKENS:-512}
      - ATHSEARCH_WORKER_MAX_CONCURRENT_EMBED=${ATHSEARCH_WORKER_MAX_CONCURRENT_EMBED:-4}
      - ATHSEARCH_WORKER_MAX_CONCURRENT_COMPLETE=${ATHSEARCH_WORKER_MAX_CONCURRENT_COMPLETE:-8}
      - ATHSEARCH_EMBEDDER_ENABLED=${ATHSEARCH_EMBEDDER_ENABLED:-false}
      - ATHSEARCH_INGEST_ENABLED=${ATHSEARCH_INGEST_ENABLED:-false}
      - ATHSEARCH_API_TOKEN_SHA256=${ATHSEARCH_API_TOKEN_SHA256:-}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      - OTEL_EXPORTER_OTLP_PROTOCOL=${OTEL_EXPORTER_OTLP_PROTOCOL:-grpc}
      - OTEL_SERVICE_NAME=atheros-search
      - OTEL_RESOURCE_ATTRIBUTES=service.version=${VCS_REF:-unknown},deployment.environment=${DEPLOYMENT_ENVIRONMENT:-dev},compose.service=atheros-search
    ports:
      - "127.0.0.1:50051:50051"
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:19090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "/usr/local/bin/atheros-search", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  redpanda:
    image: redpandadata/redpanda:latest
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 1G
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - INTERNAL://0.0.0.0:9092,HOST://0.0.0.0:19092
      - --advertise-kafka-addr
      - INTERNAL://redpanda:9092,HOST://127.0.0.1:19092
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster info --brokers 127.0.0.1:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "9092:9092"
      - "127.0.0.1:19092:19092"
      - "9644:9644"
    volumes:
      - redpanda-data:/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    sysctls:
      - net.core.somaxconn=1024
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    sysctls:
      - net.core.somaxconn=1024
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY_ID:-administrador}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_ACCESS_KEY:-senhamaster123}
      - MINIO_PROMETHEUS_AUTH_TYPE=public
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  ollama:
    profiles:
      - vector
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    entrypoint: ["bash"]
    command: ["/config/init.sh"]
    volumes:
      - ./docker/minio:/config:ro
    environment:
      - MINIO_ACCESS_KEY_ID=${MINIO_ACCESS_KEY_ID:-administrador}
      - MINIO_SECRET_ACCESS_KEY=${MINIO_SECRET_ACCESS_KEY:-senhamaster123}
      - MINIO_BUCKET=${MINIO_BUCKET:-integration-console-exports}
      - MINIO_EXTRA_BUCKETS=${MINIO_EXTRA_BUCKETS:-ssl-proxy-wireless-raw-archive}
      - PUSHGATEWAY_URL=${PUSHGATEWAY_URL:-http://pushgateway:9091}

  redpanda-init:
    image: redpandadata/redpanda:latest
    depends_on:
      redpanda:
        condition: service_healthy
    restart: "no"
    environment:
      <<: *ath_sensor_env
      SYNC_REDPANDA_BOOTSTRAP_SERVERS: ${SYNC_REDPANDA_BOOTSTRAP_SERVERS:-redpanda:9092}
      SYNC_REDPANDA_TOPIC_MANIFEST: /config/topics.manifest
      PUSHGATEWAY_URL: ${PUSHGATEWAY_URL:-http://pushgateway:9091}
    volumes:
      - ./docker/redpanda:/config:ro
    entrypoint: ["sh"]
    command: ["/config/bootstrap.sh"]

  postgres:
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - shared_preload_libraries=pg_cron,pg_stat_statements
      - -c
      - cron.database_name=sync
      - -c
      - listen_addresses=*
      - -c
      - track_io_timing=on
    restart: unless-stopped
    shm_size: ${POSTGRES_SHM_SIZE:-256m}
    deploy:
      resources:
        limits:
          cpus: ${POSTGRES_CPUS:-16.0}
          memory: ${POSTGRES_MEMORY:-32G}
        reservations:
          cpus: ${POSTGRES_RESERVED_CPUS:-4.0}
          memory: ${POSTGRES_RESERVED_MEMORY:-16G}
    environment:
      POSTGRES_DB: sync
      POSTGRES_USER: sync
      POSTGRES_PASSWORD: sync
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sync -d sync"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      # /docker-entrypoint-initdb.d is intentionally unused; zig-coordinator
      # applies sql/postgres.sql with psql (shim includes the split sql/* tree).
      - postgres-data:/var/lib/postgresql/data

  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./docker/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/observability/alerts.yml:/etc/prometheus/alerts/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - pushgateway
      - postgres-exporter
      - redis-exporter
      - node-exporter
      - cadvisor
      - otel-collector
      - loki
      - jaeger
    extra_hosts:
      - "host.docker.internal:host-gateway"

  loki:
    image: grafana/loki:3.1.1
    restart: unless-stopped
    command:
      - -config.file=/etc/loki/config.yml
    volumes:
      - ./docker/observability/loki.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    ports:
      - "127.0.0.1:3100:3100"

  promtail:
    image: grafana/promtail:3.1.1
    restart: unless-stopped
    command:
      - -config.file=/etc/promtail/config.yml
    volumes:
      - ./docker/observability/promtail.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail-data:/promtail
    depends_on:
      - loki

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    restart: unless-stopped
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.107.0
    restart: unless-stopped
    command:
      - --config=/etc/otel-collector/config.yml
    volumes:
      - ./docker/observability/otel-collector.yml:/etc/otel-collector/config.yml:ro
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4320:4318"
      - "127.0.0.1:8888:8888"
    depends_on:
      - jaeger

  grafana:
    image: grafana/grafana:11.1.4
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_AUTH_ANONYMOUS_ENABLED=${GRAFANA_ANONYMOUS_ENABLED:-false}
    volumes:
      - ./docker/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3004:3000"
    depends_on:
      - prometheus
      - loki
      - jaeger

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.19.1
    restart: unless-stopped
    environment:
      - DATA_SOURCE_NAME=postgresql://sync:sync@postgres:5432/sync?sslmode=disable
      - PG_EXPORTER_EXTEND_QUERY_PATH=/etc/postgres-exporter/queries.yml
    volumes:
      - ./docker/observability/postgres-exporter-queries.yml:/etc/postgres-exporter/queries.yml:ro
    ports:
      - "9187:9187"
    depends_on:
      postgres:
        condition: service_healthy

  redis-exporter:
    image: oliver006/redis_exporter:v1.61.0
    restart: unless-stopped
    command:
      - --redis.addr=redis://redis:6379
    ports:
      - "127.0.0.1:9121:9121"
    depends_on:
      redis:
        condition: service_healthy

  node-exporter:
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/containers/storage/.+)($$|/)
      - --collector.netdev.device-exclude=^(veth.*|br-.*|docker.*|lo)$$
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro,rslave
    ports:
      - "127.0.0.1:9100:9100"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    ports:
      - "127.0.0.1:8082:8080"

  pushgateway:
    image: prom/pushgateway:v1.8.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:9091:9091"

volumes:
  redpanda-data:
  postgres-data:
  sync-outbox:
  minio-data:
  ollama-data:
  prometheus-data:
  loki-data:
  grafana-data:
  promtail-data:
