x-ath-sensor-env: &ath_sensor_env
  SYNC_NATS_URL: nats://127.0.0.1:4222
  DATABASE_URL: postgres://sync:sync@127.0.0.1:5432/sync

services:
  ssl-proxy:
    depends_on:
      nats:
        condition: service_healthy
      postgres:
        condition: service_healthy
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VCS_REF: ${VCS_REF:-unknown}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    # Compatibility mode: host-mounted peer config files are often 0600 on the host.
    # Run as root so startup key sync/read logic can access /config/peer1/*.conf.
    user: "0:0"
    command: ["/usr/local/bin/start-proxy-wg"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3002/health && /app/ssl-proxy boringtun show wg0 >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    # NET_ADMIN and /dev/net/tun are required for BoringTun to create tun interfaces
    # and manage routes. Risk: container compromise grants network admin + root-in-container.
    # Mitigations: capabilities limited to NET_ADMIN only, no --privileged.
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./config:/config
      - sync-outbox:/sync-outbox
    environment:
      - WG_INTERFACE_NAME=wg0
      - WG_TEMPLATE_PATH=/config/templates/server.conf
      - WG_CONFIG_PATH=/run/wireguard/wg0.conf
      - WG_UAPI_SOCKET_DIR=/var/run/wireguard
      - WG_SERVER_ADDRESS=${WG_SERVER_ADDRESS:-10.13.13.1/24}
      - WG_PORT=${WG_PORT:-443}
      - WG_INTERNAL_PORT=${WG_INTERNAL_PORT:-51820}
      - WG_OBFUSCATION_ENABLED=${WG_OBFUSCATION_ENABLED:-false}
      - WG_OBFUSCATION_KEY=${WG_OBFUSCATION_KEY:-}
      - WG_OBFUSCATION_MAGIC_BYTE=${WG_OBFUSCATION_MAGIC_BYTE:-0xAA}
      - WG_OBFUSCATION_SESSION_IDLE_SECS=${WG_OBFUSCATION_SESSION_IDLE_SECS:-300}
      - WG_MTU=1280
      - WG_WAN_INTERFACE=auto
      - WG_SYSCTL_RETRIES=3
      - WG_SYSCTL_RETRY_DELAY_MS=200
      - WG_RUNTIME_SYSCTLS=0
      - WG_SERVER_PRIVATE_KEY_FILE=/config/server/privatekey-server
      - WG_PEER1_CONFIG_PATH=/config/peer1/peer1.conf
      - WG_OBFUSCATED_PEER1_CONFIG_PATH=/config/peer1/peer1-obfuscated.conf.example
      - WG_PEER1_PUBLIC_KEY_FILE=/config/peer1/publickey-peer1
      - WG_PEER1_PRESHARED_KEY_FILE=/config/peer1/presharedkey-peer1
      - WG_PEER1_ALLOWED_IPS=10.13.13.2/32
      - WG_PEER2_CONFIG_PATH=/config/peer2/peer2.conf
      - WG_OBFUSCATED_PEER2_CONFIG_PATH=/config/peer2/peer2-obfuscated.conf.example
      - WG_PEER2_PUBLIC_KEY_FILE=/config/peer2/publickey-peer2
      - WG_PEER2_PRESHARED_KEY_FILE=/config/peer2/presharedkey-peer2
      - WG_PEER2_ALLOWED_IPS=10.13.13.3/32
      - WG_SUDO=1
      - RUST_LOG=ssl_proxy=info
      - EXPLICIT_PROXY_ENABLED=false
      # Development stacks must set ADMIN_API_KEY; the service rejects empty admin auth.
      - ADMIN_API_KEY=macaco
      - SYNC_NATS_URL=${SYNC_NATS_URL:-nats://nats:4222}
      - SYNC_OUTBOX_DIR=/sync-outbox

    ports:
      # Publish the plain and obfuscated WireGuard UDP entrypoints on the Docker host.
      - "443:443/udp"
      - "51820:51820/udp"
      # Keep policy-enforcement and admin surfaces local to the host.
      - "127.0.0.1:3001:3001"
      - "127.0.0.1:3002:3002"
    # The image also contains /usr/local/bin/wg-obfs-shim plus sample client
    # assets under /app/client-config/ for operators who need to hand out a
    # matching shim setup from the deployed server environment.
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv4.conf.all.rp_filter=0
      - net.ipv4.conf.default.rp_filter=0

  zig-coordinator:
    depends_on:
      nats:
        condition: service_healthy
      nats-bootstrap:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    build:
      context: .
      dockerfile: services/zig-coordinator/Dockerfile
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgres://sync:sync@postgres:5432/sync}
      - SYNC_NATS_URL=${SYNC_NATS_URL:-nats://nats:4222}
      - SYNC_SCHEMA_FILE=/app/src/postgres/schema.sql
      - SYNC_STREAM_NAME=proxy.events
      - SYNC_STREAM_NAMES=${SYNC_STREAM_NAMES:-proxy.events,wireless.audit}
      - SYNC_ORACLE_STREAM_NAMES=${SYNC_ORACLE_STREAM_NAMES:-proxy.events}
      - AUDIT_STREAM_NAME=${AUDIT_STREAM_NAME:-AUDIT_STREAM}
      - SYNC_RESULT_STREAM_NAME=${SYNC_RESULT_STREAM_NAME:-ORACLE_RESULT_STREAM}
      - SYNC_SCAN_SUBJECT=${SYNC_SCAN_SUBJECT:-sync.scan.request}
      - SYNC_LOAD_SUBJECT=${SYNC_LOAD_SUBJECT:-sync.oracle.load}
      - SYNC_RESULT_SUBJECT=${SYNC_RESULT_SUBJECT:-sync.oracle.result}
      - SYNC_SCAN_CONSUMER=${SYNC_SCAN_CONSUMER:-zig-coordinator-scan}
      - SYNC_LOAD_CONSUMER=${SYNC_LOAD_CONSUMER:-oracle-worker-load}
      - SYNC_RESULT_CONSUMER=${SYNC_RESULT_CONSUMER:-zig-coordinator-result}
      - SYNC_OUTBOX_DIR=/sync-outbox
    volumes:
      - sync-outbox:/sync-outbox
    healthcheck:
      test: ["CMD", "/usr/local/bin/zig-coordinator", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  oracle-worker:
    depends_on:
      nats:
        condition: service_healthy
      nats-bootstrap:
        condition: service_completed_successfully
    build:
      context: .
      dockerfile: services/oracle-worker/Dockerfile
    restart: unless-stopped
    volumes:
      - ./lib:/app/lib:ro
      - ./wallet:/app/wallet:ro
      - ./secrets:/run/secrets:ro
      - sync-outbox:/sync-outbox
    environment:
      - SYNC_NATS_URL=${SYNC_NATS_URL:-nats://nats:4222}
      - AUDIT_STREAM_NAME=${AUDIT_STREAM_NAME:-AUDIT_STREAM}
      - SYNC_LOAD_SUBJECT=${SYNC_LOAD_SUBJECT:-sync.oracle.load}
      - SYNC_RESULT_SUBJECT=${SYNC_RESULT_SUBJECT:-sync.oracle.result}
      - SYNC_LOAD_CONSUMER=${SYNC_LOAD_CONSUMER:-oracle-worker-load}
      - SYNC_OUTBOX_DIR=/sync-outbox
      - TNS_ADMIN=/app/wallet
      - LD_LIBRARY_PATH=/app/lib
      - ORACLE_CONN=${ORACLE_CONN:-mainerc_tp}
      - ORACLE_USER=${ORACLE_USER:-USCIS_APP}
      - ORACLE_PASS_FILE=${ORACLE_PASS_FILE:-/run/secrets/oracle_password.txt}
    healthcheck:
      test: ["CMD", "/usr/local/bin/oracle-worker", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  integration-console-web:
    depends_on:
      nats:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      integration-console-db-setup:
        condition: service_completed_successfully
    build:
      context: .
      dockerfile: apps/integration-console/Dockerfile
    restart: unless-stopped
    command: ["bin/rails", "server", "-b", "0.0.0.0"]
    environment:
      - RAILS_ENV=development
      - DATABASE_URL=${INTEGRATION_CONSOLE_DATABASE_URL:-postgres://sync:sync@postgres:5432/sync}
      - SYNC_DATABASE_URL=${SYNC_DATABASE_URL:-postgres://sync:sync@postgres:5432/sync}
      - SYNC_DB_POOL=${SYNC_DB_POOL:-5}
      - SYNC_NATS_URL=${SYNC_NATS_URL:-nats://nats:4222}
      - INTEGRATION_CONSOLE_REDIS_URL=${INTEGRATION_CONSOLE_REDIS_URL:-redis://redis:6379/1}
      - INTEGRATION_CONSOLE_CACHE_TTL_INVENTORY=${INTEGRATION_CONSOLE_CACHE_TTL_INVENTORY:-60}
      - INTEGRATION_CONSOLE_CACHE_TTL_AUDIT_RECENT=${INTEGRATION_CONSOLE_CACHE_TTL_AUDIT_RECENT:-10}
      - INTEGRATION_CONSOLE_CACHE_TTL_DASHBOARD=${INTEGRATION_CONSOLE_CACHE_TTL_DASHBOARD:-15}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-http://minio:9000}
      - MINIO_ACCESS_KEY_ID=${MINIO_ACCESS_KEY_ID:-administrador}
      - MINIO_SECRET_ACCESS_KEY=${MINIO_SECRET_ACCESS_KEY:-senhamaster123}
      - MINIO_BUCKET=${MINIO_BUCKET:-integration-console-exports}
    ports:
      - "3003:3000"

  integration-console-worker:
    depends_on:
      nats:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      integration-console-db-setup:
        condition: service_completed_successfully
    build:
      context: .
      dockerfile: apps/integration-console/Dockerfile
    restart: unless-stopped
    command: ["bin/rails", "runner", "Nats::Subscriber.new.run_forever"]
    environment:
      - RAILS_ENV=development
      - DATABASE_URL=${INTEGRATION_CONSOLE_DATABASE_URL:-postgres://sync:sync@postgres:5432/sync}
      - SYNC_DATABASE_URL=${SYNC_DATABASE_URL:-postgres://sync:sync@postgres:5432/sync}
      - SYNC_DB_POOL=${SYNC_DB_POOL:-5}
      - SYNC_NATS_URL=${SYNC_NATS_URL:-nats://nats:4222}

  integration-console-db-setup:
    depends_on:
      postgres:
        condition: service_healthy
    build:
      context: .
      dockerfile: apps/integration-console/Dockerfile
    restart: "no"
    command: ["bin/rails", "db:migrate"]
    environment:
      - RAILS_ENV=development
      - DATABASE_URL=${INTEGRATION_CONSOLE_DATABASE_URL:-postgres://sync:sync@postgres:5432/sync}
      - SYNC_DATABASE_URL=${SYNC_DATABASE_URL:-postgres://sync:sync@postgres:5432/sync}
      - SYNC_DB_POOL=${SYNC_DB_POOL:-5}

  integration-console-heatmap-refresh:
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      integration-console-db-setup:
        condition: service_completed_successfully
    build:
      context: .
      dockerfile: apps/integration-console/Dockerfile
    restart: unless-stopped
    command: ["sh", "-lc", "while true; do bin/rails runner 'WirelessHeatmap.refresh!'; sleep \"$${HEATMAP_REFRESH_INTERVAL_SECONDS:-300}\"; done"]
    environment:
      - RAILS_ENV=development
      - DATABASE_URL=${INTEGRATION_CONSOLE_DATABASE_URL:-postgres://sync:sync@postgres:5432/sync}
      - SYNC_DATABASE_URL=${SYNC_DATABASE_URL:-postgres://sync:sync@postgres:5432/sync}
      - SYNC_DB_POOL=${SYNC_DB_POOL:-5}
      - INTEGRATION_CONSOLE_REDIS_URL=${INTEGRATION_CONSOLE_REDIS_URL:-redis://redis:6379/1}
      - HEATMAP_REFRESH_INTERVAL_SECONDS=${HEATMAP_REFRESH_INTERVAL_SECONDS:-300}

  integration-console-heartbeat:
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      integration-console-db-setup:
        condition: service_completed_successfully
    build:
      context: .
      dockerfile: apps/integration-console/Dockerfile
    restart: unless-stopped
    command: ["sh", "-lc", "while true; do bin/rails runner 'SensorHeartbeatMonitor.new.call'; sleep \"$${SENSOR_HEARTBEAT_MONITOR_INTERVAL_SECONDS:-60}\"; done"]
    environment:
      - RAILS_ENV=development
      - DATABASE_URL=${INTEGRATION_CONSOLE_DATABASE_URL:-postgres://sync:sync@postgres:5432/sync}
      - SYNC_DATABASE_URL=${SYNC_DATABASE_URL:-postgres://sync:sync@postgres:5432/sync}
      - SYNC_DB_POOL=${SYNC_DB_POOL:-5}
      - INTEGRATION_CONSOLE_REDIS_URL=${INTEGRATION_CONSOLE_REDIS_URL:-redis://redis:6379/1}
      - SENSOR_HEARTBEAT_MONITOR_INTERVAL_SECONDS=${SENSOR_HEARTBEAT_MONITOR_INTERVAL_SECONDS:-60}

  atheros-sensor:
    depends_on:
      nats:
        condition: service_healthy
      nats-bootstrap:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      zig-coordinator:
        condition: service_healthy
    build:
      context: .
      dockerfile: Dockerfile
      target: atheros-sensor
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - /sys/class/net:/sys/class/net:ro
      - sync-outbox:/sync-outbox
    environment:
      <<: *ath_sensor_env
      SYNC_NATS_URL: ${SYNC_NATS_URL:-nats://127.0.0.1:4222}
      DATABASE_URL: ${DATABASE_URL:-postgres://sync:sync@127.0.0.1:5432/sync}
      ATH_SENSOR_REQUIRE_HOST_ENDPOINTS: ${ATH_SENSOR_REQUIRE_HOST_ENDPOINTS:-true}
      ATH_SENSOR_DEVICE: ${ATH_SENSOR_DEVICE:-}
      ATH_SENSOR_LOCATION_ID: ${ATH_SENSOR_LOCATION_ID:-default}
      ATH_SENSOR_CHANNEL: ${ATH_SENSOR_CHANNEL:-11}
      ATH_SENSOR_CHANNEL_HOP_ENABLED: ${ATH_SENSOR_CHANNEL_HOP_ENABLED:-false}
      ATH_SENSOR_CHANNEL_HOP_INTERVAL_MS: ${ATH_SENSOR_CHANNEL_HOP_INTERVAL_MS:-1000}
      ATH_SENSOR_REG_DOMAIN: ${ATH_SENSOR_REG_DOMAIN:-US}
      ATH_SENSOR_MAC_DEVICE_LOOKUP_ENABLED: ${ATH_SENSOR_MAC_DEVICE_LOOKUP_ENABLED:-true}
      ATH_SENSOR_CLIENT_INVENTORY_FLUSH_SECS: ${ATH_SENSOR_CLIENT_INVENTORY_FLUSH_SECS:-60}
      ATH_SENSOR_SIGNAL_ANOMALY_DBM_DELTA: ${ATH_SENSOR_SIGNAL_ANOMALY_DBM_DELTA:-15}
      ATH_SENSOR_DEAUTH_FLOOD_THRESHOLD: ${ATH_SENSOR_DEAUTH_FLOOD_THRESHOLD:-20}
      ATH_SENSOR_DEAUTH_FLOOD_WINDOW_SECS: ${ATH_SENSOR_DEAUTH_FLOOD_WINDOW_SECS:-30}
      ATH_SENSOR_DEAUTH_FLOOD_COOLDOWN_SECS: ${ATH_SENSOR_DEAUTH_FLOOD_COOLDOWN_SECS:-60}
      ATH_SENSOR_EXPORT_HANDSHAKES: ${ATH_SENSOR_EXPORT_HANDSHAKES:-false}
      ATH_SENSOR_AUTHORIZED_NETWORK_CACHE_TTL_SECS: ${ATH_SENSOR_AUTHORIZED_NETWORK_CACHE_TTL_SECS:-60}
      ATH_SENSOR_METRICS_PORT: ${ATH_SENSOR_METRICS_PORT:-}
      ATH_SENSOR_SHUTDOWN_GRACE_SECS: ${ATH_SENSOR_SHUTDOWN_GRACE_SECS:-5}
      ATH_SENSOR_BACKLOG_MAX_ATTEMPTS: ${ATH_SENSOR_BACKLOG_MAX_ATTEMPTS:-10}
      ATH_SENSOR_BACKLOG_MAX_AGE_HOURS: ${ATH_SENSOR_BACKLOG_MAX_AGE_HOURS:-72}
      ATH_SENSOR_MAC_LOOKUP_ERROR_TTL_SECS: ${ATH_SENSOR_MAC_LOOKUP_ERROR_TTL_SECS:-30}
      ATH_SENSOR_AUDIT_LAYER_STREAM: ${ATH_SENSOR_AUDIT_LAYER_STREAM:-off}
      SYNC_OUTBOX_DIR: /sync-outbox
      RUST_LOG: ${ATH_SENSOR_RUST_LOG:-warn,atheros_sensor=info,ssl_proxy=info}
    healthcheck:
      test: ["CMD-SHELL", "/usr/local/bin/atheros-sensor healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8222/varz >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats-data:/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY_ID:-administrador}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_ACCESS_KEY:-senhamaster123}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    entrypoint: ["sh", "-lc"]
    command:
      - |
        until mc alias set local http://minio:9000 "$$MINIO_ACCESS_KEY_ID" "$$MINIO_SECRET_ACCESS_KEY"; do
          sleep 1
        done
        mc mb --ignore-existing "local/$$MINIO_BUCKET"
    environment:
      - MINIO_ACCESS_KEY_ID=${MINIO_ACCESS_KEY_ID:-administrador}
      - MINIO_SECRET_ACCESS_KEY=${MINIO_SECRET_ACCESS_KEY:-senhamaster123}
      - MINIO_BUCKET=${MINIO_BUCKET:-integration-console-exports}

  nats-bootstrap:
    image: natsio/nats-box:0.16.0
    depends_on:
      nats:
        condition: service_healthy
    restart: "no"
    environment:
      <<: *ath_sensor_env
      SYNC_NATS_URL: ${SYNC_NATS_URL:-nats://nats:4222}
      AUDIT_STREAM_NAME: ${AUDIT_STREAM_NAME:-AUDIT_STREAM}
      SYNC_RESULT_STREAM_NAME: ${SYNC_RESULT_STREAM_NAME:-ORACLE_RESULT_STREAM}
      SYNC_SCAN_SUBJECT: ${SYNC_SCAN_SUBJECT:-sync.scan.request}
      SYNC_SCAN_CONSUMER: ${SYNC_SCAN_CONSUMER:-zig-coordinator-scan}
      SYNC_LOAD_SUBJECT: ${SYNC_LOAD_SUBJECT:-sync.oracle.load}
      SYNC_LOAD_CONSUMER: ${SYNC_LOAD_CONSUMER:-oracle-worker-load}
      SYNC_RESULT_SUBJECT: ${SYNC_RESULT_SUBJECT:-sync.oracle.result}
      SYNC_RESULT_CONSUMER: ${SYNC_RESULT_CONSUMER:-zig-coordinator-result}
    volumes:
      - ./docker/nats:/config:ro
    entrypoint: ["sh"]
    command: ["/config/bootstrap.sh"]

  postgres:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: sync
      POSTGRES_USER: sync
      POSTGRES_PASSWORD: sync
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sync -d sync"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      # /docker-entrypoint-initdb.d is intentionally unused; zig-coordinator
      # applies services/zig-coordinator/schema/postgres.sql with psql.
      - postgres-data:/var/lib/postgresql/data

volumes:
  nats-data:
  postgres-data:
  sync-outbox:
  minio-data: