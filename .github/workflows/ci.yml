name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentation:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository and nested repositories
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Validate documentation and Kubernetes delivery policy
        run: make docs-check

  gitops:
    name: Kustomize and Argo CD policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository and nested repositories
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python dependencies
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install GitOps checker dependencies
        run: python -m pip install --requirement scripts/requirements.txt

      - name: Set up kubectl with embedded Kustomize
        uses: azure/setup-kubectl@v4
        with:
          version: v1.36.3

      - name: Render canonical GitOps sources
        run: make gitops-check KUSTOMIZE=kubectl

  runtime-datastore-policy:
    name: Runtime datastore policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python dependencies
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install GitOps checker dependencies
        run: python -m pip install --requirement scripts/requirements.txt

      - name: Reject PostgreSQL and MongoDB runtime paths
        run: scripts/check-runtime-datastores.py

      - name: Test signed cutover evidence
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v

      - name: Validate four-domain TiDB schema
        run: scripts/check-tidb-schema-contract.py

  schema-column-limits:
    name: Schema column limits
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Enforce 15-column table limit
        run: scripts/check-column-limits.sh

  octopus:
    name: Octopus
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository and nested repositories
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
          cache-dependency-path: |
            services/octopus/build.sbt
            services/octopus/project/build.properties
            services/octopus/project/plugins.sbt

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Verify Docker
        run: docker version

      - name: Verify Octopus source identity
        run: make octopus-source-integrity

      - name: Test Octopus
        run: cd services/octopus && sbt test

      - name: Assemble and inspect Octopus artifact
        run: |
          cd services/octopus
          sbt assembly
          python3 ../../scripts/octopus_image_contract.py jar target/scala-3.*/octopus.jar

  traffic-audit:
    name: Traffic audit gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository and nested repositories
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Elixir
        uses: erlef/setup-elixir@v1
        with:
          elixir-version: "1.17.3"
          otp-version: "26.2"

      - name: Restore Mix dependencies
        uses: actions/cache@v4
        with:
          path: services/traffic_audit/deps
          key: ${{ runner.os }}-mix-${{ hashFiles('services/traffic_audit/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Fetch dependencies
        run: cd services/traffic_audit && mix deps.get

      - name: Check formatting and lint
        run: cd services/traffic_audit && mix format --check-formatted && mix credo --strict

      - name: Run tests
        run: cd services/traffic_audit && mix test

      - name: Build escript
        run: cd services/traffic_audit && MIX_ENV=prod mix escript.build

      - name: Reject malformed CLI usage with exit 64
        run: |
          cd services/traffic_audit
          ./traffic-audit run || test $? -eq 64

      - name: Build the runtime image
        run: docker build -t traffic-audit:ci -f services/traffic_audit/Dockerfile services/traffic_audit

      - name: Run the gate in fixture mode inside the image
        run: docker run --rm -e TRAFFIC_AUDIT_CAPTURE_MODE=fixture traffic-audit:ci run $GITHUB_SHA
