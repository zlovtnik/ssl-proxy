name: Helm lint

on:
  pull_request:
    paths:
      - "helm/**"
  push:
    branches:
      - main
    paths:
      - "helm/**"

permissions:
  contents: read

concurrency:
  group: helm-lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: helm lint / template
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: "latest"

      - name: Helm dependency update
        working-directory: helm/ssl-proxy
        run: helm dependency update

      - name: Helm lint
        working-directory: helm/ssl-proxy
        run: helm lint .

      - name: Helm template (default values)
        working-directory: helm/ssl-proxy
        run: helm template test-release . > /dev/null

      - name: Helm template (k8s overlay)
        working-directory: helm/ssl-proxy
        continue-on-error: true
        run: helm template test-release . -f values-k8s.yaml > /dev/null

      - name: Check values.yaml / values-k8s.yaml drift
        run: scripts/check-helm-values-drift.sh helm/ssl-proxy
