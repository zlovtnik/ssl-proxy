apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ssl-proxy-prod-app-stack
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: ssl-proxy
    app.kubernetes.io/component: app-stack
    environment: prod
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: ssl-proxy
  source:
    repoURL: https://github.com/zlovtnik/ssl-proxy.git
    targetRevision: main
    path: cyber-stack/matrix/prod/app-stack
    kustomize: {}
  destination:
    server: https://kubernetes.default.svc
    namespace: prod-ssl-proxy
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - PrunePropagationPolicy=foreground
      - ApplyOutOfSyncOnly=true
      - ServerSideApply=true
