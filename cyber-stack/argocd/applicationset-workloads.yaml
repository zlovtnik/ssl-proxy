apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: ssl-proxy-workloads
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - list:
        elements:
          - name: ssl-proxy-prod-bootstrap
            component: bootstrap
            environment: prod
            path: cyber-stack/matrix/prod/bootstrap
            namespace: prod-ssl-proxy
            server: https://kubernetes.default.svc
          - name: ssl-proxy-prod-data-plane
            component: data-plane
            environment: prod
            path: cyber-stack/matrix/prod/data-plane
            namespace: prod-ssl-proxy
            server: https://kubernetes.default.svc
          - name: ssl-proxy-prod-app-stack
            component: app-stack
            environment: prod
            path: cyber-stack/matrix/prod/app-stack
            namespace: prod-ssl-proxy
            server: https://kubernetes.default.svc
  strategy:
    type: RollingSync
    rollingSync:
      steps:
        - matchExpressions:
            - key: app.kubernetes.io/component
              operator: In
              values: [bootstrap]
        - matchExpressions:
            - key: app.kubernetes.io/component
              operator: In
              values: [data-plane]
        - matchExpressions:
            - key: app.kubernetes.io/component
              operator: In
              values: [app-stack]
  template:
    metadata:
      name: '{{ .name }}'
      namespace: argocd
      labels:
        app.kubernetes.io/part-of: ssl-proxy
        app.kubernetes.io/component: '{{ .component }}'
        environment: '{{ .environment }}'
    spec:
      project: ssl-proxy
      source:
        repoURL: https://github.com/zlovtnik/ssl-proxy.git
        targetRevision: main
        path: '{{ .path }}'
        kustomize: {}
      destination:
        server: '{{ .server }}'
        namespace: '{{ .namespace }}'
      ignoreDifferences:
        - group: apps
          kind: Deployment
          jsonPointers:
            - /spec/template/metadata/annotations/reloader.stakater.com~1last-reloaded-from
        - group: ""
          kind: Secret
          name: cloudflared-tunnel-credentials
          jsonPointers: [/data]
        - group: ""
          kind: Secret
          name: minio-credentials
          jsonPointers: [/data]
        - group: ""
          kind: Secret
          name: observability-credentials
          jsonPointers: [/data]
        - group: ""
          kind: Secret
          name: proxy-admin-key
          jsonPointers: [/data]
        - group: ""
          kind: Secret
          name: proxy-runtime-secrets
          jsonPointers: [/data]
        - group: ""
          kind: Secret
          name: redis-runtime
          jsonPointers: [/data]
        - group: ""
          kind: Secret
          name: schema-migrator-backend
          jsonPointers: [/data]
        - group: ""
          kind: Secret
          name: schema-migrator-bootstrap
          jsonPointers: [/data]
        - group: ""
          kind: Secret
          name: schema-migrator-keycloak
          jsonPointers: [/data]
        - group: ""
          kind: Secret
          name: ssl-proxy-identity-tls
          jsonPointers: [/data]
        - group: ""
          kind: Secret
          name: postgres-atheros-search
          jsonPointers: [/data]
        - group: ""
          kind: Secret
          name: postgres-keycloak
          jsonPointers: [/data]
        - group: ""
          kind: Secret
          name: postgres-octopus
          jsonPointers: [/data]
        - group: ""
          kind: Secret
          name: postgres-schema-migrator
          jsonPointers: [/data]
        - group: ""
          kind: Secret
          name: postgres-schema-owner
          jsonPointers: [/data]
        - group: ""
          kind: Secret
          name: postgres-runtime-tls
          jsonPointers: [/data]
        - group: ""
          kind: Secret
          name: pgbouncer-listener-tls
          jsonPointers: [/data]
        - group: ""
          kind: Secret
          name: pgbouncer-runtime-users
          jsonPointers: [/data]
        - group: ""
          kind: Secret
          name: wireguard-config
          jsonPointers:
            - /data
        - group: ""
          kind: ConfigMap
          name: ssl-proxy-prod-postgres-endpoint
          jsonPointers: [/data]
        - group: ""
          kind: ConfigMap
          name: platform-ready
          jsonPointers: [/data]
        - group: apps
          kind: StatefulSet
          name: ssl-proxy-redpanda
          jsonPointers: [/spec/volumeClaimTemplates]
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
          allowEmpty: false
        syncOptions:
          - PrunePropagationPolicy=foreground
          - ApplyOutOfSyncOnly=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
