apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: ssl-proxy-workloads
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - list:
        elements:
          - name: ssl-proxy-prod-bootstrap
            component: bootstrap
            environment: prod
            path: cyber-stack/matrix/prod/bootstrap
            namespace: prod-ssl-proxy
            server: https://kubernetes.default.svc
          - name: ssl-proxy-prod-data-plane
            component: data-plane
            environment: prod
            path: cyber-stack/matrix/prod/data-plane
            namespace: prod-ssl-proxy
            server: https://kubernetes.default.svc
          - name: ssl-proxy-prod-app-stack
            component: app-stack
            environment: prod
            path: cyber-stack/matrix/prod/app-stack
            namespace: prod-ssl-proxy
            server: https://kubernetes.default.svc
  template:
    metadata:
      name: '{{ .name }}'
      namespace: argocd
      labels:
        app.kubernetes.io/part-of: ssl-proxy
        app.kubernetes.io/component: '{{ .component }}'
        environment: '{{ .environment }}'
    spec:
      project: ssl-proxy
      source:
        repoURL: https://github.com/zlovtnik/ssl-proxy.git
        targetRevision: main
        path: '{{ .path }}'
        kustomize: {}
      destination:
        server: '{{ .server }}'
        namespace: '{{ .namespace }}'
      ignoreDifferences:
        # The host-side synchronizer is the only writer for this platform input.
        # Its validated Vault bundle changes both fields from the empty shell
        # rendered by the bootstrap slice.
        - group: ""
          kind: Secret
          name: pgbouncer-listener-tls
          jsonPointers:
            - /data
            - /type
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
          allowEmpty: false
        syncOptions:
          - PrunePropagationPolicy=foreground
          - ApplyOutOfSyncOnly=true
          - ServerSideApply=true
  templatePatch: |
    {{- if eq .component "data-plane" }}
    spec:
      ignoreDifferences:
        - group: apps
          kind: StatefulSet
          jsonPointers:
            - /spec/volumeClaimTemplates
    {{- end }}
    {{- if eq .environment "staging" }}
    metadata:
      annotations:
        argocd-image-updater.argoproj.io/write-back-method: git
        argocd-image-updater.argoproj.io/git-branch: main
        argocd-image-updater.argoproj.io/write-back-target: kustomization:{{ .path }}
        {{- if eq .component "app-stack" }}
        argocd-image-updater.argoproj.io/image-list: ssl-proxy=192.168.1.242:5000/ssl-proxy:staging,java-coordinator=192.168.1.242:5000/java-coordinator:staging,atheros-sensor=192.168.1.242:5000/atheros-sensor:staging,atheros-search=192.168.1.242:5000/atheros-search:staging,atheros-search-ui=192.168.1.242:5000/atheros-search-ui:staging,schema-migrator-backend=192.168.1.242:5000/schema-migrator-backend:staging,schema-migrator-ui=192.168.1.242:5000/schema-migrator-ui:staging
        argocd-image-updater.argoproj.io/ssl-proxy.update-strategy: digest
        argocd-image-updater.argoproj.io/java-coordinator.update-strategy: digest
        argocd-image-updater.argoproj.io/atheros-sensor.update-strategy: digest
        argocd-image-updater.argoproj.io/atheros-search.update-strategy: digest
        argocd-image-updater.argoproj.io/atheros-search-ui.update-strategy: digest
        argocd-image-updater.argoproj.io/schema-migrator-backend.update-strategy: digest
        argocd-image-updater.argoproj.io/schema-migrator-ui.update-strategy: digest
        {{- end }}
        {{- if eq .component "data-plane" }}
        argocd-image-updater.argoproj.io/image-list: postgres-runtime-schema=192.168.1.242:5000/postgres-runtime-schema:staging
        argocd-image-updater.argoproj.io/postgres-runtime-schema.update-strategy: digest
        {{- end }}
    {{- end }}
