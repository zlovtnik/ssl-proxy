apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dev-ssl-proxy
resources:
  - ../../../base/tidb/statefulset.yaml
  - ../../../base/redpanda/statefulset.yaml
  - ../../../base/minio/statefulset.yaml
  - ../../../base/redis-runtime/deployment.yaml
  - ../../../base/tidb-schema-executor
  - ../../../base/telemetry
images:
  - name: tidb-runtime-schema
    newName: 192.168.1.242:5000/tidb-runtime-schema
    digest: sha256:d6473f4611ae0e29d12b621b8c13e3342241bfeab2522f5facb39d2eafb1cefd
patches:
  - path: ../patches/tidb-replicas.yaml
  - path: ../patches/alloy-positions.yaml
  - target:
      kind: Job
      name: ssl-proxy-tidb-schema-executor
    patch: |-
      - op: replace
        path: /spec/template/metadata/annotations/ssl-proxy.io~1content-hash
        value: schema-migrator-001-10abd5b1ef8462fe4f521e064fc16193e50dec2cf508db34a4b32a9acc59f703
  - target:
      kind: ConfigMap
      name: ssl-proxy-tidb-config
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          ssl-proxy.io/recovery-generation: "2026-08-08-1"
  - target:
      kind: Job
      name: ssl-proxy-redpanda-init
    patch: |-
      - op: add
        path: /metadata/annotations/ssl-proxy.io~1recovery-generation
        value: "2026-08-10-1"
  - target:
      kind: Job
      name: ssl-proxy-tidb-init
    patch: |-
      - op: add
        path: /metadata/annotations/ssl-proxy.io~1recovery-generation
        value: "2026-08-10-1"
