apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dev-ssl-proxy
  # Bootstrap owns this ConfigMap. It remains a local render input because the
  # IDENTITY_HOSTNAME substitution is resolved while app-stack renders.
resources:
- ../../../base/platform-config/configmap.yaml
- ../../../base/proxy/deployment.yaml
- ../../../base/proxy/service.yaml
- ../../../base/java-coordinator/deployment.yaml
- ../../../base/schema-migrator
- ../../../base/atheros-sensor/daemonset.yaml
- ../../../base/atheros-search
images:
- digest: sha256:a0b3699f0d366b3103b04119d12629d9b618b8c91b8186de00ab1f63c37995f5
  name: atheros-search
  newName: 192.168.1.242:5000/atheros-search
- digest: sha256:e0f87044a0ae83c03fcf7fe82e191e058c08b0dc6ccb7ac12b94b4a4a086f0f3
  name: atheros-search-ui
  newName: 192.168.1.242:5000/atheros-search-ui
- digest: sha256:8f4577bfe795824e13f44b812a2085072c96831e5f1427a66419c5bd1c7450ae
  name: atheros-sensor
  newName: 192.168.1.242:5000/atheros-sensor
- digest: sha256:c676a7037ea2373092c5984993d1910c60e0e25f040ae2a4e5b212ca0b15ed45
  name: java-coordinator
  newName: 192.168.1.242:5000/java-coordinator
- digest: sha256:b3a21ef09de93a96f4707860c5612ac9fcb1a17390ba16fa38e5ae1dc2aae69e
  name: schema-migrator-backend
  newName: 192.168.1.242:5000/schema-migrator-backend
- digest: sha256:1dc8ff2dd1868dfc2c98997ca5b538f0ddc39088ac18b6f24f96ed70f3b87443
  name: schema-migrator-ui
  newName: 192.168.1.242:5000/schema-migrator-ui
- digest: sha256:da9a36635e36870eeb7948ed1f892cc44beb70ca72d317c973a0316bb4ee01ef
  name: ssl-proxy
  newName: 192.168.1.242:5000/ssl-proxy
patches:
- path: ../patches/identity-hostname.yaml
- path: ../patches/local-config-annotation.yaml
  target:
    kind: ConfigMap
    labelSelector: app.kubernetes.io/component=platform-config
- path: ../patches/proxy-replicas.yaml
- path: ../patches/octopus-environment.yaml
- path: ../patches/keycloak-recovery.yaml
configurations:
- ../../../base/schema-migrator/kustomizeconfig.yaml
vars:
- fieldref:
    fieldPath: data.IDENTITY_HOSTNAME
  name: IDENTITY_HOSTNAME
  objref:
    apiVersion: v1
    kind: ConfigMap
    name: ssl-proxy-platform-config
