apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dev-ssl-proxy
resources:
  # Keep bootstrap prerequisites in this already-registered Application until
  # the platform has registered the dedicated bootstrap Application. The
  # Namespace manifest disables pruning, so ownership can move safely later.
  - ../namespace.yaml
  - ../../../base/platform-config/serviceaccount.yaml
  - ../../../base/platform-config/configmap.yaml
  - ../../../base/proxy/deployment.yaml
  - ../../../base/proxy/service.yaml
  - ../../../base/java-coordinator/deployment.yaml
  - ../../../base/schema-migrator
  - ../../../base/atheros-sensor/daemonset.yaml
  - ../../../base/atheros-search/deployment.yaml
images:
  - name: ssl-proxy
    newName: 192.168.1.221:5000/ssl-proxy
    digest: sha256:981561e17bef3de5fcffc8d4b7a8658a0524ed6afb81f6a888ab2b0df90387a4
  - name: java-coordinator
    newName: 192.168.1.221:5000/java-coordinator
    digest: sha256:34ce5b4072eebd8809be883ba4f7ffda8bc787614a43b9876c1c543382097cd7
  - name: atheros-sensor
    newName: 192.168.1.221:5000/atheros-sensor
    digest: sha256:9458bb85f29b96b87abc3d84fffa791e219f0584321c035a1f6f2fa036c76937
  - name: atheros-search
    newName: 192.168.1.221:5000/atheros-search
    digest: sha256:3d1317eba8b0c4088e15dc0aa64e16bef88b4a365e81fe528ef41340d98975d3
  - name: atheros-search-ui
    newName: 192.168.1.221:5000/atheros-search-ui
    digest: sha256:dc319805ab7ae99a40049a3259ae5b560ede7380cfe51ee4e88ecfbe7854d1a0
  - name: schema-migrator-backend
    newName: 192.168.1.221:5000/schema-migrator-backend
    digest: sha256:0c323640aaf98ec05e203dd998cb941d15aece7c582570981f3c5cd8799b33e3
  - name: schema-migrator-ui
    newName: 192.168.1.221:5000/schema-migrator-ui
    digest: sha256:dfeda482650825f803fa84ee70b2a1df32bd807aa3e26b398407a4c9be69f536
patches:
  - path: ../patches/identity-hostname.yaml
  - path: ../patches/proxy-replicas.yaml
  - path: ../patches/octopus-environment.yaml
configurations:
  - ../../../base/schema-migrator/kustomizeconfig.yaml
vars:
  - name: IDENTITY_HOSTNAME
    objref:
      apiVersion: v1
      kind: ConfigMap
      name: ssl-proxy-platform-config
    fieldref:
      fieldpath: data.IDENTITY_HOSTNAME
