apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dev-ssl-proxy
resources:
  - ../../../base/platform-config/configmap.yaml
  - ../../../base/proxy/deployment.yaml
  - ../../../base/proxy/service.yaml
  - ../../../base/java-coordinator/deployment.yaml
  - ../../../base/schema-migrator/backend.yaml
  - ../../../base/schema-migrator/ui.yaml
  - ../../../base/schema-migrator/keycloak.yaml
  - ../../../base/schema-migrator/traefik.yaml
  - ../../../base/schema-migrator/configmaps.yaml
  - ../../../base/schema-migrator/bootstrap-job.yaml
  - ../../../base/schema-migrator/validate-job.yaml
  - ../../../base/atheros-sensor/daemonset.yaml
  - ../../../base/atheros-search/deployment.yaml
images:
  - name: ssl-proxy
    newName: 192.168.1.221:5000/ssl-proxy
    newTag: d7f190b
  - name: java-coordinator
    newName: 192.168.1.221:5000/java-coordinator
    newTag: d7f190b
  - name: atheros-sensor
    newName: 192.168.1.221:5000/atheros-sensor
    newTag: d7f190b
  - name: atheros-search
    newName: 192.168.1.221:5000/atheros-search
    newTag: d7f190b
  - name: atheros-search-ui
    newName: 192.168.1.221:5000/atheros-search-ui
    newTag: d7f190b
  - name: schema-migrator-backend
    newName: 192.168.1.221:5000/schema-migrator-backend
    newTag: d7f190b
  - name: schema-migrator-ui
    newName: 192.168.1.221:5000/schema-migrator-ui
    newTag: d7f190b
patches:
  - target:
      kind: ConfigMap
      labelSelector: app.kubernetes.io/component=platform-config
    patch: |-
      - op: add
        path: /metadata/annotations/config.kubernetes.io~1local-config
        value: "true"
  - path: ../patches/proxy-replicas.yaml
  - path: ../patches/octopus-environment.yaml
replacements:
  - source:
      kind: ConfigMap
      name: ssl-proxy-platform-config
      fieldPath: data.IDENTITY_HOSTNAME
    targets:
      - select:
          kind: ConfigMap
          name: ssl-proxy-schema-migrator-traefik
        fieldPaths:
          - data.dynamic\.yaml
        options:
          delimiter: "`"
          index: 1
      - select:
          kind: ConfigMap
          name: ssl-proxy-schema-migrator-traefik
        fieldPaths:
          - data.dynamic\.yaml
        options:
          delimiter: "`"
          index: 7
      - select:
          kind: ConfigMap
          name: ssl-proxy-schema-migrator-traefik
        fieldPaths:
          - data.dynamic\.yaml
        options:
          delimiter: "`"
          index: 11
