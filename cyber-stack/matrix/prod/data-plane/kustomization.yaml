apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: prod-ssl-proxy
resources:
  - ../../../base/redpanda/statefulset.yaml
  - ../../../base/minio/statefulset.yaml
  - ../../../base/redis-runtime/deployment.yaml
  - ../../../base/tidb-schema-executor
  - ../../../base/telemetry
configMapGenerator:
  - name: ssl-proxy-telemetry-prometheus-catalog
    namespace: ssl-proxy
    behavior: merge
    files:
      - external-service-catalog.yml=../config/prometheus/external-service-catalog.yml
images:
  - name: tidb-runtime-schema
    newName: 192.168.1.242:5000/tidb-runtime-schema
    digest: sha256:d6473f4611ae0e29d12b621b8c13e3342241bfeab2522f5facb39d2eafb1cefd
  - name: prom/prometheus
    digest: sha256:508729e0e2d18e11fd742a5a5ca70e557b940a93948c3c95fd0123a6fd538b69
  - name: grafana/grafana
    digest: sha256:121a7a9ece6dc10b969f1f96eed64b4f07dfac0d0b8abc070f7cb83bbde86f63
  - name: grafana/loki
    digest: sha256:efd47c67f9bac88ca29bcf8cb997d9ab29d1848bd0aff579282295542a745952
  - name: grafana/alloy
    digest: sha256:0f4434c92b3e6cdac38bb129b344e1790c246f7b6e2eaffcc16a5fa363240e33
  - name: otel/opentelemetry-collector-contrib
    digest: sha256:c5918f78992ee73b0d6f0e599423ac5ec52dd5d9726733114d6eca53d5a32ed5
patches:
  - path: ../patches/alloy-positions.yaml
  - path: ../patches/jaeger-recovery.yaml
  - path: ../patches/tidb-metrics-bridge.yaml
  - target:
      kind: Job
      name: ssl-proxy-tidb-schema-executor
    patch: |-
      - op: replace
        path: /spec/template/metadata/annotations/ssl-proxy.io~1content-hash
        value: schema-migrator-001-10abd5b1ef8462fe4f521e064fc16193e50dec2cf508db34a4b32a9acc59f703
