apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: prod-ssl-proxy
resources:
- ../../../base/redpanda/statefulset.yaml
- ../../../base/redpanda/networkpolicy.yaml
- ../../../base/redpanda-maintenance
- ../../../base/minio/statefulset.yaml
- ../../../base/redis-runtime/deployment.yaml
- ../../../base/pgbouncer
- ../../../base/postgres-pool-readiness
- ../../../base/postgres-schema-executor
- ../../../base/telemetry
- ../patches/grafana-lan-service.yaml
configMapGenerator:
- behavior: merge
  literals:
  - ACTIVE_TOPICS=sync.scan.request
  - DRY_RUN=false
  name: redpanda-maint-env
  namespace: ssl-proxy
- behavior: merge
  files:
  - external-service-catalog.yml=../config/prometheus/external-service-catalog.yml
  name: ssl-proxy-telemetry-prometheus-catalog
  namespace: ssl-proxy
- files:
  - default.conf=../config/grafana-lan-proxy/default.conf
  name: ssl-proxy-telemetry-grafana-lan-proxy
  namespace: ssl-proxy
images:
- digest: sha256:0521270448f67a8d48602bc1c08ffa22c92091ebd77b8cb127599f5b4bebf304
  name: redpanda-maint
  newName: 192.168.1.242:5000/redpanda-maint
- digest: sha256:0f4434c92b3e6cdac38bb129b344e1790c246f7b6e2eaffcc16a5fa363240e33
  name: grafana/alloy
- digest: sha256:ab5cb380e3ff3172d6c8bd2e7cfd31cce977d2881b260e1f5bc089bf0b759b43
  name: grafana/grafana
- digest: sha256:58a6c186ce78ba04d58bfe2a927eff296ba733a430df09645d56cdc158f3ba08
  name: grafana/loki
- digest: sha256:e7ffdea1db8e1830237169cbc481d52604f68447ce35df8ed5062202c3e3dc29
  name: minio/minio
  newName: 192.168.1.242:5000/minio
- digest: sha256:c5918f78992ee73b0d6f0e599423ac5ec52dd5d9726733114d6eca53d5a32ed5
  name: otel/opentelemetry-collector-contrib
- digest: sha256:8b26761c2469c73d990cae44be6d2d8d14736e6d7e186faee2695d0a2a691d7d
  name: postgres-runtime-schema
  newName: 192.168.1.242:5000/postgres-runtime-schema
- digest: sha256:508729e0e2d18e11fd742a5a5ca70e557b940a93948c3c95fd0123a6fd538b69
  name: prom/prometheus
patches:
- path: ../patches/redpanda-maint-scan-only.yaml
- path: ../patches/external-schema-executor.yaml
- path: ../patches/pgbouncer-external-postgres.yaml
- path: ../patches/alloy-positions.yaml
- path: ../patches/jaeger-recovery.yaml
- path: ../patches/grafana-lan-nodeport.yaml
- patch: |-
    - op: replace
      path: /spec/template/metadata/annotations/ssl-proxy.io~1content-hash
      value: schema-migrator-001-c728bb26dce5f13ec782e924fa61d4f3fe7a981c4611fed0c7c5291d55c621df-runtime-ccd89874c1fc84dd
  target:
    kind: Job
    name: ssl-proxy-postgres-schema-executor
