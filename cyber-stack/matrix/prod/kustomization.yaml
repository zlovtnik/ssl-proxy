      path: /spec/template/metadata/annotations/ssl-proxy.io~1content-hash
      value: schema-migrator-001-c728bb26dce5f13ec782e924fa61d4f3fe7a981c4611fed0c7c5291d55c621df
  target:
    kind: Job
    name: ssl-proxy-postgres-schema-executor
replacements:
- source:
    kind: ConfigMap
    name: ssl-proxy-platform-config
    fieldPath: data.IDENTITY_PUBLIC_ORIGIN
  targets:
  - select:
      kind: Deployment
      name: ssl-proxy-schema-migrator-keycloak
    fieldPaths:
    - spec.template.spec.containers.[name=keycloak].args.2
    options:
      delimiter: "="
      index: 1
