  newName: 192.168.1.242:5000/atheros-search-ui
- digest: sha256:d3bf1e3a262a9520407a15689b0c7a0242ceb3f07b898d17f9fc09db6ec0ec9e
  name: atheros-sensor
  newName: 192.168.1.242:5000/atheros-sensor
- digest: sha256:09747f5da48f27fee8a35205cb1a37953c0c5625f02f81b48667d15e78b1c9d3
  name: java-coordinator
