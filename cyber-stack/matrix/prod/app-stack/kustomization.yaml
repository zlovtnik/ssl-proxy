apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: prod-ssl-proxy
resources:
- ../../../base/platform-config/configmap.yaml
- ../../../base/proxy/deployment.yaml
- ../../../base/proxy/service.yaml
- ../../../base/proxy/networkpolicy.yaml
- ../../../base/java-coordinator/deployment.yaml
- ../../../base/java-coordinator/networkpolicy.yaml
- ../../../base/schema-migrator
- ../../../base/atheros-sensor/daemonset.yaml
- ../../../base/atheros-sensor/networkpolicy.yaml
- ../../../base/atheros-search
- ../../../base/cloudflared
- ../../../base/public-gateway
images:
- digest: sha256:ae28c769c57aaf31655d61e6d902691cf30da2ef33d36b8ca5f8479b0f21f165
  name: atheros-search
  newName: 192.168.1.242:5000/atheros-search
- digest: sha256:ca66e2b679a06bd0c0cec93eccb92e0af3884905b2642e5f0c9f68596b277af8
  name: atheros-search-ui
  newName: 192.168.1.242:5000/atheros-search-ui
- digest: sha256:c7b85139dbcf15c9043622f79ff2ed8931b988286e4977d93c0c14ced5b2f355
  name: atheros-sensor
  newName: 192.168.1.242:5000/atheros-sensor
- digest: sha256:d3c088481ab2e4762f5d77d9ccd4cff091b3bb8e0f9e55b02108ad2cb7b89ee1
  name: java-coordinator
  newName: 192.168.1.242:5000/java-coordinator
- digest: sha256:95a63d737357e6b9b916ffa0a29932886100dbb2ae623eb0196a012c9faac1ec
  name: schema-migrator-backend
  newName: 192.168.1.242:5000/schema-migrator-backend
- digest: sha256:c8ed262700235d499bf8a2d6e02080630972cd8effc558b9e46f7a44ed870f47
  name: schema-migrator-ui
  newName: 192.168.1.242:5000/schema-migrator-ui
- digest: sha256:f81a7bba967e7aacdcb0543e761b2c97533dce179c6998e489599f9f406fd4da
  name: ssl-proxy
  newName: 192.168.1.242:5000/ssl-proxy
patches:
- path: ../patches/identity-hostname.yaml
- path: ../patches/schema-migrator-identity.yaml
- path: ../patches/cloudflare-edge.yaml
- path: ../patches/local-config-annotation.yaml
  target:
    kind: ConfigMap
    labelSelector: app.kubernetes.io/component=platform-config
- path: ../patches/proxy.yaml
- path: ../patches/java-coordinator.yaml
- path: ../patches/atheros-search.yaml
- path: ../patches/atheros-sensor.yaml
- path: ../patches/schema-migrator-images.yaml
- path: ../patches/octopus-runtime.yaml
- path: ../patches/keycloak-direct-postgres.yaml
replacements:
- source:
    fieldPath: data.IDENTITY_PUBLIC_ORIGIN
    kind: ConfigMap
    name: ssl-proxy-platform-config
  targets:
  - fieldPaths:
    - spec.template.spec.containers.[name=keycloak].args.2
    options:
      delimiter: "="
      index: 1
    select:
      kind: Deployment
      name: ssl-proxy-schema-migrator-keycloak
