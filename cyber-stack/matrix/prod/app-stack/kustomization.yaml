apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: prod-ssl-proxy
resources:
- ../../../base/platform-config/configmap.yaml
- ../../../base/proxy/deployment.yaml
- ../../../base/proxy/service.yaml
- ../../../base/proxy/networkpolicy.yaml
- ../../../base/java-coordinator
- ../../../base/schema-migrator
- ../../../base/atheros-sensor/daemonset.yaml
- ../../../base/atheros-sensor/networkpolicy.yaml
- ../../../base/atheros-search
- ../../../base/cloudflared
- ../../../base/public-gateway
- ../../../base/stats-reader
# Gate: bootstrap secret shells and the data-plane platform-ready preflight
# require platform-sync to populate and validate octopus-metrics-store and
# postgres-octopus-metrics before this app-stack slice is healthy.
- ../../../base/octopus-metrics
images:
- digest: sha256:64e01d6e90483a45025a39bc3d65912edda69989ce9609623d11a29cfcf1aa72
  name: atheros-search
  newName: 192.168.1.242:5000/atheros-search
- digest: sha256:107488592905e3b50db83a468c1af2ed43515433849b146d67dcc80dfec2e53f
  name: atheros-search-ui
  newName: 192.168.1.242:5000/atheros-search-ui
- digest: sha256:fa8be40c9278975f4830a2e777d1f5784f596c0eee7f341911ee90defca31ad1
  name: atheros-sensor
  newName: 192.168.1.242:5000/atheros-sensor
- digest: sha256:14023bb9e92f68cc672b0b47f7f0621de47dbb5e2c2100e559b0b2092dfe446e
  name: java-coordinator
  newName: 192.168.1.242:5000/java-coordinator
- digest: sha256:cfd85ae8e02329dd4d6b0f475c9aa4470d3f247b44a1ff4e007c4d74c212204f
  name: schema-migrator-backend
  newName: 192.168.1.242:5000/schema-migrator-backend
- digest: sha256:0cd879ccc37559e9c7807d588a5ab7700b8bd67cf7458cf104ce8157f2f604b9
  name: schema-migrator-ui
  newName: 192.168.1.242:5000/schema-migrator-ui
- digest: sha256:243cb47503ae135d74774c516f5fd875e25a597c7eafae57d04435677bd39aaf
  name: ssl-proxy
  newName: 192.168.1.242:5000/ssl-proxy
- digest: sha256:a8a57952bcee5a17d36c760ae3053d27e132f607417583bfe830e7050ac84c06
  name: stats-reader
  newName: 192.168.1.242:5000/stats-reader
- digest: sha256:68aa74b33318b058db55182a122701ccb8b0a480e00468df8c51413415fb600d
  name: octopus-metrics
  newName: 192.168.1.242:5000/octopus-metrics
patches:
- path: ../patches/identity-hostname.yaml
- path: ../patches/schema-migrator-identity.yaml
- path: ../patches/cloudflare-edge.yaml
- path: ../patches/local-config-annotation.yaml
  target:
    kind: ConfigMap
    labelSelector: app.kubernetes.io/component=platform-config
- path: ../patches/proxy.yaml
- path: ../patches/java-coordinator.yaml
- path: ../patches/atheros-search.yaml
- path: ../patches/atheros-sensor.yaml
- path: ../patches/schema-migrator-images.yaml
- path: ../patches/octopus-runtime.yaml
- path: ../patches/keycloak-direct-postgres.yaml
replacements:
- source:
    fieldPath: data.IDENTITY_PUBLIC_ORIGIN
    kind: ConfigMap
    name: ssl-proxy-platform-config
  targets:
  - fieldPaths:
    - spec.template.spec.containers.[name=keycloak].args.2
    options:
      delimiter: "="
      index: 1
    select:
      kind: Deployment
      name: ssl-proxy-schema-migrator-keycloak
