apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: prod-ssl-proxy
resources:
- ../../../base/platform-config/configmap.yaml
- ../../../base/proxy/deployment.yaml
- ../../../base/proxy/service.yaml
- ../../../base/proxy/networkpolicy.yaml
- ../../../base/java-coordinator
- ../../../base/schema-migrator
- ../../../base/atheros-sensor/daemonset.yaml
- ../../../base/atheros-sensor/networkpolicy.yaml
- ../../../base/atheros-search
- ../../../base/delip-queve
- ../../../base/cloudflared
- ../../../base/public-gateway
- ../../../base/stats-reader
# Gate: bootstrap secret shells and the data-plane platform-ready preflight
# require platform-sync to populate and validate octopus-metrics-store and
# postgres-octopus-metrics before this app-stack slice is healthy.
- ../../../base/octopus-metrics
images:
- digest: sha256:0e99eb582271670cab5fab24ab28ac0e93d03bd5db35883f4626de803514e319
  name: atheros-search
  newName: 192.168.1.242:5000/atheros-search
- digest: sha256:d3afe06af856c2ee2636787ddada522948f1cd8714b1bc6459db6fc996840090
  name: atheros-search-ui
  newName: 192.168.1.242:5000/atheros-search-ui
- digest: sha256:e6158c809c187d27a928d26f98a531997694ee77fc28160ab1c0c91301ba3a37
  name: atheros-sensor
  newName: 192.168.1.242:5000/atheros-sensor
- digest: sha256:331458e59a76dc5e3b57087f960953dadb1a5c31e55b19d103dbbb8c8b80fdca
  name: java-coordinator
  newName: 192.168.1.242:5000/java-coordinator
- digest: sha256:1d35336ea640d18fa1168626d62805379ea54570cdf9ea2069a77a58f504c3ae
  name: schema-migrator-backend
  newName: 192.168.1.242:5000/schema-migrator-backend
- digest: sha256:ec6740e08286b2ecd84b7bc51ca6f932ad880dbf8e855f03e33dcb8a2d05b507
  name: schema-migrator-ui
  newName: 192.168.1.242:5000/schema-migrator-ui
- digest: sha256:0898fa608da492b8ab24ee378ea44419d1e1a21ab327b1bf4bc9461e69c5d096
  name: ssl-proxy
  newName: 192.168.1.242:5000/ssl-proxy
- digest: sha256:c3f09315c12564a595dce2290401c8d6902251c1733ee37b074f799ec4248a3b
  name: stats-reader
  newName: 192.168.1.242:5000/stats-reader
- digest: sha256:3e9852a3fcac850f03fff40e3de5d699c53d520414ad60be0bf696133d976714
  name: octopus-metrics
  newName: 192.168.1.242:5000/octopus-metrics
- digest: sha256:1d5e29a6f0696680afb6bd5fda672c58b855d65d9a1296b72d8a708dd106b4d5
  name: delip-queve-manager
  newName: 192.168.1.242:5000/delip-queve-manager
- digest: sha256:4ea545aeb7e17ab7cb0ef3669536f1a93f38ef34b4d435ac1b3bbd8f1f38bcf4
  name: delip-queve-worker
  newName: 192.168.1.242:5000/delip-queve-worker
patches:
- path: ../patches/identity-hostname.yaml
- path: ../patches/schema-migrator-identity.yaml
- path: ../patches/cloudflare-edge.yaml
- path: ../patches/local-config-annotation.yaml
  target:
    kind: ConfigMap
    labelSelector: app.kubernetes.io/component=platform-config
- path: ../patches/proxy.yaml
- path: ../patches/java-coordinator.yaml
- path: ../patches/java-coordinator-broker-drain.yaml
- path: ../patches/octopus-broker-recovery.yaml
- path: ../patches/atheros-search.yaml
- path: ../patches/atheros-sensor.yaml
- path: ../patches/schema-migrator-images.yaml
- path: ../patches/octopus-runtime.yaml
- path: ../patches/keycloak-direct-postgres.yaml
- path: ../patches/dq-preparation.yaml
configMapGenerator:
- name: ssl-proxy-dq-atheros-dedup-v0-1-0
  behavior: merge
  files:
  - manifest.json=../config/dq/atheros-dedup-v0.1.0.json
replacements:
- source:
    fieldPath: data.IDENTITY_PUBLIC_ORIGIN
    kind: ConfigMap
    name: ssl-proxy-platform-config
  targets:
  - fieldPaths:
    - spec.template.spec.containers.[name=keycloak].args.2
    options:
      delimiter: "="
      index: 1
    select:
      kind: Deployment
      name: ssl-proxy-schema-migrator-keycloak
