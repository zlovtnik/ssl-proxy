apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: prod-ssl-proxy
resources:
  - ../namespace.yaml
  - ../../../base/platform-config/serviceaccount.yaml
  - ../../../base/platform-config/configmap.yaml
  - ../../../base/platform-config/default-deny-networkpolicy.yaml
  - ../../../base/platform-sync/serviceaccount.yaml
  - ../../../base/platform-sync/role.yaml
  - ../../../base/platform-sync/rolebinding.yaml
  - ../../../base/platform-sync/targets.yaml
  - ../../../base/reloader/serviceaccount.yaml
  - ../../../base/reloader/role.yaml
  - ../../../base/reloader/rolebinding.yaml
  - ../../../base/reloader/deployment.yaml
  - ../../../base/reloader/networkpolicy.yaml
patches:
  - path: ../patches/identity-hostname.yaml
  - patch: |-
      - op: replace
        path: /metadata/name
        value: ssl-proxy-prod-postgres-endpoint
    target:
      version: v1
      kind: ConfigMap
      name: ssl-proxy-postgres-endpoint
  - path: ../patches/platform-sync-target.yaml
