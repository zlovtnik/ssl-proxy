apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-pgbouncer
  namespace: ssl-proxy
  annotations:
    ssl-proxy.io/postgres-reset-maintenance: "true"
spec:
  replicas: 0
---
apiVersion: batch/v1
kind: Job
metadata:
  name: ssl-proxy-postgres-schema-executor
  namespace: ssl-proxy
  annotations:
    argocd.argoproj.io/hook: Skip
    ssl-proxy.io/postgres-reset-maintenance: "true"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: ssl-proxy-postgres-pool-readiness
  namespace: ssl-proxy
  annotations:
    argocd.argoproj.io/hook: Skip
    ssl-proxy.io/postgres-reset-maintenance: "true"
