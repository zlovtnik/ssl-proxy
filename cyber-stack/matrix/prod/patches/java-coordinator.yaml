apiVersion: apps/v1
kind: Deployment
metadata:
  name: ssl-proxy-java-coordinator
  namespace: ssl-proxy
spec:
  replicas: 1
  # Stop the old consumer before starting its replacement; Kafka retains work.
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        # Recreate terminally failed processors after the data-plane upgrade.
        ssl-proxy.io/atheros-search-schema-version: "004"
    spec:
      containers:
        - name: java-coordinator
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:+UseZGC -XX:+ZGenerational -XX:InitialRAMPercentage=40 -XX:MaxRAMPercentage=60 -XX:+ExitOnOutOfMemoryError"
          resources:
            limits:
              cpu: "2"
              memory: 4Gi
            requests:
              cpu: "1"
              memory: 2Gi
