apiVersion: batch/v1
kind: Job
metadata:
  name: ssl-proxy-postgres-schema-executor
  namespace: ssl-proxy
spec:
  template:
    spec:
      containers:
        - name: schema
          env:
            - name: POSTGRES_HOST
              value: null
              valueFrom:
                configMapKeyRef:
                  name: ssl-proxy-prod-postgres-endpoint
                  key: POSTGRES_HOST
            - name: POSTGRES_PORT
              value: null
              valueFrom:
                configMapKeyRef:
                  name: ssl-proxy-prod-postgres-endpoint
                  key: POSTGRES_PORT
            - name: POSTGRES_DATABASE
              value: null
              valueFrom:
                configMapKeyRef:
                  name: ssl-proxy-prod-postgres-endpoint
                  key: POSTGRES_DATABASE
            - name: PGSSLMODE
              value: null
              valueFrom:
                configMapKeyRef:
                  name: ssl-proxy-prod-postgres-endpoint
                  key: POSTGRES_SSL_MODE
            - name: POSTGRES_SSL_SERVER_NAME
              valueFrom:
                configMapKeyRef:
                  name: ssl-proxy-prod-postgres-endpoint
                  key: POSTGRES_SSL_SERVER_NAME
