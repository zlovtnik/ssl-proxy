apiVersion: apps/v1
kind: Deployment
metadata:
  name: ssl-proxy-java-coordinator
  namespace: ssl-proxy
spec:
  template:
    spec:
      containers:
        - name: java-coordinator
          env:
            - name: OCTOPUS_PUBLIC_STATS_ALLOWED_ORIGINS
              value: "https://rclabs.uk,https://www.rclabs.uk,https://palm-beauty-99316208.figma.site"
            # Single-broker production requires RF=1; raise this with broker count.
            - name: SYNC_REDPANDA_TOPIC_REPLICATION_FACTOR
              value: "1"
