apiVersion: apps/v1
kind: Deployment
metadata:
  name: ssl-proxy-telemetry-jaeger
  namespace: ssl-proxy
spec:
  template:
    spec:
      containers:
        - name: jaeger
          env:
            # Leave 1 GiB for Badger mappings, page cache and non-Go memory.
            - name: GOMEMLIMIT
              value: "3GiB"
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
          startupProbe:
            failureThreshold: 180
