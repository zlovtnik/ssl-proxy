apiVersion: v1
kind: ConfigMap
metadata:
  name: ssl-proxy-cloudflared
  namespace: ssl-proxy
data:
  config.yaml: |
    tunnel: 00000000-0000-0000-0000-000000000000
    credentials-file: /etc/cloudflared/credentials/credentials.json
    ingress:
      - hostname: staging-gateway.rclabs.uk
        service: https://traefik.kube-system.svc.cluster.local:443
        originRequest:
          originServerName: staging-gateway.rclabs.uk
          httpHostHeader: staging-gateway.rclabs.uk
          caPool: /etc/cloudflared/origin-ca/ca.crt
          connectTimeout: 10s
          tlsTimeout: 10s
          keepAliveTimeout: 90s
      - service: http_status:404
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ssl-proxy-public-gateway
  namespace: ssl-proxy
spec:
  routes:
    - kind: Rule
      match: Host(`staging-gateway.rclabs.uk`) && (PathPrefix(`/realms/middleware`) || PathPrefix(`/resources/`))
      priority: 300
      middlewares: [{name: ssl-proxy-public-security-headers}, {name: ssl-proxy-public-rate-limit}]
      services: [{kind: Service, name: ssl-proxy-schema-migrator-keycloak, port: 8080, scheme: http}]
    - kind: Rule
      match: Host(`staging-gateway.rclabs.uk`) && PathPrefix(`/api/`) && !Path(`/api/health`)
      priority: 200
      middlewares: [{name: ssl-proxy-public-security-headers}, {name: ssl-proxy-public-rate-limit}, {name: ssl-proxy-public-body-limit}]
      services: [{kind: Service, name: ssl-proxy-schema-migrator-backend, port: 8080, scheme: http}]
    - kind: Rule
      match: Host(`staging-gateway.rclabs.uk`) && PathPrefix(`/v1/`)
      priority: 100
      middlewares: [{name: ssl-proxy-public-security-headers}, {name: ssl-proxy-public-rate-limit}, {name: ssl-proxy-public-body-limit}]
      services: [{kind: Service, name: ssl-proxy-atheros-search, port: 8080, scheme: http}]
