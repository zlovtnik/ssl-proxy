apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-pgbouncer
  namespace: ssl-proxy
spec:
  template:
    spec:
      initContainers:
        - name: render-pgbouncer-config
          env:
            - {name: POSTGRES_HOST, value: null, valueFrom: {configMapKeyRef: {name: ssl-proxy-staging-postgres-endpoint, key: POSTGRES_HOST}}}
            - {name: POSTGRES_PORT, value: null, valueFrom: {configMapKeyRef: {name: ssl-proxy-staging-postgres-endpoint, key: POSTGRES_PORT}}}
            - {name: POSTGRES_DATABASE, value: null, valueFrom: {configMapKeyRef: {name: ssl-proxy-staging-postgres-endpoint, key: POSTGRES_DATABASE}}}
            - {name: POSTGRES_SSL_MODE, value: null, valueFrom: {configMapKeyRef: {name: ssl-proxy-staging-postgres-endpoint, key: POSTGRES_SSL_MODE}}}
            - {name: POSTGRES_SSL_SERVER_NAME, value: null, valueFrom: {configMapKeyRef: {name: ssl-proxy-staging-postgres-endpoint, key: POSTGRES_SSL_SERVER_NAME}}}
