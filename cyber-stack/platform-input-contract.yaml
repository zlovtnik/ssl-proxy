apiVersion: platform.ssl-proxy.io/v1alpha1
kind: PlatformInputContract
metadata:
  name: ssl-proxy-prod
spec:
  environment: prod
  namespace: prod-ssl-proxy
  source:
    provider: hashicorp-vault
    engine: kv-v2
    mount: secret
    pathPrefix: secret/ssl-proxy/prod
  apply:
    writerIdentity: platform-owned
    validateAllKeysBeforeWrite: true
    idempotent: true
    neverLogValues: true
  validation:
    identityCertificate:
      secretName: ssl-proxy-identity-tls
      dnsName: identity.prod.ssl-proxy.internal
    lokiHtpasswd:
      secretName: observability-credentials
      usernameKey: loki-username
      passwordKey: loki-password
      htpasswdKey: loki-htpasswd
    postgres:
      endpointConfigMapName: ssl-proxy-prod-postgres-endpoint
      database: sync
      transport: tls-verify-full
      tlsSecretName: postgres-runtime-tls
      grantMatrixDocument: sql/postgres
      accounts:
        postgres-atheros-search: atheros_search_runtime
        postgres-keycloak: keycloak_runtime
        postgres-octopus: octopus_runtime
        postgres-schema-migrator: schema_migrator_runtime
        postgres-schema-owner: schema_owner
  inputs:
    - kind: Secret
      name: minio-credentials
      type: Opaque
      vaultPath: secret/ssl-proxy/prod/minio-credentials
      keys:
        - access-key
        - secret-key
    - kind: Secret
      name: observability-credentials
      type: Opaque
      vaultPath: secret/ssl-proxy/prod/observability-credentials
      keys:
        - grafana-admin-password
        - loki-username
        - loki-password
        - loki-htpasswd
        - alertmanager-webhook-url
        - jenkins-prometheus-password
        - minio-prometheus-bearer-token
    - kind: Secret
      name: proxy-admin-key
      type: Opaque
      vaultPath: secret/ssl-proxy/prod/proxy-admin-key
      keys:
        - api-key
    - kind: Secret
      name: proxy-runtime-secrets
      type: Opaque
      vaultPath: secret/ssl-proxy/prod/proxy-runtime-secrets
      keys:
        - wg-obfuscation-key
    - kind: Secret
      name: redis-runtime
      type: Opaque
      vaultPath: secret/ssl-proxy/prod/redis-runtime
      keys:
        - password
    - kind: Secret
      name: schema-migrator-backend
      type: Opaque
      vaultPath: secret/ssl-proxy/prod/schema-migrator-backend
      keys:
        - encrypt-key
        - jwt-secret
        - api-bearer-token
    - kind: Secret
      name: schema-migrator-bootstrap
      type: Opaque
      vaultPath: secret/ssl-proxy/prod/schema-migrator-bootstrap
      keys:
        - application-admin-password
    - kind: Secret
      name: schema-migrator-keycloak
      type: Opaque
      vaultPath: secret/ssl-proxy/prod/schema-migrator-keycloak
      keys:
        - bootstrap-admin-password
    - kind: Secret
      name: ssl-proxy-identity-tls
      type: kubernetes.io/tls
      vaultPath: secret/ssl-proxy/prod/ssl-proxy-identity-tls
      keys:
        - tls.crt
        - tls.key
    - kind: Secret
      name: postgres-atheros-search
      type: Opaque
      vaultPath: secret/ssl-proxy/prod/postgres-atheros-search
      keys:
        - password
    - kind: Secret
      name: postgres-keycloak
      type: Opaque
      vaultPath: secret/ssl-proxy/prod/postgres-keycloak
      keys:
        - password
    - kind: Secret
      name: postgres-octopus
      type: Opaque
      vaultPath: secret/ssl-proxy/prod/postgres-octopus
      keys:
        - password
    - kind: Secret
      name: postgres-schema-migrator
      type: Opaque
      vaultPath: secret/ssl-proxy/prod/postgres-schema-migrator
      keys:
        - password
    - kind: Secret
      name: postgres-schema-owner
      type: Opaque
      vaultPath: secret/ssl-proxy/prod/postgres-schema-owner
      keys:
        - password
    - kind: Secret
      name: postgres-runtime-tls
      type: Opaque
      vaultPath: secret/ssl-proxy/prod/postgres-runtime-tls
      keys:
        - ca.crt
    - kind: Secret
      name: pgbouncer-runtime-users
      type: Opaque
      vaultPath: secret/ssl-proxy/prod/pgbouncer-runtime-users
      keys:
        - userlist.txt
    - kind: Secret
      name: wireguard-config
      type: Opaque
      vaultPath: secret/ssl-proxy/prod/wireguard-config
      keys:
        - server.conf
        - Corefile
        - privatekey-server
        - publickey-server
        - peer1.conf
        - peer1-obfuscated.conf
        - publickey-peer1
        - presharedkey-peer1
        - peer2.conf
        - peer2-obfuscated.conf
        - publickey-peer2
        - presharedkey-peer2
    - kind: ConfigMap
      name: ssl-proxy-prod-postgres-endpoint
      vaultPath: secret/ssl-proxy/prod/ssl-proxy-prod-postgres-endpoint
      keys:
        - POSTGRES_HOST
        - POSTGRES_PORT
        - POSTGRES_DATABASE
        - POSTGRES_SSL_MODE
        - POSTGRES_SSL_SERVER_NAME
