apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ssl-proxy-platform-sync
  labels:
    app.kubernetes.io/name: ssl-proxy
    app.kubernetes.io/component: platform-sync
    app.kubernetes.io/managed-by: kustomize
rules:
- apiGroups:
  - ''
  resources:
  - secrets
  resourceNames:
  - cloudflared-tunnel-credentials
  - minio-credentials
  - observability-credentials
  - pgbouncer-listener-tls
  - pgbouncer-runtime-users
  - postgres-atheros-search
  - postgres-keycloak
  - postgres-octopus
  - postgres-runtime-tls
  - postgres-schema-migrator
  - postgres-schema-owner
  - proxy-admin-key
  - proxy-runtime-secrets
  - redis-runtime
  - schema-migrator-backend
  - schema-migrator-bootstrap
  - schema-migrator-keycloak
  - ssl-proxy-identity-tls
  - wireguard-config
  verbs:
  - get
  - update
- apiGroups:
  - ''
  resources:
  - configmaps
  resourceNames:
  - platform-sync-lock
  - platform-ready
  - ssl-proxy-postgres-endpoint
  verbs:
  - get
  - update
