apiVersion: apps/v1
kind: Deployment
metadata:
  name: ssl-proxy-telemetry-prometheus
  namespace: ssl-proxy
  labels:
    app.kubernetes.io/name: ssl-proxy
    app.kubernetes.io/component: telemetry-prometheus
    app.kubernetes.io/managed-by: kustomize
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ssl-proxy
      app.kubernetes.io/component: telemetry-prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ssl-proxy
        app.kubernetes.io/component: telemetry-prometheus
    spec:
      serviceAccountName: ssl-proxy
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 65534
        runAsNonRoot: true
        runAsUser: 65534
      containers:
        - name: prometheus
          image: prom/prometheus:v3.2.1
          imagePullPolicy: Always
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--storage.tsdb.retention.time=15d"
            - "--web.console.libraries=/etc/prometheus/console_libraries"
            - "--web.console.templates=/etc/prometheus/consoles"
          ports:
            - containerPort: 9090
              name: http
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: ssl-proxy-telemetry-prometheus-config
        - name: data
          persistentVolumeClaim:
            claimName: ssl-proxy-telemetry-prometheus-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ssl-proxy-telemetry-prometheus-data
  namespace: ssl-proxy
  labels:
    app.kubernetes.io/name: ssl-proxy
    app.kubernetes.io/component: telemetry-prometheus
    app.kubernetes.io/managed-by: kustomize
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ssl-proxy-telemetry-prometheus
  namespace: ssl-proxy
  labels:
    app.kubernetes.io/name: ssl-proxy
    app.kubernetes.io/component: telemetry-prometheus
    app.kubernetes.io/managed-by: kustomize
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ssl-proxy
    app.kubernetes.io/component: telemetry-prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
      protocol: TCP
