apiVersion: apps/v1
kind: Deployment
metadata:
  name: ssl-proxy-telemetry-otel-collector
  namespace: ssl-proxy
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/name: ssl-proxy
    app.kubernetes.io/component: telemetry-otel-collector
    app.kubernetes.io/managed-by: kustomize
spec:
  revisionHistoryLimit: 3
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ssl-proxy
      app.kubernetes.io/component: telemetry-otel-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ssl-proxy
        app.kubernetes.io/component: telemetry-otel-collector
    spec:
      serviceAccountName: ssl-proxy
      automountServiceAccountToken: false
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.120.0@sha256:c5918f78992ee73b0d6f0e599423ac5ec52dd5d9726733114d6eca53d5a32ed5
          imagePullPolicy: IfNotPresent
          args:
            - "--config=/etc/otelcol/config.yaml"
          env:
            - name: ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: ssl-proxy-platform-config
                  key: ENVIRONMENT
          ports:
            - containerPort: 4317
              name: otlp-grpc
            - containerPort: 4318
              name: otlp-http
            - containerPort: 8888
              name: metrics
            - containerPort: 8889
              name: prom-exporter
            - containerPort: 13133
              name: health
          livenessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: ssl-proxy-telemetry-otel-collector-config
---
apiVersion: v1
kind: Service
metadata:
  name: ssl-proxy-telemetry-otel-collector
  namespace: ssl-proxy
  labels:
    app.kubernetes.io/name: ssl-proxy
    app.kubernetes.io/component: telemetry-otel-collector
    app.kubernetes.io/managed-by: kustomize
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ssl-proxy
    app.kubernetes.io/component: telemetry-otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
      protocol: TCP
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
      protocol: TCP
    - name: metrics
      port: 8888
      targetPort: metrics
      protocol: TCP
    - name: prom-exporter
      port: 8889
      targetPort: prom-exporter
      protocol: TCP
    - name: health
      port: 13133
      targetPort: health
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ssl-proxy-telemetry-otel-collector
  namespace: ssl-proxy
  labels:
    app.kubernetes.io/name: ssl-proxy
    app.kubernetes.io/component: telemetry-otel-collector
    app.kubernetes.io/managed-by: kustomize
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ssl-proxy
      app.kubernetes.io/component: telemetry-otel-collector
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
      ports:
        - {protocol: TCP, port: 4317}
        - {protocol: TCP, port: 4318}
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/component: telemetry-prometheus}
        - podSelector:
            matchLabels: {app.kubernetes.io/component: telemetry-blackbox-exporter}
      ports:
        - {protocol: TCP, port: 8888}
        - {protocol: TCP, port: 8889}
        - {protocol: TCP, port: 13133}
