apiVersion: apps/v1
kind: Deployment
metadata:
  name: ssl-proxy-telemetry-blackbox-exporter
  namespace: ssl-proxy
  labels:
    app.kubernetes.io/name: ssl-proxy
    app.kubernetes.io/component: telemetry-blackbox-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ssl-proxy
      app.kubernetes.io/component: telemetry-blackbox-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ssl-proxy
        app.kubernetes.io/component: telemetry-blackbox-exporter
    spec:
      serviceAccountName: ssl-proxy
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: blackbox-exporter
          image: prom/blackbox-exporter:v0.28.0
          args: ["--config.file=/etc/blackbox/blackbox.yml"]
          ports:
            - {name: http, containerPort: 9115}
          readinessProbe:
            httpGet: {path: /-/healthy, port: http}
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: {path: /-/healthy, port: http}
            initialDelaySeconds: 15
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            readOnlyRootFilesystem: true
          volumeMounts:
            - {name: config, mountPath: /etc/blackbox, readOnly: true}
      volumes:
        - name: config
          configMap: {name: ssl-proxy-telemetry-blackbox-config}
---
apiVersion: v1
kind: Service
metadata:
  name: ssl-proxy-telemetry-blackbox-exporter
  namespace: ssl-proxy
spec:
  selector:
    app.kubernetes.io/name: ssl-proxy
    app.kubernetes.io/component: telemetry-blackbox-exporter
  ports:
    - {name: http, port: 9115, targetPort: http}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ssl-proxy-telemetry-blackbox-exporter
  namespace: ssl-proxy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ssl-proxy
      app.kubernetes.io/component: telemetry-blackbox-exporter
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/component: telemetry-prometheus}
      ports:
        - {protocol: TCP, port: 9115}
