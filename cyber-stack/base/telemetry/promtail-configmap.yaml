apiVersion: v1
kind: ConfigMap
metadata:
  name: ssl-proxy-telemetry-alloy-config
  namespace: ssl-proxy
  labels:
    app.kubernetes.io/name: ssl-proxy
    app.kubernetes.io/component: telemetry-alloy
    app.kubernetes.io/managed-by: kustomize
data:
  config.alloy: |
    loki.write "default" {
      endpoint {
        url = "http://ssl-proxy-telemetry-loki:3100/loki/api/v1/push"
      }
    }

    loki.source.journal "default" {
      max_age = "12h"
      labels = {
        job = "systemd-journal",
      }
      relabel_rules {
        rule {
          source_labels = ["__systemd_unit"]
          target_label = "unit"
        }
      }
      forward_to = [loki.write.default.receiver]
    }

    loki.source.files "default" {
      targets = [
        {__path__ = "/var/log/containers/*.log", job = "container-logs"},
      ]
      forward_to = [loki.process.default.receiver]
    }

    loki.process "default" {
      stage.cri {}

      stage.regex {
        expression = "^(?P<pod_name>[^_]+)_(?P<namespace>[^_]+)_(?P<container>.+)-(?P<container_id>[a-f0-9]+)\\.log$"
        source = "filename"
      }

      stage.labels {
        values = {
          pod_name = "",
          namespace = "",
          container = "",
        }
      }

      forward_to = [loki.write.default.receiver]
    }
