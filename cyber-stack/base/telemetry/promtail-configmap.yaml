apiVersion: v1
kind: ConfigMap
metadata:
  name: ssl-proxy-telemetry-alloy-config
  namespace: ssl-proxy
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/name: ssl-proxy
    app.kubernetes.io/component: telemetry-alloy
    app.kubernetes.io/managed-by: kustomize
data:
  config.alloy: |
    loki.write "default" {
      endpoint {
        url = "http://ssl-proxy-telemetry-loki:3100/loki/api/v1/push"
        tenant_id = "ssl-proxy"
        basic_auth {
          username = sys.env("LOKI_USERNAME")
          password = sys.env("LOKI_PASSWORD")
        }
      }
    }

    loki.relabel "journal" {
      forward_to = []

      rule {
        source_labels = ["__journal__systemd_unit"]
        target_label  = "unit"
      }
    }

    loki.source.journal "default" {
      max_age = "12h"
      labels = {
        job = "systemd-journal",
      }
      relabel_rules = loki.relabel.journal.rules
      forward_to = [loki.write.default.receiver]
    }

    local.file_match "default" {
      path_targets = [
        {__path__ = "/var/log/containers/*.log", job = "container-logs"},
      ]
    }

    loki.source.file "default" {
      targets = local.file_match.default.targets
      forward_to = [loki.process.default.receiver]
    }

    loki.process "default" {
      stage.cri {}

      stage.regex {
        expression = "^.*/(?P<pod_name>[^_]+)_(?P<namespace>[^_]+)_(?P<container>.+)-(?P<container_id>[a-f0-9]+)\\.log$"
        source = "filename"
      }

      stage.labels {
        values = {
          pod_name = "",
          namespace = "",
          container = "",
        }
      }

      forward_to = [loki.write.default.receiver]
    }
