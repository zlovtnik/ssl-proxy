apiVersion: v1
kind: ConfigMap
metadata:
  name: ssl-proxy-telemetry-grafana-datasources
  namespace: ssl-proxy
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/name: ssl-proxy
    app.kubernetes.io/component: telemetry-grafana
    app.kubernetes.io/managed-by: kustomize
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://ssl-proxy-telemetry-prometheus:9090
        isDefault: true
        editable: false
      - name: Loki
        type: loki
        access: proxy
        url: http://ssl-proxy-telemetry-loki:3100
        editable: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ssl-proxy-telemetry-grafana-dashboard-provider
  namespace: ssl-proxy
  labels:
    app.kubernetes.io/name: ssl-proxy
    app.kubernetes.io/component: telemetry-grafana
    app.kubernetes.io/managed-by: kustomize
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: default
        orgId: 1
        folder: "ssl-proxy"
        type: file
        disableDeletion: false
        editable: false
        options:
          path: /var/lib/grafana/dashboards
          foldersFromFilesStructure: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ssl-proxy-telemetry-grafana-dashboards
  namespace: ssl-proxy
  labels:
    app.kubernetes.io/name: ssl-proxy
    app.kubernetes.io/component: telemetry-grafana
    app.kubernetes.io/managed-by: kustomize
data:
  ssl-proxy-overview.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "title": "SSL Proxy Overview",
      "uid": "ssl-proxy-overview",
      "panels": [],
      "schemaVersion": 39,
      "time": { "from": "now-1h", "to": "now" }
    }
