apiVersion: apps/v1
kind: Deployment
metadata:
  name: ssl-proxy-telemetry-tidb-metrics-bridge
  namespace: ssl-proxy
  labels:
    app.kubernetes.io/name: ssl-proxy
    app.kubernetes.io/component: telemetry-tidb-metrics-bridge
spec:
  replicas: 0
  strategy:
    type: Recreate
    rollingUpdate: null
  selector:
    matchLabels:
      app.kubernetes.io/name: ssl-proxy
      app.kubernetes.io/component: telemetry-tidb-metrics-bridge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ssl-proxy
        app.kubernetes.io/component: telemetry-tidb-metrics-bridge
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      serviceAccountName: ssl-proxy
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: prometheus-agent
          image: prom/prometheus:v3.2.1
          args:
            - "--agent"
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.agent.path=/prometheus-agent"
          env:
            - name: ENVIRONMENT
              valueFrom:
                fieldRef: {fieldPath: metadata.namespace}
          ports:
            - {name: health, containerPort: 9090}
          readinessProbe:
            httpGet: {path: /-/ready, port: health}
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: {path: /-/healthy, port: health}
            initialDelaySeconds: 15
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 200m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            readOnlyRootFilesystem: true
          volumeMounts:
            - {name: config, mountPath: /etc/prometheus, readOnly: true}
            - {name: data, mountPath: /prometheus-agent}
      volumes:
        - name: config
          configMap: {name: ssl-proxy-telemetry-tidb-bridge-config}
        - name: data
          emptyDir: {}
