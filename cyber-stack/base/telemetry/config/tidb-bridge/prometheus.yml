global:
  scrape_interval: 15s
  external_labels:
    environment: "${ENVIRONMENT}"
    service: tidb
    collector: host-network-bridge

scrape_configs:
  - job_name: tidb-production-host
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:10080"]

remote_write:
  - url: http://ssl-proxy-telemetry-prometheus:9090/api/v1/write
    queue_config:
      capacity: 5000
      max_shards: 4
      min_shards: 1
      max_samples_per_send: 1000
