groups:
  - name: redpanda-maintenance
    rules:
      - alert: RedpandaMaintenanceNoRun
        expr: (kube_cronjob_info{namespace="prod-ssl-proxy",cronjob="redpanda-daily-clean"} unless on() redpanda_maint_last_run_timestamp_seconds) or (time() - max(redpanda_maint_last_run_timestamp_seconds) > 93600)
        for: 5m
        labels: {severity: critical, service: redpanda}
        annotations:
          summary: "Redpanda maintenance has not run in 26 hours"
          diagnostic: "The daily maintenance Job is absent or its last-run metric is stale."
          dashboard_url: "http://ssl-proxy-telemetry-grafana:3000/d/redpanda-cluster"
          runbook_url: "https://github.com/zlovtnik/ssl-proxy/blob/main/docs/runbooks/redpanda-maintenance.md#no-run-or-no-success"
      - alert: RedpandaMaintenanceNoSuccess
        expr: (kube_cronjob_info{namespace="prod-ssl-proxy",cronjob="redpanda-daily-clean"} unless on() redpanda_maint_last_success_timestamp_seconds) or (time() - max(redpanda_maint_last_success_timestamp_seconds) > 93600)
        for: 5m
        labels: {severity: critical, service: redpanda}
        annotations:
          summary: "Redpanda maintenance has not succeeded in 26 hours"
          diagnostic: "Inspect the topic status metric and the failed Job logs before changing any gate."
          dashboard_url: "http://ssl-proxy-telemetry-grafana:3000/d/redpanda-cluster"
          runbook_url: "https://github.com/zlovtnik/ssl-proxy/blob/main/docs/runbooks/redpanda-maintenance.md#no-run-or-no-success"
      - alert: RedpandaMaintenanceTopicBlocked
        expr: redpanda_maint_topic_status >= 10
        for: 1h
        labels: {severity: critical, service: redpanda}
        annotations:
          summary: "Redpanda maintenance is blocked for {{ $labels.topic }}"
          diagnostic: "Status 10 or greater is fail-closed; use the runbook status table and do not bypass the gate."
          dashboard_url: "http://ssl-proxy-telemetry-grafana:3000/d/redpanda-cluster"
          runbook_url: "https://github.com/zlovtnik/ssl-proxy/blob/main/docs/runbooks/redpanda-maintenance.md#blocked-status"
      - alert: RedpandaMaintenanceStillDryRun
        expr: redpanda_maint_dry_run == 1
        for: 3d
        labels: {severity: warning, service: redpanda}
        annotations:
          summary: "Redpanda maintenance has remained in dry-run for three days"
          diagnostic: "Review three days of plans and enable only a topic whose gates and archive prerequisites are complete."
          dashboard_url: "http://ssl-proxy-telemetry-grafana:3000/d/redpanda-cluster"
          runbook_url: "https://github.com/zlovtnik/ssl-proxy/blob/main/docs/runbooks/redpanda-maintenance.md#promotion"
      - alert: RedpandaMaintenanceJobFailed
        expr: kube_job_status_failed{namespace="prod-ssl-proxy",job_name=~"redpanda-daily-clean.*"} > 0
        for: 5m
        labels: {severity: critical, service: redpanda}
        annotations:
          summary: "Redpanda maintenance Job failed"
          diagnostic: "A destructive Job is never retried blindly; inspect its plan and status first."
          dashboard_url: "http://ssl-proxy-telemetry-grafana:3000/d/redpanda-cluster"
          runbook_url: "https://github.com/zlovtnik/ssl-proxy/blob/main/docs/runbooks/redpanda-maintenance.md#failed-job"
