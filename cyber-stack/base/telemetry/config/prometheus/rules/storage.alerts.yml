groups:
  - name: storage-capacity-alerts
    rules:
      - alert: RedpandaTopicLogBytesHigh
        expr: redpanda_topic_log_bytes{topic="wireless.audit"} > 67108864000
        for: 30m
        labels: {severity: warning, service: redpanda}
        annotations:
          summary: "Topic wireless.audit retains more than 63 GiB"
          diagnostic: "Topic retention has outgrown the 7-day byte budget for the Redpanda data volume."
          dashboard_url: "http://ssl-proxy-telemetry-grafana:3000/d/infrastructure-capacity"
          runbook_url: "https://github.com/zlovtnik/ssl-proxy/blob/main/docs/runbooks/disk-full.md#redpanda-topic-oversize"
      - alert: RedpandaTopicLogBytesCritical
        expr: redpanda_topic_log_bytes{topic="wireless.audit"} > 96636764160
        for: 15m
        labels: {severity: critical, service: redpanda}
        annotations:
          summary: "Topic wireless.audit retains more than 90 GiB"
          diagnostic: "Topic data is at the size that fills the Redpanda data volume and risks node-wide disk exhaustion."
          dashboard_url: "http://ssl-proxy-telemetry-grafana:3000/d/infrastructure-capacity"
          runbook_url: "https://github.com/zlovtnik/ssl-proxy/blob/main/docs/runbooks/disk-full.md#redpanda-topic-oversize"
      - alert: RegistryVolumeHigh
        expr: docker_volume_used_bytes{volume="ssl-proxy-ci_registry-data"} > 16106127360
        for: 30m
        labels: {severity: warning, service: infrastructure}
        annotations:
          summary: "CI registry volume {{ $labels.volume }} exceeds 15 GiB"
          diagnostic: "Registry blob storage has outgrown its retention budget; review the retention plan before garbage collection."
          dashboard_url: "http://ssl-proxy-telemetry-grafana:3000/d/infrastructure-capacity"
          runbook_url: "https://github.com/zlovtnik/ssl-proxy/blob/main/docs/runbooks/disk-full.md#ci-registry-volume"
      - alert: JenkinsDinDVolumeHigh
        expr: docker_volume_used_bytes{volume="ssl-proxy-ci_jenkins-docker-data"} > 32212254720
        for: 30m
        labels: {severity: warning, service: infrastructure}
        annotations:
          summary: "Jenkins Docker-in-Docker volume {{ $labels.volume }} exceeds 30 GiB"
          diagnostic: "Build cache has outgrown its budget; prune with ops/ci/dind-prune.sh."
          dashboard_url: "http://ssl-proxy-telemetry-grafana:3000/d/infrastructure-capacity"
          runbook_url: "https://github.com/zlovtnik/ssl-proxy/blob/main/docs/runbooks/disk-full.md#jenkins-docker-in-docker-volume"
      - alert: PostgresDatabaseSizeHigh
        expr: ssl_proxy_postgres_database_bytes{datname="sync"} > 161061273600
        for: 30m
        labels: {severity: warning, service: octopus}
        annotations:
          summary: "PostgreSQL database {{ $labels.datname }} exceeds 150 GiB"
          diagnostic: "The platform database is approaching the disk budget; run the read-only size report before deciding on retention changes."
          dashboard_url: "http://ssl-proxy-telemetry-grafana:3000/d/infrastructure-capacity"
          runbook_url: "https://github.com/zlovtnik/ssl-proxy/blob/main/docs/runbooks/disk-full.md#postgresql-growth"
      - alert: PostgresRelationSizeHigh
        expr: ssl_proxy_postgres_relation_bytes > 53687091200
        for: 30m
        labels: {severity: warning, service: octopus}
        annotations:
          summary: "PostgreSQL relation {{ $labels.schema }}.{{ $labels.relation }} exceeds 50 GiB"
          diagnostic: "A single relation has outgrown expectations; check dead tuples and retention before reclaiming space."
          dashboard_url: "http://ssl-proxy-telemetry-grafana:3000/d/infrastructure-capacity"
          runbook_url: "https://github.com/zlovtnik/ssl-proxy/blob/main/docs/runbooks/disk-full.md#postgresql-growth"
      - alert: StorageTextfileStale
        expr: time() - ssl_proxy_storage_textfile_timestamp_seconds > 7200
        for: 15m
        labels: {severity: warning, service: infrastructure}
        annotations:
          summary: "Host storage textfile metrics have not been published for over two hours"
          diagnostic: "Volume and topic size alerts cannot fire while the node_exporter textfile collector is stale."
          dashboard_url: "http://ssl-proxy-telemetry-grafana:3000/d/infrastructure-capacity"
          runbook_url: "https://github.com/zlovtnik/ssl-proxy/blob/main/docs/runbooks/disk-full.md#storage-metrics-are-stale"
      # An absent producer is indistinguishable from a healthy zero, which is how
      # five storage rules sat unevaluated for days. This fires when the metrics
      # those rules read do not exist at all.
      - alert: StorageMetricsMissing
        expr: absent(docker_volume_used_bytes) or absent(ssl_proxy_storage_textfile_timestamp_seconds) or absent(ssl_proxy_postgres_database_bytes)
        for: 15m
        labels: {severity: critical, service: storage}
        annotations:
          summary: "Host storage metrics are not being produced"
          diagnostic: "At least one of docker_volume_used_bytes, ssl_proxy_storage_textfile_timestamp_seconds or ssl_proxy_postgres_database_bytes has no series, so the registry, Docker-in-Docker and PostgreSQL size alerts cannot fire. Check ssl-proxy-pv-usage-textfile.timer on the host."
          dashboard_url: "http://ssl-proxy-telemetry-grafana:3000/d/infrastructure-capacity"
          runbook_url: "https://github.com/zlovtnik/ssl-proxy/blob/main/docs/runbooks/disk-full.md#storage-metrics-are-missing"
      - alert: HostPathVolumeHigh
        expr: ssl_proxy_host_path_used_bytes{class="k3s_pvc"} / ssl_proxy_host_path_capacity_bytes{class="k3s_pvc"} > 0.85
        for: 15m
        labels: {severity: warning, service: storage}
        annotations:
          summary: "Volume {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} is above 85% full"
          diagnostic: "A k3s local-path volume has outgrown its declared capacity. Reclaim from the subsystem that owns it; see the storage workmap for targets."
          dashboard_url: "http://ssl-proxy-telemetry-grafana:3000/d/infrastructure-capacity"
          runbook_url: "https://github.com/zlovtnik/ssl-proxy/blob/main/docs/runbooks/disk-full.md#host-path-volume-pressure"
      # Size thresholds cannot see a burst. This node once lost 374 GiB in about
      # eighty minutes and held disk pressure long enough to evict the Argo CD
      # control plane. The rate alert fires while there is still headroom and
      # names a writer rather than a total.
      - alert: FilesystemShrinkingFast
        expr: max by (node, mountpoint, fstype) (deriv(node_filesystem_avail_bytes{mountpoint="/", fstype!~"tmpfs|overlay"}[1h]) * 3600) < -53687091200
        for: 15m
        labels: {severity: warning, service: storage}
        annotations:
          summary: "Node {{ $labels.node }} is losing more than 50 GiB of free space per hour"
          diagnostic: "Free space on {{ $labels.mountpoint }} has fallen by more than 50 GiB per hour for fifteen minutes. Query ssl_proxy_host_path_used_bytes{class=\"host_path\"} to identify the growing path before the node reaches disk pressure."
          dashboard_url: "http://ssl-proxy-telemetry-grafana:3000/d/infrastructure-capacity"
          runbook_url: "https://github.com/zlovtnik/ssl-proxy/blob/main/docs/runbooks/disk-full.md#node-disk-pressure-and-eviction"
      - alert: NodeDiskPressure
        expr: kube_node_status_condition{condition="DiskPressure"} == 1
        for: 5m
        labels: {severity: critical, service: infrastructure}
        annotations:
          summary: "Node {{ $labels.node }} is under disk pressure"
          diagnostic: "Kubelet has set DiskPressure and may be evicting workloads, including the Argo CD control plane, which breaks commands such as argocd app get --show-operation. Free space before the condition clears."
          dashboard_url: "http://ssl-proxy-telemetry-grafana:3000/d/infrastructure-capacity"
          runbook_url: "https://github.com/zlovtnik/ssl-proxy/blob/main/docs/runbooks/disk-full.md#node-disk-pressure-and-eviction"
