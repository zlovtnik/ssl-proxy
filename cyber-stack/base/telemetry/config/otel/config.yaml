extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 400
    spike_limit_mib: 100
  resource/normalize:
    attributes:
      - key: service.name
        value: unknown-service
        action: insert
      - key: deployment.environment
        value: ${env:ENVIRONMENT}
        action: insert
  tail_sampling:
    decision_wait: 10s
    num_traces: 50000
    expected_new_traces_per_sec: 100
    policies:
      - name: retain-errors
        type: status_code
        status_code:
          status_codes: [ERROR]
      - name: retain-slow-traces
        type: latency
        latency:
          threshold_ms: 2000
      - name: baseline-ten-percent
        type: probabilistic
        probabilistic:
          sampling_percentage: 10
  batch:
    timeout: 5s
    send_batch_size: 1024
    send_batch_max_size: 2048

connectors:
  forward:
  spanmetrics:
    namespace: traces.span.metrics
    histogram:
      explicit:
        buckets: [5ms, 10ms, 25ms, 50ms, 100ms, 250ms, 500ms, 1s, 2s, 5s, 10s]
    dimensions:
      - name: deployment.environment
      - name: http.request.method
      - name: http.response.status_code
      - name: rpc.system
      - name: rpc.method
      - name: db.system.name
    exemplars:
      enabled: true

exporters:
  otlp/jaeger:
    endpoint: ssl-proxy-telemetry-jaeger:4317
    tls:
      insecure: true
  prometheus:
    endpoint: 0.0.0.0:8889
    resource_to_telemetry_conversion:
      enabled: true

service:
  extensions: [health_check]
  telemetry:
    metrics:
      address: 0.0.0.0:8888
  pipelines:
    traces/ingest:
      receivers: [otlp]
      processors: [memory_limiter, resource/normalize]
      exporters: [spanmetrics, forward]
    traces/sample:
      receivers: [forward]
      processors: [tail_sampling, batch]
      exporters: [otlp/jaeger]
    metrics/otlp:
      receivers: [otlp]
      processors: [memory_limiter, resource/normalize, batch]
      exporters: [prometheus]
    metrics/spanmetrics:
      receivers: [spanmetrics]
      processors: [batch]
      exporters: [prometheus]
