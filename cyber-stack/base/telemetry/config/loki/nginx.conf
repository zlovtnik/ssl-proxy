worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    log_format loki '$remote_addr - $remote_user [$time_local] "$status" $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /dev/stdout loki;
    client_body_temp_path /tmp/client_body;
    fastcgi_temp_path /tmp/fastcgi;
    proxy_temp_path /tmp/proxy;
    scgi_temp_path /tmp/scgi;
    uwsgi_temp_path /tmp/uwsgi;

    server {
        listen 8080;
        server_name _;

        location = /ready {
            auth_basic off;
            proxy_pass http://127.0.0.1:3100/ready;
        }

        location / {
            auth_basic "Loki";
            auth_basic_user_file /etc/loki-proxy-auth/.htpasswd;
            client_max_body_size 10m;
            proxy_buffering off;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization "";
            proxy_pass http://127.0.0.1:3100;
        }
    }
}
