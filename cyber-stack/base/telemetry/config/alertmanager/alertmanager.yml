global:
  resolve_timeout: 5m

route:
  receiver: private-webhook
  group_by: [alertname, environment, service, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

inhibit_rules:
  - source_matchers: ['severity="critical"']
    target_matchers: ['severity="warning"']
    equal: [alertname, environment, service]

receivers:
  - name: private-webhook
    webhook_configs:
      - url_file: /etc/alertmanager-secrets/alertmanager-webhook-url
        send_resolved: true
        max_alerts: 20
