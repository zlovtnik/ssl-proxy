global:
  resolve_timeout: 5m

route:
  receiver: private-webhook
  # environment is not set by any rule in this repository, so grouping on it
  # only padded the group key. Kept out so a group matches on what exists.
  group_by: [alertname, service, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    # A sustained critical alert repeating every four hours is a silenced
    # alert: FilesystemFreeSpaceCritical was firing for twenty hours straight
    # and the node still reached disk pressure. Repeat criticals until they
    # resolve.
    - receiver: private-webhook
      matchers: ['severity="critical"']
      group_wait: 10s
      group_interval: 2m
      repeat_interval: 30m

inhibit_rules:
  - source_matchers: ['severity="critical"']
    target_matchers: ['severity="warning"']
    equal: [alertname, service]

receivers:
  - name: private-webhook
    webhook_configs:
      - url_file: /etc/alertmanager-secrets/alertmanager-webhook-url
        send_resolved: true
        max_alerts: 20
