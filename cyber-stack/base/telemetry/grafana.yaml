apiVersion: apps/v1
kind: Deployment
metadata:
  name: ssl-proxy-telemetry-grafana
  namespace: ssl-proxy
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/name: ssl-proxy
    app.kubernetes.io/component: telemetry-grafana
    app.kubernetes.io/managed-by: kustomize
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ssl-proxy
      app.kubernetes.io/component: telemetry-grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ssl-proxy
        app.kubernetes.io/component: telemetry-grafana
    spec:
      serviceAccountName: ssl-proxy
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 472
        runAsNonRoot: true
        runAsUser: 472
      containers:
        - name: grafana
          image: grafana/grafana:11.5.2
          imagePullPolicy: Always
          env:
            - name: GF_PATHS_PROVISIONING
              value: "/etc/grafana/provisioning"
            - name: GF_SERVER_HTTP_PORT
              value: "3000"
            - name: GF_SECURITY_ADMIN_USER
              value: "admin"
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: observability-credentials
                  key: grafana-admin-password
            - name: LOKI_USERNAME
              valueFrom:
                secretKeyRef:
                  name: observability-credentials
                  key: loki-username
            - name: LOKI_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: observability-credentials
                  key: loki-password
          ports:
            - containerPort: 3000
              name: http
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: datasource-config
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
              readOnly: true
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
              readOnly: true
            - name: data
              mountPath: /var/lib/grafana
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: datasource-config
          configMap:
            name: ssl-proxy-telemetry-grafana-datasources
        - name: dashboard-provider
          configMap:
            name: ssl-proxy-telemetry-grafana-dashboard-provider
        - name: dashboards
          configMap:
            name: ssl-proxy-telemetry-grafana-dashboards
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ssl-proxy-telemetry-grafana
  namespace: ssl-proxy
  labels:
    app.kubernetes.io/name: ssl-proxy
    app.kubernetes.io/component: telemetry-grafana
    app.kubernetes.io/managed-by: kustomize
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: ssl-proxy
    app.kubernetes.io/component: telemetry-grafana
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
