apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ssl-proxy-telemetry-alloy
  namespace: ssl-proxy
  labels:
    app.kubernetes.io/name: ssl-proxy
    app.kubernetes.io/component: telemetry-alloy
    app.kubernetes.io/managed-by: kustomize
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: ssl-proxy
      app.kubernetes.io/component: telemetry-alloy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ssl-proxy
        app.kubernetes.io/component: telemetry-alloy
    spec:
      serviceAccountName: ssl-proxy
      automountServiceAccountToken: false
      tolerations:
        - operator: Exists
      containers:
        - name: alloy
          image: grafana/alloy:v1.9.3
          imagePullPolicy: IfNotPresent
          args:
            - "run"
            - "--storage.path=/run/alloy"
            - "/etc/alloy/config.alloy"
          ports:
            - containerPort: 12345
              name: http
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            privileged: false
          volumeMounts:
            - name: config
              mountPath: /etc/alloy
              readOnly: true
            - name: varlog
              mountPath: /var/log
              readOnly: true
            - name: containers
              mountPath: /var/lib/docker/containers
              readOnly: true
            - name: positions
              mountPath: /run/alloy
      terminationGracePeriodSeconds: 30
      volumes:
        - name: config
          configMap:
            name: ssl-proxy-telemetry-alloy-config
        - name: varlog
          hostPath:
            path: /var/log
        - name: containers
          hostPath:
            path: /var/lib/docker/containers
        - name: positions
          hostPath:
            path: /var/lib/alloy
            type: DirectoryOrCreate
