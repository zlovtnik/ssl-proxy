apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ssl-proxy-telemetry-alloy
  namespace: ssl-proxy
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/name: ssl-proxy
    app.kubernetes.io/component: telemetry-alloy
    app.kubernetes.io/managed-by: kustomize
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: ssl-proxy
      app.kubernetes.io/component: telemetry-alloy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ssl-proxy
        app.kubernetes.io/component: telemetry-alloy
    spec:
      serviceAccountName: ssl-proxy
      automountServiceAccountToken: false
      tolerations:
        - operator: Exists
      initContainers:
        - name: prepare-alloy-storage
          image: busybox@sha256:3b3e3327c33950c386e85312393d20b40e2d40f72e53b40e65b7f68b4c0f5a5f
          command: ["/bin/sh", "-ec", "mkdir -p /host-var-lib/alloy && chown 473:473 /host-var-lib/alloy"]
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN"]
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 50m
              memory: 32Mi
          volumeMounts:
            - name: positions
              mountPath: /host-var-lib
      containers:
        - name: alloy
          image: grafana/alloy:v1.9.2
          imagePullPolicy: IfNotPresent
          args:
            - "run"
            - "--server.http.listen-addr=0.0.0.0:12345"
            - "--storage.path=/run/alloy"
            - "/etc/alloy/config.alloy"
          env:
            - name: LOKI_USERNAME
              valueFrom:
                secretKeyRef:
                  name: observability-credentials
                  key: loki-username
            - name: LOKI_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: observability-credentials
                  key: loki-password
          ports:
            - containerPort: 12345
              name: http
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 473
            runAsGroup: 473
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /etc/alloy
              readOnly: true
            - name: varlog
              mountPath: /var/log
              readOnly: true
            - name: containers
              mountPath: /var/lib/docker/containers
              readOnly: true
            - name: positions
              mountPath: /run/alloy
              subPath: alloy
      terminationGracePeriodSeconds: 30
      volumes:
        - name: config
          configMap:
            name: ssl-proxy-telemetry-alloy-config
        - name: varlog
          hostPath:
            path: /var/log
        - name: containers
          hostPath:
            path: /var/lib/docker/containers
        - name: positions
          hostPath:
            path: /var/lib
            type: Directory
