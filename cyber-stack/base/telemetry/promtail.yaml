apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ssl-proxy-telemetry-alloy
  namespace: ssl-proxy
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/name: ssl-proxy
    app.kubernetes.io/component: telemetry-alloy
    app.kubernetes.io/managed-by: kustomize
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: ssl-proxy
      app.kubernetes.io/component: telemetry-alloy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ssl-proxy
        app.kubernetes.io/component: telemetry-alloy
    spec:
      serviceAccountName: ssl-proxy
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 473
        supplementalGroups: [999]
        seccompProfile:
          type: RuntimeDefault
      tolerations:
        - operator: Exists
      containers:
        - name: alloy
          image: grafana/alloy:v1.9.2
          imagePullPolicy: IfNotPresent
          args:
            - "run"
            - "--server.http.listen-addr=0.0.0.0:12345"
            - "--storage.path=/run/alloy"
            - "/etc/alloy/config.alloy"
          env:
            - name: LOKI_USERNAME
              valueFrom:
                secretKeyRef:
                  name: observability-credentials
                  key: loki-username
            - name: LOKI_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: observability-credentials
                  key: loki-password
          ports:
            - containerPort: 12345
              name: http
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 473
            runAsGroup: 473
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /etc/alloy
              readOnly: true
            - name: varlog
              mountPath: /var/log
              readOnly: true
            - name: containers
              mountPath: /var/lib/docker/containers
              readOnly: true
            - name: journal
              mountPath: /run/log/journal
              readOnly: true
            - name: positions
              mountPath: /run/alloy
      terminationGracePeriodSeconds: 30
      volumes:
        - name: config
          configMap:
            name: ssl-proxy-telemetry-alloy-config
        - name: varlog
          hostPath:
            path: /var/log
        - name: containers
          hostPath:
            path: /var/lib/docker/containers
        - name: journal
          hostPath:
            path: /run/log/journal
            type: Directory
        - name: positions
          hostPath:
            path: /var/lib/alloy
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: ssl-proxy-telemetry-alloy
  namespace: ssl-proxy
  labels:
    app.kubernetes.io/name: ssl-proxy
    app.kubernetes.io/component: telemetry-alloy
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: ssl-proxy
    app.kubernetes.io/component: telemetry-alloy
  ports:
    - {name: http, port: 12345, targetPort: http}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ssl-proxy-telemetry-alloy
  namespace: ssl-proxy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ssl-proxy
      app.kubernetes.io/component: telemetry-alloy
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/component: telemetry-prometheus}
        - podSelector:
            matchLabels: {app.kubernetes.io/component: telemetry-blackbox-exporter}
      ports:
        - {protocol: TCP, port: 12345}
