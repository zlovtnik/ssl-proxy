apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ssl-proxy-telemetry-loki
  namespace: ssl-proxy
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/name: ssl-proxy
    app.kubernetes.io/component: telemetry-loki
    app.kubernetes.io/managed-by: kustomize
spec:
  serviceName: ssl-proxy-telemetry-loki
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ssl-proxy
      app.kubernetes.io/component: telemetry-loki
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ssl-proxy
        app.kubernetes.io/component: telemetry-loki
    spec:
      serviceAccountName: ssl-proxy
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: loki
          image: grafana/loki:3.4.2
          imagePullPolicy: Always
          args:
            - "-config.file=/etc/loki/loki.yaml"
          ports:
            - containerPort: 3100
              name: http
          livenessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          volumeMounts:
            - name: config
              mountPath: /etc/loki
              readOnly: true
            - name: data
              mountPath: /loki
        - name: auth-proxy
          image: nginxinc/nginx-unprivileged@sha256:62a904036bfc0e4a4f2b556e34cbf17bc136b47fde8cdb4628762725f48c5782
          imagePullPolicy: Always
          args:
            - nginx
            - -c
            - /etc/loki-proxy/nginx.conf
            - -g
            - daemon off;
          ports:
            - containerPort: 8080
              name: proxy-http
          readinessProbe:
            httpGet:
              path: /ready
              port: proxy-http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
          volumeMounts:
            - name: proxy-config
              mountPath: /etc/loki-proxy
              readOnly: true
            - name: proxy-auth
              mountPath: /etc/loki-proxy-auth
              readOnly: true
            - name: proxy-tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: ssl-proxy-telemetry-loki-config
        - name: proxy-config
          configMap:
            name: ssl-proxy-telemetry-loki-proxy-config
        - name: proxy-auth
          secret:
            secretName: observability-credentials
            defaultMode: 0440
            items:
              - key: loki-htpasswd
                path: .htpasswd
        - name: proxy-tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ssl-proxy-telemetry-loki
  namespace: ssl-proxy
  labels:
    app.kubernetes.io/name: ssl-proxy
    app.kubernetes.io/component: telemetry-loki
    app.kubernetes.io/managed-by: kustomize
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app.kubernetes.io/name: ssl-proxy
    app.kubernetes.io/component: telemetry-loki
  ports:
    - name: http
      port: 3100
      targetPort: proxy-http
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ssl-proxy-telemetry-loki-ingress
  namespace: ssl-proxy
  labels:
    app.kubernetes.io/name: ssl-proxy
    app.kubernetes.io/component: telemetry-loki
    app.kubernetes.io/managed-by: kustomize
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ssl-proxy
      app.kubernetes.io/component: telemetry-loki
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ssl-proxy
              app.kubernetes.io/component: telemetry-alloy
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ssl-proxy
              app.kubernetes.io/component: telemetry-grafana
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ssl-proxy
              app.kubernetes.io/component: telemetry-prometheus
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ssl-proxy
              app.kubernetes.io/component: telemetry-blackbox-exporter
      ports:
        - protocol: TCP
          port: 8080
