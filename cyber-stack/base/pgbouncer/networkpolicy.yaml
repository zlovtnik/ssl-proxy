apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-pgbouncer
  namespace: ssl-proxy
  labels:
    app.kubernetes.io/name: ssl-proxy
    app.kubernetes.io/component: pgbouncer
    app.kubernetes.io/managed-by: kustomize
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgres-pgbouncer
      app.kubernetes.io/component: pgbouncer
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              ssl-proxy.io/postgres-client: "true"
      ports:
        - protocol: TCP
          port: 5432
