apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-pgbouncer
  namespace: ssl-proxy
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/name: postgres-pgbouncer
    app.kubernetes.io/component: pgbouncer
    app.kubernetes.io/managed-by: kustomize
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres-pgbouncer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres-pgbouncer
        app.kubernetes.io/component: pgbouncer
        app.kubernetes.io/instance: ssl-proxy
    spec:
      serviceAccountName: ssl-proxy
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: render-pgbouncer-config
          image: busybox@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ceu"]
          args:
            - |
              case "${POSTGRES_HOST}" in
                ""|*[!A-Za-z0-9._-]*) exit 2 ;;
              esac
              case "${POSTGRES_PORT}" in
                ""|*[!0-9]*) exit 2 ;;
              esac
              [ "${POSTGRES_PORT}" -ge 1 ] && [ "${POSTGRES_PORT}" -le 65535 ] || exit 2
              [ "${POSTGRES_DATABASE}" = "sync" ] || exit 2
              [ "${POSTGRES_SSL_MODE}" = "verify-full" ] || exit 2
              [ "${POSTGRES_SSL_SERVER_NAME}" = "${POSTGRES_HOST}" ] || exit 2
              {
                printf '%s\n' '[databases]'
                printf 'sync = host=%s port=%s dbname=%s\n' \
                  "${POSTGRES_HOST}" "${POSTGRES_PORT}" "${POSTGRES_DATABASE}"
                printf '%s\n' \
                  '[pgbouncer]' \
                  'listen_addr = 0.0.0.0' \
                  'listen_port = 5432' \
                  'unix_socket_dir = /var/run/pgbouncer' \
                  'auth_type = scram-sha-256' \
                  'auth_file = /etc/pgbouncer/users/userlist.txt' \
                  'pool_mode = transaction' \
                  'max_client_conn = 400' \
                  'default_pool_size = 40' \
                  'reserve_pool_size = 10' \
                  'server_tls_sslmode = verify-full' \
                  'server_tls_ca_file = /etc/pgbouncer/upstream/ca.crt' \
                  'client_tls_sslmode = disable' \
                  'ignore_startup_parameters = extra_float_digits'
              } > /generated/pgbouncer.ini
          env:
            - name: POSTGRES_HOST
              value: "postgres.example.invalid"
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DATABASE
              value: "sync"
            - name: POSTGRES_SSL_MODE
              value: "verify-full"
            - name: POSTGRES_SSL_SERVER_NAME
              value: "postgres.example.invalid"
          resources:
            requests:
              cpu: 10m
              memory: 8Mi
            limits:
              cpu: 100m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
          volumeMounts:
            - name: generated-config
              mountPath: /generated
      containers:
        - name: pgbouncer
          image: edoburu/pgbouncer@sha256:3db3d7223e93af52b4116f642951a1a5fa44702a88c2a59cf7562cac19320c9e
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            tcpSocket:
              port: postgres
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: postgres
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 70
            runAsGroup: 70
          volumeMounts:
            - name: generated-config
              mountPath: /etc/pgbouncer/pgbouncer.ini
              subPath: pgbouncer.ini
              readOnly: true
            - name: users
              mountPath: /etc/pgbouncer/users
              readOnly: true
            - name: upstream-tls
              mountPath: /etc/pgbouncer/upstream
              readOnly: true
            - name: run
              mountPath: /var/run/pgbouncer
      volumes:
        - name: generated-config
          emptyDir:
            sizeLimit: 1Mi
        - name: users
          secret:
            secretName: pgbouncer-runtime-users
        - name: upstream-tls
          secret:
            secretName: postgres-runtime-tls
            items:
              - key: ca.crt
                path: ca.crt
        - name: run
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-pgbouncer
  namespace: ssl-proxy
  labels:
    app.kubernetes.io/name: postgres-pgbouncer
    app.kubernetes.io/component: pgbouncer
    app.kubernetes.io/managed-by: kustomize
spec:
  selector:
    app.kubernetes.io/name: postgres-pgbouncer
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
