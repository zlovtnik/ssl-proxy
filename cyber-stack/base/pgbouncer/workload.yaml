apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-pgbouncer-config
  namespace: ssl-proxy
data:
  pgbouncer.ini: |
    [databases]
    sync = host=ssl-proxy-prod-postgres-endpoint port=5432 dbname=sync
    [pgbouncer]
    listen_addr = 0.0.0.0
    listen_port = 5432
    auth_type = scram-sha-256
    auth_file = /etc/pgbouncer/users/userlist.txt
    pool_mode = transaction
    max_client_conn = 400
    default_pool_size = 40
    reserve_pool_size = 10
    server_tls_sslmode = verify-full
    server_tls_ca_file = /etc/pgbouncer/upstream/ca.crt
    client_tls_sslmode = disable
    ignore_startup_parameters = extra_float_digits
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-pgbouncer
  namespace: ssl-proxy
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres-pgbouncer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres-pgbouncer
        app.kubernetes.io/instance: ssl-proxy
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pgbouncer
          image: edoburu/pgbouncer@sha256:3db3d7223e93af52b4116f642951a1a5fa44702a88c2a59cf7562cac19320c9e
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            tcpSocket:
              port: postgres
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: postgres
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          volumeMounts:
            - name: config
              mountPath: /etc/pgbouncer/pgbouncer.ini
              subPath: pgbouncer.ini
              readOnly: true
            - name: users
              mountPath: /etc/pgbouncer/users
              readOnly: true
            - name: upstream-tls
              mountPath: /etc/pgbouncer/upstream
              readOnly: true
            - name: run
              mountPath: /var/run/pgbouncer
      volumes:
        - name: config
          configMap:
            name: postgres-pgbouncer-config
        - name: users
          secret:
            secretName: pgbouncer-runtime-users
        - name: upstream-tls
          secret:
            secretName: postgres-runtime-tls
            items:
              - key: ca.crt
                path: ca.crt
        - name: run
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-pgbouncer
  namespace: ssl-proxy
spec:
  selector:
    app.kubernetes.io/name: postgres-pgbouncer
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
