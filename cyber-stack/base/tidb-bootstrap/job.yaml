apiVersion: batch/v1
kind: Job
metadata:
  name: ssl-proxy-tidb-bootstrap
  namespace: ssl-proxy
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
  labels:
    app.kubernetes.io/name: ssl-proxy
    app.kubernetes.io/component: tidb-bootstrap
    app.kubernetes.io/managed-by: kustomize
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ssl-proxy
        app.kubernetes.io/component: tidb-bootstrap
      annotations:
        ssl-proxy.io/content-hash: "tidb-password-bootstrap-v1"
    spec:
      serviceAccountName: ssl-proxy
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bootstrap
          image: tidb-runtime-schema
          imagePullPolicy: Always
          command: ["/usr/local/bin/tidb-bootstrap"]
          env:
            - name: TIDB_HOST
              valueFrom:
                configMapKeyRef:
                  name: ssl-proxy-prod-tidb-endpoint
                  key: TIDB_HOST
            - name: TIDB_PORT
              valueFrom:
                configMapKeyRef:
                  name: ssl-proxy-prod-tidb-endpoint
                  key: TIDB_PORT
            - name: TIDB_ALLOW_EMPTY_ROOT_BOOTSTRAP
              value: "true"
            - name: TIDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tidb-root
                  key: password
            - name: TIDB_SCHEMA_OWNER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tidb-schema-owner
                  key: password
            - name: TIDB_OCTOPUS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tidb-octopus
                  key: password
            - name: TIDB_ATHEROS_SEARCH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tidb-atheros-search
                  key: password
            - name: TIDB_SCHEMA_MIGRATOR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tidb-schema-migrator
                  key: password
            - name: TIDB_KEYCLOAK_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tidb-keycloak
                  key: password
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
