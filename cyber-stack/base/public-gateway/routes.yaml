apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: ssl-proxy-public-security-headers
  namespace: ssl-proxy
  labels:
    app.kubernetes.io/name: ssl-proxy
    app.kubernetes.io/component: public-gateway
    app.kubernetes.io/managed-by: kustomize
spec:
  headers:
    contentTypeNosniff: true
    frameDeny: true
    referrerPolicy: no-referrer
    stsSeconds: 31536000
    stsIncludeSubdomains: false
    stsPreload: false
    customResponseHeaders:
      Server: ""
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: ssl-proxy-public-rate-limit
  namespace: ssl-proxy
  labels:
    app.kubernetes.io/name: ssl-proxy
    app.kubernetes.io/component: public-gateway
    app.kubernetes.io/managed-by: kustomize
spec:
  rateLimit:
    average: 60
    burst: 120
    period: 1m
    sourceCriterion:
      requestHeaderName: CF-Connecting-IP
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: ssl-proxy-public-body-limit
  namespace: ssl-proxy
  labels:
    app.kubernetes.io/name: ssl-proxy
    app.kubernetes.io/component: public-gateway
    app.kubernetes.io/managed-by: kustomize
spec:
  buffering:
    maxRequestBodyBytes: 1048576
    memRequestBodyBytes: 262144
---
apiVersion: traefik.io/v1alpha1
kind: TLSStore
metadata:
  name: default
  namespace: ssl-proxy
  labels:
    app.kubernetes.io/name: ssl-proxy
    app.kubernetes.io/component: public-gateway
    app.kubernetes.io/managed-by: kustomize
spec:
  defaultCertificate:
    secretName: ssl-proxy-identity-tls
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ssl-proxy-public-gateway
  namespace: ssl-proxy
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/name: ssl-proxy
    app.kubernetes.io/component: public-gateway
    app.kubernetes.io/managed-by: kustomize
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`gateway.example.internal`) && (PathPrefix(`/realms/middleware`) || PathPrefix(`/resources/`))
      priority: 300
      middlewares:
        - name: ssl-proxy-public-security-headers
        - name: ssl-proxy-public-rate-limit
      services:
        - kind: Service
          name: ssl-proxy-schema-migrator-keycloak
          port: 8080
          scheme: http
    - kind: Rule
      match: Host(`gateway.example.internal`) && PathPrefix(`/api/`) && !Path(`/api/health`)
      priority: 200
      middlewares:
        - name: ssl-proxy-public-security-headers
        - name: ssl-proxy-public-rate-limit
        - name: ssl-proxy-public-body-limit
      services:
        - kind: Service
          name: ssl-proxy-schema-migrator-backend
          port: 8080
          scheme: http
          responseForwarding:
            flushInterval: 100ms
    - kind: Rule
      match: Host(`gateway.example.internal`) && PathPrefix(`/v1/`)
      priority: 100
      middlewares:
        - name: ssl-proxy-public-security-headers
        - name: ssl-proxy-public-rate-limit
        - name: ssl-proxy-public-body-limit
      services:
        - kind: Service
          name: ssl-proxy-atheros-search
          port: 8080
          scheme: http
          responseForwarding:
            flushInterval: 100ms
  tls:
    store:
      name: default
