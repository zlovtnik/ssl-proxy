apiVersion: apps/v1
kind: Deployment
metadata:
  name: ssl-proxy-redis-runtime
  namespace: ssl-proxy
  labels:
    app.kubernetes.io/name: ssl-proxy
    app.kubernetes.io/component: redis-runtime
    app.kubernetes.io/instance: ssl-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ssl-proxy
      app.kubernetes.io/component: redis-runtime
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ssl-proxy
        app.kubernetes.io/component: redis-runtime
        app.kubernetes.io/instance: ssl-proxy
    spec:
      serviceAccountName: ssl-proxy
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:7.4.3-alpine
          imagePullPolicy: Always
          command: ["/bin/sh", "-ec"]
          args:
            - |
              printf 'save ""\nappendonly no\nrequirepass %s\n' "$REDIS_PASSWORD" > /etc/redis/redis.conf
              exec redis-server /etc/redis/redis.conf
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-runtime
                  key: password
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            tcpSocket:
              port: redis
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: redis
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: redis-config
              mountPath: /etc/redis
      volumes:
        - name: tmp
          emptyDir: {}
        - name: redis-config
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ssl-proxy-redis-runtime
  namespace: ssl-proxy
  labels:
    app.kubernetes.io/name: ssl-proxy
    app.kubernetes.io/component: redis-runtime
spec:
  selector:
    app.kubernetes.io/name: ssl-proxy
    app.kubernetes.io/component: redis-runtime
  ports:
    - name: redis
      port: 6379
      targetPort: redis
