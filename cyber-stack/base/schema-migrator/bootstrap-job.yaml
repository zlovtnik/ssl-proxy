apiVersion: batch/v1
kind: Job
metadata:
  name: ssl-proxy-schema-migrator-bootstrap
  namespace: ssl-proxy
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
  labels:
    app.kubernetes.io/name: ssl-proxy
    app.kubernetes.io/component: schema-migrator-bootstrap
    app.kubernetes.io/managed-by: kustomize
spec:
  backoffLimit: 4
  activeDeadlineSeconds: 1800
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ssl-proxy
        app.kubernetes.io/component: schema-migrator-bootstrap
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bootstrap
          image: quay.io/keycloak/keycloak:26.2.5
          imagePullPolicy: Always
          command: ["/bin/bash", "-ec"]
          args:
            - |
              KCADM=/opt/keycloak/bin/kcadm.sh
              CONFIG=/tmp/kcadm.config
              authenticated=false
              for attempt in $(seq 1 90); do
                if "$KCADM" config credentials \
                  --config "$CONFIG" \
                  --server "$KEYCLOAK_URL" \
                  --realm master \
                  --client "$KEYCLOAK_ADMIN_CLIENT_ID" \
                  --secret "$KEYCLOAK_ADMIN_CLIENT_SECRET" >/dev/null 2>&1; then
                  authenticated=true
                  break
                fi
                sleep 2
              done
              if [ "$authenticated" != true ]; then
                echo "Keycloak did not accept bootstrap administrator credentials" >&2
                exit 1
              fi

              cleanup_bootstrap_admin() {
                set +e
                recovery_client_uuid="$($KCADM get clients --config "$CONFIG" -r master \
                  -q "clientId=$KEYCLOAK_ADMIN_CLIENT_ID" --fields id --format csv --noquotes \
                  | grep -v '^id$' | head -n 1)"
                if [ -n "$recovery_client_uuid" ]; then
                  "$KCADM" delete "clients/$recovery_client_uuid" --config "$CONFIG" -r master
                fi
              }
              trap cleanup_bootstrap_admin EXIT

              stale_admin_id="$($KCADM get users --config "$CONFIG" -r master \
                -q "username=keycloak-admin" -q exact=true --fields id --format csv --noquotes \
                | grep -v '^id$' | head -n 1)"
              if [ -n "$stale_admin_id" ]; then
                "$KCADM" delete "users/$stale_admin_id" --config "$CONFIG" -r master
              fi

              user_id="$($KCADM get users --config "$CONFIG" -r "$REALM" \
                -q "username=$APP_USERNAME" -q exact=true --fields id --format csv --noquotes \
                | grep -v '^id$' | head -n 1)"
              if [ -z "$user_id" ]; then
                "$KCADM" create users --config "$CONFIG" -r "$REALM" \
                  -s "username=$APP_USERNAME" -s enabled=true -s emailVerified=true >/dev/null
                user_id="$($KCADM get users --config "$CONFIG" -r "$REALM" \
                  -q "username=$APP_USERNAME" -q exact=true --fields id --format csv --noquotes \
                  | grep -v '^id$' | head -n 1)"
              fi
              if [ -z "$user_id" ]; then
                echo "Keycloak user $APP_USERNAME was not found after creation" >&2
                exit 1
              fi
              "$KCADM" set-password --config "$CONFIG" -r "$REALM" \
                --username "$APP_USERNAME" --new-password - >/dev/null \
                <<< "$APP_PASSWORD"

              client_uuid=""
              for attempt in $(seq 1 45); do
                client_uuid="$($KCADM get clients --config "$CONFIG" -r "$REALM" \
                  -q "clientId=$CLIENT_ID" --fields id --format csv --noquotes \
                  | grep -v '^id$' | head -n 1)"
                if [ -n "$client_uuid" ]; then
                  break
                fi
                sleep 2
              done
              if [ -z "$client_uuid" ]; then
                echo "Keycloak client $CLIENT_ID was not found" >&2
                exit 1
              fi
              "$KCADM" update "clients/$client_uuid" --config "$CONFIG" -r "$REALM" \
                -s "redirectUris=[\"$PUBLIC_ORIGIN/*\"]" -s "webOrigins=[\"$UI_ORIGIN\"]" >/dev/null

              existing_roles="$($KCADM get "users/$user_id/role-mappings/clients/$client_uuid" \
                --config "$CONFIG" -r "$REALM" --fields name --format csv --noquotes)"
              if ! printf '%s\n' "$existing_roles" | grep -Fxq "$ADMIN_ROLE"; then
                "$KCADM" add-roles --config "$CONFIG" -r "$REALM" \
                  --uusername "$APP_USERNAME" --cclientid "$CLIENT_ID" --rolename "$ADMIN_ROLE"
              fi
          env:
            - name: KEYCLOAK_URL
              value: "http://ssl-proxy-schema-migrator-keycloak:8080"
            - name: KEYCLOAK_ADMIN_CLIENT_ID
              value: "ssl-proxy-bootstrap"
            - name: KEYCLOAK_ADMIN_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: schema-migrator-keycloak
                  key: bootstrap-admin-password
            - name: REALM
              value: "middleware"
            - name: CLIENT_ID
              value: "bedrock-ui"
            - name: PUBLIC_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: ssl-proxy-platform-config
                  key: IDENTITY_PUBLIC_ORIGIN
            - name: UI_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: ssl-proxy-platform-config
                  key: IDENTITY_PUBLIC_ORIGIN
            - name: ADMIN_ROLE
              value: "admin"
            - name: APP_USERNAME
              value: "schema-admin"
            - name: APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: schema-migrator-bootstrap
                  key: application-admin-password
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
