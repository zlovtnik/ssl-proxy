apiVersion: batch/v1
kind: Job
metadata:
  name: ssl-proxy-schema-migrator-bootstrap
  namespace: ssl-proxy
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
  labels:
    app.kubernetes.io/name: ssl-proxy
    app.kubernetes.io/component: schema-migrator-bootstrap
    app.kubernetes.io/managed-by: kustomize
spec:
  backoffLimit: 4
  activeDeadlineSeconds: 1800
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ssl-proxy
        app.kubernetes.io/component: schema-migrator-bootstrap
    spec:
      serviceAccountName: ssl-proxy
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bootstrap
          image: quay.io/keycloak/keycloak:26.2.5@sha256:4883630ef9db14031cde3e60700c9a9a8eaf1b5c24db1589d6a2d43de38ba2a9
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-ec"]
          args:
            - |
              KCADM=/opt/keycloak/bin/kcadm.sh
              REALM_CONFIG=/tmp/kcadm-realm.config
              MASTER_CONFIG=/tmp/kcadm-master.config
              ADMIN_CONFIG="$REALM_CONFIG"
              used_recovery=false
              stage="waiting for Keycloak"
              trap 'status=$?; if [ "$status" -ne 0 ]; then echo "Keycloak bootstrap failed during $stage (exit $status)" >&2; fi' EXIT

              echo "Waiting for Keycloak to be ready..."
              for i in $(seq 1 120); do
                if timeout 3 bash -c \
                  '</dev/tcp/ssl-proxy-schema-migrator-keycloak/8080' \
                  >/dev/null 2>&1; then
                  echo "Keycloak is ready."
                  break
                fi
                if [ "$i" -eq 120 ]; then
                  echo "Keycloak did not become ready within 10 minutes" >&2
                  exit 1
                fi
                sleep 5
              done

              stage="authenticating realm automation"
              echo "Authenticating Keycloak realm automation..."
              if ! "$KCADM" config credentials \
                --config "$REALM_CONFIG" \
                --server "$KEYCLOAK_URL" \
                --realm "$REALM" \
                --client "$KEYCLOAK_ADMIN_CLIENT_ID" \
                --secret "$KEYCLOAK_ADMIN_CLIENT_SECRET" >/dev/null 2>&1; then
                authenticated=false
                stage="authenticating recovery credentials"
                echo "Realm authentication unavailable; trying recovery credentials..."
                for attempt in $(seq 1 90); do
                  if "$KCADM" config credentials \
                    --config "$MASTER_CONFIG" \
                    --server "$KEYCLOAK_URL" \
                    --realm master \
                    --client "$KEYCLOAK_ADMIN_CLIENT_ID" \
                    --secret "$KEYCLOAK_ADMIN_CLIENT_SECRET" >/dev/null 2>&1; then
                    authenticated=true
                    break
                  fi
                  sleep 2
                done
                if [ "$authenticated" != true ]; then
                  echo "Keycloak did not accept realm automation or recovery credentials" >&2
                  exit 1
                fi
                used_recovery=true

                automation_client_uuid="$($KCADM get clients --config "$MASTER_CONFIG" -r "$REALM" \
                  -q "clientId=$KEYCLOAK_ADMIN_CLIENT_ID" --fields id --format csv --noquotes \
                  | grep -v '^id$' | head -n 1)"
                if [ -z "$automation_client_uuid" ]; then
                  "$KCADM" create clients --config "$MASTER_CONFIG" -r "$REALM" \
                    -s "clientId=$KEYCLOAK_ADMIN_CLIENT_ID" \
                    -s enabled=true \
                    -s publicClient=false \
                    -s serviceAccountsEnabled=true \
                    -s standardFlowEnabled=false \
                    -s directAccessGrantsEnabled=false \
                    -s "secret=$KEYCLOAK_ADMIN_CLIENT_SECRET" >/dev/null
                  automation_client_uuid="$($KCADM get clients --config "$MASTER_CONFIG" -r "$REALM" \
                    -q "clientId=$KEYCLOAK_ADMIN_CLIENT_ID" --fields id --format csv --noquotes \
                    | grep -v '^id$' | head -n 1)"
                else
                  "$KCADM" update "clients/$automation_client_uuid" \
                    --config "$MASTER_CONFIG" -r "$REALM" \
                    -s enabled=true \
                    -s publicClient=false \
                    -s serviceAccountsEnabled=true \
                    -s standardFlowEnabled=false \
                    -s directAccessGrantsEnabled=false \
                    -s "secret=$KEYCLOAK_ADMIN_CLIENT_SECRET" >/dev/null
                fi
                if [ -z "$automation_client_uuid" ]; then
                  echo "Keycloak realm automation client was not found after creation" >&2
                  exit 1
                fi

                service_account_user_id="$($KCADM get \
                  "clients/$automation_client_uuid/service-account-user" \
                  --config "$MASTER_CONFIG" -r "$REALM" \
                  --fields id --format csv --noquotes | grep -v '^id$' | head -n 1)"
                realm_management_uuid="$($KCADM get clients --config "$MASTER_CONFIG" -r "$REALM" \
                  -q clientId=realm-management --fields id --format csv --noquotes \
                  | grep -v '^id$' | head -n 1)"
                if [ -z "$service_account_user_id" ] || [ -z "$realm_management_uuid" ]; then
                  echo "Keycloak realm automation service account could not be resolved" >&2
                  exit 1
                fi
                automation_roles="$($KCADM get \
                  "users/$service_account_user_id/role-mappings/clients/$realm_management_uuid" \
                  --config "$MASTER_CONFIG" -r "$REALM" \
                  --fields name --format csv --noquotes)"
                if ! printf '%s\n' "$automation_roles" | grep -Fxq realm-admin; then
                  "$KCADM" add-roles --config "$MASTER_CONFIG" -r "$REALM" \
                    --uid "$service_account_user_id" \
                    --cclientid realm-management \
                    --rolename realm-admin
                fi

                if ! "$KCADM" config credentials \
                  --config "$REALM_CONFIG" \
                  --server "$KEYCLOAK_URL" \
                  --realm "$REALM" \
                  --client "$KEYCLOAK_ADMIN_CLIENT_ID" \
                  --secret "$KEYCLOAK_ADMIN_CLIENT_SECRET" >/dev/null 2>&1; then
                  echo "Keycloak realm automation client could not authenticate" >&2
                  exit 1
                fi

                stale_admin_id="$($KCADM get users --config "$MASTER_CONFIG" -r master \
                  -q "username=keycloak-admin" -q exact=true --fields id --format csv --noquotes \
                  | grep -v '^id$' | head -n 1)"
                if [ -n "$stale_admin_id" ]; then
                  "$KCADM" delete "users/$stale_admin_id" --config "$MASTER_CONFIG" -r master
                fi
              fi

              stage="resolving application client"
              echo "Resolving Keycloak client $CLIENT_ID in realm $REALM..."
              # The realm is imported before Keycloak becomes ready. A missing
              # client is a configuration error, not an eventual readiness event.
              client_ids="$($KCADM get clients --config "$ADMIN_CONFIG" -r "$REALM" \
                -q "clientId=$CLIENT_ID" --fields id --format csv --noquotes)"
              client_uuid="$(printf '%s\n' "$client_ids" | grep -v '^id$' | head -n 1)"
              if [ -z "$client_uuid" ]; then
                echo "Keycloak client $CLIENT_ID was not found in realm $REALM; check the realm configuration" >&2
                exit 1
              fi

              stage="configuring application client and roles"
              echo "Configuring Keycloak client $CLIENT_ID..."
              "$KCADM" update "clients/$client_uuid" --config "$ADMIN_CONFIG" -r "$REALM" \
                -s "redirectUris=[\"$PUBLIC_ORIGIN/callback\"]" -s "webOrigins=[\"$UI_ORIGIN\"]" >/dev/null

              provision_user() {
                username="$1"
                password="$2"
                role="$3"
                user_id="$($KCADM get users --config "$ADMIN_CONFIG" -r "$REALM" \
                  -q "username=$username" -q exact=true --fields id --format csv --noquotes \
                  | grep -v '^id$' | head -n 1)"
                if [ -z "$user_id" ]; then
                  "$KCADM" create users --config "$ADMIN_CONFIG" -r "$REALM" \
                    -s "username=$username" -s enabled=true -s emailVerified=true >/dev/null
                  user_id="$($KCADM get users --config "$ADMIN_CONFIG" -r "$REALM" \
                    -q "username=$username" -q exact=true --fields id --format csv --noquotes \
                    | grep -v '^id$' | head -n 1)"
                fi
                if [ -z "$user_id" ]; then
                  echo "Keycloak user $username was not found after creation" >&2
                  exit 1
                fi
                "$KCADM" set-password --config "$ADMIN_CONFIG" -r "$REALM" \
                  --username "$username" --new-password - >/dev/null <<< "$password"

                "$KCADM" update "users/$user_id" --config "$ADMIN_CONFIG" -r "$REALM" \
                  -s "username=$username" -s "enabled=true" -s "emailVerified=true" \
                  -s "requiredActions=[]" >/dev/null
                pending_actions="$($KCADM get "users/$user_id" \
                  --config "$ADMIN_CONFIG" -r "$REALM")"
                if printf '%s' "$pending_actions" | grep -Fq CONFIGURE_TOTP; then
                  echo "Keycloak user $username still has required actions pending" >&2
                  exit 1
                fi

                existing_roles="$($KCADM get "users/$user_id/role-mappings/clients/$client_uuid" \
                  --config "$ADMIN_CONFIG" -r "$REALM" --fields name --format csv --noquotes)"
                if ! printf '%s\n' "$existing_roles" | grep -Fxq "$role"; then
                  "$KCADM" add-roles --config "$ADMIN_CONFIG" -r "$REALM" \
                    --uusername "$username" --cclientid "$CLIENT_ID" --rolename "$role"
                fi
              }

              stage="configuring Schema Migrator administrator"
              echo "Configuring Keycloak Schema Migrator administrator..."
              provision_user "$SCHEMA_ADMIN_USERNAME" "$SCHEMA_ADMIN_PASSWORD" "$ADMIN_ROLE"

              stage="configuring Atheros Search client and users"
              echo "Configuring Keycloak Atheros Search client and users..."
              search_client_ids="$($KCADM get clients --config "$ADMIN_CONFIG" -r "$REALM" \
                -q "clientId=$SEARCH_CLIENT_ID" --fields id --format csv --noquotes)"
              search_client_uuid="$(printf '%s\n' "$search_client_ids" | grep -v '^id$' | head -n 1)"
              if [ -z "$search_client_uuid" ]; then
                echo "Keycloak client $SEARCH_CLIENT_ID was not found in realm $REALM" >&2
                exit 1
              fi
              client_uuid="$search_client_uuid"
              CLIENT_ID="$SEARCH_CLIENT_ID"
              "$KCADM" update "clients/$client_uuid" --config "$ADMIN_CONFIG" -r "$REALM" \
                -s "redirectUris=[\"$SEARCH_ORIGIN/callback\"]" -s "webOrigins=[\"$SEARCH_ORIGIN\"]" >/dev/null
              provision_user "$SEARCH_ADMIN_USERNAME" "$SEARCH_ADMIN_PASSWORD" "$ADMIN_ROLE"
              provision_user "$SEARCH_OPERATOR_USERNAME" "$SEARCH_OPERATOR_PASSWORD" "$OPERATOR_ROLE"
              provision_user "$SEARCH_VIEWER_USERNAME" "$SEARCH_VIEWER_PASSWORD" "$VIEWER_ROLE"

              if [ "$used_recovery" = true ]; then
                stage="removing recovery client"
                recovery_client_uuid="$($KCADM get clients --config "$MASTER_CONFIG" -r master \
                  -q "clientId=$KEYCLOAK_ADMIN_CLIENT_ID" --fields id --format csv --noquotes \
                  | grep -v '^id$' | head -n 1)"
                if [ -n "$recovery_client_uuid" ]; then
                  "$KCADM" delete "clients/$recovery_client_uuid" \
                    --config "$MASTER_CONFIG" -r master
                fi
              fi
              echo "Keycloak bootstrap completed successfully."
          env:
            - name: KEYCLOAK_URL
              value: "http://ssl-proxy-schema-migrator-keycloak:8080"
            - name: KEYCLOAK_ADMIN_CLIENT_ID
              value: "ssl-proxy-bootstrap"
            - name: KEYCLOAK_ADMIN_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: schema-migrator-keycloak
                  key: bootstrap-admin-password
            - name: REALM
              value: "middleware"
            - name: CLIENT_ID
              value: "schema-migrator-ui"
            - name: PUBLIC_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: ssl-proxy-platform-config
                  key: SCHEMA_MIGRATOR_CORS_ORIGIN
            - name: UI_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: ssl-proxy-platform-config
                  key: SCHEMA_MIGRATOR_CORS_ORIGIN
            - name: ADMIN_ROLE
              value: "admin"
            - name: SCHEMA_ADMIN_USERNAME
              value: "schema-admin"
            - name: SCHEMA_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: schema-migrator-bootstrap
                  key: application-admin-password
            - name: SEARCH_CLIENT_ID
              value: "atheros-search-ui"
            - name: SEARCH_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: ssl-proxy-platform-config
                  key: ATHEROS_SEARCH_CORS_ORIGIN
            - name: SEARCH_ADMIN_USERNAME
              value: "search-admin"
            - name: SEARCH_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: atheros-search-bootstrap
                  key: admin-password
            - name: SEARCH_OPERATOR_USERNAME
              value: "search-operator"
            - name: SEARCH_OPERATOR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: atheros-search-bootstrap
                  key: operator-password
            - name: SEARCH_VIEWER_USERNAME
              value: "search-viewer"
            - name: SEARCH_VIEWER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: atheros-search-bootstrap
                  key: viewer-password
            - name: OPERATOR_ROLE
              value: "operator"
            - name: VIEWER_ROLE
              value: "viewer"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
