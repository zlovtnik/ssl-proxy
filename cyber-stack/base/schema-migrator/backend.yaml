apiVersion: apps/v1
kind: Deployment
metadata:
  name: ssl-proxy-schema-migrator-backend
  namespace: ssl-proxy
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  labels:
    app.kubernetes.io/name: ssl-proxy
    app.kubernetes.io/component: schema-migrator-backend
    app.kubernetes.io/managed-by: kustomize
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: ssl-proxy
      app.kubernetes.io/component: schema-migrator-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ssl-proxy
        app.kubernetes.io/component: schema-migrator-backend
        ssl-proxy.io/tidb-client: "true"
    spec:
      serviceAccountName: ssl-proxy
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: schema-migrator-backend:latest
          imagePullPolicy: Always
          env:
            - name: JAVA_TOOL_OPTIONS
              value: -Djava.io.tmpdir=/tmp
            - name: BEDROCK_STATE_DB_URL
              valueFrom:
                configMapKeyRef:
                  name: ssl-proxy-platform-config
                  key: SCHEMA_MIGRATOR_TIDB_JDBC_URL
            - name: SCHEMA_MIGRATOR_DB_KIND
              value: "tidb"
            - name: BEDROCK_STATE_DB_USER
              value: "schema_migrator_runtime"
            - name: BEDROCK_STATE_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tidb-schema-migrator
                  key: password
            - name: BEDROCK_STATE_DB_POOL_SIZE
              value: "10"
            - name: BEDROCK_HTTP_HOST
              value: "0.0.0.0"
            - name: BEDROCK_HTTP_PORT
              value: "8080"
            - name: BEDROCK_CORS_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: ssl-proxy-platform-config
                  key: IDENTITY_PUBLIC_ORIGIN
            - name: BEDROCK_ENCRYPT_KEY
              valueFrom:
                secretKeyRef:
                  name: schema-migrator-backend
                  key: encrypt-key
            - name: BEDROCK_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: schema-migrator-backend
                  key: jwt-secret
            - name: BEDROCK_API_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: schema-migrator-backend
                  key: api-bearer-token
            - name: BEDROCK_DEV_AUTH_ENABLED
              value: "false"
            - name: BEDROCK_KEYCLOAK_ENABLED
              value: "true"
            - name: BEDROCK_KEYCLOAK_ISSUER
              valueFrom:
                configMapKeyRef:
                  name: ssl-proxy-platform-config
                  key: IDENTITY_KEYCLOAK_ISSUER
            - name: BEDROCK_KEYCLOAK_JWKS_URI
              value: "http://ssl-proxy-schema-migrator-keycloak:8080/realms/middleware/protocol/openid-connect/certs"
            - name: BEDROCK_KEYCLOAK_CLIENT_ID
              value: "bedrock-ui"
            - name: BEDROCK_KEYCLOAK_AUDIENCE
              value: "bedrock-ui"
            - name: BEDROCK_PATCH_STAGE_DIR
              value: /tmp/schema-migrator-patches
            - name: BEDROCK_REPO_CACHE_DIR
              value: /tmp/schema-migrator-repos
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ssl-proxy-schema-migrator-backend
  namespace: ssl-proxy
  labels:
    app.kubernetes.io/name: ssl-proxy
    app.kubernetes.io/component: schema-migrator-backend
    app.kubernetes.io/managed-by: kustomize
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ssl-proxy
    app.kubernetes.io/component: schema-migrator-backend
  ports:
    - name: http
      port: 8080
      targetPort: http
