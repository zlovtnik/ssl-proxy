apiVersion: apps/v1
kind: Deployment
metadata:
  name: ssl-proxy-schema-migrator-backend
  namespace: ssl-proxy
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  labels:
    app.kubernetes.io/name: ssl-proxy
    app.kubernetes.io/component: schema-migrator-backend
    app.kubernetes.io/managed-by: kustomize
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: ssl-proxy
      app.kubernetes.io/component: schema-migrator-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ssl-proxy
        app.kubernetes.io/component: schema-migrator-backend
        ssl-proxy.io/tidb-client: "true"
    spec:
      serviceAccountName: ssl-proxy
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: pem-to-pkcs12
          image: schema-migrator-backend:latest
          imagePullPolicy: Always
          command: ["/bin/sh", "-ec"]
          args:
            - |
              keytool -delete -alias tidb-ca \
                -keystore /run/tidb-tls/truststore.p12 \
                -storepass changeit 2>/dev/null || true
              keytool -importcert -noprompt \
                -alias tidb-ca \
                -file /etc/tidb-tls/ca.crt \
                -keystore /run/tidb-tls/truststore.p12 \
                -storetype PKCS12 \
                -storepass changeit
          env:
            - name: JAVA_TOOL_OPTIONS
              value: -Djava.io.tmpdir=/tmp
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: tidb-tls
              mountPath: /etc/tidb-tls
              readOnly: true
            - name: tidb-truststore
              mountPath: /run/tidb-tls
            - name: tmp
              mountPath: /tmp
      containers:
        - name: backend
          image: schema-migrator-backend:latest
          imagePullPolicy: Always
          env:
            - name: JAVA_TOOL_OPTIONS
              value: -Djava.io.tmpdir=/tmp
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: SCHEMA_MIGRATOR_DB_KIND
              value: "tidb"
            - name: BEDROCK_STATE_DB_URL
              value: "jdbc:mysql://ssl-proxy-tidb.$(POD_NAMESPACE).svc.cluster.local:4000/schema_migrator?sslMode=VERIFY_IDENTITY&trustCertificateKeyStoreUrl=file:///run/tidb-tls/truststore.p12&trustCertificateKeyStoreType=PKCS12&trustCertificateKeyStorePassword=changeit&fallbackToSystemTrustStore=false&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true"
            - name: BEDROCK_STATE_DB_USER
              value: "schema_migrator_runtime"
            - name: BEDROCK_STATE_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tidb-schema-migrator
                  key: password
            - name: BEDROCK_STATE_DB_POOL_SIZE
              value: "10"
            - name: BEDROCK_HTTP_HOST
              value: "0.0.0.0"
            - name: BEDROCK_HTTP_PORT
              value: "8080"
            - name: IDENTITY_HOSTNAME
              valueFrom:
                configMapKeyRef:
                  name: ssl-proxy-platform-config
                  key: IDENTITY_HOSTNAME
            - name: BEDROCK_CORS_ORIGINS
              value: "https://$(IDENTITY_HOSTNAME)"
            - name: BEDROCK_ENCRYPT_KEY
              valueFrom:
                secretKeyRef:
                  name: schema-migrator-backend
                  key: encrypt-key
            - name: BEDROCK_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: schema-migrator-backend
                  key: jwt-secret
            - name: BEDROCK_API_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: schema-migrator-backend
                  key: api-bearer-token
            - name: BEDROCK_DEV_AUTH_ENABLED
              value: "false"
            - name: BEDROCK_KEYCLOAK_ENABLED
              value: "true"
            - name: BEDROCK_KEYCLOAK_ISSUER
              value: "https://$(IDENTITY_HOSTNAME)/realms/middleware"
            - name: BEDROCK_KEYCLOAK_JWKS_URI
              value: "http://ssl-proxy-schema-migrator-keycloak:8080/realms/middleware/protocol/openid-connect/certs"
            - name: BEDROCK_KEYCLOAK_CLIENT_ID
              value: "bedrock-ui"
            - name: BEDROCK_KEYCLOAK_AUDIENCE
              value: "bedrock-ui"
            - name: BEDROCK_PATCH_STAGE_DIR
              value: /tmp/schema-migrator-patches
            - name: BEDROCK_REPO_CACHE_DIR
              value: /tmp/schema-migrator-repos
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: tidb-tls
              mountPath: /etc/tidb-tls
              readOnly: true
            - name: tidb-truststore
              mountPath: /run/tidb-tls
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 2Gi
        - name: tidb-tls
          secret:
            secretName: tidb-client-ca
            items:
              - key: ca.crt
                path: ca.crt
        - name: tidb-truststore
          emptyDir:
            sizeLimit: 1Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ssl-proxy-schema-migrator-backend
  namespace: ssl-proxy
  labels:
    app.kubernetes.io/name: ssl-proxy
    app.kubernetes.io/component: schema-migrator-backend
    app.kubernetes.io/managed-by: kustomize
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ssl-proxy
    app.kubernetes.io/component: schema-migrator-backend
  ports:
    - name: http
      port: 8080
      targetPort: http
