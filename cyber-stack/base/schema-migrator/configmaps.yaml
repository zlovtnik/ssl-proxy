apiVersion: v1
kind: ConfigMap
metadata:
  name: ssl-proxy-schema-migrator-keycloak-realm
  namespace: ssl-proxy
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/name: ssl-proxy
    app.kubernetes.io/component: schema-migrator-keycloak
    app.kubernetes.io/managed-by: kustomize
data:
  realm.json: |
    {
      "realm": "middleware",
      "enabled": true,
      "bruteForceProtected": true,
      "registrationAllowed": false,
      "resetPasswordAllowed": true,
      "loginWithEmailAllowed": true,
      "sslRequired": "external",
      "requiredActions": [
        {
          "alias": "CONFIGURE_TOTP",
          "name": "Configure OTP",
          "providerId": "CONFIGURE_TOTP",
          "enabled": true,
          "defaultAction": true,
          "priority": 10
        }
      ],
      "roles": {
        "realm": [
          { "name": "admin" },
          { "name": "operator" },
          { "name": "viewer" }
        ],
        "client": {
          "schema-migrator-ui": [
            { "name": "admin" },
            { "name": "operator" },
            { "name": "viewer" }
          ],
          "atheros-search-ui": [
            { "name": "admin" },
            { "name": "operator" },
            { "name": "viewer" }
          ]
        }
      },
      "clients": [
        {
          "clientId": "schema-migrator-ui",
          "name": "Schema Migrator UI",
          "enabled": true,
          "publicClient": true,
          "protocol": "openid-connect",
          "standardFlowEnabled": true,
          "directAccessGrantsEnabled": false,
          "implicitFlowEnabled": false,
          "serviceAccountsEnabled": false,
          "redirectUris": ["https://migrator.example.internal/callback"],
          "webOrigins": ["https://migrator.example.internal"],
          "defaultClientScopes": ["web-origins", "acr", "profile", "roles", "email"],
          "optionalClientScopes": ["address", "phone", "offline_access", "microprofile-jwt"],
          "protocolMappers": [
            {
              "name": "schema-migrator-ui-audience",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-audience-mapper",
              "consentRequired": false,
              "config": {
                "included.client.audience": "schema-migrator-ui",
                "id.token.claim": "false",
                "access.token.claim": "true",
                "introspection.token.claim": "true"
              }
            }
          ],
          "attributes": {
            "pkce.code.challenge.method": "S256",
            "post.logout.redirect.uris": "https://migrator.example.internal/login"
          }
        },
        {
          "clientId": "atheros-search-ui",
          "name": "Atheros Search UI",
          "enabled": true,
          "publicClient": true,
          "protocol": "openid-connect",
          "standardFlowEnabled": true,
          "directAccessGrantsEnabled": false,
          "implicitFlowEnabled": false,
          "serviceAccountsEnabled": false,
          "redirectUris": ["https://search.example.internal/callback"],
          "webOrigins": ["https://search.example.internal"],
          "defaultClientScopes": ["web-origins", "acr", "profile", "roles", "email"],
          "optionalClientScopes": ["address", "phone", "offline_access", "microprofile-jwt"],
          "protocolMappers": [
            {
              "name": "atheros-search-ui-audience",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-audience-mapper",
              "consentRequired": false,
              "config": {
                "included.client.audience": "atheros-search-ui",
                "id.token.claim": "false",
                "access.token.claim": "true",
                "introspection.token.claim": "true"
              }
            }
          ],
          "attributes": {
            "pkce.code.challenge.method": "S256",
            "post.logout.redirect.uris": "https://search.example.internal/"
          }
        }
      ]
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ssl-proxy-schema-migrator-traefik
  namespace: ssl-proxy
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/name: ssl-proxy
    app.kubernetes.io/component: schema-migrator-traefik
    app.kubernetes.io/managed-by: kustomize
data:
  dynamic.yaml: |
    http:
      routers:
        keycloak:
          rule: "Host(`identity.example.internal`) && (PathPrefix(`/realms/middleware`) || PathPrefix(`/resources/`))"
          entryPoints: [websecure]
          priority: 30
          service: keycloak
          tls:
            store:
              name: default
        backend:
          rule: "Host(`identity.example.internal`) && PathPrefix(`/api/`) && !Path(`/api/health`)"
          entryPoints: [websecure]
          priority: 20
          service: backend
          tls:
            store:
              name: default
      services:
        backend:
          loadBalancer:
            servers:
              - url: "http://ssl-proxy-schema-migrator-backend:8080"
        keycloak:
          loadBalancer:
            servers:
              - url: "http://ssl-proxy-schema-migrator-keycloak:8080"
    tls:
      stores:
        default:
          defaultCertificate:
            certFile: /etc/tls-cert/tls.crt
            keyFile: /etc/tls-cert/tls.key
