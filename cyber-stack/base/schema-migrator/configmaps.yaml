apiVersion: v1
kind: ConfigMap
metadata:
  name: ssl-proxy-schema-migrator-ui-config
  namespace: ssl-proxy
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/name: ssl-proxy
    app.kubernetes.io/component: schema-migrator-ui
    app.kubernetes.io/managed-by: kustomize
data:
  runtime-config.js: |
    window.__SCHEMA_MIGRATOR_CONFIG__ = {
      apiBaseUrl: "",
      keycloak: {
        realm: "middleware",
        clientId: "bedrock-ui"
      }
    };
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ssl-proxy-schema-migrator-keycloak-realm
  namespace: ssl-proxy
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/name: ssl-proxy
    app.kubernetes.io/component: schema-migrator-keycloak
    app.kubernetes.io/managed-by: kustomize
data:
  realm.json: |
    {
      "realm": "middleware",
      "enabled": true,
      "bruteForceProtected": true,
      "registrationAllowed": false,
      "resetPasswordAllowed": true,
      "loginWithEmailAllowed": true,
      "roles": {
        "realm": [
          { "name": "admin" },
          { "name": "operator" },
          { "name": "viewer" }
        ],
        "client": {
          "bedrock-ui": [
            { "name": "admin" },
            { "name": "operator" },
            { "name": "viewer" }
          ]
        }
      },
      "clients": [
        {
          "clientId": "bedrock-ui",
          "name": "Schema Migrator UI",
          "enabled": true,
          "publicClient": true,
          "protocol": "openid-connect",
          "standardFlowEnabled": true,
          "directAccessGrantsEnabled": false,
          "implicitFlowEnabled": false,
          "serviceAccountsEnabled": false,
          "redirectUris": ["https://identity.example.internal/*"],
          "webOrigins": ["https://identity.example.internal"],
          "defaultClientScopes": ["web-origins", "acr", "profile", "roles", "email"],
          "optionalClientScopes": ["address", "phone", "offline_access", "microprofile-jwt"],
          "attributes": {
            "pkce.code.challenge.method": "S256"
          }
        }
      ]
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ssl-proxy-schema-migrator-traefik
  namespace: ssl-proxy
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/name: ssl-proxy
    app.kubernetes.io/component: schema-migrator-traefik
    app.kubernetes.io/managed-by: kustomize
data:
  dynamic.yaml: |
    http:
      routers:
        keycloak:
          rule: "Host(`identity.example.internal`) && (PathPrefix(`/realms`) || PathPrefix(`/resources`))"
          entryPoints: [websecure]
          priority: 30
          service: keycloak
          tls:
            store:
              name: default
        backend:
          rule: "Host(`identity.example.internal`) && PathPrefix(`/api`)"
          entryPoints: [websecure]
          priority: 20
          service: backend
          tls:
            store:
              name: default
        ui:
          rule: "Host(`identity.example.internal`) && PathPrefix(`/`)"
          entryPoints: [websecure]
          priority: 10
          service: ui
          tls:
            store:
              name: default
      services:
        backend:
          loadBalancer:
            servers:
              - url: "http://ssl-proxy-schema-migrator-backend:8080"
        keycloak:
          loadBalancer:
            servers:
              - url: "http://ssl-proxy-schema-migrator-keycloak:8080"
        ui:
          loadBalancer:
            servers:
              - url: "http://ssl-proxy-schema-migrator-ui:80"
    tls:
      stores:
        default:
          defaultCertificate:
            certFile: /etc/tls-cert/tls.crt
            keyFile: /etc/tls-cert/tls.key
