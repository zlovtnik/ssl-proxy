apiVersion: apps/v1
kind: Deployment
metadata:
  name: ssl-proxy-schema-migrator-keycloak
  namespace: ssl-proxy
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/name: ssl-proxy
    app.kubernetes.io/component: schema-migrator-keycloak
    app.kubernetes.io/managed-by: kustomize
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ssl-proxy
      app.kubernetes.io/component: schema-migrator-keycloak
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ssl-proxy
        app.kubernetes.io/component: schema-migrator-keycloak
        ssl-proxy.io/tidb-client: "true"
    spec:
      serviceAccountName: ssl-proxy
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: pem-to-pkcs12
          image: quay.io/keycloak/keycloak:26.2.5
          imagePullPolicy: Always
          command: ["/bin/sh", "-ec"]
          args:
            - |
              keytool -delete -alias tidb-ca \
                -keystore /run/tidb-tls/truststore.p12 \
                -storepass changeit 2>/dev/null || true
              keytool -importcert -noprompt \
                -alias tidb-ca \
                -file /etc/tidb-tls/ca.crt \
                -keystore /run/tidb-tls/truststore.p12 \
                -storetype PKCS12 \
                -storepass changeit
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          volumeMounts:
            - name: tidb-tls
              mountPath: /etc/tidb-tls
              readOnly: true
            - name: tidb-truststore
              mountPath: /run/tidb-tls
            - name: tmp
              mountPath: /tmp
        - name: prepare-keycloak-home
          image: quay.io/keycloak/keycloak:26.2.5
          imagePullPolicy: Always
          command: ["/bin/sh", "-ec"]
          args:
            - cp -R /opt/keycloak/. /keycloak-home/
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
              ephemeral-storage: 500Mi
            limits:
              cpu: 250m
              memory: 256Mi
              ephemeral-storage: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          volumeMounts:
            - name: keycloak-home
              mountPath: /keycloak-home
        - name: bootstrap-admin-service
          image: quay.io/keycloak/keycloak:26.2.5
          imagePullPolicy: Always
          command: ["/opt/keycloak/bin/kc.sh"]
          args:
            - bootstrap-admin
            - service
            - --client-id
            - ssl-proxy-bootstrap
            - --client-secret:env
            - KC_BOOTSTRAP_RECOVERY_CLIENT_SECRET
            - --no-prompt
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: KC_DB
              value: mysql
            - name: KC_DB_URL_HOST
              value: "ssl-proxy-tidb.$(POD_NAMESPACE).svc.cluster.local"
            - name: KC_DB_URL_PORT
              value: "4000"
            - name: KC_DB_URL_DATABASE
              value: "keycloak"
            - name: KC_DB_URL_PROPERTIES
              value: "?sslMode=VERIFY_IDENTITY&trustCertificateKeyStoreUrl=file:///run/tidb-tls/truststore.p12&trustCertificateKeyStoreType=PKCS12&trustCertificateKeyStorePassword=changeit&fallbackToSystemTrustStore=false"
            - name: KC_DB_USERNAME
              value: "keycloak"
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tidb-keycloak
                  key: password
            - name: KC_BOOTSTRAP_RECOVERY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: schema-migrator-keycloak
                  key: bootstrap-admin-password
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
              ephemeral-storage: 250Mi
            limits:
              cpu: 500m
              memory: 1Gi
              ephemeral-storage: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          volumeMounts:
            - name: keycloak-home
              mountPath: /opt/keycloak
            - name: keycloak-data
              mountPath: /opt/keycloak/data
            - name: tmp
              mountPath: /tmp
            - name: tidb-truststore
              mountPath: /run/tidb-tls
              readOnly: true
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.2.5
          imagePullPolicy: Always
          args:
            - start
            - --import-realm
            - --hostname=https://$(IDENTITY_HOSTNAME)
            - --hostname-strict=false
            - --http-enabled=true
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: KC_DB
              value: mysql
            - name: KC_DB_URL_HOST
              value: "ssl-proxy-tidb.$(POD_NAMESPACE).svc.cluster.local"
            - name: KC_DB_URL_PORT
              value: "4000"
            - name: KC_DB_URL_DATABASE
              value: "keycloak"
            - name: KC_DB_URL_PROPERTIES
              value: "?sslMode=VERIFY_IDENTITY&trustCertificateKeyStoreUrl=file:///run/tidb-tls/truststore.p12&trustCertificateKeyStoreType=PKCS12&trustCertificateKeyStorePassword=changeit&fallbackToSystemTrustStore=false"
            - name: KC_DB_USERNAME
              value: "keycloak"
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tidb-keycloak
                  key: password
            - name: IDENTITY_HOSTNAME
              valueFrom:
                configMapKeyRef:
                  name: ssl-proxy-platform-config
                  key: IDENTITY_HOSTNAME
            - name: KC_PROXY_HEADERS
              value: xforwarded
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: KC_HOSTNAME_STRICT
              value: "false"
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: /realms/middleware/.well-known/openid-configuration
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
              ephemeral-storage: 500Mi
            limits:
              cpu: "2"
              memory: 2Gi
              ephemeral-storage: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          volumeMounts:
            - name: keycloak-home
              mountPath: /opt/keycloak
            - name: keycloak-data
              mountPath: /opt/keycloak/data
            - name: realm
              mountPath: /opt/keycloak/data/import/realm.json
              subPath: realm.json
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: tidb-tls
              mountPath: /etc/tidb-tls
              readOnly: true
            - name: tidb-truststore
              mountPath: /run/tidb-tls
              readOnly: true
      volumes:
        - name: keycloak-home
          emptyDir:
            sizeLimit: 2Gi
        - name: keycloak-data
          emptyDir:
            sizeLimit: 1Gi
        - name: realm
          configMap:
            name: ssl-proxy-schema-migrator-keycloak-realm
        - name: tmp
          emptyDir: {}
        - name: tidb-tls
          secret:
            secretName: tidb-client-ca
            items:
              - key: ca.crt
                path: ca.crt
        - name: tidb-truststore
          emptyDir:
            sizeLimit: 1Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ssl-proxy-schema-migrator-keycloak
  namespace: ssl-proxy
  labels:
    app.kubernetes.io/name: ssl-proxy
    app.kubernetes.io/component: schema-migrator-keycloak
    app.kubernetes.io/managed-by: kustomize
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: ssl-proxy
    app.kubernetes.io/component: schema-migrator-keycloak
  ports:
    - name: http
      port: 8080
      targetPort: http
