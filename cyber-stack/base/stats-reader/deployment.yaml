apiVersion: apps/v1
kind: Deployment
metadata:
  name: ssl-proxy-stats-reader
  namespace: ssl-proxy
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    reloader.stakater.com/auto: "true"
  labels:
    app.kubernetes.io/name: ssl-proxy
    app.kubernetes.io/component: stats-reader
    app.kubernetes.io/managed-by: kustomize
spec:
  revisionHistoryLimit: 3
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ssl-proxy
      app.kubernetes.io/component: stats-reader
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ssl-proxy
        app.kubernetes.io/component: stats-reader
    spec:
      serviceAccountName: ssl-proxy
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: stats-reader
          image: stats-reader
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
          env:
            - name: STATS_HTTP_PORT
              value: "8080"
            - name: REDIS_ADDR
              value: "ssl-proxy-redis-runtime:6379"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-runtime
                  key: password
            - name: REDIS_KEY
              value: "stats:current:v2"
            - name: MINIO_ENDPOINT
              value: "ssl-proxy-minio-api:9000"
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: access-key
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: secret-key
            - name: MINIO_USE_SSL
              value: "false"
            - name: MINIO_STATS_BUCKET
              value: "ssl-proxy-stats"
            - name: MINIO_STATS_PREFIX
              value: "stats/"
            - name: STATS_ALLOWED_ORIGINS
              value: "https://rclabs.uk,https://www.rclabs.uk"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /live
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ssl-proxy-stats-reader
  namespace: ssl-proxy
  labels:
    app.kubernetes.io/name: ssl-proxy
    app.kubernetes.io/component: stats-reader
    app.kubernetes.io/managed-by: kustomize
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ssl-proxy
    app.kubernetes.io/component: stats-reader
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
