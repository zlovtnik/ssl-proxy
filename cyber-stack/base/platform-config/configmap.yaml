apiVersion: v1
kind: ConfigMap
metadata:
  name: ssl-proxy-platform-config
  namespace: ssl-proxy
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/name: ssl-proxy
    app.kubernetes.io/component: platform-config
    app.kubernetes.io/managed-by: kustomize
data:
  ENVIRONMENT: "local"
  SYNC_REDPANDA_BOOTSTRAP_SERVERS: "ssl-proxy-redpanda:9092"
  SYNC_SCAN_TOPIC: "sync.scan.request"
  SYNC_LOAD_TOPIC: "sync.oracle.load"
  SYNC_RESULT_TOPIC: "sync.oracle.result"
  SYNC_PAYLOAD_AUDIT_TOPIC: "proxy.payload_audit"
  SYNC_SCAN_CONSUMER: "octopus-scan-v1"
  SYNC_LOAD_CONSUMER: "octopus-load-v1"
  SYNC_RESULT_CONSUMER: "octopus-result-v1"
  SYNC_PAYLOAD_AUDIT_CONSUMER: "octopus-payload-audit-v1"
  SYNC_STREAM_NAMES: "proxy.events,wireless.audit,audit.wireless.bandwidth,wireless.alert.rogue_ap,wireless.alert.deauth_flood,wireless.alert.signal_anomaly,wireless.alert.pmf_attack,wireless.client.inventory,wireless.probe.flush,proxy.payload_audit"
  COORDINATOR_LOAD_STREAM_NAMES: "proxy.events,wireless.audit,audit.wireless.bandwidth,wireless.alert.rogue_ap,wireless.alert.deauth_flood,wireless.alert.signal_anomaly,wireless.alert.pmf_attack,wireless.client.inventory,wireless.probe.flush,proxy.payload_audit"
  AUDIT_STREAM_NAME: "AUDIT_STREAM"
  SYNC_RESULT_STREAM_NAME: "ORACLE_RESULT_STREAM"
  WIRELESS_BACKLOG_STREAM_NAME: "WIRELESS_BACKLOG_STREAM"
  WIRELESS_MAC_STREAM_NAME: "WIRELESS_MAC_STREAM"
  WIRELESS_NETWORKS_STREAM_NAME: "WIRELESS_NETWORKS_STREAM"
  WIRELESS_PROBE_STREAM_NAME: "WIRELESS_PROBE_STREAM"
  WIRELESS_BACKLOG_SAVE_TOPIC: "wireless.backlog.save"
  WIRELESS_BACKLOG_LIST_TOPIC: "wireless.backlog.list"
  WIRELESS_BACKLOG_SYNCED_TOPIC: "wireless.backlog.synced"
  WIRELESS_BACKLOG_PRUNE_TOPIC: "wireless.backlog.prune"
  WIRELESS_MAC_LOOKUP_TOPIC: "wireless.mac.lookup"
  WIRELESS_NETWORKS_AUTHORIZED_TOPIC: "wireless.networks.authorized"
  WIRELESS_PROBE_FLUSH_TOPIC: "wireless.probe.flush"
  WIRELESS_BACKLOG_SAVE_CONSUMER: "wireless-backlog-save-v1"
  WIRELESS_BACKLOG_LIST_CONSUMER: "wireless-backlog-list-v1"
  WIRELESS_BACKLOG_SYNCED_CONSUMER: "wireless-backlog-synced-v1"
  WIRELESS_BACKLOG_PRUNE_CONSUMER: "wireless-backlog-prune-v1"
  WIRELESS_MAC_LOOKUP_CONSUMER: "wireless-mac-lookup-v1"
  WIRELESS_NETWORKS_AUTHORIZED_CONSUMER: "wireless-networks-authorized-v1"
  WIRELESS_PROBE_FLUSH_CONSUMER: "wireless-probe-flush-v1"
  WIRELESS_BACKLOG_LIST_REPLY_TOPIC: "wireless.backlog.list.reply"
  WIRELESS_BACKLOG_PRUNE_REPLY_TOPIC: "wireless.backlog.prune.reply"
  WIRELESS_MAC_LOOKUP_REPLY_TOPIC: "wireless.mac.lookup.reply"
  WIRELESS_NETWORKS_AUTHORIZED_REPLY_TOPIC: "wireless.networks.authorized.reply"
  IDENTITY_HOSTNAME: "identity.example.internal"
  IDENTITY_PUBLIC_ORIGIN: "https://$(IDENTITY_HOSTNAME)"
  IDENTITY_KEYCLOAK_ISSUER: "https://$(IDENTITY_HOSTNAME)/realms/middleware"
  SCHEMA_MIGRATOR_POSTGRES_JDBC_URL: "jdbc:postgresql://postgres-pgbouncer:5432/sync?currentSchema=schema_migrator&sslmode=disable"
  REGISTRY_PLAIN_HTTP: "0"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://ssl-proxy-telemetry-otel-collector:4317"
---
