apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      app.kubernetes.io/name: ssl-proxy
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false
resources:
  # Platform config
  - platform-config/serviceaccount.yaml
  - platform-config/configmap.yaml
  - platform-config/default-deny-networkpolicy.yaml
  # Proxy
  - proxy/deployment.yaml
  - proxy/service.yaml
  - proxy/networkpolicy.yaml
  # Java coordinator
  - java-coordinator/deployment.yaml
  - java-coordinator/networkpolicy.yaml
  # Schema migrator
  - schema-migrator
  # Atheros sensor
  - atheros-sensor/daemonset.yaml
  - atheros-sensor/networkpolicy.yaml
  # Atheros search
  - atheros-search
  # Redis
  - redis-runtime/deployment.yaml
  # PostgreSQL
  # Redpanda
  - redpanda/statefulset.yaml
  - redpanda/networkpolicy.yaml
  # MinIO
  - minio/statefulset.yaml
  # PostgreSQL schema executor
  - pgbouncer
  - postgres-schema-executor
  # Telemetry
  - telemetry
replacements:
  - source:
      kind: ConfigMap
      name: ssl-proxy-platform-config
      fieldPath: data.IDENTITY_PUBLIC_ORIGIN
    targets:
      - select:
          kind: Deployment
          name: ssl-proxy-schema-migrator-keycloak
        fieldPaths:
          - spec.template.spec.containers.[name=keycloak].args.2
        options:
          delimiter: "="
          index: 1
