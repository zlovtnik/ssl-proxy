apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ssl-proxy
resources:
  - cronjob.yaml
  - networkpolicy.yaml
configMapGenerator:
  - name: redpanda-maint-config
    files:
      - redpanda-daily-clean.sh
      - topics.tsv
  - name: redpanda-maint-env
    literals:
      - RPK_BROKERS=ssl-proxy-redpanda:9092
      - PUSHGATEWAY_URL=http://ssl-proxy-telemetry-pushgateway:9091
      - DRY_RUN=true
      - ACTIVE_TOPICS=*
      - IGNORE_GROUPS=
      - MAX_TRIM_FRACTION=0.90
      - PG_MAX_STALE_MIN=60
      - PGHOST=postgres-pgbouncer
      - PGPORT=5432
      - PGDATABASE=sync
      - PGSSLMODE=verify-full
      - PGSSLROOTCERT=/var/run/pgbouncer-tls/ca.crt
      - PGCONNECT_TIMEOUT=5
