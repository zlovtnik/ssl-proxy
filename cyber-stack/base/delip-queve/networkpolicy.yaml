apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ssl-proxy-dq-manager
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: dq-manager
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: atheros-search
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: telemetry-prometheus
      ports:
        - port: 8080
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - port: 8080
        - port: 8081
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: java-coordinator
      ports:
        - port: 8081
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: dq-worker
      ports:
        - port: 9091
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: redpanda
      ports:
        - port: 9092
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: telemetry-otel-collector
      ports:
        - port: 4317
        - port: 4318
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ssl-proxy-dq-worker
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: dq-worker
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: dq-manager
      ports:
        - port: 9091
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: telemetry-prometheus
      ports:
        - port: 8091
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: redpanda
      ports:
        - port: 9092
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: minio
      ports:
        - port: 9000
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: telemetry-otel-collector
      ports:
        - port: 4317
        - port: 4318
