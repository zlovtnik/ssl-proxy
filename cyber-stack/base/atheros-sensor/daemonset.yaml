apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ssl-proxy-atheros-sensor
  namespace: ssl-proxy
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/name: ssl-proxy
    app.kubernetes.io/component: atheros-sensor
    app.kubernetes.io/managed-by: kustomize
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: ssl-proxy
      app.kubernetes.io/component: atheros-sensor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ssl-proxy
        app.kubernetes.io/component: atheros-sensor
    spec:
      serviceAccountName: ssl-proxy
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        ssl-proxy.io/wireless-sensor: "true"
      initContainers:
        - name: configure-monitor-interface
          image: atheros-sensor:latest
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              device="${ATH_SENSOR_DEVICE:-}"
              if [ -z "$device" ]; then
                for net_path in /sys/class/net/*; do
                  driver_path="$(readlink -f "$net_path/device/driver" 2>/dev/null || true)"
                  case "$(basename "$driver_path")" in
                    ath9k|ath9k_htc) device="$(basename "$net_path")"; break ;;
                  esac
                done
              fi
              [ -n "$device" ] || { echo "no ath9k wireless interface found" >&2; exit 1; }
              iw reg set "$ATH_SENSOR_REG_DOMAIN"
              ip link set "$device" down
              iw dev "$device" set type monitor
              ip link set "$device" up
              iw dev "$device" set channel "$ATH_SENSOR_CHANNEL"
          env:
            - name: ATH_SENSOR_DEVICE
              value: ""
            - name: ATH_SENSOR_CHANNEL
              value: "6"
            - name: ATH_SENSOR_REG_DOMAIN
              value: "US"
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["NET_ADMIN"]
          volumeMounts:
            - name: sys-class-net
              mountPath: /sys/class/net
              readOnly: true
      containers:
        - name: atheros-sensor
          image: atheros-sensor:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: SYNC_REDPANDA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: ssl-proxy-platform-config
                  key: SYNC_REDPANDA_BOOTSTRAP_SERVERS
            - name: ATH_SENSOR_REQUIRE_HOST_ENDPOINTS
              value: "false"
            - name: ATH_SENSOR_DEVICE
              value: ""
            - name: ATH_SENSOR_LOCATION_ID
              value: "default"
            - name: ATH_SENSOR_CHANNEL
              value: "6"
            - name: ATH_SENSOR_CHANNEL_HOP_ENABLED
              value: "true"
            - name: ATH_SENSOR_CHANNEL_HOP_INTERVAL_MS
              value: "1000"
            - name: ATH_SENSOR_REG_DOMAIN
              value: "US"
            - name: ATH_SENSOR_AUDIT_LAYER_STREAM
              value: "off"
            - name: ATH_SENSOR_METRICS_PORT
              value: "9097"
            - name: ATH_SENSOR_METRICS_TEXTFILE_PATH
              value: "/var/lib/node_exporter/textfile_collector/atheros_sensor.prom"
            - name: ATH_SENSOR_MAC_DEVICE_LOOKUP_ENABLED
              value: "true"
            - name: ATH_SENSOR_CLIENT_INVENTORY_FLUSH_SECS
              value: "60"
            - name: ATH_SENSOR_SIGNAL_ANOMALY_DBM_DELTA
              value: "15"
            - name: ATH_SENSOR_DEAUTH_FLOOD_THRESHOLD
              value: "20"
            - name: ATH_SENSOR_DEAUTH_FLOOD_WINDOW_SECS
              value: "30"
            - name: ATH_SENSOR_DEAUTH_FLOOD_COOLDOWN_SECS
              value: "60"
            - name: ATH_SENSOR_EXPORT_HANDSHAKES
              value: "false"
            - name: ATH_SENSOR_AUTHORIZED_NETWORK_CACHE_TTL_SECS
              value: "60"
            - name: ATH_SENSOR_SHUTDOWN_GRACE_SECS
              value: "5"
            - name: ATH_SENSOR_BACKLOG_MAX_ATTEMPTS
              value: "10"
            - name: ATH_SENSOR_BACKLOG_MAX_AGE_HOURS
              value: "72"
            - name: ATH_SENSOR_REDPANDA_REQUEST_TIMEOUT_MS
              value: "10000"
            - name: ATH_SENSOR_MAC_LOOKUP_ERROR_TTL_SECS
              value: "30"
            - name: SYNC_OUTBOX_DIR
              value: "/sync-outbox"
            - name: RUST_LOG
              value: "warn,atheros_sensor=info"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: ssl-proxy-platform-config
                  key: OTEL_EXPORTER_OTLP_ENDPOINT
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "grpc"
            - name: OTEL_SERVICE_NAME
              value: "atheros-sensor"
          ports:
            - name: metrics
              containerPort: 9097
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["NET_ADMIN", "NET_RAW"]
          readinessProbe:
            exec:
              command: ["/usr/local/bin/atheros-sensor", "healthcheck"]
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          livenessProbe:
            exec:
              command: ["/usr/local/bin/atheros-sensor", "healthcheck"]
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
            requests:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: sys-class-net
              mountPath: /sys/class/net
              readOnly: true
            - name: tun-device
              mountPath: /dev/net/tun
            - name: sync-outbox
              mountPath: /sync-outbox
            - name: node-exporter-textfile
              mountPath: /var/lib/node_exporter/textfile_collector
      volumes:
        - name: sys-class-net
          hostPath:
            path: /sys/class/net
            type: Directory
        - name: tun-device
          hostPath:
            path: /dev/net/tun
            type: CharDevice
        - name: sync-outbox
          hostPath:
            path: /var/lib/ssl-proxy/sync-outbox
            type: DirectoryOrCreate
        - name: node-exporter-textfile
          hostPath:
            path: /var/lib/node_exporter/textfile_collector
            type: DirectoryOrCreate
