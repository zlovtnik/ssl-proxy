apiVersion: apps/v1
kind: Deployment
metadata:
  name: ssl-proxy-atheros-search
  namespace: ssl-proxy
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    reloader.stakater.com/auto: "true"
  labels:
    app.kubernetes.io/name: ssl-proxy
    app.kubernetes.io/component: atheros-search
    app.kubernetes.io/managed-by: kustomize
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: ssl-proxy
      app.kubernetes.io/component: atheros-search
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ssl-proxy
        app.kubernetes.io/component: atheros-search
        ssl-proxy.io/postgres-client: "true"
    spec:
      serviceAccountName: ssl-proxy
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: atheros-search
          image: atheros-search:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: ATHSEARCH_POSTGRES_HOST
              value: "postgres-pgbouncer"
            - name: ATHSEARCH_POSTGRES_PORT
              value: "5432"
            - name: ATHSEARCH_POSTGRES_DATABASE
              value: "sync"
            - name: ATHSEARCH_POSTGRES_USER
              value: "atheros_search_runtime"
            - name: ATHSEARCH_POSTGRES_PASSWORD_FILE
              value: "/var/run/postgres-password/password"
            - name: ATHSEARCH_POSTGRES_TLS_CA_FILE
              value: "/var/run/pgbouncer-tls/ca.crt"
            - name: ATHSEARCH_POSTGRES_TLS_SERVER_NAME
              value: "postgres-pgbouncer"
            - name: ATHSEARCH_SCHEMA_MANIFEST_SHA256
              value: "d4d4eb2240270ee52c8411eb7363a3c2c058d846818cab1e6a25e2ba500075b1"
            - name: ATHSEARCH_EMBEDDING_MODEL
              value: "nomic-embed-text-v2-moe"
            - name: ATHSEARCH_EMBEDDING_DIMENSIONS
              value: "768"
            - name: ATHSEARCH_EVENT_EMBEDDING_SCOPE
              value: "high_signal"
            - name: ATHSEARCH_HTTP_PORT
              value: "8080"
            - name: ATHSEARCH_GRPC_PORT
              value: "50051"
            - name: ATHSEARCH_METRICS_PORT
              value: "9090"
            - name: ATHSEARCH_LOG_LEVEL
              value: "info"
            - name: ATHSEARCH_CORS_ALLOWED_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: ssl-proxy-platform-config
                  key: ATHEROS_SEARCH_CORS_ORIGIN
            - name: ATHSEARCH_JWT_ISSUER
              valueFrom:
                configMapKeyRef:
                  name: ssl-proxy-platform-config
                  key: IDENTITY_KEYCLOAK_ISSUER
            - name: ATHSEARCH_JWT_JWKS_URI
              value: "http://ssl-proxy-schema-migrator-keycloak:8080/realms/middleware/protocol/openid-connect/certs"
            - name: ATHSEARCH_JWT_AUDIENCE
              value: "atheros-search-ui"
            - name: ATHSEARCH_JWT_CLIENT_ID
              value: "atheros-search-ui"
            - name: ATHSEARCH_WS_ENABLED
              value: "false"
            - name: ATHSEARCH_SCHEMA_READY_REQUIRED
              value: "true"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: ssl-proxy-platform-config
                  key: OTEL_EXPORTER_OTLP_ENDPOINT
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: grpc
            - name: OTEL_SERVICE_NAME
              value: atheros-search
          ports:
            - name: http
              containerPort: 8080
            - name: grpc
              containerPort: 50051
            - name: metrics
              containerPort: 9090
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: pgbouncer-ca
              mountPath: /var/run/pgbouncer-tls
              readOnly: true
            - name: postgres-password
              mountPath: /var/run/postgres-password
              readOnly: true
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
      volumes:
        - name: tmp
          emptyDir: {}
        - name: pgbouncer-ca
          secret:
            secretName: pgbouncer-listener-tls
            items:
              - key: ca.crt
                path: ca.crt
        - name: postgres-password
          secret:
            secretName: postgres-atheros-search
            defaultMode: 0440
            items:
              - key: password
                path: password
---
apiVersion: v1
kind: Service
metadata:
  name: ssl-proxy-atheros-search
  namespace: ssl-proxy
  labels:
    app.kubernetes.io/name: ssl-proxy
    app.kubernetes.io/component: atheros-search
    app.kubernetes.io/managed-by: kustomize
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ssl-proxy
    app.kubernetes.io/component: atheros-search
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: grpc
      port: 50051
      targetPort: grpc
    - name: metrics
      port: 9090
      targetPort: metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ssl-proxy-atheros-search-ui
  namespace: ssl-proxy
  labels:
    app.kubernetes.io/name: ssl-proxy
    app.kubernetes.io/component: atheros-search-ui
    app.kubernetes.io/managed-by: kustomize
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ssl-proxy
      app.kubernetes.io/component: atheros-search-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ssl-proxy
        app.kubernetes.io/component: atheros-search-ui
    spec:
      serviceAccountName: ssl-proxy
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ui
          image: atheros-search-ui:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 20
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /run
            - name: nginx-logs
              mountPath: /var/log/nginx
      volumes:
        - name: nginx-config
          configMap:
            name: ssl-proxy-atheros-search-ui-nginx
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        - name: nginx-logs
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ssl-proxy-atheros-search-ui
  namespace: ssl-proxy
  labels:
    app.kubernetes.io/name: ssl-proxy
    app.kubernetes.io/component: atheros-search-ui
    app.kubernetes.io/managed-by: kustomize
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ssl-proxy
    app.kubernetes.io/component: atheros-search-ui
  ports:
    - name: http
      port: 8080
      targetPort: http
