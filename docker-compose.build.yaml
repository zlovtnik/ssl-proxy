# Local build override. The default compose file consumes prebuilt registry
# images; include this file explicitly when building on a developer machine.
services:
  ssl-proxy:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VCS_REF: ${VCS_REF:-unknown}
        BUILD_DATE: ${BUILD_DATE:-unknown}

  wg-udp-frontdoor:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VCS_REF: ${VCS_REF:-unknown}
        BUILD_DATE: ${BUILD_DATE:-unknown}

  ssl-proxy-next:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VCS_REF: ${VCS_REF:-unknown}
        BUILD_DATE: ${BUILD_DATE:-unknown}

  wg-key-rotator:
    build:
      context: ./apps/wg-key-rotator
      dockerfile: Dockerfile

  java-coordinator:
    build:
      context: .
      dockerfile: services/octopus/Dockerfile

  integration-console-web:
    build:
      context: .
      dockerfile: apps/integration-console/Dockerfile

  integration-console-worker:
    build:
      context: .
      dockerfile: apps/integration-console/Dockerfile

  integration-console-db-setup:
    build:
      context: .
      dockerfile: apps/integration-console/Dockerfile

  integration-console-heatmap-refresh:
    build:
      context: .
      dockerfile: apps/integration-console/Dockerfile

  integration-console-heartbeat:
    build:
      context: .
      dockerfile: apps/integration-console/Dockerfile

  atheros-sensor:
    build:
      context: .
      dockerfile: Dockerfile
      target: atheros-sensor

  atheros-search:
    build:
      context: .
      dockerfile: services/atheros-search/Dockerfile
    environment:
      # The browser-only local UI has no bearer-token flow. Keep auth enabled
      # in the default Compose stack, but disable it for developer builds.
      ATHSEARCH_API_TOKEN_SHA256: ""

  postgres:
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
