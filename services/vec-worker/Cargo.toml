[package]
name = "vec-worker"
version = "0.1.0"
edition = "2021"

[workspace]

[features]
default = []
parallel-prepare = ["dep:rayon"]

[[bin]]
name = "vec-worker"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
sqlx = { version = "0.7", features = ["postgres", "runtime-tokio-rustls", "json", "chrono"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ryu = "1"
rayon = { version = "1", optional = true }
tracing = "0.1.40"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "json", "ansi"] }
thiserror = "1.0"
clap = { version = "4", features = ["derive"] }
dotenvy = "0.15"
sha2 = "0.10"
futures = "0.3"
anyhow = "1.0"
libc = "0.2"
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
lto = true
codegen-units = 1

[profile.dev]
opt-level = 0
debug = 1
incremental = true
