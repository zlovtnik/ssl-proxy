[package]
name = "oracle-worker"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
async-nats = "0.40"
base64 = "0.22"
chrono = { version = "0.4", default-features = true }
chrono-tz = "0.10"
futures = "0.3"
oracle = { version = "0.6.3", features = ["chrono"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
