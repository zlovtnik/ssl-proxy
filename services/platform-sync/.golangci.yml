run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  enable:
    - errcheck
    - gosec
    - bodyclose
    - gocritic
    - gofmt
    - goimports
    - govet
    - ineffassign
    - staticcheck
    - unconvert
    - unparam
    - unused

linters-settings:
  gosec:
    excludes:
      - G104  # Unhandled errors - we handle errors explicitly
  errcheck:
    check-blank: true

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - gosec
