[package]
name = "atheros-sensor"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
futures = "0.3"
fastrand = "2.4"
either = "1"
itertools = "0.13"
tap = "1"
derive_more = { version = "1", features = ["from", "display", "error"] }
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["server", "tokio"] }
ieee80211 = "=0.5.6"
pcap = "2.4.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lru = "0.12"
ssl-proxy = { path = "../..", default-features = false }
thiserror = "1.0"
tokio = { version = "1.40", default-features = false, features = ["macros", "rt-multi-thread", "sync", "time", "net", "io-util", "signal"] }
tokio-stream = "0.1"
tracing = "0.1"
tracing-opentelemetry = "0.32.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "json"] }
opentelemetry = "0.31"
tokio-rustls = "0.26"
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
rustls-pemfile = "2"
pbkdf2 = { version = "0.12", features = ["simple"] }
sha1 = "0.10"
hmac = "0.12"
aes = "0.8"
ccm = "0.5"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.40", features = ["test-util"] }
